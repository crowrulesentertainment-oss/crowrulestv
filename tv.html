<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>CrowRules TV v2.4/title>

<meta
    name="description"
    content="CrowRules TV — independent 24/7 television powered by CrowRules Entertainment."
>

<meta
    name="theme-color"
    content="#050505"
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   CROWRULES TV v2.3
   PUBLIC 24/7 STREAMING PLATFORM
========================================================= */

:root{

    --bg:#050505;
    --bg2:#080808;

    --panel:#0d0d0d;
    --panel2:#111111;
    --panel3:#171717;

    --border:#252525;
    --border2:#333;

    --text:#fff;
    --muted:#858585;
    --muted2:#5d5d5d;

    --red:#e50914;
    --red2:#ff2633;

    --green:#20d66b;
    --gold:#f5c542;
    --blue:#4285f4;

    --max:1600px;

    --shadow:
        0 20px 70px rgba(0,0,0,.5);

}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:

        radial-gradient(
            circle at 50% -15%,
            rgba(229,9,20,.18),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #050505,
            #080808 40%,
            #050505
        );

    color:var(--text);

    font-family:
        Montserrat,
        Arial,
        sans-serif;

}

body.modal-open{
    overflow:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:5000;

    min-height:72px;

    display:flex;

    align-items:center;

    gap:18px;

    padding:
        10px 24px;

    background:
        rgba(5,5,5,.95);

    backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid #202020;

}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    white-space:nowrap;

    font-family:Orbitron;

    font-weight:900;

    letter-spacing:.5px;

}

.logo-mark{

    width:42px;
    height:42px;

    display:grid;

    place-items:center;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--red),
            #650006
        );

    box-shadow:
        0 0 25px
        rgba(229,9,20,.25);

}

.logo span{
    color:var(--red);
}

.nav{

    display:flex;

    align-items:center;

    gap:3px;

    flex:1;

    overflow-x:auto;

}

.nav::-webkit-scrollbar{
    display:none;
}

.nav button{

    border:0;

    background:transparent;

    color:#777;

    padding:
        10px 11px;

    border-radius:7px;

    font-size:12px;

    font-weight:800;

    white-space:nowrap;

}

.nav button:hover,
.nav button.active{

    color:#fff;

    background:#181818;

}

.header-actions{

    display:flex;

    align-items:center;

    gap:8px;

}

.search-wrap{
    position:relative;
}

.search{

    width:220px;

    padding:
        10px 13px;

    background:#111;

    color:#fff;

    border:
        1px solid #292929;

    border-radius:7px;

    outline:none;

}

.search:focus{
    border-color:#555;
}

.member-button{

    border:
        1px solid #333;

    background:#151515;

    color:#fff;

    padding:
        10px 14px;

    border-radius:7px;

    font-weight:800;

}

.member-button:hover{
    border-color:var(--red);
}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:
        min(620px,75vh);

    position:relative;

    display:flex;

    align-items:flex-end;

    overflow:hidden;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.98),
            rgba(0,0,0,.72),
            rgba(0,0,0,.2)
        ),

        radial-gradient(
            circle at 80% 25%,
            rgba(229,9,20,.3),
            transparent 45%
        );

}

.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.012) 4px
        );

    pointer-events:none;

}

.hero-content{

    width:100%;

    max-width:var(--max);

    margin:auto;

    padding:
        85px 24px;

    position:relative;

    z-index:2;

}

.eyebrow{

    color:var(--red2);

    font-family:Orbitron;

    font-size:12px;

    letter-spacing:3px;

    font-weight:900;

}

.hero h1{

    margin:
        12px 0;

    max-width:1000px;

    font-family:Orbitron;

    font-size:
        clamp(
            45px,
            8vw,
            105px
        );

    line-height:.95;

}

.hero h1 span{
    color:var(--red);
}

.hero p{

    max-width:700px;

    color:#bbb;

    line-height:1.8;

}

.hero-actions{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:25px;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

    border:
        1px solid #333;

    border-radius:7px;

    padding:
        11px 17px;

    background:#151515;

    color:#fff;

    font-weight:800;

}

.btn:hover{
    border-color:#666;
}

.btn-primary{

    background:
        linear-gradient(
            135deg,
            var(--red),
            #850006
        );

    border-color:var(--red);

}

.btn-danger{

    background:
        #25090b;

    border-color:
        #6c151a;

    color:#ff777d;

}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    max-width:var(--max);

    margin:auto;

}

.section{

    padding:
        55px 24px 0;

}

.section-header{

    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:20px;

    margin-bottom:20px;

}

.section-header h2{

    margin:0;

    font-family:Orbitron;

    font-size:24px;

}

.section-header p{

    margin:6px 0 0;

    color:#777;

    font-size:11px;

}

.section-link{

    color:#aaa;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

}

.section-link:hover{
    color:#fff;
}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    display:none;

    margin:
        20px 24px 0;

    padding:
        14px 16px;

    border:
        1px solid #5b151a;

    border-radius:8px;

    background:
        rgba(229,9,20,.08);

    color:#ff858b;

    font-size:11px;

}


/* =========================================================
   LIVE TV
========================================================= */

.tv-layout{

    display:grid;

    grid-template-columns:
        minmax(0,2.35fr)
        minmax(300px,1fr);

    gap:18px;

}

.player-card,
.schedule-card{

    overflow:hidden;

    background:#0c0c0c;

    border:
        1px solid var(--border);

    border-radius:11px;

    box-shadow:var(--shadow);

}

.player{

    position:relative;

    aspect-ratio:16/9;

    background:#000;

    overflow:hidden;

}

#videoPlayer{

    display:none;

    width:100%;
    height:100%;

    background:#000;

}

#youtubePlayer{

    display:none;

    width:100%;
    height:100%;

    border:0;

    background:#000;

}

.player-message{

    position:absolute;

    inset:0;

    z-index:20;

    display:grid;

    place-items:center;

    padding:30px;

    text-align:center;

    background:
        radial-gradient(
            circle,
            rgba(229,9,20,.15),
            transparent 58%
        );

}

.player-message strong{

    display:block;

    margin-bottom:8px;

    font-family:Orbitron;

}

.player-message span{

    display:block;

    max-width:500px;

    color:#888;

    font-size:11px;

    line-height:1.7;

}

.live-overlay{

    position:absolute;

    top:14px;
    left:14px;

    z-index:40;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        7px 10px;

    background:
        rgba(0,0,0,.8);

    border-radius:5px;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

}

.live-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ff1d2d;

    box-shadow:
        0 0 12px #ff1d2d;

}

.player-controls{

    position:absolute;

    left:14px;
    right:14px;
    bottom:14px;

    z-index:40;

    display:flex;

    gap:7px;

}

.player-controls button{

    border:0;

    border-radius:6px;

    padding:
        8px 11px;

    background:
        rgba(0,0,0,.8);

    color:#fff;

    font-size:10px;

    font-weight:800;

}

.player-controls button:hover{
    background:#222;
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-info{

    padding:20px;

}

.now-badge{

    display:flex;

    align-items:center;

    gap:7px;

    color:#ff3541;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

}

.now-info h2{

    margin:
        10px 0 6px;

    font-size:21px;

}

.now-info p{

    margin:0;

    color:#999;

    font-size:13px;

    line-height:1.65;

}

.channel-label{

    margin-top:8px;

    color:#777;

    font-size:10px;

}

.progress{

    height:5px;

    margin-top:17px;

    overflow:hidden;

    border-radius:20px;

    background:#252525;

}

.progress-bar{

    width:0%;

    height:100%;

    background:var(--red);

    transition:
        width .5s linear;

}

.next-program{

    margin-top:18px;

    padding-top:16px;

    border-top:
        1px solid #222;

}

.next-program strong{

    display:block;

    margin-bottom:5px;

}

.next-program span{

    color:#888;

    font-size:11px;

}


/* =========================================================
   TV GUIDE
========================================================= */

.schedule-card{

    max-height:700px;

    display:flex;

    flex-direction:column;

}

.schedule-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:16px;

    border-bottom:
        1px solid #222;

}

.schedule-head h2{

    margin:0;

    font-family:Orbitron;

    font-size:15px;

}

.schedule-head span{

    color:#777;

    font-size:9px;

}

.schedule-list{

    flex:1;

    overflow:auto;

}

.schedule-item{

    display:grid;

    grid-template-columns:
        70px
        1fr
        58px;

    gap:10px;

    padding:13px;

    border-bottom:
        1px solid #1d1d1d;

    background:#101010;

    cursor:pointer;

}

.schedule-item:hover{
    background:#171717;
}

.schedule-item.now{

    background:
        linear-gradient(
            90deg,
            rgba(229,9,20,.18),
            #101010
        );

    box-shadow:
        inset 3px 0 var(--red);

}

.schedule-time{

    color:#bbb;

    font-size:10px;

}

.schedule-title{

    font-size:11px;

    font-weight:800;

    line-height:1.4;

}

.schedule-meta{

    margin-top:4px;

    color:#666;

    font-size:8px;

}

.schedule-status{

    text-align:right;

    color:#555;

    font-size:8px;

    font-weight:900;

}

.schedule-item.now
.schedule-status{
    color:var(--red);
}


/* =========================================================
   TOP CHANNELS
========================================================= */

.channel-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px,1fr)
        );

    gap:14px;

}

.channel{

    position:relative;

    min-height:155px;

    padding:17px;

    overflow:hidden;

    text-align:left;

    border:
        1px solid #292929;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #171717,
            #090909
        );

    color:#fff;

    transition:.2s;

}

.channel:hover{

    transform:
        translateY(-3px);

    border-color:#555;

}

.channel.active{

    border-color:var(--red);

    box-shadow:
        0 0 0 1px
        rgba(229,9,20,.18);

}

.channel-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

}

.channel-number{

    color:var(--red);

    font-family:Orbitron;

    font-size:11px;

}

.channel-logo{

    width:50px;
    height:50px;

    object-fit:contain;

    border-radius:7px;

    background:#070707;

}

.channel-name{

    margin-top:16px;

    font-size:15px;

    font-weight:900;

}

.channel-status{

    margin-top:7px;

    color:#777;

    font-size:9px;

}

.channel-live{

    position:absolute;

    top:12px;
    right:12px;

    color:var(--green);

    font-size:8px;

    font-weight:900;

}


/* =========================================================
   CARDS
========================================================= */

.card-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(210px,1fr)
        );

    gap:16px;

}

.card{

    overflow:hidden;

    background:#101010;

    border:
        1px solid #222;

    border-radius:9px;

    transition:.2s;

    cursor:pointer;

}

.card:hover{

    transform:
        translateY(-4px);

    border-color:#444;

}

.card-image{

    aspect-ratio:16/9;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #1c1c1c,
            #080808
        );

}

.card-image img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.card-placeholder{

    width:100%;
    height:100%;

    display:grid;

    place-items:center;

    font-family:Orbitron;

    font-size:26px;

}

.card-body{
    padding:14px;
}

.card-body h3{

    margin:0;

    font-size:14px;

}

.card-body p{

    margin:
        7px 0 0;

    color:#777;

    font-size:10px;

    line-height:1.5;

}

.card-stats{

    display:flex;

    gap:10px;

    margin-top:10px;

    color:#777;

    font-size:9px;

}


/* =========================================================
   MEMBERS
========================================================= */

.member-dashboard{

    display:grid;

    grid-template-columns:
        1.5fr
        1fr;

    gap:16px;

}

.member-panel{

    padding:20px;

    background:#101010;

    border:
        1px solid #252525;

    border-radius:10px;

}

.member-profile{

    display:flex;

    align-items:center;

    gap:15px;

}

.avatar{

    width:65px;
    height:65px;

    flex:0 0 65px;

    border-radius:50%;

    object-fit:cover;

    background:#222;

}

.member-name{

    font-weight:900;

}

.member-tier{

    margin-top:4px;

    color:var(--red);

    font-size:9px;

    font-weight:900;

    text-transform:uppercase;

}

.member-bio{

    margin-top:15px;

    color:#888;

    font-size:11px;

    line-height:1.6;

}

.member-actions{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:18px;

}

.member-stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:18px;

}

.member-stat{

    padding:13px;

    background:#171717;

    border-radius:7px;

    text-align:center;

}

.member-stat strong{

    display:block;

    font-family:Orbitron;

    font-size:18px;

}

.member-stat span{

    color:#777;

    font-size:8px;

    text-transform:uppercase;

}


/* =========================================================
   MEMBER CARDS
========================================================= */

.member-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px,1fr)
        );

    gap:14px;

}

.member-card{

    padding:16px;

    border:
        1px solid #222;

    border-radius:9px;

    background:#101010;

}

.member-card-top{

    display:flex;

    align-items:center;

    gap:11px;

}

.member-card .avatar{

    width:48px;
    height:48px;

    flex-basis:48px;

}

.member-points{

    margin-top:5px;

    color:var(--gold);

    font-size:9px;

    font-weight:900;

}


/* =========================================================
   SEARCH
========================================================= */

.search-results{

    position:absolute;

    top:48px;

    right:0;

    width:380px;

    max-height:500px;

    overflow:auto;

    z-index:7000;

    display:none;

    background:#101010;

    border:
        1px solid #333;

    border-radius:8px;

    box-shadow:
        0 20px 70px #000;

}

.search-results.open{
    display:block;
}

.search-result{

    display:flex;

    gap:10px;

    padding:11px;

    border-bottom:
        1px solid #222;

    cursor:pointer;

}

.search-result:hover{
    background:#181818;
}

.search-result img{

    width:70px;
    height:40px;

    object-fit:cover;

    border-radius:5px;

}

.search-result-title{

    font-size:10px;

    font-weight:900;

}

.search-result-meta{

    margin-top:4px;

    color:#777;

    font-size:8px;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    padding:35px;

    text-align:center;

    color:#666;

    font-size:11px;

}


/* =========================================================
   AUTH MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:10000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(12px);

}

.modal.open{
    display:flex;
}

.modal-card{

    width:
        min(440px,100%);

    max-height:
        90vh;

    overflow:auto;

    padding:25px;

    background:#101010;

    border:
        1px solid #333;

    border-radius:12px;

    box-shadow:
        0 30px 100px #000;

}

.modal-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

.modal-head h2{

    margin:0;

    font-family:Orbitron;

    font-size:18px;

}

.close-button{

    border:0;

    background:#1b1b1b;

    color:#aaa;

    width:34px;
    height:34px;

    border-radius:6px;

}

.form-group{
    margin-bottom:13px;
}

.form-group label{

    display:block;

    margin-bottom:6px;

    color:#aaa;

    font-size:9px;

    font-weight:800;

}

.form-group input{

    width:100%;

    padding:11px;

    border:
        1px solid #292929;

    border-radius:7px;

    background:#080808;

    color:#fff;

    outline:none;

}

.form-group input:focus{
    border-color:#666;
}

.auth-error{

    display:none;

    margin-bottom:13px;

    padding:10px;

    border-radius:6px;

    background:#25090b;

    color:#ff777d;

    font-size:10px;

}

.auth-switch{

    margin-top:15px;

    text-align:center;

    color:#777;

    font-size:10px;

}

.auth-switch button{

    border:0;

    background:transparent;

    color:#fff;

    font-weight:800;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:75px;

    padding:
        45px 24px;

    border-top:
        1px solid #181818;

    color:#666;

    font-size:11px;

    text-align:center;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .tv-layout{
        grid-template-columns:1fr;
    }

    .schedule-card{
        max-height:500px;
    }

    .member-dashboard{
        grid-template-columns:1fr;
    }

}

@media(max-width:800px){

    .header{
        padding:
            10px 14px;
    }

    .nav{
        display:none;
    }

    .search{
        width:160px;
    }

    .section{
        padding:
            40px 14px 0;
    }

    .hero-content{
        padding:
            65px 18px;
    }

    .search-results{
        right:-50px;

        width:
            calc(100vw - 28px);
    }

}

@media(max-width:550px){

    .logo{
        font-size:12px;
    }

    .logo-mark{
        width:36px;
        height:36px;
    }

    .header-actions
    .member-button{
        display:none;
    }

    .search{
        width:125px;
    }

    .hero h1{
        font-size:45px;
    }

    .schedule-item{

        grid-template-columns:
            58px
            1fr
            45px;

    }

    .member-stats{

/* =========================================================

const state = {

    channels:[],

    shows:[],

    episodes:[],

    members:[],

    scheduleItems:[],

    currentChannel:null,

    currentItem:null,

    currentProgram:null,

    nextItem:null,

/* =========================================================
   DOM
========================================================= */

const $ =
    selector =>
        document.querySelector(selector);

const $$ =
    selector =>
        [...document.querySelectorAll(selector)];


/* =========================================================
   SAFE HELPERS
========================================================= */

function safeId(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value);

}


function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function timestamp(value){

    const result =
        Date.parse(value);

    return Number.isFinite(result)
        ? result
        : 0;

}


function now(){

    return Date.now();

}


function formatTime(value){

    if(!value)
        return "—";

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "—";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


function imageFallback(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="640"
                height="360"
            >
                <rect
                    width="640"
                    height="360"
                    fill="#121212"
                />

                <text
                    x="50%"
                    y="50%"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    fill="#777"
                    font-family="Arial"
                    font-size="26"
                >
                    CROW RULES TV
                </text>

            </svg>
        `);

}


function imageURL(url){

    return url ||
        imageFallback();

}


/* =========================================================
   ERROR HANDLING
========================================================= */

function showError(message){

    const box =
        $("#errorBox");

    if(!box)
        return;

    box.textContent =
        "CrowRules TV: " +
        String(
            message ||
            "Unknown error."
        );

    box.style.display =
        "block";

}


function clearError(){

    const box =
        $("#errorBox");

    if(box){

        box.textContent =
            "";

        box.style.display =
            "none";

    }

}


/* =========================================================
   PLAYER MESSAGE
========================================================= */

function playerMessage(
    title,
    subtitle
){

    const box =
        $("#playerMessage");

    if(!box)
        return;

    box.innerHTML = `

        <div>

            <strong>
                ${escapeHTML(title)}
            </strong>

            <span>
                ${escapeHTML(subtitle)}
            </span>

        </div>

    `;

    box.classList.remove(
        "hidden"
    );

}


function hidePlayerMessage(){

    $("#playerMessage")
        ?.classList.add(
            "hidden"
        );

}


/* =========================================================
   YOUTUBE
========================================================= */

function youtubeId(url){

    if(!url)
        return null;

    try{

        const parsed =
            new URL(url);

        const host =
            parsed.hostname
                .toLowerCase();


        if(
            host === "youtu.be"
        ){

            return parsed.pathname
                .replace(/^\/+/,"")
                .split("/")[0] ||
                null;

        }


        if(
            host.includes("youtube.com")
        ){

            const v =
                parsed.searchParams.get(
                    "v"
                );

            if(v)
                return v;


            const patterns = [
                "/embed/",
                "/live/",
                "/shorts/"
            ];


            for(
                const prefix of patterns
            ){

                if(
                    parsed.pathname
                        .startsWith(prefix)
                ){

                    return parsed.pathname
                        .slice(
                            prefix.length
                        )
                        .split("/")[0] ||
                        null;

                }

            }

        }

    }catch(error){

        console.warn(
            "YouTube parse:",
            error
        );

    }

    return null;

}


/* =========================================================
   SCHEDULE HELPERS
========================================================= */

function channelSchedule(
    channelId
){

    const id =
        safeId(channelId);

    if(!id)
        return [];

    return state.scheduleItems

        .filter(
            item =>
                safeId(
                    item?.channel_id
                ) === id
        )

        .filter(
            item =>
                item &&
                item.starts_at &&
                item.ends_at
        )

        .sort(
            (a,b) =>
                timestamp(a.starts_at) -
                timestamp(b.starts_at)
        );

}


function isAiring(item){

    if(!item)
        return false;

    const start =
        timestamp(
            item.starts_at
        );

    const end =
        timestamp(
            item.ends_at
        );

    if(!start || !end)
        return false;

    return (
        start <= now() &&
        end > now()
    );

}


function getCurrentItem(
    channelId
){

    return channelSchedule(
        channelId
    )
    .find(
        item =>
            isAiring(item)
    ) || null;

}


function getNextItem(
    channelId
){

    const currentTime =
        now();

    return channelSchedule(
        channelId
    )
    .find(
        item =>
            timestamp(
                item.starts_at
            ) > currentTime
    ) || null;

}


/* =========================================================
   EPISODE LOOKUP
========================================================= */

function findEpisode(
    episodeId
){

    const id =
        safeId(episodeId);

    if(!id)
        return null;

    return state.episodes.find(
        episode =>
            safeId(
                episode?.id
            ) === id
    ) || null;

}


/* =========================================================
   BUILD PROGRAM
========================================================= */

function buildProgram(
    item
){

    if(!item)
        return null;


    const episode =
        findEpisode(
            item.episode_id
        );


    const url =
        item.video_url ||
        item.youtube_url ||
        episode?.video_url ||
        episode?.youtube_url ||
        null;


    return {

        item:item,

        episode:episode,

        id:safeId(item.id),

        title:
            item.title ||
            episode?.title ||
            "Now Playing",

        description:
            item.description ||
            episode?.description ||
            episode?.short_description ||
            "CrowRules TV programming.",

        url:url,

        thumbnail:
            item.thumbnail_url ||
            episode?.thumbnail_url ||
            episode?.youtube_thumbnail_url ||
            null,

        startsAt:
            item.starts_at,

        endsAt:
            item.ends_at

    };

}


/* =========================================================
   DESTROY MEDIA
========================================================= */

function destroyHLS(){

    if(state.hls){

        try{
            state.hls.destroy();
        }catch(error){}

        state.hls =
            null;

    }

}


function stopMedia(){

    state.playerToken++;

    destroyHLS();


    const video =
        $("#videoPlayer");

    const iframe =
        $("#youtubePlayer");


    if(video){

        try{

            video.pause();

            video.removeAttribute(
                "src"
            );

            video.load();

        }catch(error){}

        video.style.display =
            "none";

    }


    if(iframe){

        iframe.src =
            "about:blank";

        iframe.style.display =
            "none";

    }

}


/* =========================================================
   CALCULATE SCHEDULE POSITION
========================================================= */

function scheduledOffset(
    program
){

    if(!program)
        return 0;


    const start =
        timestamp(
            program.startsAt
        );


    if(!start)
        return 0;


    return Math.max(
        0,
        (
            now() -
            start
        ) / 1000
    );

}


/* =========================================================
   PLAY YOUTUBE
========================================================= */

function playYouTube(
    program,
    token
){

    const id =
        youtubeId(
            program.url
        );

    if(!id)
        return false;


    const iframe =
        $("#youtubePlayer");

    if(!iframe)
        return false;


    const offset =
        Math.max(
            0,
            Math.floor(
                scheduledOffset(
                    program
                )
            )
        );


    /*
     * start= prevents a refresh from always
     * beginning the scheduled episode at 0.
     */

    iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1" +
        "&mute=1" +
        "&playsinline=1" +
        "&rel=0" +
        "&start=" +
        encodeURIComponent(offset);


    iframe.style.display =
        "block";


    if(token !== state.playerToken)
        return true;


    hidePlayerMessage();

    return true;

}


/* =========================================================
   DIRECT VIDEO / HLS
========================================================= */

async function playDirectVideo(
    program,
    token
){

    const video =
        $("#videoPlayer");

    if(!video)
        return;


    video.style.display =
        "block";


    const url =
        program.url;


    const isHLS =
        /\.m3u8($|\?)/i.test(url) ||
        String(
            program.item?.video_type ||
            ""
        ).toLowerCase() === "hls";


    if(
        isHLS &&
        window.Hls &&
        Hls.isSupported()
    ){

        destroyHLS();

        state.hls =
            new Hls({
                enableWorker:true
            });


        state.hls.loadSource(
            url
        );

        state.hls.attachMedia(
            video
        );


        state.hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                if(
                    token !==
                    state.playerToken
                )
                    return;


                await startVideo(
                    video,
                    program,
                    token
                );

            }
        );


        state.hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                if(
                    data?.fatal &&
                    token ===
                    state.playerToken
                ){

                    playerMessage(
                        "Stream unavailable",
                        "The live stream could not be loaded."
                    );

                }

            }
        );


        return;

    }


    /*
     * Safari/native HLS.
     */

    if(
        isHLS &&
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;

    }else{

        video.src =
            url;

    }


    video.addEventListener(
        "loadedmetadata",
        async () => {

            if(
                token !==
                state.playerToken
            )
                return;


            await startVideo(
                video,
                program,
                token
            );

        },
        {
            once:true
        }
    );


    video.addEventListener(
        "error",
        () => {

            if(
                token !==
                state.playerToken
            )
                return;

            playerMessage(
                "Playback error",
                "The scheduled video source could not be played."
            );

        },
        {
            once:true
        }
    );

}


async function startVideo(
    video,
    program,
    token
){

    if(
        token !==
        state.playerToken
    )
        return;


    /*
     * THIS IS THE IMPORTANT REFRESH FIX.
     *
     * When the page loads in the middle of a scheduled
     * program, seek into the video rather than starting
     * at zero.
     */

    const offset =
        scheduledOffset(
            program
        );


    if(
        offset > 0 &&
        Number.isFinite(
            video.duration
        ) &&
        video.duration > 0
    ){

        const max =
            Math.max(
                0,
                video.duration - 1
            );


        const seek =
            Math.min(
                offset,
                max
            );


        try{

            video.currentTime =
                seek;

        }catch(error){

            console.warn(
                "Schedule seek failed:",
                error
            );

        }

    }


    video.muted =
        state.muted;


    try{

        await video.play();

        hidePlayerMessage();

    }catch(error){

        playerMessage(
            "Click Play to start",
            "Your browser blocked autoplay. The current scheduled position is ready."
        );

    }

}


/* =========================================================
   PLAY PROGRAM
========================================================= */

async function playProgram(
    program
){

    if(!program)
        return;


    const url =
        program.url;


    if(!url){

        stopMedia();

        playerMessage(
            program.title,
            "This schedule item has no playable video_url or youtube_url."
        );

        return;

    }


    const token =
        ++state.playerToken;


    stopMedia();

    /*
     * stopMedia increments token, so establish
     * the current token again.
     */

    const activeToken =
        state.playerToken;


    const yt =
        youtubeId(
            url
        );


    if(yt){

        playYouTube(
            program,
            activeToken
        );

        return;

    }


    await playDirectVideo(
        program,
        activeToken
    );

}


/* =========================================================
   CURRENT PROGRAM SYNC
========================================================= */

async function syncCurrentProgram(
    force = false
){

    const channel =
        state.currentChannel;


    /*
     * NEVER DO:
     *
     * state.currentChannel.id
     *
     * without checking that the object exists.
     */

    if(
        !channel ||
        !safeId(channel.id)
    ){

        state.currentItem =
            null;

        state.currentProgram =
            null;

        updateNowPanel(
            null
        );

        return;

    }


    const channelId =
        safeId(
            channel.id
        );


    const current =
        getCurrentItem(
            channelId
        );


    const next =
        getNextItem(
            channelId
        );


    state.nextItem =
        next;


    if(!current){

        state.currentItem =
            null;

        state.currentProgram =
            null;


        updateNowPanel(
            null
        );


        stopMedia();


        if(next){

            playerMessage(
                "Waiting for the next program",
                `${next.title || "Upcoming program"} begins at ${formatTime(next.starts_at)}.`
            );

        }else{

            playerMessage(
                "No program scheduled",
                "Add programming through the CrowRules TV Admin Dashboard."
            );

        }


        updateProgress();

        return;

    }


    const oldId =
        safeId(
            state.currentItem?.id
        );


    const newId =
        safeId(
            current.id
        );


    const changed =
        oldId !== newId;


    state.currentItem =
        current;


    const program =
        buildProgram(
            current
        );


    state.currentProgram =
        program;


    updateNowPanel(
        program
    );


    if(
        force ||
        changed
    ){

        await playProgram(
            program
        );

    }


    updateProgress();

}


/* =========================================================
   NOW PLAYING
========================================================= */

function updateNowPanel(
    program
){

    const title =
        program?.title ||
        "No Program Scheduled";


    $("#nowTitle").textContent =
        title;


    $("#nowDescription").textContent =
        program?.description ||
        (
            state.nextItem
                ? "Waiting for the next scheduled program."
                : "No program is currently scheduled."
        );


    $("#nowChannel").textContent =
        state.currentChannel?.name ||
        "CrowRules TV";


    $("#nextTitle").textContent =

        state.nextItem

            ?

            `${state.nextItem.title || "Upcoming Program"} · ${formatTime(state.nextItem.starts_at)}`

            :

            "No upcoming program";

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    const bar =
        $("#progressBar");


    if(
        !bar ||
        !state.currentItem
    ){

        if(bar)
            bar.style.width =
                "0%";

        return;

    }


    const start =
        timestamp(
            state.currentItem.starts_at
        );


    const end =
        timestamp(
            state.currentItem.ends_at
        );


    if(
        !start ||
        !end ||
        end <= start
    ){

        bar.style.width =
            "0%";

        return;

    }


    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    (
                        now() -
                        start
                    ) /
                    (
                        end -
                        start
                    )
                ) *
                100
            )
        );


    bar.style.width =
        percent + "%";

}

async function loadSchedule(){

    const from =
        new Date(
            now() -
            86400000
        )
        .toISOString();


    const through =
        new Date(
            now() +
            8 *
            86400000
        )
        .toISOString();


    const result =
        await supabaseClient

            .from("schedule_items")

            .select("*")

            .eq(
                "is_active",
                true
            )

            .gte(
                "ends_at",
                from
            )

            .lte(
                "starts_at",
                through
            )

            .order(
                "starts_at",
                {
                    ascending:true
                }
            )

            .limit(3000);


    if(result.error)
        throw result.error;


    state.scheduleItems =
        Array.isArray(
            result.data
        )
            ? result.data
            : [];


    renderSchedule();

}

async function selectChannel(
    channel
){

    /*
     * FIX:
     *
     * Validate BEFORE touching .id.
     */

    if(
        !channel ||
        typeof channel !== "object"
    ){

        console.warn(
            "selectChannel received invalid channel:",
            channel
        );

        return;

    }


    const id =
        safeId(
            channel.id
        );


    if(!id){

        console.warn(
            "Channel has no id:",
            channel
        );

        return;

    }


    state.currentChannel =
        channel;


    try{

        localStorage.setItem(
            "crowrules_tv_channel",
            id
        );

    }catch(error){}


    renderChannels();


    await syncCurrentProgram(
        true
    );

}


/* =========================================================
   RESTORE CHANNEL
========================================================= */

function restoreChannel(){

    let saved =
        "";


    try{

        saved =
            localStorage.getItem(
                "crowrules_tv_channel"
            ) ||
            "";

    }catch(error){}


    if(saved){

        const channel =
            state.channels.find(
                item =>
                    safeId(
                        item?.id
                    ) === saved
            );


        if(channel)
            return channel;

    }


    /*
     * Safe first channel fallback.
     */

    return (
        state.channels.find(
            Boolean
        ) ||
        null
    );

}

function renderSchedule(){

    const container =
        $("#scheduleList");


    if(!container)
        return;


    const relevant =
        state.scheduleItems

            .filter(
                item =>
                    item &&
                    timestamp(
                        item.ends_at
                    ) >= now()
            )

            .sort(
                (a,b) =>
                    timestamp(
                        a.starts_at
                    ) -
                    timestamp(
                        b.starts_at
                    )
            )


            .slice(
                0,
                10
            );


    if(!relevant.length){

        container.innerHTML = `
            <div class="empty">

/* =========================================================
   AUTH
========================================================= */

function openAuth(
    mode = "login"
){

    state.authMode =
        mode;


    updateAuthModal();


    $("#authModal")
        ?.classList.add(
            "open"
        );


    document.body.classList.add(
        "modal-open"
    );

}


function closeAuth(){

    $("#authModal")
        ?.classList.remove(
            "open"
        );


    document.body.classList.remove(
        "modal-open"
    );


    $("#authError").style.display =
        "none";

}


function updateAuthModal(){

    const register =
        state.authMode ===
        "register";


    $("#authTitle").textContent =
        register
            ? "Create Member Account"
            : "Member Login";


    $("#nameGroup")
        .classList.toggle(
            "hidden",
            !register
        );


    $("#authSubmit").textContent =
        register
            ? "Create Account"
            : "Sign In";


    $("#authSwitchText").textContent =
        register
            ? "Already have an account?"
            : "Don't have an account?";


    $("#authSwitch").textContent =
        register
            ? "Sign In"
            : "Create Account";


    $("#authPassword")
        .setAttribute(
            "autocomplete",
            register
                ? "new-password"
                : "current-password"
        );

}


function showAuthError(
    message
){

    const box =
        $("#authError");


    box.textContent =
        String(
            message ||
            "Authentication failed."
        );


    box.style.display =
        "block";

}


async function submitAuth(
    event
){

    event.preventDefault();


    const email =
        $("#authEmail")
            .value
            .trim();


    const password =
        $("#authPassword")
            .value;


    const displayName =
        $("#authName")
            .value
            .trim();


    if(!email || !password){

        showAuthError(
            "Enter your email and password."
        );

        return;

    }


    $("#authSubmit")
        .disabled =
        true;


    $("#authSubmit")
        .textContent =
        "Please wait...";


    try{

        if(
            state.authMode ===
            "register"
        ){

            const result =
                await supabaseClient.auth.signUp({

                    email,

                    password,

                    options:{
                        data:{
                            display_name:
                                displayName
                        }
                    }

                });


            if(result.error)
                throw result.error;


            /*
             * If email confirmation is enabled,
             * Supabase may return a user without
             * a live session.
             */

            if(!result.data.session){

                closeAuth();

                alert(
                    "Account created. Check your email if CrowRules TV requires email confirmation before signing in."
                );

                return;

            }

        }else{

            const result =
                await supabaseClient.auth.signInWithPassword({

                    email,

                    password

                });


            if(result.error)
                throw result.error;

        }


        closeAuth();

        await refreshAuth();

    }catch(error){

        console.error(
            "Auth:",
            error
        );


        showAuthError(
            error?.message ||
            "Unable to authenticate."
        );

    }finally{

        $("#authSubmit")
            .disabled =
            false;


        $("#authSubmit")
            .textContent =
            state.authMode ===
            "register"
                ? "Create Account"
                : "Sign In";

    }

}


/* =========================================================
   LOAD MEMBER PROFILE
========================================================= */

async function loadCurrentProfile(){

    state.profile =
        null;


    if(!state.user)
        return;


    const result =
        await supabaseClient

            .from("member_profiles")

            .select("*")

            .eq(
                "id",
                state.user.id
            )

            .maybeSingle();


    if(result.error){

        console.warn(
            "Member profile:",
            result.error.message
        );

        return;

    }


    state.profile =
        result.data ||
        null;


    /*
     * If the Admin/member system has not created
     * a profile yet, don't attempt to insert
     * blindly because RLS may intentionally prevent
     * public profile creation.
     */

}


/* =========================================================
   AUTH REFRESH
========================================================= */

async function refreshAuth(){

    const result =
        await supabaseClient.auth.getSession();


    if(result.error){

        console.warn(
            "Session:",
            result.error.message
        );

        return;

    }


    state.session =
        result.data?.session ||
        null;


    state.user =
        state.session?.user ||
        null;


    await loadCurrentProfile();


    renderMembers();


    updateMemberButton();

}


function updateMemberButton(){

    const button =
        $("#memberButton");


    if(!button)
        return;


    if(state.user){

        button.textContent =
            "My Account";

    }else{

        button.textContent =
            "Sign In";

    }

}


async function logout(){

    try{

        const result =
            await supabaseClient.auth.signOut();


        if(result.error)
            throw result.error;


        state.session =
            null;

        state.user =
            null;

        state.profile =
            null;


        renderMembers();

        updateMemberButton();

    }catch(error){

        console.error(
            "Logout:",
            error
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchEverything(
query
){

    const results =
        $("#searchResults");


    const q =
        String(
            query ||
            ""
        )
        .trim()
        .toLowerCase();


    if(!q){

        results.classList.remove(
            "open"
        );

        results.innerHTML =
            "";

        return;

    }


    const shows =
        state.shows
            .filter(
                show =>
                    String(
                        show?.title ||
                        ""
                    )
                    .toLowerCase()
                    .includes(q)
            )
            .slice(
                0,
                5
            );


    const episodes =
        state.episodes
            .filter(
                episode => {

                    const text =
                        (
                            String(
                                episode?.title ||
                                ""
                            ) +

                            " " +

                            String(
                                episode?.shows?.title ||
                                ""
                            )
                        )
                        .toLowerCase();


                    return text.includes(q);

                }
            )
            .slice(
                0,
                7
            );


    const output = [

        ...shows.map(
            show => `

                <div
                    class="search-result"
                    data-type="show"
                    data-id="${escapeHTML(
                        safeId(show?.id)
                    )}"
                >

                    <img
                        src="${escapeHTML(
                            imageURL(
                                show?.thumbnail_url
                            )
                        )}"
                        alt=""
                    >

                    <div>

                        <div class="search-result-title">

                            ${escapeHTML(
                                show?.title ||
                                "Show"
                            )}

                        </div>

                        <div class="search-result-meta">
                            Show
                        </div>

                    </div>

                </div>

            `
        ),

        ...episodes.map(
            episode => `

                <div
                    class="search-result"
                    data-type="episode"
                    data-id="${escapeHTML(
                        safeId(
                            episode?.id
                        )
                    )}"
                >

                    <img
                        src="${escapeHTML(
                            imageURL(
                                episode?.thumbnail_url ||
                                episode?.youtube_thumbnail_url
                            )
                        )}"
                        alt=""
                    >

                    <div>

                        <div class="search-result-title">

                            ${escapeHTML(
                                episode?.title ||
                                "Episode"
                            )}

                        </div>

                        <div class="search-result-meta">

                            ${escapeHTML(
                                episode?.shows?.title ||
                                "Episode"
                            )}

                        </div>

                    </div>

                </div>

            `
        )

    ].join("");


    results.innerHTML =
        output ||

        `
        <div class="empty">
            No results found.
        </div>
        `;


    results.classList.add(
        "open"
    );


    results
        .querySelectorAll(
            ".search-result"
        )
        .forEach(
            item => {

                item.addEventListener(
                    "click",
                    () => {

                        const type =
                            item.dataset.type;


                        const id =
                            item.dataset.id;


                        if(
                            type ===
                            "episode"
                        ){

                            const episode =
                                findEpisode(
                                    id
                                );


                            if(!episode)
                                return;


                            const fakeItem = {

                                id:
                                    "search-" +
                                    id,

                                episode_id:
                                    id,

                                title:
                                    episode.title,

                                description:
                                    episode.description,

                                video_url:
                                    episode.video_url,

                                youtube_url:
                                    episode.youtube_url,

                                starts_at:
                                    new Date()
                                        .toISOString(),

                                ends_at:
                                    new Date(
                                        now() +
                                        86400000
                                    )
                                    .toISOString()

                            };


                            const program =
                                buildProgram(
                                    fakeItem
                                );


                            if(program){

                                playProgram(
                                    program
                                );

                                scrollTo(
                                    "tv"
                                );

                            }

                        }


                        if(
                            type ===
                            "show"
                        ){

                            scrollTo(
                                "shows"
                            );

                        }


                        results.classList.remove(
                            "open"
                        );

                    }
                );

            }
        );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollTo(
id
){

    document
        .getElementById(id)
        ?.scrollIntoView({
            behavior:"smooth"
        });

}


/* =========================================================
   PLAYER CONTROLS
========================================================= */

$("#playButton")
    .addEventListener(
        "click",
        async () => {

            const video =
                $("#videoPlayer");


            if(
                video.style.display !==
                "none"
            ){

                try{

                    await video.play();

                }catch(error){

                    console.warn(
                        error
                    );

                }

                return;

            }


            if(
                state.currentProgram
            ){

                await playProgram(
                    state.currentProgram
                );

            }

        }
    );


$("#soundButton")
    .addEventListener(
        "click",
        async () => {

            state.muted =
                false;


            const video =
                $("#videoPlayer");


            if(video){

                video.muted =
                    false;

                video.volume =
                    1;

            }


            try{

                if(video)
                    await video.play();

            }catch(error){

                console.warn(
                    "Sound:",
                    error
                );

            }

        }
    );


$("#fullscreenButton")
    .addEventListener(
        "click",
        async () => {

            const player =
                document.querySelector(
                    ".player"
                );


            try{

                if(
                    !document.fullscreenElement
                ){

                    await player
                        .requestFullscreen();

                }else{

                    await document
                        .exitFullscreen();

                }

            }catch(error){

                console.warn(
                    "Fullscreen:",
                    error
                );

            }

        }
    );


/* =========================================================
   VIDEO ENDED
========================================================= */

$("#videoPlayer")
    .addEventListener(
        "ended",
        async () => {

            try{

                await loadSchedule();

                await syncCurrentProgram(
                    true
                );

            }catch(error){

                console.warn(
                    "Program rollover:",
                    error
                );

            }

        }
    );


/* =========================================================
   NAVIGATION
========================================================= */

$$(
    "[data-scroll]"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                scrollTo(
                    button.dataset.scroll
                );

            }
        );

    }
);


$("#watchLiveButton")
    .addEventListener(
        "click",
        () => {

            scrollTo(
                "tv"
            );

        }
    );


$("#memberButton")
    .addEventListener(
        "click",
        () => {

            if(state.user){

                scrollTo(
                    "members"
                );

            }else{

                openAuth(
                    "login"
                );

            }

        }
    );


/* =========================================================
   AUTH EVENTS
========================================================= */

$("#authForm")
    .addEventListener(
        "submit",
        submitAuth
    );


$("#closeAuth")
    .addEventListener(
        "click",
        closeAuth
    );


$("#authSwitch")
    .addEventListener(
        "click",
        () => {

            state.authMode =
                state.authMode ===
                "login"
                    ? "register"
                    : "login";


            updateAuthModal();

        }
    );


$("#authModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("#authModal")
            ){

                closeAuth();

            }

        }
    );


/* =========================================================
   SEARCH EVENTS
========================================================= */

$("#searchInput")
    .addEventListener(
        "input",
        event => {

            searchEverything(
                event.target.value
            );

        }
    );


document.addEventListener(
    "click",
    event => {

        const results =
            $("#searchResults");

        const input =
            $("#searchInput");


        if(
            !results.contains(
                event.target
            ) &&
            event.target !== input
        ){

            results.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "Auth event:",
            event
        );


        state.session =
            session ||
            null;


        state.user =
            session?.user ||
            null;


        /*
         * Don't perform heavy async work directly
         * inside the auth callback.
         */

        setTimeout(
            async () => {

                await loadCurrentProfile();

                renderMembers();

                updateMemberButton();

            },
            0
        );

    }
);


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

    /*
     * Schedule
     */

    supabaseClient

        .channel(
            "crowrules-schedule-v23"
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"schedule_items"
            },
            async () => {

                try{

                    await loadSchedule();

                    await syncCurrentProgram(
                        false
                    );

                }catch(error){

                    console.warn(
                        "Schedule realtime:",
                        error
                    );

                }

            }
        )

        .subscribe();


    /*
     * Channels
     */

    supabaseClient

        .channel(
            "crowrules-channels-v23"
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"tv_channels"
            },
            async () => {

                try{

                    await loadChannels();


                    if(
                        state.currentChannel
                    ){

                        const refreshed =
                            state.channels.find(
                                channel =>
                                    safeId(
                                        channel?.id
                                    ) ===
                                    safeId(
                                        state.currentChannel?.id
                                    )
                            );


                        if(refreshed){

                            state.currentChannel =
                                refreshed;

                            await syncCurrentProgram(
                                false
                            );

                        }

                    }

                }catch(error){

                    console.warn(
                        "Channels realtime:",
                        error
                    );

                }

            }
        )

        .subscribe();


    /*
     * Episodes
     */

    supabaseClient

        .channel(
            "crowrules-episodes-v23"
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"episodes"
            },
            async () => {

                try{

                    await loadEpisodes();

                    await loadSchedule();

                    await syncCurrentProgram(
                        false
                    );

                }catch(error){

                    console.warn(
                        "Episodes realtime:",
                        error
                    );

                }

            }
        )

        .subscribe();


    /*
     * Shows
     */

    supabaseClient

        .channel(
            "crowrules-shows-v23"
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"shows"
            },
            async () => {

                try{

                    await loadShows();

                    await loadEpisodes();

                }catch(error){

                    console.warn(
                        "Shows realtime:",
                        error
                    );

                }

            }
        )

        .subscribe();


    /*
     * Members
     */

    supabaseClient

        .channel(
            "crowrules-members-v23"
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"member_profiles"
            },
            async () => {

                try{

                    await loadMembers();

                    await loadCurrentProfile();

                    renderMembers();

                }catch(error){

                    console.warn(
                        "Members realtime:",
                        error
                    );

                }

            }
        )

        .subscribe();

}


/* =========================================================
   PERIODIC TV CLOCK
========================================================= */

setInterval(
    async () => {

        updateProgress();


        if(
            !state.currentChannel
        )
            return;


        const current =
            getCurrentItem(
                state.currentChannel.id
            );


        const currentId =
            safeId(
                current?.id
            );


        const activeId =
            safeId(
                state.currentItem?.id
            );


        /*
         * Program changed.
         */

        if(
            currentId !==
            activeId
        ){

            await syncCurrentProgram(
                true
            );

        }

    },
    5000
);


/* =========================================================
   PERIODIC DATA REFRESH
========================================================= */

setInterval(
    async () => {

        try{

            await Promise.all([
                loadChannels(),
                loadShows(),
                loadEpisodes(),
                loadSchedule(),
                loadMembers()
            ]);


            await syncCurrentProgram(
                false
            );

        }catch(error){

            console.warn(
                "Background refresh:",
                error
            );

        }

    },
    60000
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    $("#year").textContent =
        new Date()
            .getFullYear();


    playerMessage(
        "Connecting to CrowRules TV",
        "Loading channels and programming from Supabase."
    );


    try{

        /*
         * Auth is independent of TV playback.
         */

        await refreshAuth();


        /*
         * Load the actual TV database.
         */

        await Promise.all([

            loadChannels(),

            loadShows(),

            loadEpisodes(),

            loadSchedule(),

            loadMembers()

        ]);


        /*
         * IMPORTANT:
         *
         * Do NOT assume state.channels[0] exists.
         */

        const channel =
            restoreChannel();


        if(channel){

            await selectChannel(
                channel
            );

        }else{

            playerMessage(
                "No TV channels configured",
                "Create an active channel in the CrowRules TV Admin Dashboard."
            );

        }


        state.initialized =
            true;


        clearError();


        subscribeRealtime();


    }catch(error){

        console.error(
            "CrowRules TV initialization:",
            error
        );


        showError(
            error?.message ||
            "Unable to connect to CrowRules TV."
        );


        playerMessage(
            "CrowRules TV could not load",
            error?.message ||
            "Check your Supabase configuration and database permissions."
        );

    }

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
