<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CrowRules TV — Public v2.5.1</title>

<meta
  name="description"
  content="CrowRules TV — Independent streaming network."
>

<meta name="theme-color" content="#080808">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070707;
  --bg2:#0d0d0d;
  --panel:#111;
  --panel2:#161616;
  --border:#272727;
  --text:#f5f5f5;
  --muted:#999;
  --accent:#fff;
  --danger:#ff4545;
  --success:#39d98a;
  --shadow:0 15px 50px rgba(0,0,0,.45);
  --radius:14px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,rgba(255,255,255,.045),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Montserrat,Arial,sans-serif;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1400px,calc(100% - 32px));
  margin:auto;
}

/* HEADER */

.app-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  flex-shrink:0;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#151515;
  border:1px solid #333;
  font-size:24px;
}

.brand-text{
  font-family:Orbitron,sans-serif;
  font-weight:800;
  letter-spacing:1px;
  line-height:1;
}

.brand-text small{
  display:block;
  color:#777;
  font-family:Montserrat,sans-serif;
  font-size:8px;
  letter-spacing:1.3px;
  margin-top:5px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:4px;
  flex:1;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#aaa;
  padding:10px 12px;
  border-radius:9px;
  transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
  color:#fff;
  background:#171717;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-box{
  width:220px;
  height:40px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 11px;
  border:1px solid var(--border);
  background:#111;
  border-radius:9px;
}

.search-box span{
  color:#777;
  font-size:20px;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
}

.btn{
  border:1px solid #333;
  background:#151515;
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.btn:hover{
  background:#222;
}

.btn.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.icon-btn{
  border:1px solid #333;
  background:#151515;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:9px;
}

.mobile-menu{
  display:none;
}

/* MOBILE NAV */

#mobileNav{
  background:#0b0b0b;
  border-bottom:1px solid var(--border);
}

/* MAIN */

main{
  min-height:calc(100vh - 76px);
}

.page{
  padding:35px 0 70px;
}

.hero{
  padding:55px 0 35px;
}

.hero h1{
  font-family:Orbitron,sans-serif;
  font-size:clamp(34px,5vw,68px);
  margin:0 0 14px;
  line-height:1;
}

.hero p{
  color:#aaa;
  max-width:700px;
  line-height:1.7;
}

.section{
  margin-top:38px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.section-title{
  font-family:Orbitron,sans-serif;
  margin:0;
  font-size:22px;
}

.section-subtitle{
  color:#777;
  font-size:13px;
}

/* CARDS */

.card-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
}

.card{
  border:1px solid var(--border);
  background:linear-gradient(180deg,#151515,#0e0e0e);
  border-radius:var(--radius);
  overflow:hidden;
  transition:.2s;
  min-width:0;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#444;
  box-shadow:var(--shadow);
}

.card-image{
  aspect-ratio:16/9;
  background:#1a1a1a;
  overflow:hidden;
  position:relative;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.card-placeholder{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#555;
  font-size:35px;
}

.card-body{
  padding:13px;
}

.card-title{
  font-weight:800;
  font-size:14px;
  line-height:1.35;
}

.card-meta{
  color:#777;
  font-size:11px;
  margin-top:6px;
}

.card-actions{
  margin-top:11px;
  display:flex;
  gap:7px;
}

.card-actions button{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
}

/* PLAYER */

.player-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:18px;
}

.player-panel{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:#050505;
}

.video-wrap{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
}

.video-wrap video,
.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player-info{
  padding:16px;
}

.player-title{
  font-family:Orbitron,sans-serif;
  font-size:20px;
  font-weight:700;
}

.player-description{
  color:#888;
  line-height:1.6;
  font-size:13px;
  margin-top:7px;
}

.schedule-panel{
  border:1px solid var(--border);
  background:#0e0e0e;
  border-radius:var(--radius);
  overflow:hidden;
  max-height:620px;
}

.schedule-head{
  padding:15px;
  border-bottom:1px solid var(--border);
  font-family:Orbitron,sans-serif;
}

.schedule-list{
  overflow:auto;
  max-height:550px;
}

.schedule-item{
  padding:13px;
  border-bottom:1px solid #202020;
  cursor:pointer;
}

.schedule-item:hover{
  background:#171717;
}

.schedule-item.active{
  background:#202020;
  border-left:3px solid #fff;
}

.schedule-time{
  color:#777;
  font-size:11px;
}

.schedule-title{
  margin-top:4px;
  font-weight:700;
  font-size:13px;
}

/* MEMBERS */

.profile-panel{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:25px;
  padding:25px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:#101010;
}

.avatar{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  background:#1b1b1b;
  border:2px solid #333;
}

.form-grid{
  display:grid;
  gap:13px;
}

.field{
  display:grid;
  gap:6px;
}

.field label{
  color:#888;
  font-size:12px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #303030;
  background:#080808;
  color:#fff;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  padding:17px;
  border:1px solid var(--border);
  background:#111;
  border-radius:12px;
}

.stat-value{
  font-family:Orbitron,sans-serif;
  font-size:24px;
  font-weight:800;
}

.stat-label{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(480px,100%);
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:25px;
}

.modal h2{
  font-family:Orbitron,sans-serif;
  margin-top:0;
}

.modal-close{
  float:right;
  background:none;
  border:0;
  color:#777;
  font-size:22px;
}

/* STATUS */

.status{
  padding:12px 14px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
  display:none;
}

.status.show{
  display:block;
}

.status.error{
  background:#281010;
  color:#ff8585;
  border:1px solid #5c2222;
}

.status.success{
  background:#0e281c;
  color:#75e5a8;
  border:1px solid #245b3d;
}

.empty{
  padding:35px;
  text-align:center;
  color:#666;
  border:1px dashed #292929;
  border-radius:12px;
}

.loading{
  padding:35px;
  text-align:center;
  color:#777;
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  padding:30px 0;
  color:#666;
  font-size:12px;
  text-align:center;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .card-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .nav-links{
    display:none;
  }

  .mobile-menu{
    display:block;
  }

  .search-box{
    width:170px;
  }
}

@media(max-width:800px){
  .player-layout{
    grid-template-columns:1fr;
  }

  .schedule-panel{
    max-height:400px;
  }

  .schedule-list{
    max-height:330px;
  }

  .card-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .profile-panel{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:560px){
  .container{
    width:min(100% - 20px,1400px);
  }

  .brand-text{
    display:none;
  }

  .header-actions .btn.primary{
    display:none;
  }

  .search-box{
    width:140px;
  }

  .card-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<script>
/* ============================================================
   CROWRULES TV PUBLIC v2.5.1
   FIXED ROUTER / SUPABASE AUTH / PUBLIC DATA LAYER
   ============================================================ */


/* ------------------------------------------------------------
   SUPABASE CONFIG
   ------------------------------------------------------------ */

const SUPABASE_URL =
  "https://zauxdqyssratvzmomozf.supabase.co";

/*
   IMPORTANT:
   Put the PUBLIC anon key from your Supabase project here.

   Do NOT put the service_role key here.
*/

const SUPABASE_ANON_KEY =
  "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";


let supabaseClient = null;

if(
  SUPABASE_URL &&
  SUPABASE_ANON_KEY &&
  SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"
){
  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true,
          storageKey:"crowrules-tv-auth"
        }
      }
    );
}


/* ------------------------------------------------------------
   GLOBAL STATE
   ------------------------------------------------------------ */

const state = {

  route:"home",

  user:null,

  session:null,

  shows:[],

  episodes:[],

  channels:[],

  schedule:[],

  members:[],

  selectedShow:null,

  selectedEpisode:null,

  selectedChannel:null,

  watchSeconds:0,

  playerStartedAt:null,

  playerTimer:null,

  authMode:"login"

};


/* ------------------------------------------------------------
   DOM HELPERS
   ------------------------------------------------------------ */

const $ = selector =>
  document.querySelector(selector);

const $$ = selector =>
  Array.from(document.querySelectorAll(selector));


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showStatus(message,type="success"){

  const el = $("#globalStatus");

  if(!el) return;

  el.textContent = message;

  el.className =
    "status show " + type;

}


function hideStatus(){

  const el = $("#globalStatus");

  if(!el) return;

  el.className = "status";

}


/* ------------------------------------------------------------
   ROUTING
   ------------------------------------------------------------ */

const VALID_ROUTES = [
  "home",
  "live",
  "shows",
  "episodes",
  "channels",
  "members"
];


function normalizeRoute(route){

  route =
    String(route || "")
      .replace(/^#/,"")
      .split("/")[0]
      .trim()
      .toLowerCase();

  return VALID_ROUTES.includes(route)
    ? route
    : "home";

}


function getHashRoute(){

  const hash =
    window.location.hash || "#home";

  return normalizeRoute(hash);

}


function go(route){

  route = normalizeRoute(route);

  const target = "#" + route;

  if(window.location.hash !== target){

    window.location.hash = target;

  }else{

    renderRoute(route);

  }

}


function updateActiveNav(route){

  $$("[data-route]").forEach(button => {

    const target =
      normalizeRoute(
        button.dataset.route
      );

    button.classList.toggle(
      "active",
      target === route
    );

  });

}


function renderRoute(route){

  route = normalizeRoute(route);

  state.route = route;

  updateActiveNav(route);

  $("#mobileNav")?.classList.add("hidden");

  hideStatus();

  switch(route){

    case "home":
      renderHome();
      break;

    case "live":
      renderLive();
      break;

    case "shows":
      renderShows();
      break;

    case "episodes":
      renderEpisodes();
      break;

    case "channels":
      renderChannels();
      break;

    case "members":
      renderMembers();
      break;

    default:
      go("home");

  }

}


window.addEventListener(
  "hashchange",
  () => {

    renderRoute(
      getHashRoute()
    );

  }
);


/* ------------------------------------------------------------
   NAV CLICK HANDLER
   ------------------------------------------------------------ */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-route]"
      );

    if(!button) return;

    event.preventDefault();

    go(
      button.dataset.route
    );

  }
);


/* ------------------------------------------------------------
   MOBILE MENU
   ------------------------------------------------------------ */

$("#mobileMenuButton")
  ?.addEventListener(
    "click",
    () => {

      $("#mobileNav")
        ?.classList.toggle("hidden");

    }
  );


/* ------------------------------------------------------------
   SUPABASE INITIALIZATION
   ------------------------------------------------------------ */

async function initSupabase(){

  if(!supabaseClient){

    showStatus(
      "Supabase is not configured. Add your public anon key.",
      "error"
    );

    return;

  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error)
      throw error;

    state.session =
      data?.session || null;

    state.user =
      data?.session?.user || null;


    supabaseClient.auth.onAuthStateChange(
      async(event,session) => {

        state.session =
          session || null;

        state.user =
          session?.user || null;

        updateAuthButton();

        if(
          event === "SIGNED_IN" ||
          event === "SIGNED_OUT" ||
          event === "USER_UPDATED"
        ){

          await loadMemberProfile();

          if(state.route === "members")
            renderMembers();

        }

      }
    );

  }catch(error){

    console.error(
      "Supabase auth initialization failed:",
      error
    );

    showStatus(
      "Unable to connect to Supabase.",
      "error"
    );

  }

}


/* ------------------------------------------------------------
   DATABASE SAFE FETCH
   ------------------------------------------------------------ */

async function fetchTable(
  table,
  options={}
){

  if(!supabaseClient)
    return [];

  try{

    let query =
      supabaseClient
        .from(table)
        .select(options.select || "*");

    if(options.eq){

      for(
        const [column,value]
        of Object.entries(options.eq)
      ){

        query =
          query.eq(column,value);

      }

    }

    if(options.order){

      query =
        query.order(
          options.order.column,
          {
            ascending:
              options.order.ascending ?? false
          }
        );

    }

    if(options.limit){

      query =
        query.limit(options.limit);

    }

    const {
      data,
      error
    } = await query;

    if(error){

      console.warn(
        `Could not load ${table}:`,
        error.message
      );

      return [];

    }

    return data || [];

  }catch(error){

    console.warn(
      `Table ${table} unavailable:`,
      error
    );

    return [];

  }

}


/* ------------------------------------------------------------
   LOAD PUBLIC CONTENT
   ------------------------------------------------------------ */

async function loadPublicData(){

  /*
     These are deliberately independent.

     If one table is missing or has a schema problem,
     the rest of CrowRules TV still loads.
  */

  const [
    shows,
    episodes,
    channels,
    schedule
  ] = await Promise.all([

    fetchTable(
      "shows",
      {
        order:{
          column:"created_at",
          ascending:false
        }
      }
    ),

    fetchTable(
      "episodes",
      {
        order:{
          column:"created_at",
          ascending:false
        }
      }
    ),

    fetchTable(
      "tv_channels",
      {
        order:{
          column:"created_at",
          ascending:false
        }
      }
    ),

    fetchTable(
      "schedule_items",
      {
        order:{
          column:"start_time",
          ascending:true
        }
      }
    )

  ]);


  state.shows = shows;

  state.episodes = episodes;

  state.channels = channels;

  state.schedule = schedule;


  /*
     Some installations may use tv_channel_playlist
     instead of tv_channels.

     Only attempt the fallback if no channels loaded.
  */

  if(!state.channels.length){

    const playlist =
      await fetchTable(
        "tv_channel_playlist",
        {
          order:{
            column:"start_time",
            ascending:true
          }
        }
      );

    if(playlist.length){

      state.channels =
        playlist;

    }

  }

}

function updateAuthModal(){

  if(state.authMode === "login"){

$("#authSubmit")
  ?.addEventListener(
    "click",
    handleAuth
  );


async function handleAuth(){

  if(!supabaseClient){

    setAuthStatus(
      "Supabase is not configured.",
      "error"
    );

    return;

  }

  const email =
    $("#authEmail").value.trim();

  const password =
    $("#authPassword").value;


  if(!email || !password){

    setAuthStatus(
      "Enter your email and password.",
      "error"
    );

    return;

  }


  try{

    let result;

    if(state.authMode === "login"){

      result =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

    }else{

      result =
        await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              display_name:
                email.split("@")[0]
            }
          }
        });

    }


    if(result.error)
      throw result.error;


    if(state.authMode === "signup"){

      if(!result.data.session){

        setAuthStatus(
          "Account created. Check your email if confirmation is required.",
          "success"
        );

        return;

      }

    }


    state.session =
      result.data.session;

    state.user =
      result.data.user;


    updateAuthButton();

    closeAuth();

    await loadMemberProfile();

    showStatus(
      "Welcome to CrowRules TV.",
      "success"
    );

    if(state.route === "members")
      renderMembers();

  }catch(error){

    console.error(error);

    setAuthStatus(
      error.message ||
      "Authentication failed.",
      "error"
    );

  }

}


function setAuthStatus(
  message,
  type
){

  const el =
    $("#authStatus");

  if(!el) return;

  el.textContent =
    message;

  el.className =
    "status show " + type;

}

   ------------------------------------------------------------ */

let memberProfile = null;


async function loadMemberProfile(){

  memberProfile = null;

  if(!state.user)
    return;

  const profiles =
    await fetchTable(
      "profiles",
      {
        eq:{
          id:state.user.id
        },
        limit:1
      }
    );

  memberProfile =
    profiles[0] || null;

}


async function saveProfile(){

  if(!supabaseClient || !state.user){

    openAuth();

    return;

  }


  const displayName =
    $("#profileDisplayName")
      ?.value
      .trim() || "";

  const bio =
    $("#profileBio")
      ?.value
      .trim() || "";

  const avatarUrl =
    $("#profileAvatar")
      ?.value
      .trim() || "";


  try{

    /*
       Upsert is intentionally limited to common
       profile fields.

       If your Admin Pro has additional columns,
       they remain untouched.
    */

    const payload = {

      id:state.user.id,

      display_name:displayName,

      bio:bio,

      avatar_url:avatarUrl,

      updated_at:new Date().toISOString()

    };


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          payload,
          {
            onConflict:"id"
          }
        )
        .select()
        .single();


    if(error)
      throw error;


    memberProfile = data;

    showStatus(
      "Profile saved.",
      "success"
    );

  }catch(error){

    console.error(error);

    showStatus(
      "Profile could not be saved: " +
      error.message,
      "error"
    );

  }

}

function getVideoUrl(episode){

    episode?.video_url ||
    episode?.stream_url ||
    episode?.videoUrl ||
    episode?.media_url ||
    episode?.youtube_url ||
    episode?.youtubeUrl ||
    ""
  );

function youtubeId(url){

  if(!url)
    return null;

  try{

    const parsed =
      new URL(url);

    if(
      parsed.hostname.includes("youtube.com")
    ){

      return (
        parsed.searchParams.get("v") ||
        parsed.pathname.split("/").pop()
      );

    }

    if(
      parsed.hostname === "youtu.be"
    ){

      return parsed.pathname
        .replace("/","");

    }

  }catch{}

  return null;

}

/* ------------------------------------------------------------
   RESUME PLAYBACK
   ------------------------------------------------------------ */

function resumeKey(id){

  return (
    "crowrules_resume_" +
    String(id)
  );

}


function setupResumePlayback(
  video,
  episode
){

  const key =
    resumeKey(episode.id);

  const saved =
    Number(
      localStorage.getItem(key) || 0
    );


  if(saved > 0){

    video.addEventListener(
      "loadedmetadata",
      () => {

        if(
          saved <
          Math.max(
            0,
            video.duration - 5
          )
        ){

          video.currentTime =
            saved;

        }

      },
      {
        once:true
      }
    );

  }


  video.addEventListener(
    "timeupdate",
    () => {

      if(
        Number.isFinite(
          video.currentTime
        )
      ){

        localStorage.setItem(
          key,
          String(
            Math.floor(
              video.currentTime
            )
          )
        );

      }

    }
  );


  video.addEventListener(
    "ended",
    () => {

      localStorage.removeItem(key);

    }
  );


  video.addEventListener(
    "play",
    startWatchTimer
  );

  video.addEventListener(
    "pause",
    stopWatchTimer
  );

  video.addEventListener(
    "ended",
    stopWatchTimer
  );

}


function startWatchTimer(){

  if(state.playerTimer)
    return;

  state.playerStartedAt =
    Date.now();

  state.playerTimer =
    setInterval(
      () => {

        if(
          state.user &&
          state.playerStartedAt
        ){

          const elapsed =
            Math.floor(
              (
                Date.now() -
                state.playerStartedAt
              ) / 1000
            );

          if(elapsed > 0){

            state.watchSeconds +=
              elapsed;

            state.playerStartedAt =
              Date.now();

          }

        }

      },
      10000
    );

}


function stopWatchTimer(){

  if(state.playerTimer){

    clearInterval(
      state.playerTimer
    );

    state.playerTimer = null;

  }

  state.playerStartedAt = null;

}

  const channel =
    state.channels.find(
      x => String(x.id) === String(id)
    );

  if(!channel){

    showStatus(
      "Channel could not be found.",
      "error"
    );

    return;

  }


  state.selectedChannel =
    channel;


  const url =
    getVideoUrl(channel);

  const youtube =
    youtubeId(url);


  let player = "";


  if(youtube){

    player = `

      <iframe
        src="https://www.youtube.com/embed/${encodeURIComponent(youtube)}?autoplay=1&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>

    `;

  }else if(url){

    player = `

      <video
        id="channelVideo"
        controls
        autoplay
        playsinline
      >

        <source
          src="${escapeHTML(url)}"
        >

      </video>

    `;

  }else{

    player = `

      <div class="empty">
        This channel does not currently have
        a playable stream.
      </div>

    `;

  }


  $("#pageContent").innerHTML = `

    <section class="section">

      <button
        class="btn"
        data-route="channels"
      >
        ← Back to Channels
      </button>

      <div
        class="player-panel"
        style="margin-top:16px"
      >

        <div class="video-wrap">
          ${player}
        </div>

        <div class="player-info">

          <div class="player-title">
            ${escapeHTML(getTitle(channel))}
          </div>

          <div class="player-description">
            24/7 CrowRules TV channel.
          </div>

        </div>

      </div>

    </section>

  `;

}


/* ------------------------------------------------------------
   MEMBERS
   ------------------------------------------------------------ */

function renderMembers(){

  if(!state.user){

    $("#pageContent").innerHTML = `

      <section class="hero">

        <h1>
          Members Hub
        </h1>

        <p>
          Sign in to manage your CrowRules TV
          member profile, track your activity,
          and participate in the community.
        </p>

        <button
          class="btn primary"
          id="membersSignIn"
          type="button"
        >
          Sign In
        </button>

      </section>

    `;


    $("#membersSignIn")
      ?.addEventListener(
        "click",
        openAuth
      );

    return;

  }


  const profile =
    memberProfile || {};


  $("#pageContent").innerHTML = `

    <section class="section">

      <div class="section-head">

        <div>

          <h1 class="section-title">
            Members Hub
          </h1>

          <div class="section-subtitle">
            Manage your CrowRules TV profile.
          </div>

        </div>

        <button
          class="btn"
          id="signOutButton"
          type="button"
        >
          Sign Out
        </button>

      </div>


      <div class="profile-panel">

        <div>

          ${
            profile.avatar_url
              ? `
                <img
                  class="avatar"
                  src="${escapeHTML(profile.avatar_url)}"
                  alt="Profile"
                >
              `
              : `
                <div
                  class="avatar"
                  style="display:grid;place-items:center;font-size:50px"
                >
                  🐦‍⬛
                </div>
              `
          }

        </div>


        <div class="form-grid">

          <div class="field">

            <label>
              Display Name
            </label>

            <input
              id="profileDisplayName"
              value="${escapeHTML(
                profile.display_name ||
                state.user.user_metadata?.display_name ||
                ""
              )}"
            >

          </div>


          <div class="field">

            <label>
              Avatar URL
            </label>

            <input
              id="profileAvatar"
              value="${escapeHTML(
                profile.avatar_url || ""
              )}"
              placeholder="https://..."
            >

          </div>


          <div class="field">

            <label>
              Bio
            </label>

            <textarea
              id="profileBio"
            >${escapeHTML(
              profile.bio || ""
            )}</textarea>

          </div>


          <div>

            <button
              class="btn primary"
              id="saveProfileButton"
              type="button"
            >
              Save Profile
            </button>

          </div>

        </div>

      </div>

    </section>


    <section class="section">

      <div class="stats">

        <div class="stat">

          <div class="stat-value">
            ${formatSeconds(state.watchSeconds)}
          </div>

          <div class="stat-label">
            Watch Time
          </div>

        </div>

        <div class="stat">

          <div class="stat-value">
            ${state.shows.length}
          </div>

          <div class="stat-label">
            Shows
          </div>

        </div>

        <div class="stat">

          <div class="stat-value">
            ${state.episodes.length}
          </div>

          <div class="stat-label">
            Episodes
          </div>

        </div>

        <div class="stat">

          <div class="stat-value">
            ${state.channels.length}
          </div>

          <div class="stat-label">
            Channels
          </div>

        </div>

      </div>

    </section>

  `;


  $("#signOutButton")
    ?.addEventListener(
      "click",
      signOut
    );


  $("#saveProfileButton")
    ?.addEventListener(
      "click",
      saveProfile
    );

}


function formatSeconds(seconds){

  seconds =
    Number(seconds || 0);

  const hours =
    Math.floor(
      seconds / 3600
    );

  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  if(hours)
    return `${hours}h ${minutes}m`;

  return `${minutes}m`;

}


/* ------------------------------------------------------------
   SEARCH
   ------------------------------------------------------------ */

$("#globalSearch")
  ?.addEventListener(
    "keydown",
    event => {

      if(event.key !== "Enter")
        return;

      const term =
        event.target.value
          .trim()
          .toLowerCase();

      if(!term){

        go("home");

        return;

      }


      const show =
        state.shows.find(
          x =>
            getTitle(x)
              .toLowerCase()
              .includes(term)
        );


      if(show){

        go("shows");

        setTimeout(
          () => openShow(show.id),
          0
        );

        return;

      }


      const episode =
        state.episodes.find(
          x =>
            getTitle(x)
              .toLowerCase()
              .includes(term)
        );


      if(episode){

        go("episodes");

        setTimeout(
          () => openEpisode(episode.id),
          0
        );

        return;

      }


      showStatus(
        `No results found for "${event.target.value}".`,
        "error"
      );

    }
  );


/* ------------------------------------------------------------
   CARD EVENT DELEGATION
   ------------------------------------------------------------ */

document.addEventListener(
  "click",
  event => {

    const showButton =
      event.target.closest(
        "[data-open-show]"
      );

    if(showButton){

      event.preventDefault();

      openShow(
        showButton.dataset.openShow
      );

      return;

    }


    const episodeButton =
      event.target.closest(
        "[data-open-episode]"
      );

    if(episodeButton){

      event.preventDefault();

      openEpisode(
        episodeButton.dataset.openEpisode
      );

      return;

    }


    const channelButton =
      event.target.closest(
        "[data-open-channel]"
      );

    if(channelButton){

      event.preventDefault();

      openChannel(
        channelButton.dataset.openChannel
      );

      return;

    }

  }
);


/* ------------------------------------------------------------
   GLOBAL WINDOW HELPERS
   ------------------------------------------------------------ */

window.go = go;

window.openShow = openShow;

window.openEpisode = openEpisode;

window.openChannel = openChannel;

window.signOut = signOut;


/* ------------------------------------------------------------
   BOOT
   ------------------------------------------------------------ */

async function boot(){

  $("#year").textContent =
    new Date().getFullYear();


  /*
     Render Home immediately.

     This prevents the "CrowRules TV is loading"
     screen from becoming a permanent blank page
     if Supabase has a network/database problem.
  */

  renderRoute(
    getHashRoute()
  );


  /*
     Load authentication independently.
  */

  await initSupabase();

  updateAuthButton();


  /*
     Load public content independently.
  */

  await loadPublicData();


  /*
     Load member profile only after auth.
  */

  if(state.user){

    await loadMemberProfile();

  }


  /*
     Re-render the current route with real data.
  */

  renderRoute(
    getHashRoute()
  );

}


boot();

</script>
