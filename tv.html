<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
CrowRules TV | Broadcast Network v11 Ultimate
</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* =========================
   CROW RULES TV FOUNDATION
========================= */

:root{

--bg:#050505;
--panel:#0b0b0b;
--panel2:#111;

--cyan:#00ffff;
--green:#00ff66;
--red:#ff3030;

--border:
rgba(0,255,255,.18);

--glass:
rgba(255,255,255,.05);

}


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:
radial-gradient(circle at top,#101010,#000);

color:white;

font-family:
'Montserrat',
sans-serif;

overflow:hidden;

}


/* =========================
   APP FRAME
========================= */

#app{

display:flex;

height:100vh;

}


/* =========================
   SIDEBAR
========================= */

.sidebar{

width:240px;

background:
linear-gradient(
180deg,
#050505,
#090909
);

border-right:
1px solid var(--border);

display:flex;

flex-direction:column;

padding:20px;

}


.logo{

font-family:
Orbitron;

font-size:22px;

font-weight:900;

letter-spacing:3px;

color:var(--cyan);

margin-bottom:30px;

text-shadow:
0 0 15px var(--cyan);

}


.nav{

display:flex;

flex-direction:column;

gap:10px;

}


.nav button{

background:
var(--glass);

border:

1px solid var(--border);

color:white;

padding:14px;

border-radius:12px;

cursor:pointer;

text-align:left;

font-family:
Montserrat;

transition:.3s;

}


.nav button:hover{

background:
rgba(0,255,255,.15);

transform:
translateX(5px);

}



/* =========================
   MAIN AREA
========================= */


.main{

flex:1;

display:flex;

flex-direction:column;

}



/* =========================
   TOP BAR
========================= */


.topbar{

height:65px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 25px;


background:

rgba(0,0,0,.7);


border-bottom:
1px solid var(--border);

}



.broadcast{

color:
var(--red);

font-weight:bold;

}


.clock{

color:
var(--green);

font-family:
Orbitron;

}



/* =========================
   CONTENT
========================= */


.content{

display:flex;

flex:1;

overflow:hidden;

}



/* =========================
   HOME AREA
========================= */


.dashboard{

flex:1;

overflow-y:auto;

padding:25px;

}



/* =========================
   HERO
========================= */


.hero{

height:260px;

border-radius:20px;

padding:35px;

background:

linear-gradient(
135deg,
rgba(0,255,255,.25),
rgba(0,0,0,.9)
),

url("");

background-size:cover;


border:

1px solid var(--border);


display:flex;

flex-direction:column;

justify-content:center;

}



.hero h1{

font-family:
Orbitron;

font-size:42px;

color:
var(--cyan);

text-shadow:
0 0 20px var(--cyan);

}



.hero p{

margin-top:15px;

opacity:.8;

}



/* =========================
   PLAYER
========================= */


.player-box{

margin-top:25px;

height:500px;

background:#000;

border-radius:18px;

border:
2px solid var(--border);

position:relative;

overflow:hidden;

}



#player{

width:100%;

height:100%;

}



.loading{

position:absolute;

inset:0;

display:flex;

align-items:center;

justify-content:center;

background:#000;

color:var(--cyan);

font-family:Orbitron;

letter-spacing:3px;

}



/* =========================
 CHANNEL PANEL
========================= */


.channel-panel{

width:330px;

background:
var(--panel);

border-left:
1px solid var(--border);

padding:20px;

overflow-y:auto;

}



.section-title{

font-family:
Orbitron;

color:
var(--cyan);

margin-bottom:15px;

}



.channel-card{

background:
var(--glass);

border:
1px solid var(--border);

padding:15px;

border-radius:12px;

margin-bottom:12px;

cursor:pointer;

transition:.3s;

}



.channel-card:hover{

border-color:
var(--cyan);

background:
rgba(0,255,255,.12);

}



/* =========================
   MOBILE
========================= */


@media(max-width:900px){

.sidebar{

display:none;

}


.channel-panel{

display:none;

}


.hero h1{

font-size:28px;

}


}

</style>

</head>

<body>

RULES<br>
TV

========================= -->

<!-- HERO -->

CROWRULES TV
</h1>


<p>
Independent Streaming Network
<br>
Original Shows • Live Events • Gaming • Stories
</p>

<!-- =========================
     PLAYER
========================= -->


<div class="player-box">


<div id="player"></div>


<div class="loading" id="loading">

INITIALIZING BROADCAST SYSTEM...

</div>


</div>





<!-- =========================
     NOW PLAYING INFO
========================= -->


<div class="now-playing">


<h2 id="currentTitle">

Loading Broadcast...

</h2>


<p id="currentDescription">

Connecting to network...

</p>


<div id="broadcastStatus">

NETWORK OFFLINE

</div>


</div>




</div>





<!-- =========================
     CHANNEL LIST
========================= -->


<aside class="channel-panel">


<h2 class="section-title">

CHANNELS

</h2>

</div>



<h2 class="section-title">

UP NEXT

</h2>



<div id="upNext">


Waiting...

</div>



</aside>



</section>



</main>



</div>



<!-- =========================
     YOUTUBE API
========================= -->

<script src="https://www.youtube.com/iframe_api"></script>



<script>


/*
==================================
CROWRULES TV v11 FOUNDATION ENGINE
==================================
*/


// CLOCK

setInterval(()=>{

document.getElementById("clock").innerHTML =
new Date().toLocaleTimeString(
[],
{
hour:'2-digit',
minute:'2-digit'
}
);

},1000);



/*
==================================
PAGE SYSTEM
==================================
*/


function showPage(page){

console.log(
"Loading Page:",
page
);

}


/*
==================================
INITIAL BOOT
==================================
*/


window.onload=()=>{

console.log(
"CrowRules TV v11 Booting..."
);

};

/* =====================================
   PART 2 — BROADCAST ENGINE
===================================== */


const NETWORK = {


channels:{


"D&J Show":{

description:
"Comedy variety show",

videos:[

{id:"vT-BRFf2Yk0",title:"D&J Show — Episode #1"},
{id:"bo-fv8gLU1U",title:"D&J Show — Episode #2"},
{id:"x4W80w1wCZM",title:"D&J Show — Episode #3"},
{id:"Skdnn5cERuo",title:"D&J Show — Episode #4"},
{id:"6wsqHTc6Rl0",title:"D&J Show — Episode #5"},
{id:"7Z9--D8PLV8",title:"D&J Show — Episode #6"},
{id:"Ci_GVzgq2Go",title:"D&J Show — Episode #7"},
{id:"FE8wFPuMJPg",title:"D&J Show — Episode #8"},
{id:"wYnGU5XTwAA",title:"D&J Show — Episode #9"},
{id:"rrLKkjEdVSw",title:"D&J Show — Episode #10"}

],

index:0

},



"Talk Radio":{

description:
"Discussion and community show",

videos:[

{id:"JkoTW5nNXLg",title:"Talk Radio — Episode #1"},
{id:"sgmxBU9y6A4",title:"Talk Radio — Episode #2"},
{id:"J3SkM_WAdLo",title:"Talk Radio — Episode #3"},
{id:"uzb9N9exc7k",title:"Talk Radio — Episode #4"},
{id:"wVIMzr02YQg",title:"Talk Radio — Episode #5"},
{id:"lbuX1NST_WI",title:"Talk Radio — Episode #6"},
{id:"gX-4M0M8ax8",title:"Talk Radio — Episode #7"},
{id:"rzBtb7U-jtg",title:"Talk Radio — Episode #8"},
{id:"OeybM6vTSRo",title:"Talk Radio — Episode #9"},
{id:"ZJ4EH6ZLEwU",title:"Talk Radio — Episode #10"}

],

index:0

},



"Tacoma Nights":{

description:
"Flagship CrowRules original series",

videos:[

{id:"YXcW0pN3KrE",
title:"Tacoma Nights — Trailer"},


{id:"KQKBhSZrXd4",
title:"Back Deck Fireworks Live"},


{id:"uTvqIQjsxII",
title:"Tacoma Nights Episode 1 — My Life & My Story"},


{id:"56i8PhnjFHI",
title:"Tacoma Nights Episode 2 — The Weight of Caregiving"}

],

index:0

},



"Bird Brains":{

description:
"Comedy challenges coming soon",

videos:[],

index:0

}



};



/*
==================================
PLAYER STATE
==================================
*/


const PLAYER={

youtube:null,

channel:"Tacoma Nights",

ready:false

};



function currentChannel(){

return NETWORK.channels[
PLAYER.channel
];

}



function currentVideo(){

let ch=currentChannel();

return ch.videos[ch.index];

}



/*
==================================
YOUTUBE READY
==================================
*/


function onYouTubeIframeAPIReady(){


PLAYER.youtube =
new YT.Player(
"player",
{

height:"100%",

width:"100%",

videoId:
currentVideo().id,


playerVars:{

autoplay:1,

mute:1,

controls:1,

rel:0

},


events:{


onReady:()=>{

PLAYER.ready=true;

hideLoading();

updateNetworkUI();

PLAYER.youtube.playVideo();

},


onStateChange:
playerState

}


});


}




function hideLoading(){

document.getElementById(
"loading"
).style.display="none";

}



/*
==================================
LOAD VIDEO
==================================
*/


function playCurrent(){


if(!PLAYER.ready)
return;


let video=currentVideo();


PLAYER.youtube.loadVideoById(
video.id
);


saveProgress();


updateNetworkUI();


}





/*
==================================
NEXT EPISODE
==================================
*/


function nextEpisode(){


let ch=currentChannel();


ch.index++;


if(
ch.index >= ch.videos.length
){

ch.index=0;

}


playCurrent();


}





function playerState(event){


if(
event.data ===
YT.PlayerState.ENDED
){

nextEpisode();

}


}



/*
==================================
CHANNEL SWITCH
==================================
*/


function switchChannel(name){


PLAYER.channel=name;


NETWORK.channels[name].index=0;


playCurrent();


renderChannels();


}





/*
==================================
LOCAL MEMORY
==================================
*/


function saveProgress(){


localStorage.setItem(

"crowrules_channel",

PLAYER.channel

);


localStorage.setItem(

"crowrules_episode",

currentChannel().index

);


}





function loadProgress(){


let saved =
localStorage.getItem(
"crowrules_channel"
);


if(saved &&
NETWORK.channels[saved]){

PLAYER.channel=saved;

}



}





/*
==================================
NETWORK UI UPDATE
==================================
*/


function updateNetworkUI(){


let video=currentVideo();


document.getElementById(
"currentTitle"
).innerHTML=
video.title;



document.getElementById(
"currentDescription"
).innerHTML=
currentChannel().description;



document.getElementById(
"broadcastStatus"
).innerHTML=
"● NETWORK ONLINE • BROADCAST ACTIVE";



let next =
currentChannel().videos[
(currentChannel().index+1)
%
currentChannel().videos.length
];


document.getElementById(
"upNext"
).innerHTML =
next ? next.title :
"Coming Soon";


}





/*
==================================
CHANNEL MENU
==================================
*/


function renderChannels(){


let box =
document.getElementById(
"channelList"
);


box.innerHTML="";


Object.keys(
NETWORK.channels
)
.forEach(name=>{


let div=
document.createElement(
"div"
);


div.className=
"channel-card";


div.innerHTML=
`
<b>${name}</b>
<br>
<small>
${NETWORK.channels[name].description}
</small>
`;



div.onclick=
()=>switchChannel(name);



box.appendChild(div);



});


}





loadProgress();

renderChannels();

/* =====================================
   PART 3 — NETWORK FEATURES
===================================== */


/*
=====================================
CONTENT DATABASE
=====================================
*/

const LIBRARY = [

{
title:"Tacoma Nights",
category:"Originals",
description:
"Stories from Tacoma, life experiences, mental health, community, and building CrowRules Entertainment.",
channel:"Tacoma Nights"
},


{
title:"D&J Show",
category:"Comedy",
description:
"Comedy, challenges, and entertainment.",
channel:"D&J Show"
},


{
title:"Talk Radio",
category:"Talk",
description:
"Community discussions and conversations.",
channel:"Talk Radio"
},


{
title:"Bird Brains",
category:"Comedy",
description:
"Two guys. One brain. No common sense.",
channel:"Bird Brains"
},


{
title:"Gaming Nights",
category:"Gaming",
description:
"Roblox challenges, game nights, and events.",
channel:"Gaming Nights"
}

];



/*
=====================================
TV GUIDE
=====================================
*/


const GUIDE = [

{
time:"7:00 PM",
show:"Tacoma Nights",
episode:"Living The Story"
},


{
time:"8:00 PM",
show:"Bird Brains",
episode:"Comedy Challenges"
},


{
time:"9:00 PM",
show:"Gaming Nights",
episode:"Roblox Game Night"
},


{
time:"10:00 PM",
show:"CrowRules Originals",
episode:"Special Presentation"
}

];




function loadGuide(){


let page=
document.getElementById(
"guide"
);


if(!page)
return;



page.innerHTML="";


GUIDE.forEach(item=>{


let card=
document.createElement(
"div"
);


card.className=
"channel-card";


card.innerHTML=
`
<b>${item.time}</b>
<br>
${item.show}
<br>
<small>${item.episode}</small>
`;


page.appendChild(card);



});


}





/*
=====================================
SEARCH SYSTEM
=====================================
*/


function searchContent(query){


query=query.toLowerCase();


return LIBRARY.filter(item=>


item.title
.toLowerCase()
.includes(query)

||

item.category
.toLowerCase()
.includes(query)

);



}





/*
=====================================
FAVORITES
=====================================
*/


function addFavorite(title){


let favorites=
JSON.parse(

localStorage.getItem(
"crowrules_favorites"
)

||"[]"


);



if(!favorites.includes(title)){


favorites.push(title);


localStorage.setItem(

"crowrules_favorites",

JSON.stringify(favorites)

);


}



}





function getFavorites(){


return JSON.parse(

localStorage.getItem(
"crowrules_favorites"
)

||"[]"

);


}





/*
=====================================
CONTINUE WATCHING
=====================================
*/


function continueWatching(){


return {


channel:

localStorage.getItem(
"crowrules_channel"
)

,


episode:

localStorage.getItem(
"crowrules_episode"
)


};


}





/*
=====================================
ON DEMAND DISPLAY
=====================================
*/


function renderLibrary(){


let container=
document.getElementById(
"library"
);


if(!container)
return;


container.innerHTML="";


LIBRARY.forEach(item=>{


let card=
document.createElement(
"div"
);


card.className=
"channel-card";



card.innerHTML=
`

<h3>${item.title}</h3>

<p>
${item.description}
</p>

<small>
${item.category}
</small>

`;



card.onclick=
()=>switchChannel(
item.channel
);



container.appendChild(card);


});


}





/*
=====================================
HOME DASHBOARD
=====================================
*/


function loadHome(){


renderLibrary();


updateNetworkUI();


}





/*
=====================================
BOOT NETWORK FEATURES
=====================================
*/


setTimeout(()=>{


loadHome();


},1000);

/* =====================================
   PART 4 — CROWRULES ORIGINALS
===================================== */


/*
=====================================
ORIGINALS DATABASE

*/

*/


const EVENTS=[

},

},


{

}

/*
=====================================
FEATURED CONTENT
=====================================
*/


function renderFeatured(){


let box=
document.getElementById(
"featured"
);



if(!box)
return;



box.innerHTML="";



ORIGINALS.forEach(show=>{


let card=
document.createElement(
"div"
);



card.className=
"channel-card";



card.innerHTML=
`

<h2>
${show.icon}
${show.name}
</h2>

<p>
${show.description}
</p>

<br>

<small>
${show.status}
</small>

`;



if(show.channel){


card.onclick=
()=>switchChannel(
show.channel
);


}



box.appendChild(card);



});

/*
=====================================
EVENT DISPLAY
=====================================
*/


function renderEvents(){


let box=
document.getElementById(
"events"
);


if(!box)
return;



box.innerHTML="";



EVENTS.forEach(event=>{


let card=
document.createElement(
"div"
);

"channel-card";



card.innerHTML=
`

📡 ${event.title}
</h3>


<p>

</p>


<small>

</small>

box.appendChild(card);



});

/*
=====================================
NETWORK CATEGORY FILTER
=====================================
*/


function filterCategory(category){


return ORIGINALS.filter(
item=>

item.category===category

);


}





/*
=====================================
CROWRULES NETWORK STARTUP
=====================================
*/


function initializeOriginals(){


renderFeatured();


renderEvents();


console.log(

"CrowRules Originals Loaded"

);


}



setTimeout(()=>{


initializeOriginals();


},1500);

</script>


</body>
