<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CrowRules TV — Independent Streaming Network</title>

<meta
  name="description"
  content="CrowRules TV — independent 24/7 streaming network featuring original shows, episodes, channels, live programming and members."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050505;
  --bg2:#0a0a0a;
  --panel:#101010;
  --panel2:#151515;
  --line:#262626;
  --text:#f5f5f5;
  --muted:#9b9b9b;
  --accent:#fff;
  --danger:#ff4d5e;
  --success:#45e09a;
  --radius:14px;
  --shadow:0 15px 50px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -20%,#202020 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Montserrat,Arial,sans-serif;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1400px,calc(100% - 32px));
  margin:auto;
}

/* HEADER */

.app-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:74px;
  display:flex;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.brand-mark{
  width:43px;
  height:43px;
  border:1px solid #333;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:#0d0d0d;
}

.brand-text{
  font-family:Orbitron,sans-serif;
  font-weight:800;
  letter-spacing:1px;
  line-height:1;
}

.brand-text small{
  display:block;
  font-family:Montserrat,sans-serif;
  font-size:8px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:6px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#aaa;
  padding:10px 13px;
  border-radius:9px;
  font-weight:600;
}

.nav-btn:hover,
.nav-btn.active{
  background:#171717;
  color:#fff;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:#101010;
  border:1px solid var(--line);
  border-radius:9px;
  padding:0 11px;
}

.search-box span{
  color:#888;
}

.search-box input{
  width:175px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 0;
}

.btn,
.icon-btn{
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.btn:hover,
.icon-btn:hover{
  background:#1c1c1c;
}

.btn.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.btn.primary:hover{
  background:#ddd;
}

.mobile-menu{
  display:none;
}

#mobileNav{
  background:#090909;
  border-bottom:1px solid var(--line);
}

/* MAIN */

main{
  min-height:calc(100vh - 74px);
}

.page{
  padding:35px 0 70px;
}

.hero{
  min-height:420px;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:45px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.45),rgba(0,0,0,.8)),
    radial-gradient(circle at 80% 30%,#333,transparent 35%),
    #111;
  box-shadow:var(--shadow);
}

.hero-content{
  max-width:760px;
}

.eyebrow{
  font-family:Orbitron,sans-serif;
  font-size:11px;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:12px;
}

.hero h1{
  font-family:Orbitron,sans-serif;
  font-size:clamp(34px,6vw,76px);
  line-height:1;
  margin:0 0 18px;
}

.hero p{
  color:#ccc;
  line-height:1.7;
  max-width:650px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

/* SECTIONS */

.section{
  margin-top:42px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-family:Orbitron,sans-serif;
  font-size:20px;
}

.section-head span{
  color:#777;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
}

.card{
  min-width:0;
  background:#0e0e0e;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#444;
}

.thumb{
  aspect-ratio:16/9;
  background:
    linear-gradient(135deg,#1d1d1d,#090909);
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumb-placeholder{
  height:100%;
  display:grid;
  place-items:center;
  font-family:Orbitron,sans-serif;
  color:#555;
  font-size:11px;
  letter-spacing:2px;
}

.card-body{
  padding:13px;
}

.card-title{
  font-weight:800;
  line-height:1.3;
  font-size:14px;
}

.card-meta{
  color:#777;
  font-size:11px;
  margin-top:7px;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.small-btn{
  flex:1;
  border:1px solid #292929;
  background:#151515;
  color:#fff;
  border-radius:7px;
  padding:8px 7px;
  font-size:11px;
  font-weight:700;
}

/* LIVE */

.live-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:18px;
}

.player-panel,
.schedule-panel{
  background:#0c0c0c;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.player{
  aspect-ratio:16/9;
  background:#000;
  position:relative;
}

.player iframe,
.player video{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player-empty{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#666;
  text-align:center;
  padding:30px;
}

.player-info{
  padding:16px;
  border-top:1px solid var(--line);
}

.player-info h2{
  margin:0;
  font-size:17px;
}

.player-info p{
  color:#888;
  font-size:12px;
}

.schedule-panel{
  max-height:650px;
  overflow:auto;
}

.schedule-head{
  padding:16px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:#0c0c0c;
  z-index:2;
}

.schedule-head strong{
  font-family:Orbitron,sans-serif;
  font-size:13px;
}

.schedule-item{
  padding:13px;
  border-bottom:1px solid #1d1d1d;
  cursor:pointer;
}

.schedule-item:hover,
.schedule-item.current{
  background:#171717;
}

.schedule-time{
  font-size:10px;
  color:#777;
  margin-bottom:5px;
}

.schedule-title{
  font-weight:700;
  font-size:12px;
}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#ff6b76;
  font-size:10px;
  font-weight:800;
  margin-bottom:7px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff4d5e;
}

/* DETAIL */

.detail-hero{
  min-height:360px;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#101010;
  position:relative;
}

.detail-backdrop{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:.35;
}

.detail-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#050505 10%,rgba(5,5,5,.72),rgba(5,5,5,.9));
}

.detail-content{
  position:relative;
  z-index:2;
  padding:50px;
  max-width:850px;
}

/* MEMBERS */

.member-layout{
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  gap:20px;
}

.member-card,
.panel{
  background:#0e0e0e;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  border:1px solid #333;
  object-fit:cover;
  background:#171717;
}

.profile-name{
  font-family:Orbitron,sans-serif;
  font-size:18px;
  margin-top:15px;
}

.profile-email{
  color:#777;
  font-size:11px;
  margin-top:6px;
  word-break:break-word;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#888;
  font-size:11px;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  background:#090909;
  color:#fff;
  border:1px solid #292929;
  border-radius:9px;
  outline:0;
  padding:11px;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.member-stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#111;
  border:1px solid #222;
  border-radius:10px;
  padding:15px;
}

.stat strong{
  display:block;
  font-family:Orbitron,sans-serif;
  font-size:19px;
}

.stat span{
  color:#777;
  font-size:10px;
}

/* AUTH */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:3000;
}

.modal-card{
  width:min(440px,100%);
  background:#101010;
  border:1px solid #303030;
  border-radius:17px;
  padding:25px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  font-family:Orbitron,sans-serif;
  font-size:19px;
}

.close{
  border:0;
  background:transparent;
  color:#aaa;
  font-size:22px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#080808;
  padding:4px;
  border-radius:9px;
  margin-bottom:20px;
}

.auth-tab{
  border:0;
  background:transparent;
  color:#777;
  border-radius:7px;
  padding:9px;
  font-weight:700;
}

.auth-tab.active{
  background:#1a1a1a;
  color:#fff;
}

.message{
  padding:10px;
  border-radius:8px;
  background:#151515;
  color:#aaa;
  font-size:11px;
  margin-bottom:12px;
}

.message.error{
  color:#ff8c95;
}

.message.success{
  color:#76e6b0;
}

/* TOAST */

.toast-wrap{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5000;
  display:grid;
  gap:8px;
}

.toast{
  background:#161616;
  border:1px solid #333;
  color:#fff;
  border-radius:9px;
  padding:12px 15px;
  font-size:12px;
  box-shadow:var(--shadow);
}

/* EMPTY */

.empty{
  padding:50px 20px;
  text-align:center;
  color:#666;
  border:1px dashed #292929;
  border-radius:14px;
}

.loading{
  padding:40px;
  text-align:center;
  color:#666;
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  padding:35px 0;
  color:#666;
  font-size:11px;
  margin-top:30px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

/* RESPONSIVE */

@media(max-width:1150px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .nav-links{
    display:none;
  }

  .mobile-menu{
    display:block;
  }
}

@media(max-width:900px){
  .live-layout,
  .member-layout{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .search-box{
    display:none;
  }
}

@media(max-width:650px){
  .container{
    width:min(100% - 20px,1400px);
  }

  .brand-text{
    font-size:12px;
  }

  .brand-text small{
    font-size:6px;
  }

  .header-actions .btn.primary{
    display:none;
  }

  .hero{
    min-height:440px;
    padding:25px;
  }

  .detail-content{
    padding:28px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .member-stat-grid{
    grid-template-columns:1fr 1fr;
  }

  .footer-inner{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="container nav">

    <a
      class="brand"
      href="#home"
      data-route="home"
      aria-label="CrowRules TV Home"
    >
      <div class="brand-mark">🐦‍⬛</div>

      <div class="brand-text">
        CROWRULES TV
        <small>INDEPENDENT STREAMING NETWORK</small>
      </div>
    </a>

    <nav class="nav-links" aria-label="Main navigation">
      <button class="nav-btn active" data-route="home">Home</button>
      <button class="nav-btn" data-route="live">Live TV</button>
      <button class="nav-btn" data-route="shows">Shows</button>
      <button class="nav-btn" data-route="episodes">Episodes</button>
      <button class="nav-btn" data-route="channels">Channels</button>
      <button class="nav-btn" data-route="members">Members</button>
    </nav>

    <div class="header-actions">

      <div class="search-box">
        <span>⌕</span>
        <input
          id="globalSearch"
          autocomplete="off"
          placeholder="Search CrowRules TV"
        >
      </div>

      <button
        class="btn"
        id="authButton"
        type="button"
      >
        Sign In
      </button>

      <button
        class="btn primary"
        type="button"
        data-route="members"
      >
        Members
      </button>

      <button
        class="icon-btn mobile-menu"
        id="mobileMenuButton"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>

    </div>
  </div>
</header>

<div id="mobileNav" class="hidden">
  <div class="container" style="padding:10px 0 15px">
    <div style="display:grid;gap:5px">

      <button class="nav-btn" data-route="home">Home</button>
      <button class="nav-btn" data-route="live">Live TV</button>
      <button class="nav-btn" data-route="shows">Shows</button>
      <button class="nav-btn" data-route="episodes">Episodes</button>
      <button class="nav-btn" data-route="channels">Channels</button>
      <button class="nav-btn" data-route="members">Members</button>

    </div>
  </div>
</div>

<main id="app">
  <div class="loading">Loading CrowRules TV…</div>
</main>

<footer>
  <div class="container footer-inner">
    <div>
      <strong>CROWRULES TV</strong><br>
      Independent Streaming Network
    </div>

    <div>
      © <span id="year"></span> CrowRules Entertainment
    </div>
  </div>
</footer>

<!-- AUTH MODAL -->

<div
  id="authModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
>
  <div class="modal-card">

    <div class="modal-head">
      <h2>Members</h2>

      <button
        class="close"
        id="closeAuth"
        type="button"
      >
        ×
      </button>
    </div>

    <div class="auth-tabs">

      <button
        class="auth-tab active"
        id="signInTab"
        type="button"
      >
        Sign In
      </button>

      <button
        class="auth-tab"
        id="signUpTab"
        type="button"
      >
        Create Account
      </button>

    </div>

    <div id="authMessage" class="hidden message"></div>

    <form id="authForm">

      <div
        class="field hidden"
        id="displayNameField"
      >
        <label for="authDisplayName">
          Display Name
        </label>

        <input
          id="authDisplayName"
          type="text"
          maxlength="80"
          autocomplete="nickname"
        >
      </div>

      <div class="field">
        <label for="authEmail">
          Email
        </label>

        <input
          id="authEmail"
          type="email"
          required
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label for="authPassword">
          Password
        </label>

        <input
          id="authPassword"
          type="password"
          required
          minlength="6"
          autocomplete="current-password"
        >
      </div>

      <button
        class="btn primary"
        style="width:100%"
        id="authSubmit"
        type="submit"
      >
        Sign In
      </button>

    </form>

    <div
      id="forgotPassword"
      style="margin-top:14px;text-align:center"
    >
      <button
        class="small-btn"
        id="forgotPasswordButton"
        type="button"
      >
        Forgot password?
      </button>
    </div>

  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>

<script>
/* ============================================================
   CROWRULES TV PUBLIC v2.5
   ============================================================

   IMPORTANT:
   Replace only these two values with your existing Supabase
   project URL and ANON/PUBLISHABLE key.

   NEVER place a Supabase service_role key in public HTML.
============================================================ */

const SUPABASE_URL =
  "https://zauxdqyssratvzmomozf.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";

const hasSupabaseKey =
  SUPABASE_ANON_KEY &&
  !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");

const supabaseClient =
  hasSupabaseKey
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true,
            storageKey:"crowrules-tv-auth",
            storage:window.localStorage
          }
        }
      )
    : null;


/* ============================================================
   STATE
============================================================ */

const state = {
  route:"home",
  user:null,
  profile:null,

  shows:[],
  episodes:[],
  channels:[],
  schedule:[],
  currentChannel:null,
  currentScheduleItem:null,

  searchTerm:"",
  authMode:"signin",

  tvPosition:{}
};


/* ============================================================
   DOM HELPERS
============================================================ */

const $ = id => document.getElementById(id);

const app = $("app");

$("year").textContent =
  new Date().getFullYear();


/* ============================================================
   TOAST
============================================================ */

function toast(message){
  const wrap = $("toastWrap");

  const item = document.createElement("div");
  item.className = "toast";
  item.textContent = message;

  wrap.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },3500);
}


/* ============================================================
   SAFE TEXT
============================================================ */

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ============================================================
   IMAGE
============================================================ */

function imageOrPlaceholder(url,label="CROWRULES TV"){
  if(!url){
    return `
      <div class="thumb-placeholder">
        ${escapeHtml(label)}
      </div>
    `;
  }

  return `
    <img
      src="${escapeHtml(url)}"
      alt="${escapeHtml(label)}"
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;
}


/* ============================================================
   ROUTING
============================================================ */

function normalizeRoute(){

  let hash =
    window.location.hash.replace(/^#/,"");

  if(!hash){
    return {
      name:"home",
      id:null
    };
  }

  const parts =
    hash.split("/").filter(Boolean);

  const name =
    parts[0] || "home";

  const id =
    parts.slice(1).join("/") || null;

  const valid = [
    "home",
    "live",
    "shows",
    "show",
    "episodes",
    "episode",
    "channels",
    "channel",
    "members",
    "search"
  ];

  if(!valid.includes(name)){
    return {
      name:"home",
      id:null
    };
  }

  return {
    name,
    id
  };
}


function go(route,id=null){

  let target;

  if(id){
    target =
      `#${route}/${encodeURIComponent(id)}`;
  }else{
    target =
      `#${route}`;
  }

  /*
    IMPORTANT:
    Setting location.hash instead of only changing state
    makes browser navigation and refresh work.
  */

  if(window.location.hash !== target){
    window.location.hash = target;
  }else{
    renderRoute();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


window.go = go;


function updateActiveNavigation(route){

  document
    .querySelectorAll("[data-route]")
    .forEach(button=>{

      const target =
        button.dataset.route;

      button.classList.toggle(
        "active",
        target === route ||
        (
          route === "show" &&
          target === "shows"
        ) ||
        (
          route === "episode" &&
          target === "episodes"
        ) ||
        (
          route === "channel" &&
          target === "channels"
        )
      );
    });
}


async function renderRoute(){

  const route =
    normalizeRoute();

  state.route =
    route.name;

  updateActiveNavigation(route);

  $("mobileNav")
    .classList.add("hidden");

  if(
    route.name === "show" &&
    route.id
  ){
    await renderShowDetail(
      decodeURIComponent(route.id)
    );
    return;
  }

  if(
    route.name === "episode" &&
    route.id
  ){
    await renderEpisodeDetail(
      decodeURIComponent(route.id)
    );
    return;
  }

  if(
    route.name === "channel" &&
    route.id
  ){
    await renderChannelDetail(
      decodeURIComponent(route.id)
    );
    return;
  }

  switch(route.name){

    case "live":
      renderLive();
      break;

    case "shows":
      renderShows();
      break;

    case "episodes":
      renderEpisodes();
      break;

    case "channels":
      renderChannels();
      break;

    case "members":
      await renderMembers();
      break;

    case "search":
      renderSearch();
      break;

    case "home":
    default:
      renderHome();
      break;
  }
}


window.addEventListener(
  "hashchange",
  renderRoute
);

  const {

      session

async function loadProfile(){

  if(
    !supabaseClient ||
    !state.user
  ){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",state.user.id)

$("authForm")
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      if(!supabaseClient){

        authMessage(
          "Add your Supabase anon/publishable key to the configuration at the top of this file.",
          "error"
        );

        return;
      }

      const email =
        $("authEmail").value.trim();

      const password =
        $("authPassword").value;

      const displayName =
        $("authDisplayName").value.trim();

      const submit =
        $("authSubmit");

      submit.disabled=true;

      try{

        if(state.authMode === "signin"){

          /*
            Supabase automatically persists this session
            in localStorage because persistSession:true.
          */

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if(error){
            throw error;
          }

          state.user =
            data.user;

          await loadProfile();

          updateAuthButton();

          closeAuth();

          toast(
            `Welcome back, ${
              state.profile?.display_name ||
              state.user.email
            }`
          );

          renderRoute();

        }else{

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({
              email,
              password,
              options:{
                data:{
                  display_name:
                    displayName ||
                    email.split("@")[0]
                }
              }
            });

          if(error){
            throw error;
          }

          /*
            If email confirmation is disabled,
            Supabase returns an active session.
          */

          if(data.session){

            state.user =
              data.user;

            await ensureProfile();

            updateAuthButton();

            closeAuth();

            toast(
              "Your CrowRules TV account is ready."
            );

            go("members");

          }else{

            authMessage(
              "Account created. Check your email to confirm your account, then sign in.",
              "success"
            );

          }
        }

      }catch(error){

        console.error(error);

        authMessage(
          error.message ||
          "Authentication failed.",
          "error"
        );

      }finally{

        submit.disabled=false;

      }

    }
  );


async function ensureProfile(){

  if(
    !supabaseClient ||
    !state.user
  ){
    return;
  }

  const name =
    state.user.user_metadata?.display_name ||
    state.user.email?.split("@")[0] ||
    "Member";

  const {data} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",state.user.id)
      .maybeSingle();

  if(data){

    state.profile =
      data;

    return;
  }

  /*
    This insert is safe only when your profiles RLS
    permits authenticated users to create their own row.
  */

  const {data:created,error} =
    await supabaseClient
      .from("profiles")
      .insert({
        id:state.user.id,
        display_name:name,
        email:state.user.email || "",
        is_active:true
      })
      .select()
      .single();

  if(error){

    console.warn(
      "Could not create profile:",
      error
    );

    state.profile = {
      id:state.user.id,
      display_name:name,
      email:state.user.email || ""
    };

    return;
  }

  state.profile =
    created;
}


$("forgotPasswordButton")
  .addEventListener(
    "click",
    async ()=>{

      if(!supabaseClient){
        authMessage(
          "Supabase is not configured.",
          "error"
        );
        return;
      }

      const email =
        $("authEmail").value.trim();

      if(!email){

        authMessage(
          "Enter your email address first.",
          "error"
        );

        return;
      }

      try{

        const {
          error
        } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  window.location.pathname +
                  "#members"
              }
            );

        if(error){
          throw error;
        }

        authMessage(
          "Password reset instructions have been sent to your email.",
          "success"
        );

      }catch(error){

        authMessage(
          error.message ||
          "Unable to send password reset email.",
          "error"
        );

      }

    }
  );


async function signOut(){

  if(!supabaseClient){
    return;
  }

  await supabaseClient.auth.signOut();

  state.user=null;
  state.profile=null;

  updateAuthButton();

  toast("You have been signed out.");

  go("home");
}


async function authListener(){

  if(!supabaseClient){
    return;
  }

  supabaseClient.auth.onAuthStateChange(
    async (_event,session)=>{

      state.user =
        session?.user || null;

      if(state.user){

        /*
          Do not create a new session.
          Supabase's persisted session is reused.
        */

        await loadProfile();

      }else{

        state.profile=null;

      }

      updateAuthButton();

    }
  );
}

function renderCardSection(
  title,
  items,
  type
){

  return `

    <section class="section">

      <div class="section-head">

        <h2>${escapeHtml(title)}</h2>

        <button
          class="small-btn"
          data-route="${
            type === "show"
              ? "shows"

          }"

      ${
        items.length
          ? `

              ${

                  .map(
                    item =>
                      renderContentCard(
                        item,
                        type
                      )
                  )
                  .join("")
              }
            </div>
          `
          : `
            <div class="empty">
              No content available yet.
            </div>
          `
      }

  `;
}


function renderContentCard(
  item,
  type
){

  const image =
    item.thumbnail_url ||
    item.youtube_thumbnail_url ||
    item.banner_url;

  const title =
    item.title ||
    "Untitled";

  const meta =
    type === "show"
      ? item.category || "Show"
      : `Season ${
          item.season_number ??
          item.season ??
          1
        } • Episode ${
          item.episode_number ??
          "—"
        }`;

  return `

    <article class="card">

      <div class="thumb">

        ${imageOrPlaceholder(
          image,
          title
        )}

      </div>

      <div class="card-body">

        <div class="card-title">
          ${escapeHtml(title)}
        </div>

        <div class="card-meta">
          ${escapeHtml(meta)}
        </div>

        <div class="card-actions">

          <button
            class="small-btn"
            data-route="${type}"
            data-id="${escapeHtml(item.id)}"
          >
            ${
              type === "show"
                ? "View Show"
                : "Watch"
            }
          </button>

        </div>

      </div>

    </article>
  `;
}

/* ============================================================
   YOUTUBE NORMALIZATION
============================================================ */

function getYouTubeId(url){

  if(!url){
    return null;
  }

  try{

    const value =
      String(url).trim();

    /*
      Already an ID.
    */

    if(
      /^[A-Za-z0-9_-]{11}$/.test(value)
    ){
      return value;
    }

    const parsed =
      new URL(
        value,
        window.location.href
      );

    const host =
      parsed.hostname
        .toLowerCase()
        .replace(/^www\./,"");

    if(host === "youtu.be"){

      return (
        parsed.pathname
          .split("/")
          .filter(Boolean)[0]
          ?.slice(0,11)
      ) || null;

    }

    if(
      host === "youtube.com" ||
      host === "m.youtube.com"
    ){

      const watchId =
        parsed.searchParams.get("v");

      if(watchId){
        return watchId;
      }

      const parts =
        parsed.pathname
          .split("/")
          .filter(Boolean);

      const index =
        parts.findIndex(
          p =>
            [
              "embed",
              "shorts",
              "live"
            ].includes(p)
        );

      if(index >= 0){

        return (
          parts[index+1] ||
          null
        );

      }

    }

  }catch(error){
    console.warn(
      "YouTube URL parse error:",
      error
    );
  }

  return null;
}


function normalizePlaybackUrl(
  url,
  type=""
){

  if(!url){
    return null;
  }

  const youtubeId =
    getYouTubeId(url);

  if(
    youtubeId ||
    String(type).toLowerCase() === "youtube"
  ){

    if(youtubeId){

      return {
        type:"youtube",
        id:youtubeId,
        src:
          `https://www.youtube.com/embed/${youtubeId}` +
          `?autoplay=1&rel=0&modestbranding=1`
      };

    }

  }

  return {
    type:"video",
    id:null,
    src:String(url)
  };
}

function findCurrentScheduleItem(
  items
){

  const now =
    Date.now();

  return (
    items.find(item=>{

      const start =
        new Date(
          item.starts_at
        ).getTime();

      const end =
        new Date(
          item.ends_at
        ).getTime();

      return (
        Number.isFinite(start) &&
        Number.isFinite(end) &&
        now >= start &&
        now < end
      );

    }) || null
  );
}


function renderScheduleItems(
  items
){

  if(!items.length){

    return `
      <div class="empty">
        No scheduled programming.
      </div>
    `;

  }

  const now =
    Date.now();

  return items
    .filter(item=>{

      const end =
        new Date(
          item.ends_at
        ).getTime();

      return (
        Number.isNaN(end) ||
        end >= now - 3600000
      );

    })
    .slice(0,30)
    .map(item=>{

      const current =
        findCurrentScheduleItem(
          items
        )?.id === item.id;

      return `

        <div
          class="schedule-item ${
            current ? "current" : ""
          }"
          data-route="episode"
          data-id="${
            escapeHtml(
              item.episode_id ||
              item.episodes?.id ||
              ""
            )
          }"
        >

          ${
            current
              ? `
                <div class="live-badge">
                  <span class="live-dot"></span>
                  NOW
                </div>
              `
              : ""
          }

          <div class="schedule-time">
            ${formatTime(item.starts_at)}
            —
            ${formatTime(item.ends_at)}
          </div>

          <div class="schedule-title">
            ${escapeHtml(
              item.title ||
              item.episodes?.title ||
              "Untitled Program"
            )}
          </div>

        </div>

      `;

    })
    .join("");
}


function formatTime(value){

  if(!value){
    return "--:--";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "--:--";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


/* ============================================================
   TRUE 24/7 POSITION SUPPORT
============================================================ */

function calculateNetworkPosition(
  item
){

  if(!item){
    return 0;
  }

  const start =
    new Date(
      item.starts_at
    ).getTime();

  const now =
    Date.now();

  if(
    !Number.isFinite(start) ||
    now <= start
  ){
    return 0;
  }

  return Math.max(
    0,
    Math.floor(
      (now-start)/1000
    )
  );
}


function setupLivePlayer(
  current,
  playback,
  channel
){

  if(!current || !playback){
    return;
  }

  /*
    HTML5 files:
    jump directly into the program at the position dictated
    by the schedule. Refreshing the page therefore does not
    restart the program from zero.

    YouTube embeds cannot be reliably forced to an arbitrary
    playback position without additional API handling, so the
    player is loaded normally while the schedule remains the
    authoritative network clock.
  */

  if(playback.type === "video"){

    const video =
      $("livePlayer");

    if(!video){
      return;
    }

    const desired =
      calculateNetworkPosition(
        current
      );

    const seek = ()=>{

      if(
        Number.isFinite(video.duration) &&
        video.duration > desired
      ){

        try{
          video.currentTime =
            Math.min(
              desired,
              video.duration - .25
            );
        }catch(error){
          console.warn(
            "seek:",
            error
          );
        }

      }

      video.play()
        .catch(()=>{});

    };

    if(video.readyState >= 1){
      seek();
    }else{
      video.addEventListener(
        "loadedmetadata",
        seek,
        {once:true}
      );
    }

  }

  /*
    Persist the current channel/program locally so refreshes
    return to the same network destination.
  */

  try{

    localStorage.setItem(
      "crowrules_tv_last_channel",
      JSON.stringify({
        channelId:channel?.id || null,
        scheduleId:current?.id || null,
        savedAt:Date.now()
      })
    );

  }catch(error){}

}

async function saveProfile(event){

  event.preventDefault();

  if(
    !supabaseClient ||
    !state.user
  ){
    return;
  }

  const displayName =
    $("profileDisplayName")
      .value
      .trim();

  const avatarUrl =
    $("profileAvatarUrl")
      .value
      .trim();

  const bio =
    $("profileBio")
      .value
      .trim();

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          id:state.user.id,
          display_name:
            displayName ||
            "Member",
          avatar_url:
            avatarUrl ||
            null,
          bio:
            bio ||
            null,
          email:
            state.user.email || "",
          updated_at:
            new Date().toISOString()
        },
        {
          onConflict:"id"
        }
      )
      .select()
      .single();

  if(error){

    console.error(
      "profile save:",
      error
    );

    toast(
      "Could not save profile. Check your profiles RLS policies."
    );

    return;
  }

  state.profile =
    data;

  updateAuthButton();

  toast(
    "Profile saved."
  );

  renderMembers();
}

        String(item.title||"")
          .toLowerCase()
          .includes(term)
    );

  const episodes =
    state.episodes.filter(
      item =>
        String(item.title||"")
          .toLowerCase()
          .includes(term)
    );

  app.innerHTML = `

    <div class="page">

      <div class="container">

        <div class="section-head">

          <h2>
            Search Results
          </h2>

          <span>
            ${escapeHtml(
              state.searchTerm
            )}
          </span>

        </div>

        <section class="section">

          <div class="section-head">
            <h2>Shows</h2>
          </div>

          ${
            shows.length
              ? `
                <div class="grid">
                  ${
                    shows
                      .map(
                        item =>
                          renderContentCard(
                            item,
                            "show"
                          )
                      )
                      .join("")
                  }
                </div>
              `
              : `
                <div class="empty">
                  No matching shows.
                </div>
              `
          }

        </section>


        <section class="section">

          <div class="section-head">
            <h2>Episodes</h2>
          </div>

          ${
            episodes.length
              ? `
                <div class="grid">
                  ${
                    episodes
                      .map(
                        item =>
                          renderContentCard(
                            item,
                            "episode"
                          )
                      )
                      .join("")
                  }
                </div>
              `
              : `
                <div class="empty">
                  No matching episodes.
                </div>
              `
          }

        </section>

      </div>

    </div>
  `;
}


/* ============================================================
   CHANNEL AUTO-REFRESH / NETWORK CLOCK
============================================================ */

let networkTimer = null;

function startNetworkClock(){

  clearInterval(
    networkTimer
  );

  networkTimer =
    setInterval(
      async ()=>{

        /*
          Only refresh Live TV when the user is actually
          watching the Live TV route.

          This prevents normal page navigation from being
          unexpectedly interrupted.
        */

        const route =
          normalizeRoute();

        if(
          route.name !== "live" &&
          route.name !== "channel"
        ){
          return;
        }

        if(
          !state.currentChannel
        ){
          return;
        }

        await loadSchedule(
          state.currentChannel.id
        );

        const next =
          findCurrentScheduleItem(
            state.schedule
          );

        const previous =
          state.currentScheduleItem;

        if(
          next?.id !==
          previous?.id
        ){

          state.currentScheduleItem =
            next;

          /*
            A program boundary was reached.
            Re-render the player so the next scheduled item
            starts automatically.
          */

          if(
            route.name === "live"
          ){

            await renderLive();

          }

        }

      },
      15000
    );
}


/* ============================================================
   INITIALIZATION
============================================================ */

async function initialize(){

  try{

    /*
      Load content in parallel.
    */

    await Promise.all([
      loadShows(),
      loadEpisodes(),
      loadChannels(),
      refreshAuth()
    ]);

    await authListener();

    startNetworkClock();

    /*
      Home is the default route.
      The hash is authoritative, so:
        crowrules.html
      and
        crowrules.html#home
      both show Home.
    */

    if(!window.location.hash){

      history.replaceState(
        null,
        "",
        "#home"
      );

    }

    await renderRoute();

  }catch(error){

    console.error(
      "CrowRules TV initialization:",
      error
    );

    app.innerHTML = `

      <div class="page">

        <div class="container">

          <div class="empty">

            <h2>
              CrowRules TV is loading.
            </h2>

            <p>
              There was a problem connecting to the network.
            </p>

            <button
              class="btn"
              onclick="location.reload()"
            >
              Reload
            </button>

          </div>

        </div>

      </div>

    `;

  }

}


/* ============================================================
   KEYBOARD
============================================================ */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Escape" &&
      !$("authModal").classList.contains("hidden")
    ){
      closeAuth();
    }

  }
);


/* ============================================================
   START
============================================================ */

initialize();

</script>
