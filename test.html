/* =========================================================

========================================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function firstValue(
  obj,
  keys,
  fallback = ""
){

  for(const key of keys){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){

      return obj[key];

    }

  }

  return fallback;

}


function asArray(value){

  return Array.isArray(value)
    ? value
    : [];

}


function initials(name){

  return String(name || "CR")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(
      x => x.charAt(0)
    )
    .join("")
    .toUpperCase() || "CR";

}


function toast(message){

  const el =
    $("toast");

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {
        el.classList.remove("show");
      },
      3000
    );

}


/* =========================================================

let supabaseClient = null;


/* =========================================================
   LOAD SUPABASE CLIENT
========================================================= */

function loadSupabaseScript(){

  return new Promise(
    (resolve,reject) => {

      if(
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){

        resolve();

        return;

      }


      const existing =
        document.querySelector(
          'script[data-crowrules-supabase="true"]'
        );


      if(existing){

        existing.addEventListener(
          "load",
          resolve,
          {once:true}
        );

        existing.addEventListener(
          "error",
          reject,
          {once:true}
        );

        return;

      }


      const script =
        document.createElement("script");


      script.src =
        CONFIG.supabaseCdn;

      script.async =
        true;

      script.dataset.crowrulesSupabase =
        "true";


      script.onload =
        () => resolve();


      script.onerror =
        () =>
          reject(
            new Error(
              "Supabase browser library failed to load."
            )
          );


      document.head.appendChild(
        script
      );

    }
  );

}

/* =========================================================
   SAFE DATABASE QUERY
========================================================= */

async function safeFetchTable(
  table,
  options = {}
){

  if(!supabaseClient){

    return {
      ok:false,
      data:[],
      error:"Supabase client unavailable"
    };

  }


  try{

    let query =
      supabaseClient
        .from(table)
        .select(
          options.select || "*"
        );


    if(options.eq){

      for(
        const [
          column,
          value
        ]
        of Object.entries(options.eq)
      ){

        query =
          query.eq(
            column,
            value
          );

      }

    }


    if(options.gte){

      for(
        const [
          column,
          value
        ]
        of Object.entries(options.gte)
      ){

        query =
          query.gte(
            column,
            value
          );

      }

    }


    if(options.lte){

      for(
        const [
          column,
          value
        ]
        of Object.entries(options.lte)
      ){

        query =
          query.lte(
            column,
            value
          );

      }

    }


    if(options.order){

      query =
        query.order(
          options.order.column,
          {
            ascending:
              options.order.ascending !== false
          }
        );

    }


    if(options.limit){

      query =
        query.limit(
          options.limit
        );

    }


    const {
      data,
      error
    } =
      await query;


    if(error){

      console.warn(
        `[CrowRules TV] ${table}:`,
        error.message
      );


      return {
        ok:false,
        data:[],
        error
      };

    }


    return {
      ok:true,
      data:asArray(data),
      error:null
    };


  }catch(error){

    console.warn(
      `[CrowRules TV] ${table}:`,
      error
    );


    return {
      ok:false,
      data:[],
      error
    };

  }

}

/* =========================================================
   YOUTUBE
========================================================= */

function getYoutubeId(value){

  if(!value){
    return null;
  }


  const text =
    String(value).trim();


  if(
    /^[a-zA-Z0-9_-]{11}$/.test(text)
  ){

    return text;

  }


  try{

    const url =
      new URL(text);


    const host =
      url.hostname.toLowerCase();


    if(
      host === "youtu.be"
    ){

      return url.pathname
        .replace(/^\/+/,"")
        .split("/")[0]
        || null;

    }


    if(
      host.includes("youtube.com")
    ){

      const v =
        url.searchParams.get("v");


      if(v){
        return v;
      }


      const parts =
        url.pathname
          .split("/")
          .filter(Boolean);


      const types = [
        "embed",
        "live",
        "shorts"
      ];


      for(
        const type of types
      ){

        const index =
          parts.indexOf(type);


        if(
          index >= 0 &&
          parts[index + 1]
        ){

          return parts[
            index + 1
          ];

        }

      }

    }

  }catch(error){}


  return null;

}


function youtubeEmbed(value){

  const id =
    getYoutubeId(value);


  if(!id){
    return null;
  }


  return (
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id) +
    "?autoplay=1&rel=0&modestbranding=1"
  );

}


/* =========================================================
   PLAYER
========================================================= */

function stopMainMedia(){

  if(STATE.hls){

    try{

      STATE.hls.destroy();

    }catch(error){}

    STATE.hls =
      null;

  }


  const video =
    $("video");


  if(video){

    try{

      video.pause();

    }catch(error){}


    video.removeAttribute(
      "src"
    );


    video.load();

  }


  const yt =
    $("yt");


  if(yt){

    yt.src =
      "about:blank";

  }

}


function playYoutube(id){

  const embed =
    youtubeEmbed(id);


  if(!embed){
    return;
  }


  const yt =
    $("yt");

  const video =
    $("video");

  const placeholder =
    $("placeholder");


  if(!yt){
    return;
  }


  yt.src =
    embed;


  yt.classList.add(
    "active"
  );


  if(video){

    video.classList.remove(
      "active"
    );

  }


  if(placeholder){

    placeholder.style.display =
      "none";

  }


  if($("playerStatus")){

    $("playerStatus").textContent =
      "YOUTUBE";

  }

}


function playStream(url){

  if(!url){
    return;
  }


  const video =
    $("video");

  const yt =
    $("yt");

  const placeholder =
    $("placeholder");


  if(!video){
    return;
  }


  if(yt){

    yt.classList.remove(
      "active"
    );

  }


  if(placeholder){

    placeholder.style.display =
      "none";

  }


  video.classList.add(
    "active"
  );


  if(
    window.Hls &&
    Hls.isSupported() &&
    /\.m3u8($|\?)/i.test(url)
  ){

    if(STATE.hls){

      try{

        STATE.hls.destroy();

      }catch(error){}

    }


    STATE.hls =
      new Hls({
        enableWorker:true,
        lowLatencyMode:true
      });


    STATE.hls.loadSource(
      url
    );


    STATE.hls.attachMedia(
      video
    );


    STATE.hls.on(
      Hls.Events.MANIFEST_PARSED,
      () => {

        video.play()
          .catch(
            () => {}
          );

      }
    );


    if($("playerStatus")){

      $("playerStatus").textContent =
        "HLS LIVE";

    }


    return;

  }


  video.src =
    url;


  video.play()
    .catch(
      () => {}
    );


  if($("playerStatus")){

    $("playerStatus").textContent =
      "STREAM";

  }

}


/* =========================================================
   SELECT CHANNEL
========================================================= */

function selectChannel(raw){

  const channel =
    normalizeChannel(raw);


  STATE.currentChannel =
    channel;


  STATE.currentGuideItem =
    null;


  stopMainMedia();


  if($("placeholder")){

    $("placeholder").style.display =
      "grid";

  }


  if($("yt")){

    $("yt").classList.remove(
      "active"
    );

  }


  if($("video")){

    $("video").classList.remove(
      "active"
    );

  }


  if($("playerTitle")){

    $("playerTitle").textContent =
      channel.name;

  }


  if($("infoTitle")){

    $("infoTitle").textContent =
      channel.name;

  }


  if($("infoType")){

    $("infoType").textContent =
      channel.type;

  }


  if($("infoLive")){

    $("infoLive").textContent =
      channel.live
        ? "LIVE"
        : "AVAILABLE";

  }


  if($("playerViewerCount")){

    $("playerViewerCount").textContent =
      `● ${channel.viewers} watching`;

  }


  if($("playerStatus")){

    $("playerStatus").textContent =
      channel.live
        ? "LIVE"
        : "READY";

  }


  /*
    Channel playback priority:

    1. YouTube ID
    2. YouTube URL
    3. Direct stream URL
    4. Current schedule item
  */

  if(channel.youtubeId){

    playYoutube(
      channel.youtubeId
    );

  }else if(channel.youtubeUrl){

    const id =
      getYoutubeId(
        channel.youtubeUrl
      );


    if(id){

      playYoutube(id);

    }

  }else if(channel.streamUrl){

    playStream(
      channel.streamUrl
    );

  }else{

    const current =
      getCurrentScheduleItem(
        channel
      );


    if(current){

      playScheduleItem(
        current
      );

    }else if($("placeholderText")){

      $("placeholderText").textContent =
        "This channel does not currently have a playable stream.";

    }

  }


  updateGuideForChannel(
    channel
  );


  updateChatForChannel(
    channel
  );

}

  }

                >

                  ${escapeHtml(c.name)}
                </div>
              `;

            <article class="card">

              <div class="thumb">

                ${image}

                <span
                  class="badge ${c.live ? "live" : ""}"
                >
                  ${c.live ? "● LIVE" : "CHANNEL"}
                </span>

                <span class="number">
                  ${String(index+1).padStart(2,"0")}
                </span>

                <span class="viewer-count">
                  ● ${c.viewers} watching
                </span>

              </div>

              <div class="card-body">

                <div class="title">
                  ${escapeHtml(c.name)}
                </div>

                <div class="meta">
                  ${escapeHtml(
                    c.description ||
                    c.type ||
                    "CrowRules TV channel"
                  )}
                </div>

                <button
                  class="watch"
                  data-channel-index="${index}"
                >
                  ▶ WATCH CHANNEL
                </button>

              </div>

      )
      .join("");


  rail
    .querySelectorAll(
      "[data-channel-index]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

              Number(

              );


            const channel =
              STATE.channels[index];


            if(channel){

              selectChannel(
                channel
              );


              $("liveSection")
                ?.scrollIntoView({
                  behavior:"smooth"
                });

            }

          }
        );

      }
    );


  if($("channelRailStatus")){

    $("channelRailStatus").textContent =
      `${STATE.channels.length} AVAILABLE`;

  }

}

function parseDate(value){

  if(!value){
    return null;
  }


  const date =
    new Date(value);


  return Number.isNaN(
    date.getTime()
  )
    ? null
    : date;

}


function formatTime(value){

  const date =
    parseDate(value);


  if(!date){
    return "—";
  }


  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


function isGuideNow(item){

  const start =
    parseDate(item.start);

  const end =
    parseDate(item.end);


  if(!start){
    return false;
  }


  const now =
    new Date();


  return (
    start <= now &&
    (!end || end >= now)
  );

}


function findChannelName(id){

  if(!id){
    return "";
  }


  const channel =
    STATE.channels.find(
      raw =>
        String(
          firstValue(
            raw,
            [
              "id",
              "channel_id"
            ]
          )
        ) ===
        String(id)
    );


  return channel
    ? normalizeChannel(channel).name
    : "";

}


/* =========================================================
   GET CHANNEL SCHEDULE
========================================================= */

function getChannelSchedule(channel){

  if(!channel){
    return [];
  }


  return STATE.scheduleItems
    .map(normalizeGuide)
    .filter(
      item => {

        if(
          item.channelId &&
          channel.id
        ){

          return String(
            item.channelId
          ) ===
          String(
            channel.id
          );

        }


        if(item.channelName){

          return (
            item.channelName
              .toLowerCase() ===
            channel.name
              .toLowerCase()
          );

        }


        return false;

      }
    )
    .sort(
      (a,b) => {

        const da =
          parseDate(a.start);

        const db =
          parseDate(b.start);


        if(!da || !db){
          return 0;
        }


        return da-db;

      }
    );

}


/* =========================================================
   CURRENT CHANNEL PROGRAM
========================================================= */

function getCurrentScheduleItem(channel){

  const items =
    getChannelSchedule(
      channel
    );


  return (
    items.find(
      item =>
        isGuideNow(item)
    )
    ||
    items.find(
      item => {

        const start =
          parseDate(item.start);

        return (
          start &&
          start >= new Date()
        );

      }
    )
    ||
    null
  );

}


/* =========================================================
   PLAY SCHEDULE ITEM
========================================================= */

function playScheduleItem(item){

  if(!item){
    return;
  }


  STATE.currentGuideItem =
    item;


  if($("infoProgram")){

    $("infoProgram").textContent =
      item.program;

  }


  if($("playerTitle")){

    $("playerTitle").textContent =
      item.program;

  }


  const youtubeId =
    getYoutubeId(
      item.youtubeUrl
    );


  if(youtubeId){

    playYoutube(
      youtubeId
    );

    return;

  }


  if(item.streamUrl){

    playStream(
      item.streamUrl
    );

    return;

  }


  if($("placeholderText")){

    $("placeholderText").textContent =
      "This scheduled program does not currently have a playable video.";

  }

}

/* =========================================================
   UPDATE CHANNEL GUIDE
========================================================= */

function updateGuideForChannel(channel){

  const items =
    getChannelSchedule(
      channel
    );


  const current =
    items.find(
      item =>
        isGuideNow(item)
    );


  if($("infoProgram")){

    $("infoProgram").textContent =
      current
        ? current.program
        : "—";

  }


  /*
    If the channel itself has no direct stream,
    use its current schedule item.
  */

  if(
    channel &&
    !channel.youtubeId &&
    !channel.youtubeUrl &&
    !channel.streamUrl &&
    current
  ){

    /*
      Only automatically start schedule playback
      when there is an actual media URL.
    */

    if(
      current.youtubeUrl ||
      current.streamUrl
    ){

      playScheduleItem(
        current
      );

    }

  }

}

/* =========================================================
   CHAT ROOM
========================================================= */

async function findChatRoom(channel){

  if(
    !supabaseClient ||
    !channel
  ){

    return null;

  }


  if(channel.id){

    const result =
      await safeFetchTable(
        "chat_rooms",
        {
          eq:{
            channel_id:
              channel.id
          },
          limit:10
        }
      );


    if(result.ok){

      const exact =
        result.data.find(
          room =>
            String(
              firstValue(
                room,
                [
                  "channel_id",
                  "tv_channel_id"
                ]
              )
            ) ===
            String(channel.id)
        );


      if(exact){

        return exact;

      }

    }

  }


  const all =
    await safeFetchTable(
      "chat_rooms",
      {
        limit:100
      }
    );


  if(!all.ok){
    return null;
  }


  return all.data.find(
    room => {

      const name =
        firstValue(
          room,
          [
            "name",
            "room_name",
            "title"
          ]
        );


      return String(
        name || ""
      ).toLowerCase() ===
      String(
        channel.name || ""
      ).toLowerCase();

    }
  ) || null;

}

/* =========================================================
   REALTIME CHAT
========================================================= */

function subscribeChat(room){

  if(
    !supabaseClient ||
    !room
  ){

    return;

  }


  const roomId =
    firstValue(
      room,
      [
        "id",
        "room_id"
      ]
    );


  if(!roomId){
    return;
  }


  try{

    STATE.chatSubscription =
      supabaseClient
        .channel(
          `crowrules-chat-${roomId}`
        )
        .on(
          "postgres_changes",
          {
            event:"INSERT",
            schema:"public",
            table:"chat_messages"
          },
          payload => {

            const record =
              payload.new;


            const recordRoom =
              firstValue(
                record,
                [
                  "room_id",
                  "chat_room_id"
                ]
              );


            if(
              String(recordRoom) !==
              String(roomId)
            ){

              return;

            }


            appendMessage(
              record
            );

          }
        )
        .subscribe();

  }catch(error){

    console.warn(
      "[CrowRules TV] Chat realtime:",
      error
    );

  }

}


function appendMessage(raw){

  const box =
    $("channelMessages");


  if(!box){
    return;
  }


  box
    .querySelector(
      ".chat-note"
    )
    ?.remove();


  const m =
    normalizeMessage(raw);


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "msg";


  div.innerHTML = `

    <strong>
      ${escapeHtml(m.name)}
    </strong>

    <time>
      ${formatTime(m.created)}
    </time>

    <p>
      ${escapeHtml(m.text)}
    </p>

  `;


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}

async function sendChatMessage(){

  if(
    !supabaseClient ||
    !STATE.user ||
    !STATE.currentChatRoom
  ){

    openMemberModal();

    return;

  }


  const input =
    $("channelMessageInput");


  if(!input){
    return;
  }


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const roomId =
    firstValue(
      STATE.currentChatRoom,
      [
        "id",
        "room_id"
      ]
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("chat_messages")
      .insert({
        room_id:
          roomId,
        user_id:
          STATE.user.id,
        message:
          text,
        display_name:
          STATE.user.email ||
          "Member"
      })

  */

  if(
    data &&
    $("channelMessages")
  ){

    /*
      Do not force duplicate rendering if realtime
      has already delivered it.
    */

  }

}


/* =========================================================
   SEARCH
========================================================= */

function buildSearchIndex(){

  STATE.searchIndex = [

    ...STATE.channels.map(
      raw => {

        const c =
          normalizeChannel(raw);


        return {

          type:"CHANNEL",

          title:c.name,

          description:c.description

        };

      }
    ),


    ...STATE.shows.map(
      raw => {

        const s =
          normalizeShow(raw);


        return {

          type:"SHOW",

          title:s.title,

          description:s.description

        };

      }
    ),


    ...STATE.episodes.map(
      raw => {

        const e =
          normalizeEpisode(raw);


        return {

          type:"EPISODE",

          title:e.title,

          description:e.description

        };

      }
    ),


    ...STATE.scheduleItems.map(
      raw => {

        const g =
          normalizeGuide(raw);


        return {

          type:"PROGRAM",

          title:g.program,

          description:
            g.channelName ||
            findChannelName(
              g.channelId
            )

        };

      }
    ),


    ...STATE.members.map(
      raw => {

        const m =
          normalizeMember(raw);


        return {

          type:"MEMBER",

          title:m.name,

          description:m.bio

        };

      }
    )

  ];

}


function performSearch(){

  const input =
    $("search");

  const output =
    $("searchResults");


  if(
    !input ||
    !output
  ){

    return;

  }


  const term =
    input.value
      .trim()
      .toLowerCase();


  if(!term){

    output.textContent =
      "Search channels, shows, episodes, members and programming.";

    return;

  }


  const results =
    STATE.searchIndex
      .filter(
        item =>
          String(
            item.title || ""
          )
            .toLowerCase()
            .includes(term)
          ||
          String(
            item.description || ""
          )
            .toLowerCase()
            .includes(term)
      )
      .slice(0,20);


  if(!results.length){

    output.textContent =
      "No results found.";

    return;

  }


  output.innerHTML =
    results
      .map(
        result => `

          <div
            style="
              padding:9px 0;
              border-bottom:1px solid var(--line);
            "
          >

            <strong
              style="
                color:#fff;
                font-size:10px;
              "
            >
              ${escapeHtml(result.title)}
            </strong>

            <span
              style="
                margin-left:7px;
                color:var(--accent);
                font-family:Orbitron;
                font-size:7px;
              "
            >
              ${escapeHtml(result.type)}
            </span>

            ${
              result.description
                ? `
                  <div
                    style="
                      margin-top:4px;
                      color:var(--muted);
                      font-size:8px;
                    "
                  >
                    ${escapeHtml(
                      result.description
                    ).slice(0,150)}
                  </div>
                `
                : ""
            }

          </div>

        `
      )
      .join("");

}


/* =========================================================
   MEMBER MODAL
========================================================= */

function openMemberModal(){

  const modal =
    $("memberModal");


  if(!modal){
    return;
  }


  modal.classList.add(
    "open"
  );


  document.body.classList.add(
    "modal-open"
  );


  renderMemberModal();

}


function closeMemberModal(){

  $("memberModal")
    ?.classList.remove(
      "open"
    );


  document.body.classList.remove(
    "modal-open"
  );

}


function renderMemberModal(){

  const content =
    $("memberContent");


  if(!content){
    return;
  }


  if(STATE.user){

    content.innerHTML = `

      <div class="auth">

        <div
          style="
            padding:14px;
            border:1px solid var(--line);
            border-radius:10px;
            background:var(--panel2);
          "
        >

          <div class="eyebrow">
            SIGNED IN
          </div>

          <div
            style="
              margin-top:7px;
              font-weight:800;
              font-size:11px;
              overflow-wrap:anywhere;
            "
          >
            ${escapeHtml(
              STATE.user.email ||
              "Signed-in member"
            )}
          </div>

        </div>

        <button
          class="danger-btn"
          id="signOutBtn"
        >
          SIGN OUT

    `;


    $("signOutBtn")
      ?.addEventListener(
        "click",
        signOut

  content.innerHTML = `

    <div class="auth">

      <input
        id="authEmail"

        autocomplete="email"
        placeholder="Email address"
      >

      <input
        id="authPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <div class="auth-actions">

        <button
          class="primary"
          id="signInBtn"
        >
          SIGN IN
        </button>

        <button
          class="ghost"
          id="signUpBtn"
        >
          CREATE ACCOUNT
        </button>

      </div>

      <div
        class="auth-message"
        id="authMessage"
      >
        Sign in to participate in CrowRules TV channel chat.
      </div>

    </div>

  `;


  $("signInBtn")

  $("signUpBtn")
    ?.addEventListener(

    );

}


/* =========================================================
   AUTH
========================================================= */

async function signIn(){

  if(!supabaseClient){
    return;
  }


  const email =
    $("authEmail")
      ?.value
      .trim();


  const password =
    $("authPassword")
      ?.value;


  const message =
    $("authMessage");


  if(
    !email ||
    !password
  ){

    if(message){

      message.textContent =
        "Enter your email and password.";

    }


    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    if(message){

      message.textContent =
        error.message;

    }


    return;

  }


  STATE.session =
    data.session;


  STATE.user =
    data.user;


  updateAuthUI();

  renderMemberModal();


  toast(
    "Signed in successfully."
  );

}


async function signUp(){

  if(!supabaseClient){
    return;
  }


  const email =
    $("authEmail")
      ?.value
      .trim();


  const password =
    $("authPassword")
      ?.value;


  const message =
    $("authMessage");


  if(
    !email ||
    !password
  ){

    if(message){

      message.textContent =
        "Enter an email and password.";

    }


    return;

  }


  if(password.length < 6){

    if(message){

      message.textContent =
        "Password must be at least 6 characters.";

    }


    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signUp({
        email,
        password
      });


  if(error){

    if(message){

      message.textContent =
        error.message;

    }


    return;

  }


  if(data.session){

    STATE.session =
      data.session;


    STATE.user =
      data.user;


    updateAuthUI();

    renderMemberModal();


    toast(
      "Account created."
    );

  }else{

    if(message){

      message.textContent =
        "Account created. Check your email to confirm your account.";

    }

  }

}


async function signOut(){

  if(!supabaseClient){
    return;
  }


  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    toast(
      error.message
    );


    return;

  }


  STATE.session =
    null;


  STATE.user =
    null;


  updateAuthUI();

  renderMemberModal();


  toast(
    "Signed out."
  );

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreenPlayer(){

  const player =
    $("playerShell");


  if(!player){
    return;
  }


  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

    }else{

      await player.requestFullscreen();

    }

  }catch(error){

    toast(
      "Fullscreen is unavailable."
    );

  }

}


/* =========================================================
   POPOUT
========================================================= */

function togglePopout(){

  document.body.classList.toggle(
    "popout-active"
  );


  const active =
    document.body.classList.contains(
      "popout-active"
    );


  const button =
    $("popoutBtn");


  if(button){

    button.textContent =
      active
        ? "× CLOSE TV WINDOW"
        : "▣ TV WINDOW";

  }

}


/* =========================================================
   MINI PLAYER
========================================================= */

function closeMini(){

  $("miniPlayer")
    ?.classList.remove(
      "show"
    );


  if($("miniYT")){

    $("miniYT").src =
      "about:blank";

  }


  const video =
    $("miniVideoElement");


  if(video){

    try{

      video.pause();

    }catch(error){}


    video.removeAttribute(
      "src"
    );

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

function setupNavigation(){

  $("menuBtn")
    ?.addEventListener(
      "click",
      () => {

        const nav =
          $("navlinks");


        if(!nav){
          return;
        }


        nav.classList.toggle(
          "open"
        );


        $("menuBtn")
          .setAttribute(
            "aria-expanded",
            nav.classList.contains(
              "open"
            )
          );

      }
    );


  $("navlinks")
    ?.querySelectorAll("a")
    .forEach(
      link => {

        link.addEventListener(
          "click",
          () => {

            $("navlinks")
              ?.classList.remove(
                "open"
              );

          }
        );

      }
    );

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents(){

  $("watchLiveBtn")
    ?.addEventListener(
      "click",
      () => {

        $("liveSection")
          ?.scrollIntoView({
            behavior:"smooth"
          });

      }
    );


  $("reloadBtn")
    ?.addEventListener(
      "click",
      async () => {

        const button =
          $("reloadBtn");


        if(button){

          button.disabled =
            true;

          button.textContent =
            "↻ LOADING…";

        }


        await loadProgramming();


        if(button){

          button.disabled =
            false;

          button.textContent =
            "↻ REFRESH";

        }


        toast(
          "CrowRules TV refreshed."
        );

      }
    );


  $("fullBtn")
    ?.addEventListener(
      "click",
      fullscreenPlayer
    );


  $("popoutBtn")
    ?.addEventListener(
      "click",
      togglePopout
    );


  $("miniClose")
    ?.addEventListener(
      "click",
      closeMini
    );


  $("channelSendBtn")
    ?.addEventListener(
      "click",
      sendChatMessage
    );


  $("channelMessageInput")
    ?.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          sendChatMessage();

        }

      }
    );


  $("memberBtn")
    ?.addEventListener(
      "click",
      openMemberModal
    );


  $("closeMember")
    ?.addEventListener(
      "click",
      closeMemberModal
    );


  $("memberModal")
    ?.addEventListener(
      "click",
      event => {

        if(
          event.target ===
          $("memberModal")
        ){

          closeMemberModal();

        }

      }
    );


  $("search")
    ?.addEventListener(
      "input",
      performSearch
    );

}


/* =========================================================
   PROGRAMMING REALTIME
========================================================= */

function setupProgrammingRealtime(){

  if(
    !supabaseClient ||
    STATE.programmingSubscription
  ){

    return;

  }


  try{

    STATE.programmingSubscription =
      supabaseClient
        .channel(
          "crowrules-tv-programming"
        )


        /* ---------------------------------------------
           CHANNEL CHANGES
        --------------------------------------------- */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"tv_channels"
          },
          () => {

            loadProgramming();

          }
        )


        /* ---------------------------------------------
           CANONICAL SCHEDULE CHANGES
        --------------------------------------------- */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"schedule_items"
          },
          () => {

            loadProgramming();

          }
        )


        /* ---------------------------------------------
           SHOW CHANGES
        --------------------------------------------- */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shows"
          },
          () => {

            loadProgramming();

          }
        )


        /* ---------------------------------------------
           EPISODE CHANGES
        --------------------------------------------- */

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"episodes"
          },
          () => {

            loadProgramming();

          }
        )


        .subscribe();

  }catch(error){

    console.warn(
      "[CrowRules TV] Programming realtime:",
      error
    );

  }

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

  if(STATE.initialized){
    return;
  }


  STATE.initialized =
    true;


  if($("year")){

    $("year").textContent =
      new Date().getFullYear();

  }


  setupNavigation();

  setupEvents();


  /*
    IMPORTANT:
    Explicitly initialize the Supabase browser library
    before attempting any database operation.
  */

  const connected =
    await initializeSupabase();


  if(!connected){

    if($("placeholderText")){

      $("placeholderText").textContent =
        "CrowRules TV is running without database programming.";

    }


    return;

  }


  setupAuthListener();


  await loadSession();


  await loadProgramming();


  setupProgrammingRealtime();

}


/* =========================================================
   START
========================================================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    init,
    {
      once:true
    }
  );

}else{

  init();

}


/* =========================================================
   GUIDE CLOCK
========================================================= */

setInterval(
  () => {

    if(!STATE.scheduleItems.length){
      return;
    }


    try{

      renderGuide();


      if(STATE.currentChannel){

        updateGuideForChannel(
          STATE.currentChannel
        );

      }

    }catch(error){

      console.warn(
        "[CrowRules TV] Guide refresh:",
        error
      );

    }

  },
  30000
);

</script>
