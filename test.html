/* =========================================================
   SAFE HELPERS
========================================================= */

function escapeHtml(value) {
  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function firstValue(obj, keys, fallback = "") {
  if (!obj) return fallback;

  for (const key of keys) {
    if (
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ) {
      return obj[key];
    }
  }

  return fallback;
}


function asArray(value) {
  return Array.isArray(value) ? value : [];
}


function initials(name) {
  const text = String(name || "CR")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(x => x.charAt(0))
    .join("")
    .toUpperCase();

  return text || "CR";
}


function toast(message) {
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {

}


/* =========================================================

    } else if (state === "loading") {
      text.textContent = "LOADING";
    } else {
      text.textContent = "OFFLINE";
    }
  }
}


/* =========================================================
   DATABASE QUERY
========================================================= */

async function fetchTable(
  table,
  options = {}
) {
  if (!supabaseClient) {
    throw new Error("Supabase client unavailable.");
  }

  let query = supabaseClient
    .from(table)
    .select(options.select || "*");

  if (options.order) {
    query = query.order(
      options.order.column,
      {
        ascending:
          options.order.ascending !== false
      }
    );
  }

  if (options.limit) {
    query = query.limit(options.limit);
  }

  if (options.eq) {
    for (
      const [column, value]
      of Object.entries(options.eq)
    ) {
      query = query.eq(column, value);
    }
  }

  if (options.gte) {
    for (
      const [column, value]
      of Object.entries(options.gte)
    ) {
      query = query.gte(column, value);
    }
  }

  if (options.lte) {
    for (
      const [column, value]
      of Object.entries(options.lte)
    ) {
      query = query.lte(column, value);
    }
  }

  const { data, error } = await query;

  if (error) {
    throw error;
  }

  return asArray(data);
}


/* =========================================================
   SAFE TABLE LOAD
========================================================= */

async function safeFetchTable(
  table,
  options = {},
  fallback = []
) {
  try {
    return await fetchTable(
      table,
      options
    );
  } catch (error) {
    console.warn(
      `${table} unavailable:`,
      error.message
    );

    return fallback;
  }
}

function normalizeChannel(channel) {

    ),

        "channel_type",
        "stream_type"
      ],
      "CHANNEL"
    ),

    streamUrl: firstValue(
      channel,
      [
        "stream_url",
        "streamUrl",
        "url",
        "playback_url",
        "playbackUrl",
        "video_url",
        "videoUrl"
      ]
    ),

    youtubeUrl: firstValue(
      channel,
      [
        "youtube_url",
        "youtubeUrl",
        "youtube",
        "youtube_live_url",
        "youtube_video_url"
      ]
    ),

    youtubeId: firstValue(
      channel,
      [
        "youtube_id",
        "youtubeId",
        "video_id",
        "videoId"
      ]
    ),

    thumbnail: firstValue(
      channel,
      [
        "thumbnail_url",
        "thumbnail",
        "image_url",
        "image",
        "logo_url",
        "logo"
      ]
    ),

    live:
      toBoolean(
        firstValue(
          channel,
          [
            "is_live",
            "live",
            "currently_live"
          ],
          false
        )
      ),

    viewers:
      Number(
        firstValue(
          channel,
          [
            "viewer_count",
            "viewers",
            "current_viewers"
          ],
          0
        )
      ) || 0
  };
}


function toBoolean(value) {

  if (typeof value === "boolean") {
    return value;
  }

  if (
    typeof value === "number"
  ) {
    return value !== 0;
  }

  if (
    typeof value === "string"
  ) {
    return [
      "true",
      "1",
      "yes",
      "live"
    ].includes(
      value.toLowerCase()
    );
  }

  return false;
}


/* =========================================================
   YOUTUBE
========================================================= */

function getYoutubeId(value) {

  if (!value) {
    return null;
  }

  const text =
    String(value).trim();

  if (
    /^[a-zA-Z0-9_-]{11}$/.test(text)
  ) {
    return text;
  }

  try {

    const url =
      new URL(text);

    const host =
      url.hostname.toLowerCase();


    if (
      host === "youtu.be"
    ) {
      return url.pathname
        .replace(/^\/+/, "")
        .split("/")[0] || null;
    }


    if (
      host.includes("youtube.com")
    ) {

      const v =
        url.searchParams.get("v");

      if (v) {
        return v;
      }


      const parts =
        url.pathname
          .split("/")
          .filter(Boolean);


      const types = [
        "embed",
        "live",
        "shorts"
      ];


      for (
        const type of types
      ) {

        const index =
          parts.indexOf(type);

        if (
          index !== -1 &&
          parts[index + 1]
        ) {
          return parts[index + 1];
        }
      }
    }

  } catch (error) {
    return null;
  }

  return null;
}


function youtubeEmbed(value) {

  const id =
    getYoutubeId(value);

  if (!id) {
    return null;
  }

  return (
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id) +
    "?autoplay=1&rel=0&modestbranding=1"
  );
}

  }

    channel.name
  );

  setText(
    "miniTitle",
    channel.name
  );

  setText(
    "infoTitle",
    channel.name
  );

    channel.description ||
    "CrowRules TV channel"
  );

    "infoChannel",
    channel.name
  );

  setText(
    "infoType",
    channel.type
  );

  setText(
    "infoLive",
    channel.live
      ? "LIVE"
      : "AVAILABLE"
  );

  setText(
    "playerViewerCount",
    `● ${channel.viewers} watching`
  );

  setText(
    "playerStatus",
    channel.live
      ? "LIVE"
      : "READY"
  );


  if (channel.youtubeId) {

    playYoutube(
      channel.youtubeId
    );

  } else if (channel.youtubeUrl) {

    const id =
      getYoutubeId(
        channel.youtubeUrl
      );

    if (id) {
      playYoutube(id);
    }

  } else if (channel.streamUrl) {

    playStream(
      channel.streamUrl
    );

  } else {

    setText(
      "placeholderText",
      "This channel does not currently have a playable stream."
    );

  }


  await updateChatForChannel(
    channel
  );

  updateScheduleForChannel(
    channel
  );
}


/* =========================================================
   STOP MEDIA
========================================================= */

function stopMainMedia() {

  if (STATE.hls) {

    try {
      STATE.hls.destroy();
    } catch (error) {}

    STATE.hls = null;
  }


  const video =
    $("video");

  if (video) {

    try {
      video.pause();
    } catch (error) {}

    video.removeAttribute("src");
    video.load();
  }


  const yt =
    $("yt");

  if (yt) {
    yt.src = "about:blank";
  }
}


/* =========================================================
   YOUTUBE PLAYER
========================================================= */

function playYoutube(id) {

  const embed =
    youtubeEmbed(id);

  if (!embed) {
    return;
  }


  const iframe =
    $("yt");

  const video =
    $("video");

  const placeholder =
    $("placeholder");


  if (iframe) {

    iframe.src = embed;

    iframe.classList.add(
      "active"
    );
  }


  if (video) {
    video.classList.remove(
      "active"
    );
  }


  if (placeholder) {
    placeholder.style.display =
      "none";
  }


  setText(
    "playerStatus",
    "YOUTUBE"
  );
}


/* =========================================================
   STREAM PLAYER
========================================================= */

function playStream(url) {

  if (!url) {
    return;
  }


  const video =
    $("video");

  const yt =
    $("yt");

  const placeholder =
    $("placeholder");


  if (!video) {
    return;
  }


  if (yt) {
    yt.classList.remove(
      "active"
    );
  }


  if (placeholder) {
    placeholder.style.display =
      "none";
  }


  video.classList.add(
    "active"
  );


  if (
    window.Hls &&
    Hls.isSupported() &&
    /\.m3u8($|\?)/i.test(url)
  ) {

    STATE.hls =
      new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });


    STATE.hls.loadSource(url);

    STATE.hls.attachMedia(
      video
    );


    STATE.hls.on(
      Hls.Events.MANIFEST_PARSED,
      () => {
        video.play()
          .catch(() => {});
      }
    );


    setText(
      "playerStatus",
      "HLS LIVE"
    );

    return;
  }


  video.src = url;

  video.play()
    .catch(() => {});


  setText(
    "playerStatus",
    "STREAM"
  );
}

/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value) {

  if (!value) {
    return null;
  }

  const date =
    new Date(value);

  return Number.isNaN(
    date.getTime()
  )
    ? null
    : date;
}


function formatTime(value) {

  const date =
    parseDate(value);

  if (!date) {
    return "—";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );
}


function isScheduleNow(item) {

  const start =
    parseDate(item.start);

  const end =
    parseDate(item.end);

  if (!start) {
    return false;
  }

  const now =
    new Date();

  return (
    start <= now &&
    (!end || end >= now)
  );
}


/* =========================================================
   SCHEDULE RENDER
========================================================= */

        if (!db) return -1;

            isScheduleNow(item);

          const channel =
            item.channelName ||
            findChannelName(
              item.channelId
            );

            <tr
              class="${now ? "now-row" : ""}"
            >

              <td>
                ${formatTime(item.start)}
              </td>

              <td>
                <strong>
                  ${escapeHtml(
                    channel ||

              </td>

                  ${escapeHtml(item.title)}

              <td>
                ${escapeHtml(item.type)}
              </td>

              <td>
                ${formatTime(item.end)}
              </td>

              <td>

                ${
                  now
                    ? `

========================================================= */

function updateScheduleForChannel(
  channel
) {

  const items =
    STATE.schedule
      .map(
        normalizeScheduleItem
      )
      .filter(item => {

        if (
          item.channelId &&
          channel.id
        ) {

          return (
            String(item.channelId) ===
            String(channel.id)
          );
        }


        if (item.channelName) {

          return (
            item.channelName
              .toLowerCase() ===
            channel.name
              .toLowerCase()
          );
        }


        return false;
      })
      .filter(isScheduleNow)
      .sort((a, b) => {

        const da =
          parseDate(a.start);

        const db =
          parseDate(b.start);

        return (
          (da?.getTime() || 0) -
          (db?.getTime() || 0)
        );
      });


  if (items.length) {

    STATE.currentScheduleItem =
      items[0];

    setText(
      "infoProgram",
      items[0].title
    );

    setText(
      "infoProgram",
      "—"
    );

  }
}

/* =========================================================
   CHAT ROOM
========================================================= */

async function findChatRoom(channel) {

  if (!supabaseClient) {
    return null;
  }


  try {

    if (channel.id) {

      const rows =
        await safeFetchTable(
          "chat_rooms",
          {
            eq: {
              channel_id:
                channel.id
            },
            limit: 10
          }
        );


      if (rows.length) {
        return rows[0];
      }
    }


    const rows =
      await safeFetchTable(
        "chat_rooms",
        {
          limit: 100
        }
      );


    return (
      rows.find(row => {

        const name =
          firstValue(
            row,
            [
              "name",
              "room_name",
              "title"
            ]
          );

        return (
          String(name || "")
            .toLowerCase() ===
          String(channel.name || "")
            .toLowerCase()
        );
      }) || null
    );

  } catch (error) {

    console.warn(
      "Chat lookup unavailable:",
      error.message
    );

    return null;
  }
}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(room) {

  if (
    !supabaseClient ||
    !room
  ) {
    return;
  }


  const roomId =
    firstValue(
      room,
      [
        "id",
        "room_id"
      ]
    );


  if (!roomId) {
    return;
  }


  let rows =
    await safeFetchTable(
      "chat_messages",
      {
        eq: {
          room_id:
            roomId
        },
        limit: 100
      }
    );


  if (!rows.length) {

    rows =
      await safeFetchTable(
        "chat_messages",
        {
          eq: {
            chat_room_id:
              roomId
          },
          limit: 100
        }
      );
  }


  renderMessages(rows);
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(rows) {

  const box =
    $("channelMessages");

  if (!box) {
    return;
  }


  if (!rows.length) {

    box.innerHTML = `
      <div class="chat-note">
        No messages yet. Start the conversation.
      </div>
    `;

    return;
  }


  box.innerHTML =
    rows
      .map(raw => {

        const m =
          normalizeMessage(raw);


        return `
          <div class="msg">

            <strong>
              ${escapeHtml(m.name)}
            </strong>

            <time>
              ${formatTime(m.created)}
            </time>

            <p>
              ${escapeHtml(m.text)}
            </p>

          </div>
        `;
      })
      .join("");


  box.scrollTop =
    box.scrollHeight;
}


/* =========================================================
   REALTIME CHAT
========================================================= */

function subscribeChat(room) {

  if (
    !supabaseClient ||
    !room
  ) {
    return;
  }


  const roomId =
    firstValue(
      room,
      [
        "id",
        "room_id"
      ]
    );


  if (!roomId) {
    return;
  }


  STATE.chatSubscription =
    supabaseClient
      .channel(
        `crowrules-chat-${roomId}`
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "chat_messages"
        },
        payload => {

          const record =
            payload.new;


          const recordRoom =
            firstValue(
              record,
              [
                "room_id",
                "chat_room_id"
              ]
            );


          if (
            String(recordRoom) !==
            String(roomId)
          ) {
            return;
          }


          appendMessage(
            record
          );
        }
      )
      .subscribe();
}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(raw) {

  const box =
    $("channelMessages");

  if (!box) {
    return;
  }


  box
    .querySelector(
      ".chat-note"
    )
    ?.remove();


  const m =
    normalizeMessage(raw);


  const div =
    document.createElement("div");

  div.className =
    "msg";


  div.innerHTML = `
    <strong>
      ${escapeHtml(m.name)}
    </strong>

    <time>
      ${formatTime(m.created)}
    </time>

    <p>
      ${escapeHtml(m.text)}
    </p>
  `;


  box.appendChild(div);

  box.scrollTop =
    box.scrollHeight;
}


/* =========================================================
   SEND CHAT
========================================================= */

async function sendChatMessage() {

  if (
    !supabaseClient ||
    !STATE.user ||
    !STATE.currentChatRoom
  ) {

    openMemberModal();

    return;
  }


  const input =
    $("channelMessageInput");

  if (!input) {
    return;
  }


  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  const roomId =
    firstValue(
      STATE.currentChatRoom,
      [
        "id",
        "room_id"
      ]
    );


  try {

    let result =
      await supabaseClient
        .from("chat_messages")
        .insert({
          room_id:
            roomId,
          message:
            text
        })
        .select()
        .single();


    if (result.error) {

      result =
        await supabaseClient
          .from("chat_messages")
          .insert({
            chat_room_id:
              roomId,
            message:
              text
          })
          .select()
          .single();
    }


    if (result.error) {
      throw result.error;
    }


    input.value = "";

  } catch (error) {

    console.error(
      "Chat send failed:",
      error
    );

    toast(
      "Unable to send message."
    );
  }
}

/* =========================================================
   SEARCH
========================================================= */

function performSearch() {

  const input =
    $("search");

  const output =
    $("searchResults");

  if (
    !input ||
    !output
  ) {
    return;
  }


  const term =
    input.value
      .trim()
      .toLowerCase();


  if (!term) {

    output.textContent =
      "Search channels, shows, episodes, members and programming.";

    return;
  }


  const results =
    STATE.searchIndex
      .filter(item => {

        return (
          String(item.title || "")
            .toLowerCase()
            .includes(term)
          ||
          String(item.description || "")
            .toLowerCase()
            .includes(term)
        );
      })
      .slice(0, 20);


  if (!results.length) {

    output.textContent =
      "No results found.";

    return;
  }


  output.innerHTML =
    results
      .map(result => {

        return `
          <div
            style="
              padding:8px 0;
              border-bottom:1px solid var(--line);
            "
          >

            <strong
              style="
                color:#fff;
                font-size:10px;
              "
            >
              ${escapeHtml(
                result.title
              )}
            </strong>

            <span
              style="
                margin-left:7px;
                color:var(--accent);
                font-size:8px;
                font-family:Orbitron;
              "
            >
              ${escapeHtml(
                result.type
              )}
            </span>

            ${
              result.description
                ? `
                  <div
                    style="
                      margin-top:3px;
                      color:var(--muted);
                      font-size:9px;
                    "
                  >
                    ${escapeHtml(
                      result.description
                    ).slice(0, 150)}
                  </div>
                `
                : ""
            }

          </div>
        `;
      })
      .join("");
}

      </div>

    </div>
  `;


  $("signInBtn")
    ?.addEventListener(
      "click",
      signIn
    );

  $("signUpBtn")
    ?.addEventListener(
      "click",
      signUp
    );
}


/* =========================================================
   SIGN IN
========================================================= */

async function signIn() {

  if (!supabaseClient) {
    return;
  }


  const email =
    $("authEmail")
      ?.value
      .trim();

  const password =
    $("authPassword")
      ?.value;

  const message =
    $("authMessage");


  if (!email || !password) {

    if (message) {
      message.textContent =
        "Enter your email and password.";
    }

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if (error) {

    if (message) {
      message.textContent =
        error.message;
    }

    return;
  }


  STATE.session =
    data.session;

  STATE.user =
    data.user;


  updateAuthUI();

  renderMemberModal();

  toast(
    "Signed in successfully."
  );
}


/* =========================================================
   SIGN UP
========================================================= */

async function signUp() {

  if (!supabaseClient) {
    return;
  }


  const email =
    $("authEmail")
      ?.value
      .trim();

  const password =
    $("authPassword")
      ?.value;

  const message =
    $("authMessage");


  if (!email || !password) {

    if (message) {
      message.textContent =
        "Enter an email and password.";
    }

    return;
  }


  if (password.length < 6) {

    if (message) {
      message.textContent =
        "Password must be at least 6 characters.";
    }

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signUp({
        email,
        password
      });


  if (error) {

    if (message) {
      message.textContent =
        error.message;
    }

    return;
  }


  if (data.session) {

    STATE.session =
      data.session;

    STATE.user =
      data.user;

    updateAuthUI();

    renderMemberModal();

    toast(
      "Account created."
    );

  } else if (message) {

    message.textContent =
      "Account created. Check your email to confirm your account.";
  }
}


/* =========================================================
   SIGN OUT
========================================================= */

async function signOut() {

  if (!supabaseClient) {
    return;
  }


  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    toast(
      error.message
    );

    return;
  }


  STATE.session = null;
  STATE.user = null;

  updateAuthUI();

  renderMemberModal();

  toast(
    "Signed out."
  );
}


/* =========================================================
   AUTH LISTENER
========================================================= */

function setupAuthListener() {

  if (!supabaseClient) {
    return;
  }


  supabaseClient.auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        STATE.session =
          session || null;

        STATE.user =
          session?.user || null;

        updateAuthUI();
      }
    );
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreenPlayer() {

  const player =
    $("playerShell");

  if (!player) {
    return;
  }


  try {

    if (document.fullscreenElement) {

      await document.exitFullscreen();

    } else {

      await player.requestFullscreen();
    }

  } catch (error) {

    toast(
      "Fullscreen is not available."
    );
  }
}


/* =========================================================
   POPOUT
========================================================= */

function togglePopout() {

  document.body.classList.toggle(
    "popout-active"
  );


  const active =
    document.body.classList.contains(
      "popout-active"
    );


  const button =
    $("popoutBtn");

  if (button) {

    button.textContent =
      active
        ? "× CLOSE TV WINDOW"
        : "▣ TV WINDOW";
  }
}


/* =========================================================
   MINI PLAYER
========================================================= */

function showMini() {

  const mini =
    $("miniPlayer");

  const channel =
    STATE.currentChannel;

  if (
    !mini ||
    !channel
  ) {
    return;
  }


  const id =
    channel.youtubeId ||
    getYoutubeId(
      channel.youtubeUrl
    );


  if (id) {

    const iframe =
      $("miniYT");

    if (iframe) {

      iframe.src =
        youtubeEmbed(id);

      iframe.classList.add(
        "active"
      );
    }


    $("miniVideoElement")
      ?.classList.remove(
        "active"
      );

  } else if (channel.streamUrl) {

    $("miniYT")
      ?.classList.remove(
        "active"
      );


    const video =
      $("miniVideoElement");

    if (video) {

      video.classList.add(
        "active"
      );

      video.src =
        channel.streamUrl;
    }
  }


  setText(
    "miniTitle",
    channel.name
  );


  mini.classList.add(
    "show"
  );
}


function closeMini() {

  $("miniPlayer")
    ?.classList.remove("show");


  const iframe =
    $("miniYT");

  if (iframe) {
    iframe.src =
      "about:blank";
  }


  const video =
    $("miniVideoElement");

  if (video) {

    video.pause();

    video.removeAttribute(
      "src"
    );
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

function setupNavigation() {

  $("menuBtn")
    ?.addEventListener(
      "click",
      () => {

        const nav =
          $("navlinks");

        if (!nav) {
          return;
        }


        nav.classList.toggle(
          "open"
        );


        $("menuBtn")
          ?.setAttribute(
            "aria-expanded",
            nav.classList.contains(
              "open"
            )
          );
      }
    );


  $("navlinks")
    ?.querySelectorAll("a")
    .forEach(link => {

      link.addEventListener(
        "click",
        () => {

          $("navlinks")
            ?.classList.remove(
              "open"
            );
        }
      );
    });
}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  $("watchLiveBtn")
    ?.addEventListener(
      "click",
      () => {

        $("liveSection")
          ?.scrollIntoView({
            behavior: "smooth"
          });
      }
    );


  $("reloadBtn")
    ?.addEventListener(
      "click",
      async () => {

        const button =
          $("reloadBtn");

        if (button) {

          button.disabled = true;

          button.textContent =
            "↻ LOADING…";
        }


        await loadProgramming();


        if (button) {

          button.disabled = false;

          button.textContent =
            "↻ REFRESH PROGRAMMING";
        }


        toast(
          "CrowRules TV programming refreshed."
        );
      }
    );


  $("fullBtn")
    ?.addEventListener(
      "click",
      fullscreenPlayer
    );


  $("popoutBtn")
    ?.addEventListener(
      "click",
      togglePopout
    );


  $("miniClose")
    ?.addEventListener(
      "click",
      closeMini
    );


  $("channelSendBtn")
    ?.addEventListener(
      "click",
      sendChatMessage
    );


  $("channelMessageInput")
    ?.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendChatMessage();
        }
      }
    );


  $("memberBtn")
    ?.addEventListener(
      "click",
      openMemberModal
    );


  $("memberChatBtn")
    ?.addEventListener(
      "click",
      openMemberModal
    );


  $("closeMember")
    ?.addEventListener(
      "click",
      closeMemberModal
    );


  $("memberModal")
    ?.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          $("memberModal")
        ) {

          closeMemberModal();
        }
      }
    );


  $("search")
    ?.addEventListener(
      "input",
      performSearch
    );
}


/* =========================================================
   REALTIME PROGRAMMING
   tv_channels + schedule_items
========================================================= */

function setupProgrammingRealtime() {

  if (!supabaseClient) {
    return;
  }


  try {

    STATE.programmingSubscription =
      supabaseClient
        .channel(
          "crowrules-tv-programming"
        )

        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "tv_channels"
          },
          () => {
            loadProgramming();
          }
        )

        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "schedule_items"
          },
          () => {
            loadProgramming();
          }
        )

        .subscribe();

  } catch (error) {

    console.warn(
      "Programming realtime unavailable:",
      error.message
    );
  }
}


/* =========================================================
   SAFE TEXT
========================================================= */

function setText(id, value) {

  const el =
    $(id);

  if (el) {
    el.textContent =
      value ?? "";
  }
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

  setText(
    "year",
    new Date().getFullYear()
  );


  setupNavigation();

  setupEvents();


  if (!supabaseClient) {

    setConnectionState(
      "offline"
    );

    setText(
      "placeholderText",
      "CrowRules TV is currently offline."
    );

    return;
  }


  setupAuthListener();

  await loadSession();

  await loadProgramming();

  setupProgrammingRealtime();
}


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);


/* =========================================================
   KEEP CURRENT PROGRAM UPDATED
========================================================= */

setInterval(
  () => {

    if (!STATE.schedule.length) {
      return;
    }


    renderSchedule();


    if (STATE.currentChannel) {

      updateScheduleForChannel(
        STATE.currentChannel
      );
    }

  },
  30000
);
</script>
