<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>CrowRules TV | Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#030303;--red:#e50914;--muted:#a7a7a7;--line:rgba(255,255,255,.1);--display:Orbitron,sans-serif;--body:Montserrat,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(229,9,20,.12),transparent 35%),var(--bg);color:#fff;font-family:var(--body);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 22px;margin-bottom:45px}.brand{font:800 1rem var(--display);letter-spacing:.08em}.brand span{color:var(--red)}.back{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.hero{text-align:center;margin-bottom:35px}.eyebrow{color:var(--red);font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.title{font:800 clamp(2rem,6vw,4rem) var(--display);margin:12px 0;letter-spacing:.05em}.copy{max-width:700px;margin:auto;color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:10px;padding:22px;transition:.2s}.card:hover{transform:translateY(-2px);border-color:rgba(229,9,20,.45)}.card h2{font:700 1.05rem var(--display);margin:0 0 9px}.card p{color:var(--muted);font-size:.8rem;line-height:1.65;min-height:54px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:#999;font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}.badge.live{color:#fff;background:rgba(229,9,20,.15)}.button{display:inline-flex;padding:11px 15px;border-radius:5px;background:var(--red);font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.button.off{background:#1a1a1c;color:#777;pointer-events:none}</style>
<script src="js/live-config.js"></script></head>
<body><main class="wrap"><nav class="nav"><a class="brand" href="index.html">CROW<span>RULES</span> TV</a><a class="back" href="index.html">← Home</a></nav>
<section class="hero"><div class="eyebrow">CrowRules+</div><h1 class="title">LIVE</h1><p class="copy">Custom HLS live channels for CrowRules TV and the CrowRules+ streaming experience.</p></section><section id="channels" class="grid"></section></main>
<script>
const root=document.getElementById("channels");
root.innerHTML=window.CROWRULES_LIVE_CONFIG.channels.map(c=>{const live=Boolean(c.isLive&&c.playbackUrl);return '<article class="card"><div class="badge '+(live?"live":"")+'">'+(live?"● LIVE":"OFFLINE")+'</div><h2>'+escapeHtml(c.name)+'</h2><p>'+escapeHtml(c.description||"CrowRules live channel.")+'</p><a class="button '+(live?"":"off")+'" href="'+(live?"watch.html?channel="+encodeURIComponent(c.slug):"#")+'">'+(live?"Watch Live":"Not Live")+'</a></article>';}).join("");
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
