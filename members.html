<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CrowRules TV — Admin v3.0</title>

<meta name="theme-color" content="#080808">
<meta name="description"
      content="CrowRules TV Administration Dashboard v3.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#070707;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1b1b1b;
  --border:#292929;
  --text:#f5f5f5;
  --muted:#9b9b9b;
  --accent:#e5e5e5;
  --green:#45d483;
  --red:#ff4f5e;
  --yellow:#f0c75e;
  --blue:#5ea7ff;
  --shadow:0 15px 45px rgba(0,0,0,.4);
  --radius:14px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Montserrat,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 20%,#202020 0,#090909 45%,#050505 100%);
}

.login-card{
  width:100%;
  max-width:460px;
  background:rgba(15,15,15,.96);
  border:1px solid var(--border);
  border-radius:22px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo{
  font-family:Orbitron,sans-serif;
  font-weight:800;
  letter-spacing:2px;
}

.logo span{
  color:#aaa;
}

.login-card h1{
  margin:10px 0 8px;
  font-size:28px;
}

.login-card p{
  color:var(--muted);
  line-height:1.6;
}

.field{
  margin:16px 0;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#cfcfcf;
  font-size:13px;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0b0b;
  color:white;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#666;
}

.btn{
  border:1px solid var(--border);
  background:#151515;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  transition:.2s;
}

.btn:hover{
  background:#222;
  transform:translateY(-1px);
}

.btn-primary{
  background:#f2f2f2;
  color:#080808;
  border-color:#f2f2f2;
  font-weight:800;
}

.btn-primary:hover{
  background:white;
}

.btn-danger{
  color:#fff;
  background:#391116;
  border-color:#70232c;
}

.btn-success{
  color:#fff;
  background:#123523;
  border-color:#245f3d;
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
}

.notice{
  padding:13px 15px;
  border-radius:10px;
  background:#161616;
  border:1px solid var(--border);
  color:#bbb;
  line-height:1.5;
}

.notice.error{
  background:#291014;
  border-color:#63232b;
  color:#ffb2b9;
}

.notice.success{
  background:#102319;
  border-color:#245f3d;
  color:#a9f0c5;
}

.notice.warn{
  background:#28210d;
  border-color:#6a581d;
  color:#f2d887;
}

/* =========================================================
   APP
========================================================= */

#app{
  display:none;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:260px;
  background:#090909;
  border-right:1px solid var(--border);
  z-index:50;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:25px 22px;
  border-bottom:1px solid var(--border);
}

.brand-title{
  font-family:Orbitron,sans-serif;
  font-weight:800;
  letter-spacing:1.5px;
  font-size:18px;
}

.brand-sub{
  margin-top:5px;
  color:#777;
  font-size:11px;
  letter-spacing:1px;
}

.nav{
  padding:15px 10px;
  overflow:auto;
}

.nav-section{
  color:#666;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
  margin:17px 11px 7px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#999;
  text-align:left;
  padding:12px 13px;
  border-radius:9px;
  margin-bottom:3px;
}

.nav button:hover{
  color:white;
  background:#151515;
}

.nav button.active{
  color:white;
  background:#1d1d1d;
}

.nav-icon{
  width:23px;
  display:inline-block;
}

.sidebar-footer{
  margin-top:auto;
  padding:15px;
  border-top:1px solid var(--border);
}

.user-mini{
  font-size:12px;
  color:#aaa;
  margin-bottom:10px;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:260px;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:40;
  height:70px;
  background:rgba(7,7,7,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
}

.topbar-title{
  font-family:Orbitron,sans-serif;
  font-size:15px;
  letter-spacing:1px;
}

.topbar-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  display:inline-block;
}

.content{
  padding:30px;
  max-width:1600px;
  margin:auto;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:20px;
}

.panel-head{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.panel-head h2{
  margin:0;
  font-size:18px;
}

.panel-body{
  padding:20px;
}

.eyebrow{
  font-size:10px;
  color:#777;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:6px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
}

.stat strong{
  display:block;
  font-family:Orbitron,sans-serif;
  font-size:25px;
  margin-bottom:7px;
}

.stat span{
  color:#888;
  font-size:12px;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,
td{
  padding:13px 15px;
  text-align:left;
  border-bottom:1px solid #202020;
  font-size:13px;
}

th{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

td{
  color:#ddd;
}

tr:hover td{
  background:#141414;
}

.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--border);
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
}

.badge.green{
  color:#9df0bd;
  background:#102319;
}

.badge.red{
  color:#ffadb4;
  background:#291014;
}

.badge.yellow{
  color:#f1dc92;
  background:#28210d;
}

.badge.blue{
  color:#add0ff;
  background:#101d2c;
}

/* =========================================================
   AWARDS
========================================================= */

.awards-hero{
  background:
    linear-gradient(135deg,#151515,#090909);
  border:1px solid #303030;
  border-radius:18px;
  padding:30px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}

.awards-hero:after{
  content:"🏆";
  position:absolute;
  right:30px;
  top:15px;
  font-size:100px;
  opacity:.07;
}

.awards-hero h1{
  margin:0 0 8px;
  font-family:Orbitron,sans-serif;
}

.awards-hero p{
  color:#888;
  max-width:700px;
}

.award-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.award-card{
  background:#121212;
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
}

.award-card h3{
  margin:0 0 8px;
  font-size:15px;
}

.award-card p{
  margin:0 0 14px;
  color:#888;
  font-size:12px;
}

.award-card .actions{
  margin-top:10px;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.loading{
  padding:45px 20px;
  text-align:center;
  color:#666;
}

.loading:before{
  content:"";
  width:22px;
  height:22px;
  border:2px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  display:inline-block;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  box-shadow:var(--shadow);
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{
  margin:0;
  font-size:17px;
}

.modal-body{
  padding:20px;
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:200;
  background:#171717;
  border:1px solid #333;
  padding:13px 17px;
  border-radius:10px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu{
  display:none;
}

@media(max-width:950px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:inline-flex;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .award-grid{
    grid-template-columns:1fr;
  }

  .content{
    padding:18px;
  }
}

@media(max-width:600px){

  .topbar{
    padding:0 15px;
  }

  .topbar-title{
    font-size:12px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .login-card{
    padding:25px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN
======================================================= -->

<section id="loginScreen">

  <div class="login-card">

    <div class="logo">
      CROW<span>RULES</span> TV
    </div>

      members and the Spectrum Awards.
    </p>

    <div id="loginMessage"

<!-- =======================================================
     APP

<div id="app">

  <aside class="sidebar" id="sidebar">

      </div>

      <div class="brand-sub">

      </div>

    </div>

    <nav class="nav">

      <div class="nav-section">
        NETWORK
      </div>

      <button data-section="overview">
        <span class="nav-icon">⌂</span>
        Overview
      </button>

      <button data-section="live">
        <span class="nav-icon">●</span>

      </button>

      <button data-section="content">

      </button>

      <button data-section="members">

      <div class="nav-section">

      <button data-section="awards">

      </button>

      <button data-section="award-seasons">
        <span class="nav-icon">◆</span>

      <button data-section="award-categories">

      </button>

      <button data-section="award-nominees">

      <button data-section="award-winners">
        <span class="nav-icon">♛</span>

      </button>

      <div class="nav-section">
        SYSTEM
      </div>

      <button data-section="system">
        <span class="nav-icon">⚙</span>

      </button>

    </nav>

    <div class="sidebar-footer">

      <div
        class="user-mini"
        id="adminEmail">
        Not signed in
      </div>

      <button
        class="btn"
        id="logoutBtn"
        style="width:100%">

      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-right">

        <button
          class="btn mobile-menu"
          id="mobileMenu">
          ☰
        </button>

        <div class="topbar-title"
             id="pageTitle">
          Network Overview
        </div>

      </div>

      <div class="topbar-right">

        <span class="status-dot"></span>

        <span
          style="font-size:11px;color:#888">
          SUPABASE ONLINE
        </span>

      </div>

    </header>


    <section class="content"
             id="content">
      <div class="loading">
        Loading Admin...
      </div>

</div>


<!-- =======================================================
     MODAL
======================================================= -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Editor
      </h2>

      <button
        class="btn"
        id="modalClose">
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="modalBody">
    </div>

    <div
      class="modal-footer"
      id="modalFooter">
    </div>

  </div>

</div>


<div id="toast"></div>


<script>
/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

  SUPABASE_URL:
    "https://zauxdqyssratvzmomozf.supabase.co",

  SUPABASE_ANON_KEY:
    "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9",

  VERSION:
    "3.0.0"

};


/* =========================================================
   STATE
========================================================= */

let supabaseClient = null;

const state = {

  user:null,

  authorized:false,

  section:"overview",

  seasons:[],

  categories:[],

  nominees:[],

  winners:[],

  members:[],

  liveEvents:[],

  content:[]

};


/* =========================================================
   HELPERS
========================================================= */

const $ = selector =>
  document.querySelector(selector);

const $$ = selector =>
  document.querySelectorAll(selector);


function configured(){

  return CONFIG.SUPABASE_URL &&
         CONFIG.SUPABASE_ANON_KEY &&
         !CONFIG.SUPABASE_URL.startsWith("YOUR_") &&
         !CONFIG.SUPABASE_ANON_KEY.startsWith("YOUR_");

}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(message){

  const el=$("#toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer=setTimeout(
    ()=>el.classList.remove("show"),
    3500
  );

}


function showLoginMessage(message,type=""){

  const el=$("#loginMessage");

  el.textContent=message;

  el.className=
    "notice " + type;

  el.classList.remove("hidden");

}


function empty(message){

  return `
    <div class="empty">
      ${escapeHTML(message)}
    </div>
  `;

}


function loading(message="Loading..."){

  return `
    <div class="loading">
      ${escapeHTML(message)}
    </div>
  `;

}


function openModal(title,body,footer=""){

  $("#modalTitle").textContent=title;

  $("#modalBody").innerHTML=body;

  $("#modalFooter").innerHTML=footer;

  $("#modal").classList.add("show");

}


function closeModal(){

  $("#modal").classList.remove("show");

}


$("#modalClose").addEventListener(
  "click",
  closeModal
);

$("#modal").addEventListener(
  "click",
  event=>{
    if(event.target===event.currentTarget){
      closeModal();
    }
  }
);


/* =========================================================
   AUTH
========================================================= */

async function init(){

  if(!configured()){

    showLoginMessage(
      "Add your Supabase project URL and publishable/anon key to CONFIG before signing in.",
      "warn"
    );

    return;

  }


  supabaseClient =
    window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );


  const {
    data
  } =
    await supabaseClient.auth.getSession();


  await handleSession(
    data.session
  );


  supabaseClient.auth.onAuthStateChange(
    (_event,session)=>{

      setTimeout(
        ()=>handleSession(session),
        0
      );

    }
  );

}


async function handleSession(session){

  state.user=
    session?.user || null;


  if(!state.user){

    $("#loginScreen").style.display="flex";

    $("#app").style.display="none";

    return;

  }


  $("#adminEmail").textContent=
    state.user.email || "";


  const authorized=
    await verifyAdmin();


  if(!authorized){

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "This account is authenticated but is not authorized for the CrowRules TV admin dashboard.",
      "error"
    );

    return;

  }


  state.authorized=true;

  $("#loginScreen").style.display="none";

  $("#app").style.display="block";

  await loadSection(
    state.section
  );

}


async function verifyAdmin(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "crowrules_admin_check"
      );


    if(error){

      console.warn(
        "Admin RPC unavailable:",
        error.message
      );

      /*
       * Do not automatically grant admin access
       * if your project has not configured the
       * admin authorization RPC.
       */

      return false;

    }


    return Boolean(data);

  }catch(error){

    console.error(error);

    return false;

  }

}


$("#loginForm").addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    if(!configured()){

      showLoginMessage(
        "Configure Supabase first.",
        "warn"
      );

      return;

    }


    const email=
      $("#loginEmail").value.trim();

    const password=
      $("#loginPassword").value;


    try{

      const {
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if(error)
        throw error;


      showLoginMessage(
        "Signed in successfully.",
        "success"
      );

    }catch(error){

      showLoginMessage(
        error.message ||
        "Unable to sign in.",
        "error"
      );

    }

  }
);


$("#logoutBtn").addEventListener(
  "click",
  async()=>{

    await supabaseClient.auth.signOut();

  }
);


/* =========================================================
   NAVIGATION
========================================================= */

const titles={

  overview:"Network Overview",

  live:"Live Events",

  content:"Content",

  members:"Members",

  awards:"Spectrum Awards",

  "award-seasons":

/* =========================================================
   DATABASE HELPERS
========================================================= */

async function dbSelect(
  table,
  columns="*",
  options={}
){

  let query=
    supabaseClient
      .from(table)
      .select(columns);


  if(options.order){

    query=
      query.order(
        options.order.column,
        {
          ascending:
            options.order.ascending ?? false
        }
      );

  }


  if(options.limit){

    query=
      query.limit(
        options.limit
      );

  }


  const {
    data,
    error
  }=await query;


  if(error)
    throw error;


  return data || [];

}


async function dbInsert(
  table,
  payload
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from(table)
      .insert(payload)
      .select();


  if(error)
    throw error;


  return data;

}


async function dbUpdate(
  table,
  id,
  payload
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from(table)
      .update(payload)
      .eq("id",id)
      .select();


  if(error)
    throw error;


  return data;

}


async function dbDelete(
  table,
  id
){

  const {
    error
  } =
    await supabaseClient
      .from(table)
      .delete()
      .eq("id",id);


  if(error)
    throw error;

}

  panel.innerHTML=

  try{

        await renderOverview(panel);
        break;

      case "live":
        await renderLive(panel);
        break;

      case "content":
        await renderContent(panel);
        break;

      case "awards":

      case "award-seasons":

      case "award-categories":

      case "award-nominees":

      case "award-winners":

/* =========================================================
   SEASON EDITOR
========================================================= */

function openSeasonEditor(season=null){

  const editing=
    Boolean(season);


  openModal(

    editing
    ?"Edit Award Season"
    :"Create Award Season",

    `

      <div class="field">
        <label>Season Name</label>
        <input
          id="seasonName"
          value="${escapeHTML(
            season?.name ||
            season?.title ||
            ""
          )}">
      </div>


      <div class="field">
        <label>Year</label>
        <input
          id="seasonYear"
          type="number"
          value="${escapeHTML(
            season?.year ||
            new Date().getFullYear()
          )}">
      </div>


      <div class="field">
        <label>Description</label>
        <textarea
          id="seasonDescription"
          rows="4">${escapeHTML(
            season?.description ||
            ""
          )}</textarea>
      </div>


      <div class="field">

        <label>

          <input
            id="seasonPublished"
            type="checkbox"
            ${season?.is_published?"checked":""}>

          Published

        </label>

      </div>

    `,

    `

      <button
        class="btn"
        id="cancelSeason">
        Cancel
      </button>

      <button
        class="btn btn-primary"
        id="saveSeason">
        Save Season
      </button>

    `

  );


  $("#cancelSeason")
    .addEventListener(
      "click",
      closeModal
    );


  $("#saveSeason")
    .addEventListener(
      "click",
      async()=>{

        const payload={

          name:
            $("#seasonName")
              .value
              .trim(),

          year:
            Number(
              $("#seasonYear").value
            ),

          description:
            $("#seasonDescription")
              .value
              .trim(),

          is_published:
            $("#seasonPublished")
              .checked

        };


        if(!payload.name){

          toast(
            "Season name is required."
          );

          return;

        }


        try{

          if(editing){

            await dbUpdate(
              "spectrum_award_seasons",
              season.id,
              payload
            );

          }else{

            await dbInsert(
              "spectrum_award_seasons",
              payload
            );

          }


          closeModal();

          toast(
            editing
            ?"Season updated."
            :"Season created."
          );

          await loadSection(
            "award-seasons"
          );

        }catch(error){

          toast(
            error.message
          );

        }

      }
    );

}

                      </b>
                    </td>

                    <td>
                      ${escapeHTML(
                        category.description ||

                      )}
                    </td>

                    <td>

                      <span class="badge ${
                        category.is_active !== false
                        ?"green"
                        :"red"
                      }">

                          category.is_active !== false
                          ?"Active"
                          :"Inactive"

                      </span>

                    </td>

                    <td>

                      </button>

                    </td>

                `).join("")
              }

            </tbody>

          </table>

        </div>`
        :

      }

    </div>

  `;


  $("#addCategory")
    .addEventListener(
      "click",
      ()=>openCategoryEditor()
    );


  $$("[data-edit-category]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const category=
            categories.find(
              item =>
                String(item.id)===
                String(
                  button.dataset.editCategory
                )
            );

          openCategoryEditor(
            category

        }

}

function openCategoryEditor(category=null){

  const editing=
    Boolean(category);


  openModal(

    editing
    ?"Edit Award Category"
    :"Create Award Category",

    `

      <div class="field">

        <label>
          Category Name
        </label>

        <input
          id="categoryName"
          value="${escapeHTML(
            category?.name ||
            category?.title ||
            ""
          )}">

      </div>


      <div class="field">

        <label>
          Description
        </label>

        <textarea
          id="categoryDescription"
          rows="4">${escapeHTML(
            category?.description ||
            ""
          )}</textarea>

      </div>


      <div class="field">

        <label>

          <input
            id="categoryActive"
            type="checkbox"
            ${category?.is_active !== false
              ?"checked"
              :""}>

          Active

        </label>

      </div>

    `,

    `

      <button
        class="btn"
        id="cancelCategory">
        Cancel
      </button>

      <button
        class="btn btn-primary"
        id="saveCategory">
        Save Category
      </button>

    `

  );


  $("#cancelCategory")
    .addEventListener(
      "click",
      closeModal
    );


  $("#saveCategory")
    .addEventListener(
      "click",
      async()=>{

        const payload={

          name:
            $("#categoryName")
              .value
              .trim(),

          description:
            $("#categoryDescription")
              .value
              .trim(),

          is_active:
            $("#categoryActive")
              .checked

        };


        if(!payload.name){

          toast(
            "Category name is required."
          );

          return;

        }


        try{

          if(editing){

            await dbUpdate(
              "spectrum_award_categories",
              category.id,
              payload
            );

          }else{

            await dbInsert(
              "spectrum_award_categories",
              payload
            );

          }


          closeModal();

          toast(
            editing
            ?"Category updated."
            :"Category created."
          );

          await loadSection(
            "award-categories"
          );

        }catch(error){

          toast(
            error.message
          );

        }

      }
    );

}

/* =========================================================
   SYSTEM
========================================================= */

async function renderSystem(panel){

  let result=null;
  let errorMessage="";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "crowrules_admin_health"
      );


    if(error)
      throw error;


    result=data;

  }catch(error){

    errorMessage=
      error.message;

  }


  panel.innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div>
          <div class="eyebrow">
            HEALTH
          </div>

          <h2>
            System Health
          </h2>
        </div>

        <button
          class="btn"
          id="refreshHealth">
          Refresh
        </button>

      </div>


      <div class="panel-body">

        <div class="stats">

          <div class="stat">
            <strong>
              ONLINE
            </strong>
            <span>
              Admin App
            </span>
          </div>

          <div class="stat">
            <strong>
              AUTH
            </strong>
            <span>
              Supabase Auth
            </span>
          </div>

          <div class="stat">
            <strong>
              RLS
            </strong>
            <span>
              Database Security
            </span>
          </div>

          <div class="stat">
            <strong>
              ${CONFIG.VERSION}
            </strong>
            <span>
              Version
            </span>
          </div>

        </div>


        ${
          result
          ?
          `
          <div class="notice success">

            Protected health RPC responded
            successfully.

          </div>

          <pre class="log"
               style="
                 margin-top:15px;
                 white-space:pre-wrap;
                 background:#080808;
                 border:1px solid #222;
                 border-radius:10px;
                 padding:15px;
                 color:#aaa;
                 overflow:auto">${escapeHTML(
                   JSON.stringify(
                     result,
                     null,
                     2
                   )
                 )}</pre>
          `
          :
          `
          <div class="notice warn">

            The optional
            <b>crowrules_admin_health</b>
            RPC is unavailable.

            ${
              errorMessage
              ?
              `<br><br>
              ${escapeHTML(
                errorMessage
              )}`
              :""
            }

          </div>
          `
        }


        <div
          class="notice"
          style="margin-top:15px">

          <b>Security rule:</b>

          Never place a Supabase
          service-role key in this HTML.

          Administrative database operations
          should be protected with RLS and/or
          SECURITY DEFINER RPC functions.

        </div>

      </div>

    </div>

  `;


  $("#refreshHealth")
    .addEventListener(
      "click",
      ()=>renderSystem(panel)
    );

}
