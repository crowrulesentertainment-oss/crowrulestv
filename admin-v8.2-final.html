<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Admin Pro v8.2</title><style>body{margin:0;background:#07090e;color:#fff;font:14px system-ui}header{padding:18px;border-bottom:1px solid #273244}main{padding:20px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#10151f;border:1px solid #273244;border-radius:12px;padding:15px}button,input,select,textarea{font:inherit}button{padding:9px 12px;margin:4px;background:#151c27;color:#fff;border:1px solid #273244;border-radius:8px;cursor:pointer}.primary{background:#8b5cf6}.danger{background:#481522}.nav{margin-bottom:16px}.page{display:none}.page.active{display:block}.muted{color:#8d99aa}.bad{color:#ff5f76}.ok{color:#35d07f}.table{overflow:auto}.table table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:8px;border-bottom:1px solid #273244;text-align:left}.field{display:grid;gap:5px;margin:9px 0}.field input,.field select,.field textarea{background:#080c13;color:#fff;border:1px solid #273244;border-radius:7px;padding:8px;width:100%;box-sizing:border-box}.video{aspect-ratio:16/9;background:#000}.video iframe,.video video{width:100%;height:100%;border:0}</style></head><body><header><b>🐦‍⬛ CrowRules Entertainment — Admin Pro v8.2</b><span id="auth" style="float:right">Connecting…</span></header><main><nav><button data-p="dash">Dashboard</button><button data-p="db">All Supabase Databases</button><button data-p="schedule">Schedule Studio</button><button data-p="player">Video Player</button></nav><section id="dash" class="page active"><div id="stats" class="grid"></div><div class="card" id="health">Checking Supabase…</div></section><section id="db" class="page"><div class="card"><select id="tables"></select><input id="search" placeholder="Search"><button id="reload">Reload</button><button class="primary" id="add">+ Add</button><div id="meta" class="muted"></div><div class="table"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></div></section><section id="schedule" class="page"><div class="grid"><div class="card"><h2>Episode</h2><div class="field"><label>Episode ID</label><input id="eid"></div><div class="field"><label>Channel ID</label><input id="ech"></div><div class="field"><label>Title</label><input id="et"></div><div class="field"><label>Start</label><input id="es" type="datetime-local"></div><div class="field"><label>End</label><input id="ee" type="datetime-local"></div><button class="primary" id="ae">Add Episode</button></div><div class="card"><h2>Live Event</h2><div class="field"><label>Live Event ID</label><input id="lid"></div><div class="field"><label>Channel ID</label><input id="lch"></div><div class="field"><label>Title</label><input id="lt"></div><div class="field"><label>Start</label><input id="ls" type="datetime-local"></div><div class="field"><label>End</label><input id="le" type="datetime-local"></div><button class="primary" id="al">Add Live Event</button><p class="muted">item_type is always <b>live</b> for live events.</p></div><div class="card"><h2>Schedule</h2><button id="load">Load</button><div id="list"></div></div></div></section><section id="player" class="page"><div class="card"><h2>Video Player</h2><input id="vu" style="width:70%;padding:9px;background:#080c13;color:#fff;border:1px solid #273244" placeholder="YouTube / MP4 / WebM / HLS URL"><button class="primary" id="vp">Play</button><div class="video" id="vb"></div></div></section><section id="form" class="page"><div class="card"><h2 id="ft">Record</h2><div id="fields"></div><button class="primary" id="save">Save</button><button id="cancel">Cancel</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://zauxdqyssratvzmomozf.supabase.co','sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9');const T=['tv_channels','episodes','live_events','schedule_items','tv_channel_playlist','shows','members','profiles','celebrity_deaths','yearbook_schools','yearbook_members','awards','records','creator_channels','backdeckcrew_settings','backdeckcrew_members','tacoma_nights_episodes','pnw_episodes','analytics_events','messages'];let table=T[0],rows=[],edit=-1,$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active')}document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>go(x.dataset.p));async function load(){let r=await db.from(table).select('*').limit(200);if(r.error){$('tb').innerHTML='<tr><td class="bad">'+esc(r.error.message)+'</td></tr>';return}rows=r.data||[];let cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];$('th').innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Actions</th></tr>';$('tb').innerHTML=rows.map((r,i)=>'<tr>'+cols.map(c=>'<td>'+esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])+'</td>').join('')+'<td><button onclick="editRow('+i+')">Edit</button><button class="danger" onclick="delRow('+i+')">Delete</button></td></tr>').join('');$('meta').textContent=table+' • '+rows.length+' rows'}function make(o){let ks=[...new Set([...Object.keys(o),...(rows[0]?Object.keys(rows[0]):[])])].filter(k=>!['id','created_at','updated_at'].includes(k));$('fields').innerHTML=ks.map(k=>'<div class="field"><label>'+esc(k)+'</label><textarea data-k="'+esc(k)+'">'+esc(o[k]??'')+'</textarea></div>').join('')}window.editRow=i=>{edit=i;go('form');make(rows[i])};window.delRow=async i=>{if(confirm('Delete this row?')){let r=await db.from(table).delete().eq('id',rows[i].id);if(r.error)alert(r.error.message);else load()}};$('add').onclick=()=>{edit=-1;go('form');make({})};$('save').onclick=async()=>{let p={};document.querySelectorAll('[data-k]').forEach(x=>p[x.dataset.k]=x.value);let r=edit<0?await db.from(table).insert(p):await db.from(table).update(p).eq('id',rows[edit].id);if(r.error)alert('Save failed: '+r.error.message);else{go('db');load()}};$('cancel').onclick=()=>go('db');$('tables').innerHTML=T.map(x=>'<option>'+x+'</option>').join('');$('tables').onchange=()=>{table=$('tables').value;load()};$('reload').onclick=load;$('search').oninput=()=>{let q=$('search').value.toLowerCase();document.querySelectorAll('#tb tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};async function stats(){let a=[['tv_channels','TV Channels'],['episodes','Episodes'],['live_events','Live Events'],['schedule_items','Schedule Items']];for(let [t,n] of a){let r=await db.from(t).select('*',{count:'exact',head:true});$('stats').insertAdjacentHTML('beforeend','<div class="card"><div class="muted">'+n+'</div><h2>'+((r.count??0))+'</h2></div>')}}async function sched(){let r=await db.from('schedule_items').select('*').order('start_time').limit(100);$('list').innerHTML=r.error?'<span class="bad">'+esc(r.error.message)+'</span>':(r.data||[]).map(x=>'<div class="card"><b>'+esc(x.title||x.source_id||'Untitled')+'</b><br><span class="muted">'+esc(x.item_type)+' • '+esc(x.start_time)+'</span></div>').join('')||'<span class="muted">No schedule items.</span>'}async function addS(live){let p={item_type:live?'live':'episode',source_id:$(live?'lid':'eid').value,channel_id:$(live?'lch':'ech').value,title:$(live?'lt':'et').value,start_time:$(live?'ls':'es').value,end_time:$(live?'le':'ee').value};Object.keys(p).forEach(k=>{if(!p[k])delete p[k]});let r=await db.from('schedule_items').insert(p);if(r.error)alert('Schedule failed: '+r.error.message);else sched()}$('ae').onclick=()=>addS(false);$('al').onclick=()=>addS(true);$('load').onclick=sched;$('vp').onclick=()=>{let u=$('vu').value.trim(),m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);$('vb').innerHTML=m?'<iframe src="https://www.youtube.com/embed/'+m[1]+'?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>':'<video controls autoplay playsinline src="'+esc(u)+'"></video>'};(async()=>{let s=await db.auth.getSession();$('auth').textContent=s.data.session?'Authenticated':'Supabase connected';let h=await db.from('schedule_items').select('id',{count:'exact',head:true});$('health').innerHTML=h.error?'<span class="bad">'+esc(h.error.message)+'</span>':'<span class="ok">Supabase connected • schedule_items reachable</span>';await stats();await load()})().catch(e=>$('health').innerHTML='<span class="bad">'+esc(e.message)+'</span>');</script></body></html>
