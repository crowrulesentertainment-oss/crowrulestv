services:
  - type: worker
    name: crowrules-plus-playout
    runtime: docker
    dockerfilePath: ./crowrules-plus-engine/Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8788"
      - key: SUPABASE_URL
        value: https://cevylpnoexugwgygvtgu.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CR_OWNER_USER_ID
        sync: false
      - key: CR_CONTROL_TOKEN
        generateValue: true
      - key: CR_MAIN_STREAM_KEY
        sync: false
      - key: CR_TACOMA_STREAM_KEY
        sync: false
      - key: CR_PRODUCTIONS_STREAM_KEY
        sync: false
      - key: CR_BACKDECK_STREAM_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "5000"
      - key: HEARTBEAT_INTERVAL_MS
        value: "15000"
