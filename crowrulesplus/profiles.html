<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Who's Watching? | CrowRules+</title>
<style>
:root{--bg:#05050b;--panel:rgba(14,15,28,.78);--line:rgba(255,255,255,.12);--text:#f7f7fb;--muted:#a7a9bb;--accent:#72e8ff;--accent2:#a77bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#17152c 0,#080812 45%,#030308 100%);color:var(--text);font-family:Montserrat,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 48%,rgba(114,232,255,.035) 50%,transparent 52%),radial-gradient(circle at 15% 80%,rgba(167,123,255,.08),transparent 28%)}
.wrap{width:min(1100px,92vw);margin:auto}.top{padding:34px 0 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.18em;font-size:13px}.brand span{color:var(--accent)}.account{color:var(--muted);font-size:12px}
main{min-height:calc(100vh - 120px);display:grid;place-items:center;padding:30px 0 70px}.panel{text-align:center;width:min(900px,100%)}.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:800}h1{font-size:clamp(36px,7vw,72px);margin:12px 0 10px;letter-spacing:-.04em}p{color:var(--muted);margin:0 auto 34px;max-width:620px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;max-width:760px;margin:0 auto}.profile{border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;padding:16px;border-radius:22px;transition:.2s}.profile:hover,.profile:focus-visible{background:var(--panel);border-color:var(--line);transform:translateY(-4px);outline:none}.avatar{width:118px;height:118px;margin:auto;border-radius:28px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#171a31,#29244b);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35)}.avatar img{width:100%;height:100%;object-fit:cover}.avatar span{font-size:42px;font-weight:900;color:var(--accent)}.name{display:block;margin-top:14px;font-weight:800}.kid{display:inline-block;margin-top:7px;font-size:9px;letter-spacing:.18em;color:var(--accent);font-weight:900}.add .avatar{border-style:dashed}.add .avatar span{font-size:38px;color:var(--muted)}.actions{margin-top:35px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button.action{background:transparent;color:var(--muted);border:1px solid var(--line);padding:12px 18px;border-radius:999px;cursor:pointer;font-weight:800;letter-spacing:.08em;font-size:10px}button.action:hover{color:var(--text);border-color:rgba(114,232,255,.45)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(430px,100%);background:#0d0e19;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.6)}.dialog h2{margin-top:0}.field{width:100%;padding:14px 15px;background:#070811;border:1px solid var(--line);border-radius:12px;color:white;margin:8px 0 14px}.check{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:20px}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#05050b;font-weight:900;cursor:pointer}.close{margin-top:10px;width:100%}.status{min-height:20px;color:#ff9cae;font-size:12px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap top"><div class="brand">CROWRULES<span>+</span></div><div id="account" class="account">Loading account…</div></div>
<main><section class="panel">
<div class="eyebrow">ONE ACCOUNT · YOUR UNIVERSE</div>
<h1>Who's Watching?</h1>
<p>Choose a CrowRules+ profile. Each profile keeps its own Continue Watching, My List, history and recommendations.</p>
<div id="profiles" class="grid"></div>
<div class="actions"><button class="action" id="manage">MANAGE PROFILES</button><button class="action" id="home">CANCEL</button></div>
</section></main>
<div id="modal" class="modal" aria-hidden="true">
<div class="dialog"><h2>Create Profile</h2><p style="margin-bottom:15px">Create another viewing identity under this CrowRules account.</p>
<form id="form"><input id="displayName" class="field" maxlength="40" required placeholder="Profile name"><input id="avatarUrl" class="field" type="url" placeholder="Avatar URL (optional)"><label class="check"><input id="kids" type="checkbox"> Kids profile</label><div id="status" class="status"></div><button class="primary">CREATE PROFILE</button><button type="button" class="action close" id="close">CLOSE</button></form></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/crplus-profiles.js"></script>
</body>
</html>
