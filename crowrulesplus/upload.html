<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload | CrowRules+</title><link rel="stylesheet" href="./styles.css"></head><body><header><a class="logo" href="./">CROW<span>RULES+</span></a><a class="btn" href="./">← Home</a></header><main><section><div class="callout"><small>CROWRULES CREATOR STUDIO</small><h1>Upload a Video</h1><p>Upload MP4/WebM/QuickTime video to private Supabase Storage. New uploads are created as unpublished drafts until approved for CrowRules+.</p><form id="form"><input id="title" required placeholder="Video title"><input id="description" placeholder="Description"><input id="division" placeholder="Division key (dreamscapes, podcasting, sports, etc.)" value="crowrules"><select id="type"><option value="movie">Movie</option><option value="episode">Episode</option><option value="podcast">Podcast</option><option value="special">Special</option><option value="sports">Sports</option></select><input id="file" type="file" accept="video/mp4,video/webm,video/quicktime" required><button class="btn primary">Upload Video</button></form><p id="status" class="muted"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const $=s=>document.querySelector(s);
$("#form").onsubmit=async e=>{e.preventDefault();const{data:{user}}=await sb.auth.getUser();if(!user){$("#status").textContent="Please sign in first.";return}const file=$("#file").files[0];if(!file)return;$("#status").textContent="Uploading…";const path=user.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"-");const up=await sb.storage.from("crplus-videos").upload(path,file,{contentType:file.type||"video/mp4",upsert:false});if(up.error){$("#status").textContent=up.error.message;return}const r=await sb.functions.invoke("crplus-create-upload",{body:{title:$("#title").value,description:$("#description").value,division_key:$("#division").value,content_type:$("#type").value,storage_path:path}});if(r.error){$("#status").textContent=r.error.message;return}$("#status").innerHTML="Upload complete. Draft ID: "+r.data.id+" — awaiting publication.";$("#form").reset()};
</script></body></html>
