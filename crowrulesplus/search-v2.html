<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Universal Search | CrowRules+</title>
<style>
:root{--bg:#05050b;--panel:#101321;--line:#252a3c;--text:#f7f8ff;--muted:#9da5bc;--cyan:#70eaff;--purple:#a87cff}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 80% 0,#24194a 0,#080914 40%,#030307 100%);min-height:100vh}.wrap{width:min(1280px,92vw);margin:auto}.nav{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px}.logo{margin-right:auto;font-weight:900;letter-spacing:.16em}.logo b{color:var(--cyan)}.nav a{font-size:11px;font-weight:800;color:var(--muted)}.nav a:hover{color:white}.hero{padding:54px 0 20px}.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--cyan);font-weight:900}.hero h1{font-size:clamp(40px,6vw,72px);line-height:.95;margin:10px 0}.hero p{color:var(--muted);max-width:700px;line-height:1.55}.searchbox{position:relative;margin-top:28px}.searchbox form{display:flex;gap:10px}.searchbox input{width:100%;background:#080a12;border:1px solid var(--line);border-radius:16px;color:white;padding:18px 20px;font-size:18px;outline:0}.searchbox input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #70eaff12}.searchbox button{border:0;border-radius:16px;padding:0 26px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--purple));cursor:pointer}.suggestions{position:absolute;left:0;right:120px;top:64px;background:#0d101b;border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:10;box-shadow:0 20px 50px #0009}.suggestions button{display:block;width:100%;text-align:left;padding:13px 16px;border:0;border-bottom:1px solid #1b1f2d;background:none;color:#dce0ee;cursor:pointer}.suggestions button:hover{background:#171b2a}.hidden{display:none!important}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{border:1px solid var(--line);background:#0c0f19;color:var(--muted);border-radius:999px;padding:9px 14px;font-size:11px;font-weight:800;cursor:pointer}.chip.active,.chip:hover{border-color:var(--cyan);color:white}.section{margin-top:26px}.sectionhead{display:flex;align-items:center;justify-content:space-between}.sectionhead h2{font-size:18px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.rail{display:flex;gap:14px;overflow-x:auto;padding:15px 0 10px;scrollbar-width:thin}.mini{min-width:180px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer}.mini strong{display:block}.mini small{display:block;color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:18px;padding:16px 0 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#46506e}.poster{aspect-ratio:16/9;background:#171a28}.poster img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:13px}.title{font-weight:800}.meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:7px}.desc{font-size:11px;line-height:1.45;color:#b5b9c9;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{text-align:center;color:var(--muted);padding:70px 10px;grid-column:1/-1}.empty h2{color:white}@media(max-width:760px){.nav a{display:none}.searchbox form{flex-direction:column}.searchbox button{height:52px}.suggestions{right:0;top:120px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav"><a class="logo" href="home.html">CROWRULES<b>+</b></a><a href="home.html">HOME</a><a href="live.html">LIVE</a><a href="my-list.html">MY LIST</a><a href="profiles.html">PROFILE</a></nav>
<main>
<section class="hero">
<div class="eyebrow">DISCOVERY INTELLIGENCE · V2</div>
<h1>Search the universe.</h1>
<p>Find stories, shows, sports, podcasts and Dreamscapes — with live suggestions, recent searches and profile-aware discovery.</p>
<div class="searchbox">
<form id="searchForm"><input id="q" type="search" placeholder="What do you want to watch?" autocomplete="off" aria-label="Search CrowRules+"><button>SEARCH</button></form>
<div id="suggestions" class="suggestions hidden"></div>
</div>
<div id="chips" class="chips"></div>
</section>
<section id="recentSection" class="section hidden"><div class="sectionhead"><h2>Recent Searches</h2><span id="clearRecent">CLEAR</span></div><div id="recent" class="rail"></div></section>
<section id="trendingSection" class="section"><div class="sectionhead"><h2>Trending Across CrowRules+</h2><span>DISCOVER</span></div><div id="trending" class="rail"></div></section>
<section class="section"><div class="sectionhead"><h2 id="resultTitle">All Results</h2><span id="status"></span></div><div id="results" class="grid"></div></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="js/search-v2.js"></script>
</body>
</html>
