<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Search | CrowRules+</title><style>
:root{--bg:#05050b;--panel:#111321;--line:#24283a;--text:#f5f7ff;--muted:#9da3b8;--a:#72e8ff;--b:#a77bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#211a3c,#070811 45%,#030308);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1240px,92vw);margin:auto}.nav{height:72px;display:flex;align-items:center;gap:25px;border-bottom:1px solid var(--line)}.logo{font-weight:900;letter-spacing:.18em;margin-right:auto}.logo i{color:var(--a);font-style:normal}.nav a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700}.nav a:hover{color:white}.hero{padding:58px 0 30px}.eyebrow{color:var(--a);font-size:10px;letter-spacing:.3em;font-weight:900}h1{font-size:clamp(38px,6vw,68px);margin:10px 0}.search{display:flex;gap:10px;margin-top:25px}.search input{flex:1;background:#080a13;border:1px solid var(--line);color:white;border-radius:14px;padding:18px 20px;font-size:18px;outline:none}.search input:focus{border-color:var(--a)}button{border:0;border-radius:14px;padding:0 24px;background:linear-gradient(90deg,var(--a),var(--b));font-weight:900;cursor:pointer}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--line);background:#0c0e18;color:var(--muted);border-radius:999px;padding:9px 14px;font-size:11px;cursor:pointer}.chip.active,.chip:hover{color:white;border-color:var(--a)}.status{color:var(--muted);font-size:13px;min-height:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:15px 0 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#3a4260}.poster{aspect-ratio:16/9;background:#171a28;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.title{font-weight:800}.meta{color:var(--muted);font-size:10px;margin-top:7px;text-transform:uppercase;letter-spacing:.08em}.desc{color:#b3b7c8;font-size:11px;line-height:1.45;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{text-align:center;padding:70px 15px;color:var(--muted)}@media(max-width:760px){.nav a{display:none}.search{flex-direction:column}.search button{height:52px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="wrap"><nav class="nav"><div class="logo">CROWRULES<i>+</i></div><a href="home.html">HOME</a><a href="live.html">LIVE</a><a href="my-list.html">MY LIST</a><a href="profiles.html">PROFILE</a></nav><section class="hero"><div class="eyebrow">ONE UNIVERSE · ONE SEARCH</div><h1>Find your next story.</h1><form class="search" id="form"><input id="q" autocomplete="off" placeholder="Search movies, series, sports, podcasts, Dreamscapes, creators…" autofocus><button>SEARCH</button></form><div class="chips" id="chips"></div><div class="status" id="status"></div></section><section id="results" class="grid"></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="js/search.js"></script></body></html>
