<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules+ Creator & Admin Studio</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><a class="logo" href="./">CROW<span>RULES+</span></a><nav><a class="btn" href="./">Public</a><a class="btn" href="./profile.html">Profile</a><a class="btn" href="./guide.html">Guide</a></nav></header>
<main><section><h1>Creator & Admin Studio</h1><p class="muted">Upload → edit → review → publish → schedule → analyze.</p><div id="status" class="accountPanel">Checking access…</div>
<div id="app" hidden>
<div class="sectionHead"><h2>Content Library</h2><button class="btn primary" id="new">＋ New Title</button></div>
<div class="cards" id="cards"></div>
<div class="sectionHead"><h2 id="editorTitle">Content Editor</h2></div>
<form id="editor" class="accountPanel">
<input type="hidden" id="id">
<div class="grid"><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Type<select id="type"><option>movie</option><option>show</option><option>episode</option><option>podcast</option><option>live</option><option>sports</option><option>special</option></select></label><label>Division<input id="division" placeholder="dreamscapes, podcasting, sports…"></label><label>Playback<select id="playback"><option>youtube</option><option>youtube_live</option><option>storage</option><option>mp4</option><option>hls</option><option>external</option></select></label><label>Membership level<input id="membership" type="number" min="0" value="0"></label><label>Season<input id="season" type="number"></label><label>Episode<input id="episode" type="number"></label></div>
<label>Description<textarea id="description"></textarea></label><label>Video URL<input id="video"></label><label>Storage path<input id="storage"></label><div class="grid"><label>Thumbnail URL<input id="thumb"></label><label>Backdrop URL<input id="backdrop"></label><label>Age rating<input id="rating"></label><label>Tags<input id="tags" placeholder="tacoma, live, comedy"></label></div>
<div class="grid"><label>Release at<input id="release" type="datetime-local"></label><label>Workflow<select id="workflow"><option>draft</option><option>review</option><option>published</option><option>archived</option></select></label></div>
<label><input id="featured" type="checkbox"> Featured</label>
<div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="publish">Publish</button><button class="btn" type="button" id="unpublish">Unpublish</button><button class="btn" type="button" id="delete">Delete</button></div></form>
<div class="sectionHead"><h2>Analytics</h2><button class="btn" id="refreshAnalytics">Refresh</button></div><div id="analytics" class="accountPanel"></div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const $=id=>document.getElementById(id);let items=[],current=null;
async function api(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Sign in required");const r=await fetch("https://cevylpnoexugwgygvtgu.supabase.co/functions/v1/crplus-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){ $("cards").innerHTML=items.map(c=>`<article class="card"><div class="poster" style="background-image:url('${esc(c.thumbnail_url)}')">${esc(c.title)}</div><div class="cardBody"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.content_type)} · ${esc(c.workflow_status||"draft")} · ${c.is_published?"Published":"Draft"}</p><p>${esc(c.division_key||"Universal")} · Level ${c.membership_level}</p><button class="btn mini" data-edit="${c.id}">Edit</button> <button class="btn mini" data-feature="${c.id}">${c.is_featured?"★ Featured":"☆ Feature"}</button></div></article>`).join("")||"<p class='muted'>No titles yet.</p>";document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>loadEditor(items.find(x=>x.id===b.dataset.edit)));document.querySelectorAll("[data-feature]").forEach(b=>b.onclick=async()=>{const c=items.find(x=>x.id===b.dataset.feature);await api("feature",{id:c.id,featured:!c.is_featured});await load()})}
function loadEditor(c){current=c||null; $("editorTitle").textContent=c?"Edit Content":"New Content";$("id").value=c?.id||"";$("title").value=c?.title||"";$("slug").value=c?.slug||"";$("type").value=c?.content_type||"movie";$("division").value=c?.division_key||"";$("playback").value=c?.playback_type||"youtube";$("membership").value=c?.membership_level??0;$("season").value=c?.season_number??"";$("episode").value=c?.episode_number??"";$("description").value=c?.description||"";$("video").value=c?.video_url||"";$("storage").value=c?.storage_path||"";$("thumb").value=c?.thumbnail_url||"";$("backdrop").value=c?.backdrop_url||"";$("rating").value=c?.age_rating||"";$("tags").value=(c?.tags||[]).join(", ");$("release").value=c?.release_at?new Date(c.release_at).toISOString().slice(0,16):"";$("workflow").value=c?.workflow_status||"draft";$("featured").checked=!!c?.is_featured;scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
async function load(){try{const j=await api("list");items=j.items||[];$("status").innerHTML="<h2>Studio access granted</h2><p class='muted'>Role: "+esc(j.role)+" · "+items.length+" titles</p>";$("app").hidden=false;render();}catch(e){$("status").innerHTML="<h2>Access unavailable</h2><p>"+esc(e.message)+"</p><a class='btn primary' href='./#account'>Sign in to CrowRules+</a>"}}
$("new").onclick=()=>loadEditor();$("editor").onsubmit=async e=>{e.preventDefault();try{const item={id:$("id").value||undefined,title:$("title").value,slug:$("slug").value,content_type:$("type").value,division_key:$("division").value||null,playback_type:$("playback").value,membership_level:+$("membership").value||0,season_number:$("season").value?+$("season").value:null,episode_number:$("episode").value?+$("episode").value:null,description:$("description").value,video_url:$("video").value||null,storage_path:$("storage").value||null,thumbnail_url:$("thumb").value||null,backdrop_url:$("backdrop").value||null,age_rating:$("rating").value||null,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),release_at:$("release").value?new Date($("release").value).toISOString():null,workflow_status:$("workflow").value,is_published:$("workflow").value==="published",is_featured:$("featured").checked};const j=await api("save_content",{item});loadEditor(j.item);await load();alert("Saved.");}catch(e){alert(e.message)}};
$("publish").onclick=async()=>{if(!$("id").value)return alert("Save the title first.");try{await api("publish",{id:$("id").value,published:true});await load()}catch(e){alert(e.message)}};$("unpublish").onclick=async()=>{if(!$("id").value)return;try{await api("publish",{id:$("id").value,published:false});await load()}catch(e){alert(e.message)}};$("delete").onclick=async()=>{if(!$("id").value||!confirm("Delete this title?"))return;try{await api("delete",{id:$("id").value});loadEditor();await load()}catch(e){alert(e.message)}};$("refreshAnalytics").onclick=async()=>{try{const j=await api("analytics"),plays=j.plays||[],starts=plays.filter(x=>x.event_type==="start").length,completes=plays.filter(x=>x.event_type==="complete").length,ratings=j.ratings||[],avg=ratings.length?(ratings.reduce((a,x)=>a+x.rating,0)/ratings.length).toFixed(1):"—";$("analytics").innerHTML="<strong>"+plays.length+"</strong> play events · <strong>"+starts+"</strong> starts · <strong>"+completes+"</strong> completes · <strong>"+avg+"</strong> avg rating · <strong>"+(j.comments||[]).filter(x=>!x.is_hidden).length+"</strong> visible comments";}catch(e){$("analytics").textContent=e.message}};load();
</script></body></html>
