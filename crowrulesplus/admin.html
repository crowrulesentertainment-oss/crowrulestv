<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules+ Operations Center</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><a class="logo" href="./">CROW<span>RULES+</span></a><nav><a class="btn" href="./">Public</a><a class="btn" href="./profile.html">Profile</a><a class="btn" href="./guide.html">Guide</a></nav></header>
<main><section><h1>CrowRules+ Operations Center</h1><p class="muted">Content · Live Channels · EPG · Collections · Moderation · Analytics</p><div id="status" class="accountPanel">Checking access…</div><div id="app" hidden>
<div class="sectionHead"><h2>Dashboard</h2><button class="btn" id="refresh">Refresh All</button></div><div id="metrics" class="tiles"></div>
<div class="sectionHead"><h2>Content Library</h2><button class="btn primary" id="newContent">＋ New Title</button></div><div id="cards" class="cards"></div>
<div class="sectionHead"><h2>Content Editor</h2></div><form id="editor" class="accountPanel"><input type="hidden" id="id"><div class="grid">
<label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Type<select id="type"><option>movie</option><option>show</option><option>episode</option><option>podcast</option><option>live</option><option>sports</option><option>special</option></select></label><label>Division<input id="division"></label><label>Playback<select id="playback"><option>youtube</option><option>youtube_live</option><option>storage</option><option>mp4</option><option>hls</option><option>external</option></select></label><label>Membership<input id="membership" type="number" min="0" value="0"></label><label>Season<input id="season" type="number"></label><label>Episode<input id="episode" type="number"></label></div>
<label>Description<textarea id="description"></textarea></label><div class="grid"><label>Video URL<input id="video"></label><label>Storage path<input id="storage"></label><label>Thumbnail URL<input id="thumb"></label><label>Backdrop URL<input id="backdrop"></label><label>Age rating<input id="rating"></label><label>Tags<input id="tags"></label></div><div class="grid"><label>Release<input id="release" type="datetime-local"></label><label>Workflow<select id="workflow"><option>draft</option><option>review</option><option>published</option><option>archived</option></select></label></div><label><input id="featured" type="checkbox"> Featured</label><div class="actions"><button class="btn primary">Save</button><button class="btn" type="button" id="publish">Publish</button><button class="btn" type="button" id="unpublish">Unpublish</button><button class="btn" type="button" id="delete">Delete</button></div></form>
<div class="sectionHead"><h2>Live Channels</h2><button class="btn" id="newChannel">＋ Channel</button></div><div id="channels" class="cards"></div><div id="channelForm" class="accountPanel" hidden><input type="hidden" id="channelId"><div class="grid"><label>Key<input id="channelKey"></label><label>Name<input id="channelName"></label><label>Stream Type<select id="streamType"><option>youtube_live</option><option>hls</option><option>external</option></select></label><label>Stream URL<input id="streamUrl"></label><label>Sort Order<input id="sortOrder" type="number" value="0"></label></div><label>Description<textarea id="channelDesc"></textarea></label><label><input id="isLive" type="checkbox"> Live now</label><button class="btn primary" id="saveChannel">Save Channel</button></div>
<div class="sectionHead"><h2>Programming Guide / EPG</h2><button class="btn" id="newSchedule">＋ Schedule</button></div><div id="schedule" class="cards"></div><div id="scheduleForm" class="accountPanel" hidden><input type="hidden" id="scheduleId"><div class="grid"><label>Channel<select id="scheduleChannel"></select></label><label>Content<select id="scheduleContent"></select></label><label>Title<input id="scheduleTitle"></label><label>Start<input id="scheduleStart" type="datetime-local"></label><label>End<input id="scheduleEnd" type="datetime-local"></label></div><button class="btn primary" id="saveSchedule">Save Schedule</button></div>
<div class="sectionHead"><h2>Collections</h2><button class="btn" id="newCollection">＋ Collection</button></div><div id="collections" class="cards"></div><div id="collectionForm" class="accountPanel" hidden><input type="hidden" id="collectionId"><div class="grid"><label>Title<input id="collectionTitle"></label><label>Slug<input id="collectionSlug"></label><label>Cover URL<input id="collectionCover"></label></div><label>Description<textarea id="collectionDesc"></textarea></label><label><input id="collectionPublished" type="checkbox"> Published</label><label>Content IDs (comma-separated)<input id="collectionItems"></label><button class="btn primary" id="saveCollection">Save Collection</button></div>
<div class="sectionHead"><h2>Comment Moderation</h2></div><div id="comments" class="accountPanel"></div>
<div class="sectionHead"><h2>Playback Sources</h2></div><div id="sources" class="accountPanel"></div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-"),$=id=>document.getElementById(id);let state={content:[],channels:[],schedule:[],collections:[],comments:[],sources:[]};
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Sign in required");const r=await fetch("https://cevylpnoexugwgygvtgu.supabase.co/functions/v1/crplus-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function load(){try{const j=await api("list");state.content=j.content||[];state.channels=j.channels||[];state.schedule=j.schedule||[];state.collections=j.collections||[];state.comments=j.comments||[];state.sources=j.sources||[];status.innerHTML="<h2>Operations access granted</h2><p class='muted'>Role: "+esc(j.role)+" · "+state.content.length+" titles · "+state.channels.length+" channels</p>";app.hidden=false;render();}catch(e){status.innerHTML="<h2>Access unavailable</h2><p>"+esc(e.message)+"</p><a class='btn primary' href='./#account'>Sign in</a>"}}
function render(){metrics.innerHTML=[["Titles",state.content.length],["Published",state.content.filter(x=>x.is_published).length],["Live Channels",state.channels.filter(x=>x.is_live).length+"/"+state.channels.length],["Scheduled",state.schedule.length],["Collections",state.collections.length],["Comments",state.comments.filter(x=>!x.is_hidden).length]].map(x=>"<div class='tile'><strong>"+x[1]+"</strong><span>"+x[0]+"</span></div>").join("");
cards.innerHTML=state.content.map(c=>"<article class='card'><div class='poster' style=\"background-image:url('"+esc(c.thumbnail_url)+"')\">"+esc(c.title)+"</div><div class='cardBody'><h3>"+esc(c.title)+"</h3><p class='muted'>"+esc(c.content_type)+" · "+esc(c.workflow_status)+" · "+(c.is_published?"Published":"Draft")+"</p><button class='btn mini' data-edit='"+c.id+"'>Edit</button> <button class='btn mini' data-feature='"+c.id+"'>"+(c.is_featured?"★ Featured":"☆ Feature")+"</button></div></article>").join("");
channels.innerHTML=state.channels.map(x=>"<article class='card'><div class='poster'>"+esc(x.name)+"</div><div class='cardBody'><h3>"+esc(x.name)+"</h3><p class='muted'>"+esc(x.stream_type)+" · "+(x.is_live?"LIVE":"Offline")+"</p><p>"+esc(x.stream_url||"No stream URL")+"</p><button class='btn mini' data-channel='"+x.id+"'>Edit</button></div></article>").join("")||"<p class='muted'>No channels.</p>";
schedule.innerHTML=state.schedule.map(x=>{const ch=state.channels.find(c=>c.id===x.channel_id);return "<article class='card'><div class='cardBody'><h3>"+esc(x.title)+"</h3><p class='muted'>"+esc(ch?.name||"Channel")+" · "+new Date(x.starts_at).toLocaleString()+" → "+new Date(x.ends_at).toLocaleTimeString()+"</p><button class='btn mini' data-sched='"+x.id+"'>Edit</button></div></article>"}).join("")||"<p class='muted'>No scheduled programming.</p>";
collections.innerHTML=state.collections.map(x=>"<article class='card'><div class='poster'>"+esc(x.title)+"</div><div class='cardBody'><p class='muted'>"+(x.is_published?"Published":"Draft")+"</p><button class='btn mini' data-col='"+x.id+"'>Edit</button></div></article>").join("")||"<p class='muted'>No collections.</p>";
comments.innerHTML=state.comments.map(x=>"<div class='comment'><strong>"+esc(x.crplus_content?.title||"Content")+"</strong><p>"+esc(x.body)+"</p><button class='btn mini' data-comment='"+x.id+"'>"+(x.is_hidden?"Restore":"Hide")+"</button></div>").join("")||"<p class='muted'>No comments.</p>";
sources.innerHTML=state.sources.map(x=>"<div class='result'><strong>"+esc(x.source_type)+"</strong> · "+esc(x.content_id)+" · "+(x.is_primary?"Primary":"Backup")+"<br>"+esc(x.source_url||x.storage_path||"")+"</div>").join("")||"<p class='muted'>No alternate sources configured.</p>";
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editContent(state.content.find(x=>x.id===b.dataset.edit)));document.querySelectorAll("[data-feature]").forEach(b=>b.onclick=async()=>{const c=state.content.find(x=>x.id===b.dataset.feature);await api("feature",{id:c.id,featured:!c.is_featured});load()});document.querySelectorAll("[data-channel]").forEach(b=>editChannel(state.channels.find(x=>x.id===b.dataset.channel)));document.querySelectorAll("[data-sched]").forEach(b=>editSchedule(state.schedule.find(x=>x.id===b.dataset.sched)));document.querySelectorAll("[data-col]").forEach(b=>editCollection(state.collections.find(x=>x.id===b.dataset.col)));document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=async()=>{const c=state.comments.find(x=>x.id===b.dataset.comment);await api("moderate_comment",{id:c.id,hidden:!c.is_hidden});load()});}
function editContent(c){$("id").value=c?.id||"";$("title").value=c?.title||"";$("slug").value=c?.slug||"";$("type").value=c?.content_type||"movie";$("division").value=c?.division_key||"";$("playback").value=c?.playback_type||"youtube";$("membership").value=c?.membership_level??0;$("season").value=c?.season_number??"";$("episode").value=c?.episode_number??"";$("description").value=c?.description||"";$("video").value=c?.video_url||"";$("storage").value=c?.storage_path||"";$("thumb").value=c?.thumbnail_url||"";$("backdrop").value=c?.backdrop_url||"";$("rating").value=c?.age_rating||"";$("tags").value=(c?.tags||[]).join(",");$("release").value=c?.release_at?new Date(c.release_at).toISOString().slice(0,16):"";$("workflow").value=c?.workflow_status||"draft";$("featured").checked=!!c?.is_featured;scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
$("newContent").onclick=()=>editContent();$("editor").onsubmit=async e=>{e.preventDefault();const item={id:$("id").value||undefined,title:$("title").value,slug:$("slug").value,content_type:$("type").value,division_key:$("division").value||null,playback_type:$("playback").value,membership_level:+$("membership").value||0,season_number:$("season").value?+$("season").value:null,episode_number:$("episode").value?+$("episode").value:null,description:$("description").value,video_url:$("video").value||null,storage_path:$("storage").value||null,thumbnail_url:$("thumb").value||null,backdrop_url:$("backdrop").value||null,age_rating:$("rating").value||null,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),release_at:$("release").value?new Date($("release").value).toISOString():null,workflow_status:$("workflow").value,is_published:$("workflow").value==="published",is_featured:$("featured").checked};try{await api("save_content",{item});load();alert("Saved");}catch(e){alert(e.message)}};$("publish").onclick=async()=>{$("id").value&&await api("publish",{id:$("id").value,published:true}).then(load).catch(e=>alert(e.message))};$("unpublish").onclick=async()=>{$("id").value&&await api("publish",{id:$("id").value,published:false}).then(load).catch(e=>alert(e.message))};$("delete").onclick=async()=>{$("id").value&&confirm("Delete this title?")&&api("delete",{id:$("id").value}).then(load).catch(e=>alert(e.message))};
function editChannel(x){channelForm.hidden=false;$("channelId").value=x?.id||"";$("channelKey").value=x?.channel_key||"";$("channelName").value=x?.name||"";$("streamType").value=x?.stream_type||"youtube_live";$("streamUrl").value=x?.stream_url||"";$("sortOrder").value=x?.sort_order||0;$("channelDesc").value=x?.description||"";$("isLive").checked=!!x?.is_live}newChannel.onclick=()=>editChannel();saveChannel.onclick=async()=>{try{await sb.from("crplus_live_channels").upsert({id:$("channelId").value||undefined,channel_key:$("channelKey").value,name:$("channelName").value,stream_type:$("streamType").value,stream_url:$("streamUrl").value||null,sort_order:+$("sortOrder").value||0,description:$("channelDesc").value||null,is_live:$("isLive").checked,updated_at:new Date().toISOString()}).throwOnError();load()}catch(e){alert(e.message)}};
function editSchedule(x){scheduleForm.hidden=false;$("scheduleId").value=x?.id||"";scheduleChannel.innerHTML=state.channels.map(c=>"<option value='"+c.id+"' "+(x?.channel_id===c.id?"selected":"")+">"+esc(c.name)+"</option>").join("");scheduleContent.innerHTML="<option value=''>— none —</option>"+state.content.map(c=>"<option value='"+c.id+"' "+(x?.content_id===c.id?"selected":"")+">"+esc(c.title)+"</option>").join("");$("scheduleTitle").value=x?.title||"";$("scheduleStart").value=x?.starts_at?new Date(x.starts_at).toISOString().slice(0,16):"";$("scheduleEnd").value=x?.ends_at?new Date(x.ends_at).toISOString().slice(0,16):""}newSchedule.onclick=()=>editSchedule();saveSchedule.onclick=async()=>{try{await sb.from("crplus_schedule").upsert({id:$("scheduleId").value||undefined,channel_id:scheduleChannel.value,content_id:scheduleContent.value||null,title:$("scheduleTitle").value,starts_at:new Date($("scheduleStart").value).toISOString(),ends_at:new Date($("scheduleEnd").value).toISOString()}).throwOnError();load()}catch(e){alert(e.message)}};
function editCollection(x){collectionForm.hidden=false;$("collectionId").value=x?.id||"";$("collectionTitle").value=x?.title||"";$("collectionSlug").value=x?.slug||"";$("collectionCover").value=x?.cover_url||"";$("collectionDesc").value=x?.description||"";$("collectionPublished").checked=!!x?.is_published;$("collectionItems").value=""}newCollection.onclick=()=>editCollection();saveCollection.onclick=async()=>{try{const payload={id:$("collectionId").value||undefined,title:$("collectionTitle").value,slug:$("collectionSlug").value,cover_url:$("collectionCover").value||null,description:$("collectionDesc").value||null,is_published:$("collectionPublished").checked,updated_at:new Date().toISOString()};const r=await sb.from("crplus_collections").upsert(payload).select().single().throwOnError();const ids=$("collectionItems").value.split(",").map(x=>x.trim()).filter(Boolean);await sb.from("crplus_collection_items").delete().eq("collection_id",r.id);if(ids.length)await sb.from("crplus_collection_items").insert(ids.map((id,i)=>({collection_id:r.id,content_id:id,sort_order:i}))).throwOnError();load()}catch(e){alert(e.message)}};
refresh.onclick=load;load();</script></body></html>
