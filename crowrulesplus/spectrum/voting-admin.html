<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards · Voting Control</title><link rel="stylesheet" href="../styles.css"></head><body><main class="spectrumPage"><a href="./admin.html">← Admin Center</a><section class="spectrumLiveHero"><span class="eyebrow">PRIVATE ADMINISTRATION</span><h1>Voting <span>Control</span></h1><p>Configure future Spectrum voting. Public voting remains inactive until an administrator explicitly opens a ballot.</p></section><section class="tvSpectrumAwards"><div class="grid"><label>Award<select id="award"></select></label><label>Status<select id="status"><option>draft</option><option>scheduled</option><option>open</option><option>closed</option><option>certified</option><option>archived</option></select></label><label>Eligibility<select id="eligibility"><option>authenticated</option><option>member</option><option>creator</option><option>admin_test</option></select></label><label>Max votes/category<input id="max" type="number" min="1" value="1"></label><label>Opens<input id="opens" type="datetime-local"></label><label>Closes<input id="closes" type="datetime-local"></label></div><label><input id="public" type="checkbox"> Enable public voting/results visibility</label><button class="btn primary" id="save">Save Voting Configuration</button><div id="current"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./voting-admin.js"></script></body></html>
