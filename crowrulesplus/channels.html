annels.filter(x=>(filter==="all"||x.is_live)&&(!q||(x.name+" "+(x.description||"")+" "+(x.channel_key||"")).toLowerCase().includes(q)));$("grid").innerHTML=list.map(x=>'<article class="channelCard"><div class="channelVisual"><span class="livePill '+(x.is_live?"":"offPill")+'">'+(x.is_live?"● LIVE":"OFF AIR")+'</span><div class="channelLogo">'+esc(x.name||"CrowRules+ Channel")+'</div></div><div class="channelBody"><h2>'+esc(x.name||"Untitled Channel")+'</h2><p>'+esc(x.description||"CrowRules+ programming")+'</p>'+(x._program?'<div class="muted">Now: <b>'+esc(x._program.title)+'</b></div>':'<div class="muted">No scheduled program right now</div>')+'<div class="channelActions"><a class="btn primary" href="./live.html?channel='+encodeURIComponent(x.id)+'">'+(x.is_live?"Watch Live":"View Channel")+'</a><a class="btn" href="./guide.html">Guide</a></div></div></article>').join("")||'<div class="empty">No channels match your search.</div>'}document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});$("search").oninput=render;load();setInterval(load,30000);</script></body></html>
