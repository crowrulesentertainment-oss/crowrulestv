<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050508">
<title>CrowRules+ Channels</title>
<link rel="stylesheet" href="./styles.css">
<style>
.channelHero{padding:55px 0 22px}
.channelTools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 24px}
.channelSearch{flex:1;min-width:220px;background:#0b0b12;border:1px solid #303044;color:#fff;border-radius:12px;padding:13px 16px;font:inherit;outline:none}
.channelSearch:focus{border-color:var(--cyan)}
.channelGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.channelCard{background:linear-gradient(145deg,#101019,#09090e);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}
.channelCard:hover{transform:translateY(-4px);border-color:#55557a}
.channelCard.selected{border-color:var(--cyan);box-shadow:0 0 0 1px #5ee7df22,0 12px 40px #0006}
.channelVisual{aspect-ratio:16/7;background:radial-gradient(circle at 70% 20%,#2a123d,transparent 45%),linear-gradient(135deg,#101c2c,#09090e);display:flex;align-items:end;padding:18px;position:relative;overflow:hidden}
.channelVisual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
.channelVisual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#07070b 100%)}
.channelLogo,.livePill{z-index:2}
.channelLogo{font:900 1.35rem Orbitron;position:relative}
.livePill{position:absolute;top:14px;left:14px;padding:5px 9px;border-radius:999px;background:#ff3658;color:#fff;font-size:.68rem;font-weight:900}
.offPill{background:#252532}
.channelBody{padding:16px}
.channelBody h2{font-size:1.22rem;margin:0 0 5px}
.channelBody p{color:var(--muted);margin:5px 0 13px}
.channelMeta{display:flex;justify-content:space-between;gap:10px;margin:10px 0;font-size:.78rem;color:var(--muted)}
.nowLine{padding:11px 12px;border-radius:10px;background:#0a1115;border:1px solid #18343a}
.nextLine{padding:9px 0;color:var(--muted);font-size:.82rem}
.channelActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.epg{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.channelCard.open .epg{display:block}
.epgHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.epgHead strong{font-family:Orbitron}
.timeline{display:grid;gap:7px}.timelineItem{cursor:pointer}.timelineItem:hover{border-color:#5ee7df77;transform:translateX(2px)}.epgLink{display:inline-flex;margin-top:10px;font-size:.78rem;color:var(--cyan)}
.timelineItem{position:relative;padding:10px 11px;border:1px solid #242438;border-radius:10px;background:#0b0b12}
.timelineItem.now{border-color:#ff3658;background:#160c12}
.timelineItem.next{border-color:#5ee7df55}
.timelineTime{font-size:.72rem;color:var(--muted);margin-bottom:3px}
.timelineTitle{font-weight:800}
.progress{height:4px;border-radius:99px;background:#252532;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff3658,#a855f7)}
.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.statMini{padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#0b0b11}
.statMini b{color:var(--cyan)}
.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:5px}
.statusDot.live{background:#ff3658;box-shadow:0 0 9px #ff3658}
.sync{margin-left:auto;color:var(--muted);font-size:.75rem}
@media(max-width:600px){.channelGrid{grid-template-columns:1fr}.channelTools{align-items:stretch}.sync{width:100%;margin-left:0}}
</style>
</head>
<body>
<header class="top">
<a class="brand" href="./">CROW<span>RULES+</span></a>
<nav><a href="./">LIBRARY</a><a href="./live.html">LIVE</a><a href="./guide.html">GUIDE</a><a href="./profile.html">MY CROW</a></nav>
</header>

<main class="page">
<section class="channelHero">
<span class="eyebrow">CROWRULES+ TELEVISION</span>
<h1>Channels</h1>
<p class="muted">Every channel. Every story. One CrowRules universe.</p>
<div class="stats">
<div class="statMini"><b id="total">0</b> Channels</div>
<div class="statMini"><b id="live">0</b> Live Now</div>
<div class="statMini"><b id="off">0</b> Off Air</div>
<div class="statMini"><b id="scheduled">0</b> Programs Today</div>
</div>
</section>

<div class="channelTools">
<input id="search" class="channelSearch" type="search" placeholder="Search channels, descriptions, or channel keys…" autocomplete="off">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="live">Live</button>
<button class="filter" data-filter="off">Off Air</button>
<button class="btn" id="refresh">↻ Refresh</button>
<span id="sync" class="sync">Connecting…</span>
</div>

<section id="grid" class="channelGrid">
<div class="loading">Loading channels…</div>
</section>
</main>

<footer><span>© CrowRules Entertainment</span><span>One Account · One Universe</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const fmt=v=>v?new Date(v).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
const dateKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const now=()=>Date.now();

let channels=[], schedules=[], filter="all", openId=null, loading=false; const requestedChannel=new URLSearchParams(location.search).get("channel");

function currentProgram(list){
 const n=now();
 return list.find(x=>new Date(x.starts_at).getTime()<=n&&new Date(x.ends_at).getTime()>n);
}
function nextProgram(list){
 const n=now();
 return list.find(x=>new Date(x.starts_at).getTime()>n);
}
function minutesLeft(x){return x?Math.max(1,Math.ceil((new Date(x.ends_at).getTime()-now())/60000)):0}
function progressPct(x){
 if(!x)return 0;
 const a=new Date(x.starts_at).getTime(),b=new Date(x.ends_at).getTime();
 return Math.max(0,Math.min(100,(now()-a)/(b-a)*100));
}

async function load(){
 if(loading)return;
 loading=true;
 $("sync").textContent="Syncing…";
 try{
  const r=await sb.from("crplus_live_channels").select("*").order("sort_order");
  if(r.error)throw r.error;
  channels=r.data||[];
  const ids=channels.map(x=>x.id);
  if(ids.length){
   const start=new Date(now()-6*60*60*1000).toISOString();
   const end=new Date(now()+24*60*60*1000).toISOString();
   const s=await sb.from("crplus_schedule")
    .select("id,channel_id,title,starts_at,ends_at,content_id")
    .in("channel_id",ids).lt("starts_at",end).gt("ends_at",start)
    .order("starts_at").limit(1000);
   if(s.error)throw s.error;
   schedules=s.data||[];
  }else schedules=[];
  $("total").textContent=channels.length;
  $("live").textContent=channels.filter(x=>x.is_live).length;
  $("off").textContent=channels.filter(x=>!x.is_live).length;
  $("scheduled").textContent=schedules.filter(x=>dateKey(x.starts_at)===dateKey(new Date())).length;
  render();
  $("sync").textContent="Synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
 }catch(e){
  $("sync").textContent="Sync error";
  $("grid").innerHTML="<div class='empty'>"+esc(e.message||"Unable to load channels.")+"</div>";
 }finally{loading=false}
}

function channelSchedules(id){
 return schedules.filter(x=>x.channel_id===id);
}

function programUrl(p){return p.content_id?"./title.html?id="+encodeURIComponent(p.content_id):""}\nfunction render(){
 const q=$("search").value.trim().toLowerCase();
 const list=channels.filter(x=>{
  const status=filter==="all"||(filter==="live"&&x.is_live)||(filter==="off"&&!x.is_live);
  const text=(x.name+" "+(x.description||"")+" "+(x.channel_key||"")).toLowerCase();
  return status&&(!q||text.includes(q));
 });
 $("grid").innerHTML=list.map(cardHtml).join("")||"<div class='empty'>No channels match your filters.</div>";
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>toggleEPG(b.dataset.open)); document.querySelectorAll("[data-program]").forEach(el=>el.onclick=e=>{if(e.target.closest("a"))return; const p=schedules.find(x=>x.id===el.dataset.program); if(p?.content_id) location.href=programUrl(p)});
}

function cardHtml(x){
 const ss=channelSchedules(x.id);
 const current=currentProgram(ss), next=nextProgram(ss);
 const open=openId===x.id;
 const day=ss.filter(p=>new Date(p.ends_at).getTime()>now()).slice(0,12);
 const logo=x.logo_url?"<img src='"+esc(x.logo_url)+"' alt='' loading='lazy'>":"";
 return "<article class='channelCard "+(open?"open ":"")+(openId===x.id?"selected":"")+"'>"+
  "<div class='channelVisual'>"+logo+
   "<span class='livePill "+(x.is_live?"":"offPill")+"'>"+(x.is_live?"● LIVE":"OFF AIR")+"</span>"+
   "<div class='channelLogo'>"+esc(x.name||"CrowRules+ Channel")+"</div>"+
  "</div>"+
  "<div class='channelBody'>"+
   "<h2>"+esc(x.name||"Untitled Channel")+"</h2>"+
   "<p>"+esc(x.description||"CrowRules+ programming")+"</p>"+
   "<div class='channelMeta'><span><span class='statusDot "+(x.is_live?"live":"")+"'></span>"+(x.is_live?"Broadcasting now":"Off air")+"</span><span>"+esc(x.stream_type||"live")+"</span></div>"+
   (current?"<div class='nowLine'>▶ Now: <b>"+esc(current.title||"Untitled")+"</b><br><span class='muted'>"+minutesLeft(current)+" min remaining</span><div class='progress'><span style='width:"+progressPct(current)+"%'></span></div></div>":"<div class='nowLine'>No scheduled program right now</div>")+
   (next?"<div class='nextLine'>Next: <b>"+esc(next.title||"Untitled")+"</b> · "+fmt(next.starts_at)+"</div>":"<div class='nextLine'>No next program scheduled</div>")+
   "<div class='channelActions'><a class='btn primary' href='./live.html?channel="+encodeURIComponent(x.id)+"'>"+(x.is_live?"Watch Live":"View Channel")+"</a>"+
   "<button class='btn' data-open='"+esc(x.id)+"'>"+(open?"Hide Schedule":"24h Schedule")+"</button></div>"+
   "<div class='epg'><div class='epgHead'><strong>Programming</strong><span class='muted'>Next 12 slots</span></div><div class='timeline'>"+
   (day.length?day.map(p=>{
    const isNow=current&&current.id===p.id, isNext=next&&next.id===p.id;
    return "<div class='timelineItem "+(isNow?"now ":"")+(isNext?"next":"")+" data-program='"+esc(p.id)+"'><div class='timelineTime'>"+fmt(p.starts_at)+" – "+fmt(p.ends_at)+"</div><div class='timelineTitle'>"+esc(p.title||"Untitled")+"</div>"+(isNow?"<div class='progress'><span style='width:"+progressPct(p)+"%'></span></div>":"")+(p.content_id?"<a class='epgLink' href='"+programUrl(p)+"'>Open title →</a>":"")+"</div>";
   }).join(""):"<div class='empty'>No programming scheduled in the next 24 hours.</div>")+
   "</div></div>"+
  "</div></article>";
}

function toggleEPG(id){
 openId=openId===id?null:id;
 render();
 const card=document.querySelector(".channelCard.selected");
 if(card)card.scrollIntoView({behavior:"smooth",block:"nearest"});
}

document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
 filter=b.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 render();
});
$("search").oninput=render;
$("refresh").onclick=load;

load().then(()=>{if(requestedChannel){openId=requestedChannel;render();}});\nsetInterval(load,30000);
setInterval(()=>{render()},1000);
</script>
</body>
</html>
