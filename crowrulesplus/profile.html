'}async function go(){const {data:{user}}=await sb.auth.getUser();if(!user){$("#auth").innerHTML='<h2>Welcome</h2><p class="muted">Sign in to use your universal CrowRules account.</p><a class="btn primary" href="../login.html">Sign In / Create Account</a>';return}$("#auth").innerHTML="<b>"+esc(user.email||"Member")+"</b><p class='muted'>Universal CrowRules account connected.</p>";$("#dashboard").hidden=false;const m=await sb.rpc("get_my_membership");if(!m.error&&m.data){const x=Array.isArray(m.data)?m.data[0]:m.data;$("#membership").innerHTML=Object.entries(x).map(([k,v])=>'<div class="stat"><strong style="font-size:1rem">'+esc(v)+'</strong><span class="muted">'+esc(k.replaceAll("_"," "))+'</span></div>').join("")}const [h,l]=await Promise.all([sb.from("crplus_watch_history").select("content_id,last_watched_at,position_seconds,completed,crplus_content(id,title,thumbnail_url,content_type,is_published)").eq("user_id",user.id).order("last_watched_at",{ascending:false}).limit(20),sb.from("crplus_my_list").select("content_id,created_at,crplus_content(id,title,thumbnail_url,content_type,is_published)").eq("user_id",user.id).order("created_at",{ascending:false}).limit(20)]);const hr=(h.data||[]).filter(x=>x.crplus_content?.is_published);const lr=(l.data||[]).filter(x=>x.crplus_content?.is_published);$("#history").innerHTML=hr.map(x=>card(x.crplus_content)).join("")||'<p class="muted">Your watch history will appear here.</p>';$("#mylist").innerHTML=lr.map(x=>card(x.crplus_content)).join("")||'<p class="muted">Add titles to My List from any watch page.</p>';$("#stats").innerHTML='<div class="stat"><strong>'+hr.length+'</strong><span class="muted">Recent watches</span></div><div class="stat"><strong>'+lr.length+'</strong><span class="muted">My List</span></div><div class="stat"><strong>1</strong><span class="muted">Universal account</span></div>}$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};go();</script></body></html>
