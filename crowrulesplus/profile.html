<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | CrowRules+</title><link rel="stylesheet" href="./styles.css"></head><body><header><a class="logo" href="./">CROW<span>RULES+</span></a><nav><a class="btn" href="./">Home</a><a class="btn" href="./admin.html">Studio</a></nav></header><main><section><div id="profile" class="accountPanel">Loading…</div><div class="sectionHead"><h2>My List</h2></div><div id="list" class="cards"></div><div class="sectionHead"><h2>Continue Watching</h2></div><div id="history" class="cards"></div><div class="sectionHead"><h2>Notifications</h2></div><div id="notifications" class="accountPanel"></div><div class="sectionHead"><h2>Creator Universe</h2></div><div id="creators" class="cards"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let user;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function run(){const r=await sb.auth.getUser();user=r.data.user;if(!user){profile.innerHTML="<h1>Sign in to CrowRules+</h1><p class='muted'>Your Universal CrowRules Account connects your membership, list, history and creator relationships.</p><a class='btn primary' href='./#account'>Open Login</a>";return}
const [m,h,l,n,c,f]=await Promise.all([
 sb.from("crplus_universal_membership").select("*").eq("user_id",user.id).maybeSingle(),
 sb.from("crplus_watch_history").select("*,crplus_content(title,thumbnail_url,slug)").eq("user_id",user.id).order("last_watched_at",{ascending:false}).limit(20),
 sb.from("crplus_my_list").select("*,crplus_content(title,thumbnail_url,slug)").eq("user_id",user.id).order("created_at",{ascending:false}).limit(20),
 sb.from("crplus_notifications").select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(20),
 sb.from("crplus_creators").select("*").order("verified",{ascending:false}).order("display_name"),
 sb.from("crplus_follows").select("creator_id").eq("follower_id",user.id)
]);
const mem=m.data;profile.innerHTML="<h1>"+esc(user.email)+"</h1><p class='muted'>Universal CrowRules Account · "+esc(mem?.plan_name||"CROW / Universal membership")+" · Level "+(mem?.level??0)+"</p>";
function cards(rows){return (rows||[]).map(x=>{const c=x.crplus_content||x;return "<article class='card'><div class='poster' style=\"background-image:url('"+esc(c.thumbnail_url)+"')\">"+esc(c.title)+"</div><div class='cardBody'><h3>"+esc(c.title)+"</h3><a class='btn mini primary' href='./title.html?id="+c.id+"'>Open</a></div></article>"}).join("")||"<p class='muted'>Nothing here yet.</p>"}
list.innerHTML=cards(l.data);history.innerHTML=cards(h.data);notifications.innerHTML=(n.data||[]).map(x=>"<p><strong>"+esc(x.title)+"</strong><br>"+esc(x.body||"")+"<br><small class='muted'>"+new Date(x.created_at).toLocaleString()+"</small></p>").join("")||"<p class='muted'>You're all caught up.</p>";
const followed=new Set((f.data||[]).map(x=>x.creator_id));creators.innerHTML=(c.data||[]).map(x=>"<article class='card'><div class='poster'>"+esc(x.display_name)+"</div><div class='cardBody'><h3>"+esc(x.display_name)+"</h3><p class='muted'>"+esc(x.bio||"CrowRules creator")+"</p><button class='btn mini' data-follow='"+x.id+"'>"+(followed.has(x.id)?"✓ Following":"＋ Follow")+"</button></div></article>").join("")||"<p class='muted'>No creators yet.</p>";
document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=async()=>{const id=b.dataset.follow;if(followed.has(id)){await sb.from("crplus_follows").delete().eq("follower_id",user.id).eq("creator_id",id);followed.delete(id);b.textContent="＋ Follow"}else{await sb.from("crplus_follows").upsert({follower_id:user.id,creator_id:id});followed.add(id);b.textContent="✓ Following"}});
}run();
</script></body></html>
