<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Title | CrowRules+</title><link rel="stylesheet" href="./styles.css"></head><body><header><a class="logo" href="./">CROW<span>RULES+</span></a><nav><a href="./">Home</a><a href="guide.html">Guide</a><a href="profile.html">Profile</a></nav></header><main><section class="hero" id="detail"><div><small id="type">CROWRULES+</small><h1 id="title">Loading…</h1><p id="meta"></p><p id="desc"></p><div class="actions"><a id="watch" class="btn primary">▶ Watch</a><button id="list" class="btn">＋ My List</button><button id="like" class="btn">♡ Like</button></div></div></section><section><div class="sectionHead"><h2>Rating</h2><span id="avg" class="muted"></span></div><div id="stars" class="stars">☆ ☆ ☆ ☆ ☆</div></section><section><div class="sectionHead"><h2>Episodes</h2></div><div id="episodes" class="cards"></div></section><section><div class="sectionHead"><h2>Discussion</h2></div><div id="comments"></div><form id="commentForm" class="commentForm"><textarea id="comment" maxlength="2000" placeholder="Join the conversation…"></textarea><button class="btn primary">Post Comment</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const id=new URLSearchParams(location.search).get("id");const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let user,content;
function card(c){return '<article class="card"><div class="poster">'+esc(c.title)+'</div><div class="cardBody"><h3>'+esc(c.title)+'</h3><div class="muted">S'+(c.season_number||1)+' E'+(c.episode_number||"")+'</div><a class="btn mini primary" href="title.html?id='+c.id+'">View</a></div></article>'}
async function run(){const u=await sb.auth.getUser();user=u.data.user;const r=await sb.from("crplus_content").select("*").eq("id",id).single();content=r.data;if(!content){$("#title").textContent="Title not found";return}document.title=content.title+" | CrowRules+";$("#title").textContent=content.title;$("#type").textContent=(content.content_type||"TITLE").toUpperCase();$("#meta").textContent=[content.content_type,content.division_key,content.age_rating,content.duration_seconds?Math.round(content.duration_seconds/60)+" min":""].filter(Boolean).join(" · ");$("#desc").textContent=content.description||"";$("#watch").href="watch.html?id="+id;$("#list").onclick=async()=>{if(!user)return alert("Sign in to save titles.");await sb.from("crplus_my_list").upsert({user_id:user.id,content_id:id});$("#list").textContent="✓ Saved"};$("#like").onclick=async()=>{if(!user)return alert("Sign in to like titles.");await sb.from("crplus_likes").upsert({user_id:user.id,content_id:id});$("#like").textContent="♥ Liked"};const ep=await sb.from("crplus_content").select("*").eq("show_id",id).eq("is_published",true).order("season_number").order("episode_number");$("#episodes").innerHTML=(ep.data||[]).map(card).join("");const rr=await sb.from("crplus_ratings").select("rating").eq("content_id",id);const ratings=rr.data||[];$("#avg").textContent=ratings.length?(ratings.reduce((a,x)=>a+x.rating,0)/ratings.length).toFixed(1)+" / 5 ("+ratings.length+")":"No ratings yet";document.querySelectorAll(".stars").forEach(el=>{el.innerHTML=[1,2,3,4,5].map(n=>'<button class="star" data-rating="'+n+'">☆</button>').join("");el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{if(!user)return alert("Sign in to rate.");await sb.from("crplus_ratings").upsert({user_id:user.id,content_id:id,rating:Number(b.dataset.rating),updated_at:new Date().toISOString()});run()})});loadComments()}
async function loadComments(){const r=await sb.from("crplus_comments").select("*").eq("content_id",id).order("created_at",{ascending:false});$("#comments").innerHTML=(r.data||[]).map(x=>'<div class="comment"><strong>'+esc(x.user_id).slice(0,8)+'</strong><p>'+esc(x.body)+'</p></div>').join("")||'<p class="muted">Be the first to comment.</p>'}
$("#commentForm").onsubmit=async e=>{e.preventDefault();if(!user)return alert("Sign in to comment.");const body=$("#comment").value.trim();if(!body)return;await sb.from("crplus_comments").insert({user_id:user.id,content_id:id,body});$("#comment").value="";loadComments()};run();
</script></body></html>
