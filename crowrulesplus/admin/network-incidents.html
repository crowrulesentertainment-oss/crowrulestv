<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Incidents | CrowRules+</title><style>body{background:#05050b;color:#fff;font-family:Arial;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:#0b0b14;border:1px solid #29293b;border-radius:16px;padding:20px;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #333;background:#111;color:#fff}textarea{min-height:100px}button{cursor:pointer;margin-top:10px}.incident{border-top:1px solid #29293b;padding:14px 0}.open{color:#f9c}.resolved{color:#8ff}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p>CR+ • NETWORK OPERATIONS</p><h1>Incident Console</h1><section class="panel"><h2>Log Incident</h2><div class="row"><select id="channel"><option value="">Network-wide</option></select><select id="type"><option>empty_schedule</option><option>stream_issue</option><option>emergency_takeover</option><option>schedule_conflict</option><option>other</option></select><select id="severity"><option>warning</option><option>critical</option><option>info</option></select><input id="message" placeholder="Incident message"></div><button id="save">LOG INCIDENT</button><p id="status"></p></section><section class="panel"><h2>Open Incidents</h2><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="network-incidents.js"></script></body></html>
