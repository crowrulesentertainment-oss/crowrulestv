<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Programming Manager | CrowRules+</title><style>body{margin:0;background:#05050b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.hero{padding:40px 0}.eyebrow{color:#8ff;letter-spacing:.2em;font-size:.75rem}.hero h1{font-size:clamp(2.4rem,6vw,5rem);margin:.2em 0}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.panel{background:#0b0b14;border:1px solid #252538;border-radius:18px;padding:20px}label{display:block;color:#aaa;margin:14px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{cursor:pointer;margin-top:14px}.danger{color:#f99}.program{padding:15px;border:1px solid #29293a;border-radius:12px;margin:10px 0}.conflict{border-color:#f77}.status{color:#8ff}.muted{color:#888}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">CROWRULES+ • ADMIN</div><h1>LIVE PROGRAMMING</h1><p class="muted">Build and manage the 24/7 CrowRules+ channel schedule.</p></section><div class="grid"><section class="panel"><h2>ADD PROGRAM</h2><label>Channel</label><select id="channel"></select><label>Content</label><select id="content"><option value="">Custom program title</option></select><label>Title</label><input id="title" placeholder="Program title"><label>Start</label><input id="start" type="datetime-local"><label>End</label><input id="end" type="datetime-local"><button id="save">ADD TO SCHEDULE</button><p id="status" class="status"></p></section><section class="panel"><h2>PROGRAM GRID</h2><div id="grid">Loading…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="live-programming.js"></script></body></html>
