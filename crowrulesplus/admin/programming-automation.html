<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programming Automation | CrowRules+</title><style>body{margin:0;background:#05050b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:28px}.hero{padding:35px 0}.ey{color:#8ff;letter-spacing:.2em;font-size:.75rem}.hero h1{font-size:clamp(2.3rem,6vw,5rem);margin:.2em 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#0b0b14;border:1px solid #252538;border-radius:18px;padding:20px}label{display:block;color:#aaa;margin:13px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{margin-top:14px;cursor:pointer}.item{border:1px solid #29293a;border-radius:12px;padding:14px;margin:10px 0}.muted{color:#888}.ok{color:#8ff}.warn{color:#f9c} @media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="ey">CROWRULES+ • PROGRAMMING AUTOMATION V4</div><h1>24/7 SCHEDULE BUILDER</h1><p class="muted">Create reusable programming templates and generate a future schedule without hand-building every slot.</p></section><div class="grid"><section class="panel"><h2>NEW TEMPLATE</h2><label>Channel</label><select id="channel"></select><label>Content</label><select id="content"><option value="">Custom title</option></select><label>Title</label><input id="title" placeholder="Program title"><label>Start time</label><input id="time" type="time" value="20:00"><label>Duration (minutes)</label><input id="duration" type="number" min="1" max="1440" value="60"><label>Days</label><select id="days" multiple size="7"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select><button id="add">SAVE TEMPLATE</button><p id="status" class="ok"></p></section><section class="panel"><h2>AUTOMATION TEMPLATES</h2><div id="templates">Loading…</div><hr><h2>GENERATE SCHEDULE</h2><label>From</label><input id="from" type="date"><label>Through</label><input id="through" type="date"><button id="generate">GENERATE 7-DAY / SELECTED RANGE</button><p id="generateStatus" class="ok"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="programming-automation.js"></script></body></html>
