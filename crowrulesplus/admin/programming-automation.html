<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Programming Scheduler | CrowRules+</title><style>body{margin:0;background:#05050b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.ey{color:#8ff;letter-spacing:.2em;font-size:.72rem}.hero{padding:28px 0}.hero h1{font-size:clamp(2.3rem,6vw,5rem);margin:.2em 0}.toolbar,.panel{background:#0b0b14;border:1px solid #28283b;border-radius:18px;padding:18px;margin-bottom:20px}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{cursor:pointer}.timeline{overflow:auto}.row{display:grid;grid-template-columns:190px 1fr;min-width:1000px;border-top:1px solid #222}.channel{padding:16px;font-weight:bold}.slots{position:relative;min-height:110px;background:linear-gradient(90deg,transparent 24.9%,#222 25%,transparent 25.1%,transparent 49.9%,#222 50%,transparent 50.1%,transparent 74.9%,#222 75%,transparent 75.1%)}.slot{position:absolute;top:16px;bottom:16px;border:1px solid #5cc;border-radius:10px;padding:10px;overflow:hidden;background:#101827;box-sizing:border-box}.slot b{display:block}.muted{color:#888}.ok{color:#8ff}.warn{color:#f9c}@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="ey">CROWRULES+ • SMART PROGRAMMING V5</div><h1>24/7 NETWORK CONTROL</h1><p class="muted">Preview, fill and publish channel programming with conflict-aware automation.</p></section><section class="toolbar"><input id="from" type="date"><input id="through" type="date"><select id="channel"><option value="">All channels</option></select><button id="refresh">REFRESH TIMELINE</button><button id="fill">FILL OPEN GAPS</button><button id="publish">PUBLISH GENERATED SCHEDULE</button><button id="clearDraft">CLEAR GENERATED DRAFT</button></section><p id="status" class="ok"></p><section class="panel"><h2>7-DAY TIMELINE</h2><div class="muted">Generated slots appear in the preview. Existing programming is protected from overlap.</div><div id="timeline" class="timeline">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="programming-automation.js"></script></body></html>
