<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Live TV | CrowRules+</title><link rel="stylesheet" href="css/crowrulesplus.css"><style>body{margin:0;background:#05050b;color:#fff;font-family:Montserrat,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.hero{padding:70px 0 30px}.eyebrow{letter-spacing:.2em;color:#8ff}.hero h1{font-size:clamp(2.5rem,6vw,5rem)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{padding:22px;border:1px solid #252538;border-radius:18px;background:#0b0b14;text-decoration:none;color:#fff}.live{color:#8ff}.sub{color:#aaa}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">CROWRULES+ • 24/7</div><h1>LIVE TV</h1><p class="sub">Channels, live programs and the CrowRules+ programming universe.</p></section><div id="channels" class="cards">Loading…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);(async()=>{const{data,error}=await sb.from("crplus_live_channels").select("channel_key,name,description,is_live,sort_order").order("sort_order");if(error)throw error;document.querySelector("#channels").innerHTML=(data||[]).map(c=>'<a class="card" href="channel.html?channel='+encodeURIComponent(c.channel_key)+'"><div class="'+(c.is_live?"live":"")+'">'+(c.is_live?"● LIVE NOW":"OFFLINE")+'</div><h2>'+c.name+'</h2><p class="sub">'+(c.description||"")+'</p></a>').join("")||"No channels yet."})().catch(()=>document.querySelector("#channels").textContent="Live TV could not load.");</script></body></html>
