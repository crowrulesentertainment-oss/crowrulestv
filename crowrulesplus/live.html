<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowRules+ Live</title><link rel="stylesheet" href="./styles.css">
<style>
.liveShell{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:18px}.player{background:#050507;border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;min-height:300px}.player iframe,.player video{width:100%;aspect-ratio:16/9;border:0;display:block}.placeholder{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(255,0,70,.22),transparent 45%),#050507}.liveBadge{display:inline-flex;align-items:center;gap:7px;color:#ff526f;font-weight:800;letter-spacing:.08em;font-size:.75rem}.dot{width:8px;height:8px;border-radius:50%;background:#ff3658;box-shadow:0 0 12px #ff3658}.channelRail{display:grid;gap:9px;max-height:70vh;overflow:auto}.channel{width:100%;text-align:left;background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px;cursor:pointer}.channel.active{border-color:#ff3658;background:rgba(255,54,88,.1)}.channel b{display:block}.channel small{opacity:.65}.schedule{display:grid;gap:8px}.scheduleItem{padding:11px;border-left:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.025);border-radius:8px}.scheduleItem.now{border-left-color:#ff3658}.muted{opacity:.68}@media(max-width:900px){.liveShell{grid-template-columns:1fr}}
</style></head>
<body><header class="top"><a class="brand" href="./">CROW<span>RULES+</span></a><nav><a href="./">LIBRARY</a><a href="./guide.html">GUIDE</a><a href="./profile.html">MY CROW</a></nav></header>
<main class="page"><div class="liveBadge"><span class="dot"></span> CROW RULES+ LIVE</div><h1>Live Television. One Universe.</h1>
<div class="liveShell"><section><div class="liveTools"><button class="btn" id="fullscreen">⛶ Fullscreen</button><button class="btn" id="mute">🔊 Mute</button><button class="btn" id="share">↗ Share</button><span id="clock" class="muted"></span></div><div id="player" class="player"><div class="placeholder"><b>Loading live network…</b></div></div><div id="info" class="panel" style="margin-top:14px"></div><section class="panel" style="margin-top:14px"><h2>Now Playing</h2><div id="nowPlaying" class="ccItem"><span class="muted">Select a channel.</span></div></section><section class="panel" style="margin-top:14px"><h2>Coming Up</h2><div id="schedule" class="schedule"></div></section></section>
<aside class="panel"><h2>Channels</h2><div id="channels" class="channelRail"></div></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-"),params=new URLSearchParams(location.search),requested=params.get("channel");let channels=[],current=null;
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])),fmt=v=>v?new Date(v).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
async function load(){const r=await sb.from("crplus_live_channels").select("*").order("sort_order");if(r.error){$("channels").innerHTML="<p>"+esc(r.error.message)+"</p>";return}channels=r.data||[];renderChannels();let chosen=requested?channels.find(x=>x.id===requested||x.channel_key===requested):channels.find(x=>x.is_live);if(!chosen)chosen=channels[0];if(chosen)selectChannel(chosen.id);else $("info").innerHTML="<h2>Nothing is live right now.</h2><p class='muted'>Check the guide for upcoming programming.</p>";}
function renderChannels(){$("channels").innerHTML=channels.map(x=>"<button class='channel "+(current?.id===x.id?"active":"")+"' data-channel='"+x.id+"'><b>"+esc(x.name)+"</b><small>"+(x.is_live?"● LIVE":"OFF AIR")+" · "+esc(x.channel_key||"")+"</small></button>").join("")||"<p class='muted'>No channels configured.</p>";document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>selectChannel(b.dataset.channel));}
async function selectChannel(id){current=channels.find(x=>x.id===id);if(!current)return;renderChannels();let media="";if(current.stream_url){if(/youtube\.com|youtu\.be/i.test(current.stream_url))media="<iframe src='"+esc(current.stream_url)+"' allow='autoplay; fullscreen; picture-in-picture' allowfullscreen></iframe>";else media="<video controls autoplay playsinline src='"+esc(current.stream_url)+"'></video>"}else media="<div class='placeholder'><div><div class='liveBadge'><span class='dot'></span>"+(current.is_live?"LIVE":"OFF AIR")+"</div><h2>"+esc(current.name)+"</h2><p class='muted'>Stream source not configured yet.</p></div></div>";$("player").innerHTML=media;$("info").innerHTML="<span class='liveBadge'>"+(current.is_live?"● LIVE NOW":"CHANNEL")+"</span><h2>"+esc(current.name)+"</h2><p class='muted'>"+esc(current.description||"")+" </p>";$("nowPlaying").innerHTML="<strong>"+esc(current.name)+"</strong><p class='muted'>"+(current.is_live?"Live now":"Off air")+" · Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+"</p>";loadSchedule(current.id);}
async function loadSchedule(id){const r=await sb.from("crplus_schedule").select("id,title,starts_at,ends_at,content_id").eq("channel_id",id).gte("ends_at",new Date().toISOString()).order("starts_at").limit(12);if(r.error)return;$("schedule").innerHTML=(r.data||[]).map(x=>"<div class='scheduleItem'><b>"+esc(x.title||"Untitled")+"</b><div class='muted'>"+fmt(x.starts_at)+" – "+fmt(x.ends_at)+"</div></div>").join("")||"<p class='muted'>No upcoming programming scheduled.</p>";}
const toolsCss=document.createElement("style");toolsCss.textContent=".liveTools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.liveTools .muted{margin-left:auto}.ccItem{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025)}";document.head.appendChild(toolsCss);$("fullscreen").onclick=()=>{$("player").requestFullscreen?.()};$("mute").onclick=()=>{const v=$("player").querySelector("video");if(v){v.muted=!v.muted;$("mute").textContent=v.muted?"🔇 Unmute":"🔊 Mute"}};$("share").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("share").textContent="✓ Link Copied";setTimeout(()=>$("share").textContent="↗ Share",1800)}catch{prompt("Copy this link:",location.href)}};setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"}),1000);load();setInterval(load,30000);
</script></body></html>
