<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a12">
  <meta name="description" content="CrowRules TV is coming soon. A new screen for stories, shows, and live entertainment from CrowRules Entertainment.">
  <title>CrowRules TV — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --cyan:#42e8ff; --purple:#9c6bff; --muted:#aab3c8; }
    * { box-sizing: border-box; }
    html { min-height:100%; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
      padding:28px; color:#f7f8ff; font-family:Montserrat,Arial,sans-serif;
      background: radial-gradient(ellipse at 18% 18%, #172b48 0, transparent 38%),
                  radial-gradient(ellipse at 84% 78%, #2b1747 0, transparent 36%), #080a12;
    }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22;
      background-image:linear-gradient(#a8caff14 1px,transparent 1px),linear-gradient(90deg,#a8caff14 1px,transparent 1px);
      background-size:48px 48px; mask-image:linear-gradient(to bottom,black,transparent 92%); }
    main { position:relative; width:min(100%,820px); text-align:center; padding:clamp(32px,7vw,76px) clamp(20px,6vw,64px); border:1px solid #7a8fb52b; border-radius:28px; background:linear-gradient(145deg,#111827d9,#0b0d18eF); box-shadow:0 24px 100px #0008,inset 0 1px #ffffff0d; }
    .mark { display:grid; place-items:center; width:76px; height:76px; margin:0 auto 28px; border:1px solid #42e8ff80; border-radius:22px; color:var(--cyan); font:800 27px Orbitron,sans-serif; background:linear-gradient(135deg,#42e8ff18,#9c6bff22); box-shadow:0 0 42px #42e8ff18; }
    .eyebrow { margin:0 0 18px; color:var(--cyan); font-size:.72rem; font-weight:800; letter-spacing:.25em; text-transform:uppercase; }
    h1 { margin:0; font:800 clamp(2.3rem,8vw,5rem)/1.08 Orbitron,sans-serif; letter-spacing:-.055em; }
    h1 span { display:block; color:transparent; background:linear-gradient(90deg,var(--cyan),#b4a0ff 75%); background-clip:text; -webkit-background-clip:text; }
    .status { display:inline-flex; align-items:center; gap:10px; margin:30px 0 20px; padding:10px 15px; border:1px solid #ffc76b55; border-radius:999px; color:#ffd58a; background:#ffc76b0d; font-size:.76rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ffc76b; box-shadow:0 0 12px #ffc76b99; }
    .message { max-width:560px; margin:0 auto; color:var(--muted); font-size:clamp(.95rem,2.4vw,1.1rem); line-height:1.85; }
    .tagline { margin:34px 0 0; color:#f3f4ff; font-size:.84rem; font-weight:700; letter-spacing:.09em; }
    .tagline span { color:var(--purple); }
    footer { margin-top:36px; color:#68748e; font-size:.72rem; letter-spacing:.08em; }
    @media (max-width:480px) { body { padding:16px; } main { border-radius:20px; } .mark { width:64px;height:64px;border-radius:18px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CR</div>
    <p class="eyebrow">CrowRules Entertainment presents</p>
    <h1>CrowRules <span>TV</span></h1>
    <div class="status"><span class="dot" aria-hidden="true"></span>Under Development</div>
    <p class="message">A new screen for stories, shows, and live entertainment is on the way. CrowRules TV is in development—check back as we build what comes next.</p>
    <p class="tagline">One company. <span>One universe.</span></p>
    <footer>© <span id="year">2026</span> CrowRules Entertainment</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
