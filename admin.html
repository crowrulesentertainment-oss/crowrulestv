<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro v6.6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font:14px system-ui,sans-serif}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box}
.box{max-width:760px;width:100%}.small{color:#8996a8}.bad{color:#ff637b}
button{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="status"><div class="box"><h2>🐦‍⬛ CrowRules Entertainment</h2><p id="statusText">Loading Admin Pro v6.6…</p><p id="statusDetail" class="small">Starting the CrowRules Supabase control center.</p></div></div>
<script>
'use strict';
(async()=>{
 const text=document.getElementById('statusText');
 const detail=document.getElementById('statusDetail');
 const fail=m=>{
  text.textContent='Admin Pro could not start';
  text.className='bad';
  detail.textContent=String(m).replace(/[<>]/g,'');
  detail.className='small bad';
  const b=document.createElement('button');
  b.textContent='Reload';
  b.onclick=()=>location.reload();
  document.querySelector('.box').appendChild(b);
 };
 try{
  const c=new AbortController();
  const timer=setTimeout(()=>c.abort(),20000);
  const r=await fetch('./admin-v6.3.html?build=20260827-api-fix',{cache:'no-store',signal:c.signal});
  clearTimeout(timer);
  if(!r.ok)throw new Error('Admin Pro source returned HTTP '+r.status);
  let h=await r.text();
  if(h.length<500)throw new Error('Admin Pro source is incomplete');

  // Replace only the legacy public/anon key in the fetched Admin Pro source.
  // This is safe for a browser-side Supabase publishable key; never use a service-role key here.
  const publishableKey='sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9';
  h=h.replace(/const SUPABASE_KEY\s*=\s*(['"]).*?\1\s*;/,`const SUPABASE_KEY='${publishableKey}';`);

  if(!h.includes(publishableKey))throw new Error('Could not update the Supabase publishable key in Admin Pro source');
  document.open();
  document.write(h);
  document.close();
 }catch(e){
  fail(e.name==='AbortError'?'Timed out loading Admin Pro.':e.message||e);
 }
})();
</script>
</body>
</html>
