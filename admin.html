<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CrowRules Entertainment — Admin Pro v2.5</title>

<style>
:root{
  --bg:#070707;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1b1b1b;
  --line:#292929;
  --text:#f4f4f4;
  --muted:#929292;
  --accent:#fff;
  --danger:#ef4444;
  --success:#22c55e;
  --warning:#f59e0b;
  --radius:14px;
  --sidebar:260px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Montserrat,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar);
  background:#090909;
  border-right:1px solid var(--line);
  z-index:100;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:25px 20px 20px;
  border-bottom:1px solid var(--line);
}

.brand-title{
  font-family:Orbitron,sans-serif;
  font-size:18px;
  font-weight:800;
  letter-spacing:1px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.nav{
  padding:15px 10px;
  overflow-y:auto;
  flex:1;
}

.nav-section{
  color:#666;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:14px 12px 7px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  color:#aaa;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  margin:2px 0;
  transition:.18s;
}

.nav-btn:hover{
  background:#161616;
  color:#fff;
}

.nav-btn.active{
  background:#fff;
  color:#050505;
  font-weight:700;
}

.nav-icon{
  width:20px;
  text-align:center;
}

.sidebar-footer{
  border-top:1px solid var(--line);
  padding:13px;
}

/* MAIN */

.main{
  margin-left:var(--sidebar);
  min-height:100vh;
}

.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-title{
  font-family:Orbitron,sans-serif;
  font-size:17px;
  font-weight:700;
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.content{
  padding:25px;
}

/* BUTTONS */

.btn{
  border:1px solid var(--line);
  background:#151515;
  color:#fff;
  border-radius:9px;
  padding:9px 14px;
  font-size:12px;
  font-weight:700;
}

.btn:hover{
  background:#202020;
}

.btn.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
}

.btn.danger{
  background:#281010;
  color:#ff9b9b;
  border-color:#4a2020;
}

.btn.success{
  background:#102517;
  color:#8df2ad;
  border-color:#204b2c;
}

.btn.warning{
  background:#261b0a;
  color:#ffd078;
  border-color:#503d18;
}

/* DASHBOARD */

.hero{
  background:
    radial-gradient(circle at 80% 20%,#242424 0,transparent 35%),
    linear-gradient(135deg,#111,#090909);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  margin-bottom:22px;
}

.hero h1{
  font-family:Orbitron,sans-serif;
  margin:0;
  font-size:25px;
}

.hero p{
  color:#aaa;
  max-width:850px;
  line-height:1.7;
}

.grid{
  display:grid;
  gap:15px;
}

.stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}

.stat-label{
  color:#888;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat-value{
  font-family:Orbitron,sans-serif;
  font-size:27px;
  margin-top:10px;
}

.stat-small{
  color:#666;
  font-size:11px;
  margin-top:7px;
}

/* PANELS */

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:18px;
  overflow:hidden;
}

.panel-head{
  padding:17px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.panel-title{
  font-size:14px;
  font-weight:800;
}

.panel-body{
  padding:18px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.search{
  min-width:230px;
  background:#0a0a0a;
  border:1px solid var(--line);
  color:#fff;
  padding:9px 12px;
  border-radius:9px;
  outline:none;
}

.search:focus{
  border-color:#555;
}

/* TABLE */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  border-bottom:1px solid #202020;
  padding:12px 14px;
  text-align:left;
  font-size:12px;
  vertical-align:middle;
}

th{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

td{
  color:#ddd;
}

tr:hover td{
  background:#131313;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
  font-weight:800;
  background:#202020;
  color:#bbb;
}

.badge.green{
  background:#102619;
  color:#85e8a3;
}

.badge.yellow{
  background:#2a210d;
  color:#ffd66e;
}

.badge.red{
  background:#2b1111;
  color:#ff9b9b;
}

/* FORMS */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:#999;
  font-size:11px;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#090909;
  color:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#666;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:17px;
}

/* YEARBOOK */

.yearbook-hero{
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  background:
    linear-gradient(135deg,#151515,#080808);
  margin-bottom:20px;
}

.yearbook-kicker{
  color:#888;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:2px;
}

.yearbook-hero h1{
  font-family:Orbitron,sans-serif;
  margin:8px 0;
  font-size:27px;
}

.yearbook-hero p{
  color:#aaa;
  line-height:1.7;
  max-width:900px;
}

.yearbook-links{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:18px;
}

.yearbook-link{
  border:1px solid var(--line);
  background:#0d0d0d;
  padding:15px;
  border-radius:12px;
}

.yearbook-link strong{
  display:block;
  margin-bottom:5px;
}

.yearbook-link span{
  color:#777;
  font-size:11px;
}

.shared-member{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* EMPTY */

.empty{
  padding:35px;
  text-align:center;
  color:#666;
}

.loading{
  padding:35px;
  text-align:center;
  color:#777;
}

/* LOGIN */

.login{
  position:fixed;
  inset:0;
  background:#050505;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#101010;
  padding:30px;
}

.login-logo{
  font-family:Orbitron,sans-serif;
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.login-sub{
  color:#777;
  font-size:12px;
  margin-bottom:25px;
}

.login-error{
  color:#ff8f8f;
  font-size:11px;
  margin-top:10px;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:2000;
  background:#fff;
  color:#050505;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  transform:translateY(120px);
  opacity:0;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .yearbook-links{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  :root{
    --sidebar:0px;
  }

  .sidebar{
    position:static;
    width:100%;
    height:auto;
  }

  .sidebar-footer{
    display:none;
  }

  .nav{
    display:flex;
    overflow:auto;
  }

  .nav-section{
    display:none;
  }

  .nav-btn{
    min-width:max-content;
  }

  .main{
    margin-left:0;
  }

  .topbar{
    position:static;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .content{
    padding:15px;
  }
}
</style>
</head>

<script>
/* =========================================================
   CROWRULES ENTERTAINMENT ADMIN PRO v2.5
   Shared CrowRules Members + Yearbook
   ========================================================= */

/*
  IMPORTANT:
  Replace these two values with your Supabase project credentials.

  Project:
  zauxdqyssratvzmomozf
*/

const SUPABASE_URL =
  "https://zauxdqyssratvzmomozf.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* ---------------------------------------------------------
   State
--------------------------------------------------------- */

const state = {
  section:"dashboard",
  user:null,
  rows:[],
  count:0,
  page:1,
  pageSize:25,
  search:"",
  loading:false
};

/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      el.classList.remove("show");
    },2500);
}

function pretty(value){
  if(value === null || value === undefined || value === ""){
    return "—";
  }

  if(typeof value === "boolean"){
    return value ? "Yes" : "No";
  }

  return esc(value);
}

function date(value){
  if(!value) return "—";

  try{
    return new Intl.DateTimeFormat(
      "en-US",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    ).format(new Date(value));
  }catch{
    return value;
  }
}

function badge(value){
  const v =
    String(value || "")
      .toLowerCase();

  let cls = "";

  if(
    v.includes("published") ||
    v.includes("active") ||
    v === "completed" ||
    v === "approved"
  ){
    cls = "green";
  }

  if(
    v.includes("draft") ||
    v.includes("new") ||
    v.includes("review") ||
    v === "pending"
  ){
    cls = "yellow";
  }

  if(
    v.includes("archived") ||
    v.includes("declined") ||
    v === "inactive"
  ){
    cls = "red";
  }

  return `<span class="badge ${cls}">
    ${esc(value || "—")}
  </span>`;
}

/* ---------------------------------------------------------
   Authentication
--------------------------------------------------------- */

async function initAuth(){

  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();

  if(session?.user){
    await boot(session.user);
  }else{
    showLogin();
  }

  sb.auth.onAuthStateChange(
    async(event,session)=>{

      if(session?.user){
        await boot(session.user);
      }else{
        showLogin();
      }

    }
  );
}

async function boot(user){

  state.user = user;

  $("loginScreen").style.display = "none";
  $("app").style.display = "block";

  $("userLabel").textContent =
    user.email || "";

  await verifyAdmin();

  renderSection();
}

async function verifyAdmin(){

  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("id,display_name,role,is_active")
      .eq("id",state.user.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(
    !data ||
    data.is_active === false ||
    ![
      "admin",
      "super_admin",
      "owner",
      "manager",
      "producer",
      "editor"
    ].includes(data.role)
  ){
    toast("Administrator access could not be verified.");
  }
}

function showLogin(){

  $("loginScreen").style.display = "flex";
  $("app").style.display = "none";

  $("loginError").textContent = "";
}

$("loginForm").addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    const email =
      $("loginEmail").value.trim();

    const password =
      $("loginPassword").value;

    $("loginError").textContent =
      "Signing in...";

    const {
      error
    } =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      $("loginError").textContent =
        error.message;
    }else{
      $("loginError").textContent = "";
    }

  }
);

$("logoutBtn").addEventListener(
  "click",
  async()=>{
    await sb.auth.signOut();
  }
);

/* ---------------------------------------------------------
   Navigation
--------------------------------------------------------- */

document
  .querySelectorAll(".nav-btn")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        state.section =
          button.dataset.section;

        state.page = 1;
        state.search = "";

        document
          .querySelectorAll(".nav-btn")
          .forEach(x=>{
            x.classList.remove("active");
          });

        button.classList.add("active");

        renderSection();
      }
    );

  });

$("refreshBtn").addEventListener(
  "click",
  ()=>{
    renderSection();
  }
);

/* ---------------------------------------------------------
   Section Metadata
--------------------------------------------------------- */

const tableSections = {

  shows:{
    title:"Shows",
    table:"shows",
    columns:[
      ["title","Title"],
      ["slug","Slug"],
      ["status","Status"],
      ["is_published","Published"],
      ["created_at","Created"]
    ]
  },

  episodes:{
    title:"Episodes",
    table:"episodes",
    columns:[
      ["title","Title"],
      ["show_id","Show"],
      ["episode_number","Episode"],
      ["is_published","Published"],
      ["created_at","Created"]
    ]
  },

  schedule:{
    title:"Schedule",

/* ---------------------------------------------------------
   Generic Table Loader
--------------------------------------------------------- */

async function loadTable(
  key,
  customTable = null
){

  const meta =
    tableSections[key];

  const table =
    customTable ||
    meta.table;

  const from =
    (state.page - 1) *
    state.pageSize;

  const to =
    from +
    state.pageSize -
    1;

  let query =
    sb
      .from(table)
      .select("*",{count:"exact"})
      .range(from,to);

  if(state.search){

    const columns =
      meta.columns
        .map(x=>x[0])
        .filter(Boolean);

    const searchable =
      columns.filter(
        x=>[
          "title",
          "name",
          "display_name",
          "username",
          "email",
          "slug",
          "role",
          "description",
          "review_text",
          "event_name"
        ].includes(x)
      );

    if(searchable.length){

      query =
        query.or(
          searchable
            .map(
              col =>
                `${col}.ilike.%${state.search}%`
            )
            .join(",")
        );

    }

  }

  query =
    query.order(
      "created_at",
      {
        ascending:false
      }
    );

  const {
    data,
    error,
    count
  } =
    await query;

  if(error){
    console.error(error);
    throw error;
  }

  state.rows = data || [];
  state.count = count || 0;

  return state.rows;
}

/* ---------------------------------------------------------
   Table Renderer
--------------------------------------------------------- */

function renderTable(
  key,
  rows
){

  const meta =
    tableSections[key];

  let html = `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">
          ${esc(meta.title)}
        </div>

        <div class="toolbar">

          <input
            class="search"
            id="tableSearch"
            placeholder="Search..."
            value="${esc(state.search)}"
          >

          <button
            class="btn"
            onclick="clearSearch()"
          >
            Clear
          </button>

          <button
            class="btn primary"
            onclick="newRecord('${key}')"
          >
            + New
          </button>

        </div>
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
  `;

  meta.columns.forEach(
    col=>{
      html +=
        `<th>${esc(col[1])}</th>`;
    }
  );

  html += `
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
  `;

  if(!rows.length){

    html += `
      <tr>
        <td
          colspan="${meta.columns.length + 1}"
        >
          <div class="empty">
            No records found.
          </div>
        </td>
      </tr>
    `;

  }else{

    rows.forEach(row=>{

      html += "<tr>";

      meta.columns.forEach(
        col=>{

          const keyName = col[0];
          const value =
            row[keyName];

          if(
            [
              "status",
              "is_published",
              "is_active",
              "is_featured",
              "approved_at"
            ].includes(keyName)
          ){

            let label = value;

            if(
              typeof value === "boolean"
            ){
              label =
                value
                  ? "Active"
                  : "No";
            }

            html +=
              `<td>${badge(label)}</td>`;

          }else if(
            keyName.includes("_at") ||
            keyName.endsWith("_date")
          ){

            html +=
              `<td>${date(value)}</td>`;

          }else if(
            keyName === "rating"
          ){

            html +=
              `<td>${"★".repeat(
                Math.max(
                  0,
                  Math.min(
                    5,
                    Number(value || 0)
                  )
                )
              )}</td>`;

          }else{

            let text =
              value === null ||
              value === undefined
                ? "—"
                : String(value);

            if(text.length > 55){
              text =
                text.substring(0,55) +
                "…";
            }

            html +=
              `<td>${esc(text)}</td>`;
          }

        }
      );

      html += `
        <td>
          <div class="toolbar">
            <button
              class="btn"
              onclick='editRecord(${JSON.stringify(key)},${JSON.stringify(row)})'
            >
              Edit
            </button>

            <button
              class="btn danger"
              onclick='deleteRecord(${JSON.stringify(meta.table)},${JSON.stringify(row)})'
            >
              Delete
            </button>
          </div>
        </td>
      `;

      html += "</tr>";

    });

  }

  html += `
          </tbody>
        </table>

      </div>

      <div
        style="
          padding:13px 18px;
          color:#666;
          font-size:11px;
          border-top:1px solid #202020;
        "
      >
        ${state.count} total records
      </div>

    </div>
  `;

  return html;
}

--------------------------------------------------------- */

function primaryKey(row){

  if(row?.id !== undefined){
    return {
      id:row.id
    };
  }

  if(row?.user_id !== undefined){
    return {
      user_id:row.user_id
    };
  }

  return null;
}

function cleanPayload(
  obj
){

  const output = {};

  Object.entries(obj)
    .forEach(
      ([key,value])=>{

        if(
          value === "" ||
          value === undefined
        ){
          output[key] = null;
        }else{
          output[key] = value;
        }

      }
    );

  return output;
}

async function saveRecord(
  table,
  id,
  payload
){

  let result;

  if(id){

    result =
      await sb
        .from(table)
        .update(payload)
        .eq("id",id)
        .select()
        .single();

  }else{

    result =
      await sb
        .from(table)
        .insert(payload)
        .select()
        .single();

  }

  if(result.error){
    throw result.error;
  }

  toast(
    id
      ? "Record updated."
      : "Record created."
  );

  await renderSection();
}

async function deleteRecord(
  table,
  row
){

  if(
    !confirm(
      "Delete this record? This cannot be undone."
    )
  ){
    return;
  }

  const pk =
    primaryKey(row);

  if(!pk){
    toast("No primary key found.");
    return;
  }

  let query =
    sb
      .from(table)
      .delete();

  Object.entries(pk)
    .forEach(
      ([key,value])=>{
        query =
          query.eq(key,value);
      }
    );

  const {
    error
  } =
    await query;

  if(error){
    toast(error.message);
    return;
  }

  toast("Record deleted.");

  renderSection();
}

/* ---------------------------------------------------------
   Generic Record Form
--------------------------------------------------------- */

function newRecord(key){

  const meta =
    tableSections[key];

  if(!meta){
    return;
  }

  editRecord(
    key,
    {}
  );
}

function editRecord(
  key,
  row
){

  const meta =
    tableSections[key];

  if(!meta){
    return;
  }

  const content =
    $("content");

  let html = `

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          ${row.id ? "Edit" : "New"}
          ${esc(meta.title)}
        </div>

        <button
          class="btn"
          onclick="renderSection()"
        >
          Cancel
        </button>

      </div>

      <div class="panel-body">

        <form
          id="recordForm"
          class="form-grid"
        >
  `;

  meta.columns
    .forEach(
      ([name,label])=>{

        if(
          [
            "created_at",
            "updated_at"
          ].includes(name)
        ){
          return;
        }

        const value =
          row[name];

        if(
          [
            "is_active",
            "is_published",
            "is_featured",
            "is_member",
            "is_creator"
          ].includes(name)
        ){

          html += `

            <div class="field">

              <label>
                ${esc(label)}
              </label>

              <label
                style="
                  display:flex;
                  align-items:center;
                  gap:8px;
                  color:#bbb;
                "
              >

                <input
                  type="checkbox"
                  name="${esc(name)}"
                  ${value ? "checked" : ""}
                >

                Enabled

              </label>

            </div>

          `;

        }else if(
          name.includes("text") ||
          [
            "bio",
            "description",
            "story",
            "content",
            "review_text",
            "message",
            "vision",
            "why_crowrules",
            "entertainment_connection"
          ].includes(name)
        ){

          html += `

            <div class="field full">

              <label>
                ${esc(label)}
              </label>

              <textarea
                name="${esc(name)}"
              >${esc(value || "")}</textarea>

            </div>

          `;

        }else{

          html += `

            <div class="field">

              <label>
                ${esc(label)}
              </label>

              <input
                name="${esc(name)}"
                value="${esc(value ?? "")}"
              >

            </div>

          `;

        }

      }
    );

  html += `

          <div class="field full">

            <div class="form-actions">

              <button
                type="submit"
                class="btn primary"
              >
                Save
              </button>

            </div>

          </div>

        </form>

      </div>

    </div>
  `;

  content.innerHTML = html;

  $("recordForm")
    .addEventListener(
      "submit",
      async event=>{

        event.preventDefault();

        const form =
          new FormData(
            event.currentTarget
          );

        const payload = {};

        meta.columns
          .forEach(
            ([name])=>{

              if(
                [
                  "created_at",
                  "updated_at"
                ].includes(name)
              ){
                return;
              }

              if(
                [
                  "is_active",
                  "is_published",
                  "is_featured",
                  "is_member",
                  "is_creator"
                ].includes(name)
              ){

                payload[name] =
                  form.get(name) !== null;

              }else{

                payload[name] =
                  form.get(name);

              }

            }
          );

        try{

          await saveRecord(
            meta.table,
            row.id,
            cleanPayload(payload)
          );

        }catch(error){

          toast(
            error.message ||
            "Unable to save record."
          );

        }

      }
    );
}

/* ---------------------------------------------------------
   Search
--------------------------------------------------------- */

function clearSearch(){

  state.search = "";
  state.page = 1;

  renderSection();
}

document.addEventListener(
  "input",
  event=>{

    if(
      event.target.id !==
      "tableSearch"
    ){
      return;
    }

    clearTimeout(
      window.__searchTimer
    );

    window.__searchTimer =
      setTimeout(
        ()=>{
          state.search =
            event.target.value.trim();

          state.page = 1;

          renderSection();
        },
        350
      );
  }
);

/* ---------------------------------------------------------
   Navigation shortcut
--------------------------------------------------------- */

function go(section){

  state.section = section;
  state.page = 1;
  state.search = "";

  document
    .querySelectorAll(".nav-btn")
    .forEach(button=>{
      button.classList.toggle(
        "active",
        button.dataset.section === section
      );
    });

  renderSection();
}

/* ---------------------------------------------------------
   Render Section
--------------------------------------------------------- */

async function renderSection(){

  if(!state.user){
    return;
  }

  const content =
    $("content");

  const titles = {
    dashboard:"Dashboard",
    yearbook:"CrowRules Yearbook",
    yearbookMembers:"Shared Yearbook Members",
    yearbookSettings:"Yearbook Settings",
    analytics:"Analytics"
  };

  if(
    tableSections[state.section]
  ){

    $("pageTitle").textContent =
      tableSections[
        state.section
      ].title;

  }else{

    $("pageTitle").textContent =
      titles[state.section] ||
      "CrowRules Admin Pro";

  }

  content.innerHTML =
    `<div class="loading">Loading...</div>`;

  try{

    if(
      state.section ===
      "dashboard"
    ){

      content.innerHTML =
        await dashboard();

      return;
    }

    if(
      state.section ===
      "yearbook"
    ){

      content.innerHTML =
        await yearbookDashboard();

      return;
    }

    if(
      state.section ===
      "yearbookMembers"
    ){

      content.innerHTML =
        await sharedMembers();

      return;
    }

    if(
      state.section ===
      "yearbookSettings"
    ){

      content.innerHTML =
        await yearbookSettings();

      bindYearbookSettings();

      return;
    }

    if(
      state.section ===
      "analytics"
    ){

      content.innerHTML =
        await analytics();

      return;
    }

    const meta =
      tableSections[
        state.section
      ];

    if(meta){

      const rows =
        await loadTable(
          state.section
        );

      content.innerHTML =
        renderTable(
          state.section,
          rows
        );

      return;
    }

    content.innerHTML =
      `<div class="empty">
        Section not found.
      </div>`;

  }catch(error){

    console.error(error);

    content.innerHTML = `

      <div class="panel">

        <div class="empty">

          <strong>
            Unable to load section
          </strong>

          <br><br>

          ${esc(
            error.message ||
            "Unknown error"
          )}

          <br><br>

          <button
            class="btn"
            onclick="renderSection()"
          >
            Try Again
          </button>

        </div>

      </div>

    `;

  }
}

/* ---------------------------------------------------------
   Yearbook Settings Binding
--------------------------------------------------------- */

function bindYearbookSettings(){

  const form =
    $("yearbookSettingsForm");

  if(!form){
    return;
  }

  form.addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      const fd =
        new FormData(form);

      const payload = {};

      [
        "brand_name",
        "tagline",
        "contact_email",
        "logo_url",
        "hero_image_url",
        "vision",
        "why_crowrules",
        "entertainment_connection",
        "hero_text"
      ].forEach(
        name=>{
          payload[name] =
            fd.get(name);
        }
      );

      [
        "request_enabled",
        "reviews_enabled",
        "members_enabled",
        "archive_enabled"
      ].forEach(
        name=>{
          payload[name] =
            fd.get(name) !== null;
        }
      );

      const {
        error
      } =
        await sb
          .from(
            "crowrules_yearbook_settings"
          )
          .update(payload)
          .eq(
            "site_key",
            "crowrules_yearbook"
          );

      if(error){
        toast(error.message);
        return;
      }

      toast(
        "Yearbook settings saved."
      );

    }
  );
}

/* ---------------------------------------------------------
   Analytics
--------------------------------------------------------- */

async function analytics(){

  const [
    events,
    views
  ] =
    await Promise.all([

      sb
        .from("analytics_events")
        .select("*",{
          count:"exact",
          head:true
        }),

      sb
        .from("content_view_stats")
        .select("*")
        .order(
          "views",
          {
            ascending:false
          }
        )
        .limit(10)

    ]);

  return `

    <div class="hero">

      <h1>
        Analytics
      </h1>

      <p>
        CrowRules Entertainment performance
        overview.
      </p>

    </div>

    <div class="grid stats">

      ${stat(
        "Analytics Events",
        events.count || 0,
        "tracked events"
      )}

      ${stat(
        "Top Content",
        views.data?.length || 0,
        "ranked content"
      )}

    </div>

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          Top Content
        </div>

      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Content</th>
              <th>Views</th>
            </tr>
          </thead>

          <tbody>

            ${
              views.data?.length
                ? views.data
                    .map(
                      row=>`
                        <tr>
                          <td>
                            ${esc(
                              row.title ||
                              row.content_id ||
                              "Content"
                            )}
                          </td>
                          <td>
                            ${Number(
                              row.views || 0
                            ).toLocaleString()}
                          </td>
                        </tr>
                      `
                    )
                    .join("")
                : `
                  <tr>
                    <td colspan="2">
                      <div class="empty">
                        No analytics available.
                      </div>
                    </td>
                  </tr>
                `
            }

          </tbody>

        </table>

      </div>

    </div>
  `;
}
