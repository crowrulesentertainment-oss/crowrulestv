<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>CrowRules Entertainment — Admin Pro v5.3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.box{width:min(760px,100%);padding:30px;box-sizing:border-box;text-align:center;border:1px solid #202a38;border-radius:18px;background:#0a0f17;box-shadow:0 24px 70px #0009}
.logo{font-size:34px}.small{color:#8996a8}.bad{color:#ff637b}.ok{color:#72e6a8}
.spinner{width:34px;height:34px;margin:0 auto 18px;border:3px solid #273241;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
button{margin-top:14px;padding:10px 15px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="status" aria-live="polite"><div class="box"><div class="logo">🐦‍⬛</div><h2>CrowRules Entertainment</h2><div class="spinner" id="spinner"></div><p id="statusText">Loading Admin Pro v5.3…</p><p id="statusDetail" class="small">Starting the control center.</p></div></div>
<script>
(async function(){
'use strict';
const status=document.getElementById('status');
const text=document.getElementById('statusText');
const detail=document.getElementById('statusDetail');
const spinner=document.getElementById('spinner');
let timer;
function fail(message){
 clearTimeout(timer); spinner.style.display='none'; text.textContent='Admin Pro v5.3 could not start'; text.className='bad'; detail.textContent=String(message||'Unknown loading error').replace(/[<>]/g,''); detail.className='small bad';
 if(!document.getElementById('reloadAdmin')){const b=document.createElement('button');b.id='reloadAdmin';b.type='button';b.textContent='Reload Admin Pro';b.onclick=function(){location.reload()};status.querySelector('.box').appendChild(b)}
}
try{
 const controller=new AbortController();
 timer=setTimeout(function(){controller.abort()},30000);
 text.textContent='Loading Admin Pro v5.3…';
 const response=await fetch('./admin-v4.html?build=20260827-v5.3&ts='+Date.now(),{method:'GET',cache:'no-store',credentials:'same-origin',redirect:'follow',signal:controller.signal});
 clearTimeout(timer);
 if(!response.ok)throw new Error('Admin Pro core returned HTTP '+response.status);
 let html=await response.text();
 if(!html||html.trim().length<500)throw new Error('Admin Pro core document is empty or incomplete');
 if(!/<html[\s>]/i.test(html))throw new Error('Admin Pro core returned invalid HTML');
 text.textContent='Starting Admin Pro v5.3…';
 detail.textContent='Loading the complete administration interface.';
 const marker='</body>';
 const bodyIndex=html.toLowerCase().lastIndexOf(marker);
 if(bodyIndex===-1)throw new Error('Admin Pro core is missing the closing body tag');
 const enhancement='\n<script>\n(function(){\n  window.CROW_ADMIN_VERSION="5.3";\n  window.CROW_ADMIN_LOADED_AT=new Date().toISOString();\n})();\n<\\/script>\n';
 html=html.slice(0,bodyIndex)+enhancement+html.slice(bodyIndex);
 document.open();
 document.write(html);
 document.close();
}catch(error){
 clearTimeout(timer);
 fail(error&&error.name==='AbortError'?'Timed out loading Admin Pro v5.3 after 30 seconds.':(error&&error.message)||error);
}
})();
</script>
</body>
</html>
