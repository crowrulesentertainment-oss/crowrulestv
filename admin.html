<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>CrowRules Entertainment — Admin Pro v5.4</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%}
#adminFrame{display:block;width:100%;height:100%;border:0;background:#05070b}
#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05070b;transition:opacity .2s ease}
#loader.hidden{opacity:0;pointer-events:none}
.box{width:min(560px,calc(100% - 40px));box-sizing:border-box;padding:30px;text-align:center;border:1px solid #202a38;border-radius:18px;background:#0a0f17;box-shadow:0 24px 70px #0009}
.logo{font-size:38px;margin-bottom:8px}.small{color:#8996a8}.bad{color:#ff637b}
.spinner{width:34px;height:34px;margin:0 auto 18px;border:3px solid #273241;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{margin-top:14px;padding:10px 15px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <iframe id="adminFrame" title="CrowRules Admin Pro" src="./admin-v4.html?admin_v54=1&build=20260827-v5.4" allow="clipboard-read; clipboard-write"></iframe>
</div>
<div id="loader" aria-live="polite">
  <div class="box">
    <div class="logo">🐦‍⬛</div>
    <h2>CrowRules Entertainment</h2>
    <div class="spinner" id="spinner"></div>
    <p id="statusText">Loading Admin Pro v5.4…</p>
    <p id="statusDetail" class="small">Starting the control center.</p>
    <button id="reload" type="button" style="display:none">Reload Admin Pro</button>
  </div>
</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('adminFrame');
var loader=document.getElementById('loader');
var spinner=document.getElementById('spinner');
var text=document.getElementById('statusText');
var detail=document.getElementById('statusDetail');
var reload=document.getElementById('reload');
var finished=false;
var timeout=setTimeout(function(){
  if(finished)return;
  spinner.style.display='none';
  text.textContent='Admin Pro is taking too long to load';
  text.className='bad';
  detail.textContent='The Admin Pro core did not report that it finished loading. You can retry without leaving this page.';
  detail.className='small bad';
  reload.style.display='inline-block';
},30000);
function done(){
  if(finished)return;
  finished=true;
  clearTimeout(timeout);
  setTimeout(function(){loader.classList.add('hidden')},250);
}
frame.addEventListener('load',function(){
  done();
});
frame.addEventListener('error',function(){
  clearTimeout(timeout);
  spinner.style.display='none';
  text.textContent='Admin Pro could not load';
  text.className='bad';
  detail.textContent='The Admin Pro core returned a loading error.';
  detail.className='small bad';
  reload.style.display='inline-block';
});
reload.onclick=function(){
  finished=false;
  reload.style.display='none';
  spinner.style.display='block';
  text.textContent='Reloading Admin Pro v5.4…';
  text.className='';
  detail.textContent='Starting the control center.';
  detail.className='small';
  loader.classList.remove('hidden');
  clearTimeout(timeout);
  timeout=setTimeout(function(){
    if(finished)return;
    spinner.style.display='none';
    text.textContent='Admin Pro is taking too long to load';
    text.className='bad';
    detail.textContent='The Admin Pro core did not report that it finished loading.';
    detail.className='small bad';
    reload.style.display='inline-block';
  },30000);
  frame.src='./admin-v4.html?admin_v54=1&build=20260827-v5.4&ts='+Date.now();
};
})();
</script>

<!-- BACKDECKCREW_ADMIN_INTEGRATION -->
<script>
(()=>{
 const add=()=>{
  const aside=document.querySelector('aside');
  const main=document.querySelector('main');
  if(!aside||!main)return;
  const nav=document.createElement('button'); nav.className='nav'; nav.dataset.page='backdeckcrew'; nav.textContent='🎬 Back Deck Crew'; aside.appendChild(nav);
  const page=document.createElement('section'); page.id='page-backdeckcrew'; page.className='page'; page.innerHTML='<h1>Back Deck Crew</h1><div class="grid"><div class="card"><h2>Back Deck Crew Settings</h2><div id="backdeck-settings" class="muted">Loading…</div></div><div class="card"><h2>Crew Members</h2><div id="backdeck-members" class="muted">Loading…</div></div></div>'; main.appendChild(page);
  nav.onclick=async()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));nav.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));page.classList.add('active');
   const s=await db.from('backdeckcrew_settings').select('*').eq('site_slug','backdeckcrew').maybeSingle();
   document.getElementById('backdeck-settings').textContent=s.error?s.error.message:JSON.stringify(s.data||{},null,2);
   const m=await db.from('backdeckcrew_members').select('name,role,bio,is_featured,is_active,sort_order').order('sort_order',{ascending:true});
   document.getElementById('backdeck-members').innerHTML=m.error?'<span class="bad">'+String(m.error.message).replace(/[<>]/g,'')+'</span>':(m.data||[]).map(x=>'<div class="notice"><b>'+String(x.name||'').replace(/[<>]/g,'')+'</b> — '+String(x.role||'').replace(/[<>]/g,'')+'</div>').join('')||'<span class="muted">No crew members yet.</span>';
  };
 }; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
</body>
</html>
