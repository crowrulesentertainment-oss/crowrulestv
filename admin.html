<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrowRules Entertainment Admin v2.6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #050608;
    --panel: #0c0f14;
    --panel2: #11151c;
    --panel3: #171c24;
    --border: #252c37;
    --text: #f2f4f7;
    --muted: #8d98a8;
    --accent: #ff1744;
    --accent2: #ff4968;
    --green: #22c55e;
    --yellow: #facc15;
    --blue: #38bdf8;
    --danger: #ef4444;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Montserrat, Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at top left, rgba(255,23,68,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(56,189,248,.08), transparent 30%),
        #050608;
}

.login-box {
    width: min(460px, 100%);
    background: rgba(12,15,20,.95);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 34px;
    box-shadow: var(--shadow);
}

.logo {
    font-family: Orbitron, sans-serif;
    font-weight: 800;
    letter-spacing: 2px;
    font-size: 28px;
}

.logo span {
    color: var(--accent);
}

.login-subtitle {
    color: var(--muted);
    margin: 8px 0 28px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    background: #080b10;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 13px;
    outline: none;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,23,68,.10);
}

.field textarea {
    min-height: 100px;
    resize: vertical;
}

.primary-btn {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 13px 16px;
    background: var(--accent);
    color: white;
    font-weight: 800;
}

.primary-btn:hover {
    background: var(--accent2);
}

.login-error {
    color: #ff7389;
    background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.25);
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 13px;
}

/* =========================================================
   APP
========================================================= */

#app {
    min-height: 100vh;
}

.topbar {
    height: 70px;
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(5,6,8,.94);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.menu-toggle {
    display: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: white;
    border-radius: 8px;
    padding: 8px 11px;
}

.admin-title {
    font-family: Orbitron, sans-serif;
    font-size: 18px;
    font-weight: 800;
}

.admin-title span {
    color: var(--accent);
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.role-badge {
    background: rgba(255,23,68,.12);
    border: 1px solid rgba(255,23,68,.3);
    color: #ff6d88;
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
}

.user-email {
    color: var(--muted);
    font-size: 12px;
}

.logout-btn {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
}

/* =========================================================
   LAYOUT
========================================================= */

.layout {
    display: flex;
    min-height: calc(100vh - 70px);
}

.sidebar {
    width: 265px;
    flex: 0 0 265px;
    border-right: 1px solid var(--border);
    background: #080a0e;
    overflow-y: auto;
    padding: 18px 12px;
}

.sidebar-heading {
    font-family: Orbitron, sans-serif;
    font-size: 10px;
    color: #657080;
    letter-spacing: 1.5px;
    margin: 15px 9px 8px;
    text-transform: uppercase;
}

.table-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: #b7c0cd;
    text-align: left;
    border-radius: 8px;
    padding: 9px 10px;
    margin-bottom: 3px;
    font-size: 12px;
}

.table-btn:hover {
    background: var(--panel2);
    color: white;
}

.table-btn.active {
    background: rgba(255,23,68,.10);
    color: white;
    border-color: rgba(255,23,68,.25);
}

.table-count {
    color: #667080;
    font-size: 10px;
}

.main {
    flex: 1;
    min-width: 0;
    padding: 24px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
}

.page-title {
    font-family: Orbitron, sans-serif;
    font-size: 23px;
    margin: 0 0 5px;
}

.page-description {
    color: var(--muted);
    font-size: 13px;
}

.header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-btn {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 12px;
    font-weight: 700;
}

.action-btn:hover {
    border-color: #424b59;
}

.action-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
}

.action-btn.danger {
    background: rgba(239,68,68,.08);
    color: #ff7c8f;
    border-color: rgba(239,68,68,.3);
}

/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 17px;
}

.stat-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .8px;
}

.stat-value {
    font-family: Orbitron, sans-serif;
    font-size: 23px;
    margin-top: 8px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 220px;
}

.search-box input {
    width: 100%;
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 13px;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent);
}

.page-size {
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: auto;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

.data-table th {
    text-align: left;
    padding: 12px;
    font-size: 10px;
    color: #768192;
    text-transform: uppercase;
    letter-spacing: .7px;
    background: #090c11;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}

.data-table td {
    padding: 11px 12px;
    border-bottom: 1px solid #1b212a;
    font-size: 12px;
    vertical-align: top;
}

.data-table tr:hover td {
    background: rgba(255,255,255,.018);
}

.cell-json {
    max-width: 250px;
    max-height: 70px;
    overflow: auto;
    white-space: pre-wrap;
    color: #aeb8c5;
    font-family: monospace;
    font-size: 10px;
}

.cell-null {
    color: #4f5967;
}

.cell-bool.true {
    color: var(--green);
    font-weight: 800;
}

.cell-bool.false {
    color: #667080;
}

.row-actions {
    display: flex;
    gap: 5px;
    white-space: nowrap;
}

.icon-btn {
    border: 1px solid var(--border);
    background: #10141a;
    color: white;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
}

.icon-btn.edit:hover {
    border-color: var(--blue);
}

.icon-btn.delete:hover {
    border-color: var(--danger);
    color: #ff7d8d;
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 13px;
}

.page-info {
    color: var(--muted);
    font-size: 11px;
}

.page-buttons {
    display: flex;
    gap: 5px;
}

.page-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: white;
    border-radius: 7px;
    padding: 7px 10px;
}

.page-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(7px);
}

.modal {
    width: min(800px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #0b0e13;
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow);
}

.modal-header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #0b0e13;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
}

.modal-title {
    font-family: Orbitron, sans-serif;
    font-size: 16px;
}

.close-btn {
    background: transparent;
    border: 0;
    color: #9aa4b2;
    font-size: 22px;
}

.modal-body {
    padding: 20px;
}

.modal-footer {
    position: sticky;
    bottom: 0;
    background: #0b0e13;
    border-top: 1px solid var(--border);
    padding: 13px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.form-field.full {
    grid-column: 1 / -1;
}

.form-field label {
    display: block;
    color: #8f9aaa;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 6px;
}

.form-field input,
.form-field textarea,
.form-field select {
    width: 100%;
    background: #070a0e;
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    outline: none;
}

.form-field textarea {
    min-height: 100px;
    resize: vertical;
    font-family: inherit;
}

.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus {
    border-color: var(--accent);
}

.form-field small {
    display: block;
    margin-top: 5px;
    color: #586272;
    font-size: 9px;
}

.checkbox-field {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 42px;
}

.checkbox-field input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

#toastContainer {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    min-width: 280px;
    max-width: 400px;
    background: #11161d;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 9px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    font-size: 12px;
}

.toast.success {
    border-left-color: var(--green);
}

.toast.error {
    border-left-color: var(--danger);
}

.toast-title {
    font-weight: 800;
    margin-bottom: 3px;
}

.toast-message {
    color: var(--muted);
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.state-box {
    text-align: center;
    padding: 55px 20px;
    color: var(--muted);
}

.loader {
    width: 28px;
    height: 28px;
    margin: 0 auto 12px;
    border: 3px solid #252c37;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px) {

    .menu-toggle {
        display: block;
    }

    .sidebar {
        position: fixed;
        top: 70px;
        bottom: 0;
        left: 0;
        z-index: 45;
        transform: translateX(-100%);
        transition: transform .2s ease;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        width: 100%;
        padding: 17px;
    }

    .stats {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }

    .user-email {
        display: none;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-field.full {
        grid-column: auto;
    }

    .dashboard-header {
        flex-direction: column;
    }
}

@media(max-width:600px) {

    .topbar {
        padding: 0 12px;
    }

    .admin-title {
        font-size: 14px;
    }

    .role-badge {
        display: none;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .modal-overlay {
        padding: 8px;
    }

    .modal {
        max-height: 96vh;
    }

    .pagination {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN
======================================================= -->

<section id="loginScreen">

    <div class="login-box">

        <div class="logo">
            CROW<span>RULES</span>
        </div>

        <div class="login-subtitle">
            Entertainment Administration v2.6
        </div>

        <div id="loginError" class="login-error hidden"></div>

        <form id="loginForm">

            <div class="field">

                <label>Email</label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label>Password</label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                class="primary-btn"
                type="submit"
            >
                SIGN IN
            </button>

        </form>

    </div>

</section>


<!-- =======================================================
     APPLICATION
======================================================= -->

<section id="app" class="hidden">

    <header class="topbar">

        <div class="topbar-left">

            <button
                id="menuToggle"
                class="menu-toggle"
            >
                ☰
            </button>

            <div class="admin-title">
                CROW<span>RULES</span> ADMIN
            </div>

        </div>

        <div class="topbar-right">

            <div
                id="userEmail"
                class="user-email"
            ></div>

            <div
                id="roleBadge"
                class="role-badge"
            >
                checking...
            </div>

                id="logoutBtn"

                Logout
            </button>

        </div>

    </header>


    <div class="layout">

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-heading">
                Database
            </div>

            <div id="tableList"></div>

        </aside>


        <main class="main">

            <div class="dashboard-header">

                <div>

                    <h1
                        id="pageTitle"
                        class="page-title"
                    >
                        Dashboard
                    </h1>

                    <div
                        id="pageDescription"
                        class="page-description"
                    >
                        Manage CrowRules Entertainment.
                    </div>

                </div>

                <div class="header-actions">

                    <button
                        id="refreshBtn"
                        class="action-btn"
                    >
                        ↻ Refresh
                    </button>

                    <button
                        id="addBtn"

                    >
                        + Add Record
                    </button>

                </div>

            </div>


            <section class="stats">

                <div class="stat-card">

                    <div class="stat-label">
                        Current Table
                    </div>

                    <div

                    >
                        —
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Records

                    <div

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Columns
                    </div>

                    <div
                        id="columnCountStat"

                    >
                        0
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Tables
                    </div>

                    <div
                        id="tableCountStat"

                    >
                        0
                    </div>

                </div>

            </section>


            <div class="toolbar">

                <div class="search-box">

                    <input
                        id="searchInput"

                </div>

                <select

            <div class="table-wrap">

                <div

                <table

                    <thead id="dataHead"></thead>

            <div class="pagination">

                    —
                </div>

                <div class="page-buttons">

                    <button

                        ← Previous
                    </button>

                    <button
                        id="nextBtn"
                        class="page-btn"

                        Next →
                    </button>

                </div>

            </div>

        </main>

    </div>

</section>


<!-- =======================================================
     EDITOR MODAL
======================================================= -->

<div
    id="editorOverlay"
    class="modal-overlay hidden"
>

    <div class="modal">

        <div class="modal-header">

            <div
                id="modalTitle"
                class="modal-title"
            >
                Add Record
            </div>

            <button
                id="closeModal"
                class="close-btn"
            >
                ×
            </button>

        </div>

        <div
            id="modalBody"
            class="modal-body"
        ></div>

        <div class="modal-footer">

            <button
                id="cancelModal"
                class="action-btn"
            >
                Cancel
            </button>

            <button
                id="saveRecord"
                class="action-btn primary"
            >
                Save Record
            </button>

        </div>

    </div>

</div>


<div id="toastContainer"></div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://zauxdqyssratvzmomozf.supabase.co";

/*
 * IMPORTANT:
 * Replace this with your Supabase PUBLIC / ANON key.
 *
 * NEVER put the service_role key here.
 */
const SUPABASE_ANON_KEY =
    "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";


const {
    createClient
} = supabase;


const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   DATABASE TABLE DEFINITIONS
========================================================= */

const TABLES = [

    "profiles",
    "shows",
    "episodes",
    "live_events",
    "schedule_items",
    "site_settings",
    "newsletter_subscribers",

    "content_categories",
    "content_items",

    "memberships",
    "user_memberships",

    "creator_channels",

    "polls",
    "poll_options",
    "poll_votes",

========================================================= */

const state = {

    currentTable: null,

    currentRows: [],

    currentColumns: [],

    currentPage: 1,

    pageSize: 25,

    totalRows: 0,

    editingRecord: null,

    session: null,

    profile: null,

    searchTimer: null

};


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   TOAST
========================================================= */

function toast(
    title,
    message = "",
    type = "success"
) {

    const el =
        document.createElement("div");

    el.className =
        `toast ${type}`;

    el.innerHTML = `
        <div class="toast-title">
            ${escapeHtml(title)}
        </div>
        <div class="toast-message">
            ${escapeHtml(message)}
        </div>
    `;

    $("toastContainer").appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 4500);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

    renderTableList();

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();

    if (session) {

        state.session = session;

        await enterApplication();

    } else {

        showLogin();

    }


    supabaseClient
        .auth
        .onAuthStateChange(
            async (_event, session) => {

                state.session = session;

                if (session) {

                    await enterApplication();

                } else {

                    showLogin();

                }

            }
        );

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin() {

    $("loginScreen")
        .classList
        .remove("hidden");

    $("app")
        .classList
        .add("hidden");

}


async function login(email,password) {

    const {
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });

    if (error)
        throw error;

}


/* =========================================================
   ADMIN ACCESS
========================================================= */

async function enterApplication() {

    $("loginScreen")
        .classList
        .add("hidden");

    $("app")
        .classList
        .remove("hidden");

    $("userEmail").textContent =
        state.session.user.email || "";

    await loadAdminProfile();

}


/* =========================================================
   PROFILE / ROLE CHECK
========================================================= */

async function loadAdminProfile() {

    const userId =
        state.session.user.id;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id",userId)
            .maybeSingle();

    if (error) {

        toast(
            "Profile Error",
            error.message,
            "error"
        );

        return;

    }

    state.profile = data;

    const role =
        data?.role || "unknown";

    $("roleBadge").textContent =
        role;


    const allowedRoles = [
        "admin",
        "super_admin",
        "owner",
        "manager",
        "producer",
        "editor"
    ];

    if (!allowedRoles.includes(role)) {

        toast(
            "Limited Access",
            "Your account does not have an administrative role.",
            "error"
        );

        disableAdminActions();

    }

}


/* =========================================================
   DISABLE ADMIN ACTIONS
========================================================= */

function disableAdminActions() {

    $("addBtn").disabled = true;

}


/* =========================================================
   TABLE LIST
========================================================= */

function renderTableList() {

    const container =
        $("tableList");

    container.innerHTML = "";

    TABLES.forEach(table => {

        const button =
            document.createElement("button");

        button.className =
            "table-btn";

        button.dataset.table =
            table;

        button.innerHTML = `
            <span>${prettyName(table)}</span>
            <span
                class="table-count"
                data-count="${table}"
            >
                —
            </span>
        `;

        button.addEventListener(
            "click",
            () => {

                selectTable(table);

                if (
                    window.innerWidth <= 900
                ) {
                    $("sidebar")
                        .classList
                        .remove("open");
                }

            }
        );

        container.appendChild(button);

    });

    $("tableCountStat").textContent =
        TABLES.length;

}


/* =========================================================
   TABLE NAME
========================================================= */

function prettyName(name) {

    return name
        .replaceAll("_"," ")
        .replace(
            /\b\w/g,
            c => c.toUpperCase()
        );

}


/* =========================================================
   SELECT TABLE
========================================================= */

async function selectTable(table) {

    state.currentTable =
        table;

    state.currentPage =
        1;

    state.editingRecord =
        null;

    document
        .querySelectorAll(".table-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.table === table
            );

        });

    $("pageTitle").textContent =
        prettyName(table);

    $("pageDescription").textContent =
        `Manage records in public.${table}`;

    $("currentTableStat").textContent =
        table;

    state.currentColumns =
        SCHEMA[table]?.columns || [];

    $("columnCountStat").textContent =
        state.currentColumns.length;

    await loadRows();

}


/* =========================================================
   LOAD ROWS
========================================================= */

async function loadRows() {

    if (!state.currentTable)
        return;

    showLoading();

    const table =
        state.currentTable;

    const pageSize =
        Number(
            $("pageSize").value
        );

    state.pageSize =
        pageSize;

    const from =
        (state.currentPage - 1)
        * pageSize;

    const to =
        from + pageSize - 1;

    let query =
        supabaseClient
            .from(table)
            .select(
                "*",
                {
                    count:"exact"
                }
            )
            .range(from,to);

    const search =
        $("searchInput").value.trim();

    /*
     * Generic client-side search is used after loading
     * the current page. This avoids needing dynamic SQL.
     */

    const {
        data,
        error,
        count
    } = await query;

    if (error) {

        showError(error.message);

        return;

    }

    state.currentRows =
        data || [];

    state.totalRows =
        count || 0;

    if (search) {

        const term =
            search.toLowerCase();

        state.currentRows =
            state.currentRows.filter(row => {

                return Object.values(row)
                    .some(value =>
                        String(value ?? "")
                            .toLowerCase()
                            .includes(term)
                    );

            });

    }

    renderData();

}


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

    $("dataTable")
        .classList
        .add("hidden");

    $("tableState")
        .classList
        .remove("hidden");

    $("tableState").innerHTML = `
        <div class="loader"></div>
        Loading ${escapeHtml(
            state.currentTable || "table"
        )}...
    `;

}


function showError(message) {

    $("dataTable")
        .classList
        .add("hidden");

    $("tableState")
        .classList
        .remove("hidden");

    $("tableState").innerHTML = `
        <strong>Database Error</strong>
        <br><br>
        ${escapeHtml(message)}
    `;

}


/* =========================================================
   RENDER DATA
========================================================= */

function renderData() {

    const rows =
        state.currentRows;

    const columns =
        state.currentColumns;

    if (!rows.length) {

        $("dataTable")
            .classList
            .add("hidden");

        $("tableState")
            .classList
            .remove("hidden");

        $("tableState").innerHTML =
            `No records found.`;

    } else {

        $("dataTable")
            .classList
            .remove("hidden");

        $("tableState")
            .classList
            .add("hidden");

    }


    const head =
        $("dataHead");

    head.innerHTML = `
        <tr>
            ${
                columns
                    .map(
                        col =>
                        `<th>${escapeHtml(col[0])}</th>`
                    )
                    .join("")
            }
            <th>Actions</th>
        </tr>
    `;


    const body =
        $("dataBody");

    body.innerHTML = "";

    rows.forEach(row => {

        const tr =
            document.createElement("tr");

        columns.forEach(
            ([name,type]) => {

                const td =
                    document.createElement("td");

                td.innerHTML =
                    formatCell(
                        row[name],
                        type
                    );

                tr.appendChild(td);

            }
        );


        const actionTd =
            document.createElement("td");

        actionTd.innerHTML = `
            <div class="row-actions">

                <button
                    class="icon-btn edit"
                    data-action="edit"
                >
                    Edit
                </button>

                <button
                    class="icon-btn delete"
                    data-action="delete"
                >
                    Delete
                </button>

            </div>
        `;

        actionTd
            .querySelector(
                '[data-action="edit"]'
            )
            .addEventListener(
                "click",
                () => openEditor(row)
            );


        actionTd
            .querySelector(
                '[data-action="delete"]'
            )
            .addEventListener(
                "click",
                () => deleteRecord(row)
            );


        tr.appendChild(actionTd);

        body.appendChild(tr);

    });


    $("recordCountStat").textContent =
        state.totalRows;

    updatePagination();

}


/* =========================================================
   CELL FORMAT
========================================================= */

function formatCell(
    value,
    type
) {

    if (
        value === null ||
        value === undefined
    ) {

        return `
            <span class="cell-null">
                NULL
            </span>
        `;

    }


    if (type === "boolean") {

        return `
            <span
                class="cell-bool ${value ? "true":"false"}"
            >
                ${value ? "TRUE":"FALSE"}
            </span>
        `;

    }


    if (
        type === "jsonb" ||
        typeof value === "object"
    ) {

        return `
            <div class="cell-json">
                ${escapeHtml(
                    JSON.stringify(
                        value,
                        null,
                        2
                    )
                )}
            </div>
        `;

    }


    let text =
        String(value);


    if (text.length > 120) {

        text =
            text.substring(0,120)
            + "…";

    }


    return escapeHtml(text);

}


/* =========================================================
   PAGINATION
========================================================= */

function updatePagination() {

    const total =
        state.totalRows;

    const size =
        state.pageSize;

    const pages =
        Math.max(
            1,
            Math.ceil(total / size)
        );

    $("pageInfo").textContent =
        `Page ${state.currentPage} of ${pages} • ${total} records`;

    $("prevBtn").disabled =
        state.currentPage <= 1;

    $("nextBtn").disabled =
        state.currentPage >= pages;

}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(record = null) {

    if (!state.currentTable)
        return;

    state.editingRecord =
        record;

    const editing =
        !!record;

    $("modalTitle").textContent =
        editing
            ? `Edit ${prettyName(state.currentTable)}`
            : `Add ${prettyName(state.currentTable)}`;


    const columns =
        state.currentColumns;

    const pk =
        SCHEMA[
            state.currentTable
        ]?.pk || [];


    const body =
        $("modalBody");

    body.innerHTML =
        `<div class="form-grid"></div>`;

    const grid =
        body.querySelector(
            ".form-grid"
        );


    columns.forEach(
        ([name,type,nullable,generated]) => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "form-field";


            const value =
                record
                    ? record[name]
                    : null;


            const isPK =
                pk.includes(name);


            const disabled =
                editing &&
                isPK;


            if (type === "boolean") {

                wrapper.innerHTML = `

                    <label>
                        ${escapeHtml(name)}
                    </label>

                    <div class="checkbox-field">

                        <input
                            type="checkbox"
                            data-field="${escapeHtml(name)}"
                            ${value ? "checked":""}
                            ${generated ? "disabled":""}
                        >

                        <span>
                            ${escapeHtml(name)}
                        </span>

                    </div>

                `;

            } else {

                let input;

                if (
                    type === "text" &&
                    (
                        name.includes("description") ||
                        name === "bio" ||
                        name === "notes"
                    )
                ) {

                    input = `
                        <textarea
                            data-field="${escapeHtml(name)}"
                            ${disabled || generated ? "disabled":""}
                        >${escapeHtml(
                            value ?? ""
                        )}</textarea>
                    `;

                } else if (
                    type === "jsonb"
                ) {

                    input = `
                        <textarea
                            data-field="${escapeHtml(name)}"
                            ${disabled || generated ? "disabled":""}
                        >${escapeHtml(
                            value
                                ? JSON.stringify(
                                    value,
                                    null,
                                    2
                                )
                                : "{}"
                        )}</textarea>
                    `;

                } else {

                    let inputType =
                        "text";

                    if (
                        type === "integer" ||
                        type === "bigint"
                    ) {

                        inputType =
                            "number";

                    }

                    if (type === "date") {

                        inputType =
                            "date";

                    }

                    if (
                        type === "timestamptz"
                    ) {

                        inputType =
                            "datetime-local";

                    }


                    let displayValue =
                        value ?? "";


                    if (
                        type === "timestamptz" &&
                        value
                    ) {

                        displayValue =
                            toLocalDateTime(
                                value
                            );

                    }


                    input = `
                        <input
                            type="${inputType}"
                            data-field="${escapeHtml(name)}"
                            value="${escapeHtml(displayValue)}"
                            ${disabled || generated ? "disabled":""}
                        >
                    `;

                }


                wrapper.innerHTML = `

                    <label>
                        ${escapeHtml(name)}
                    </label>

                    ${input}

                    ${
                        generated
                        ? `<small>
                            Automatically generated
                          </small>`
                        : ""
                    }

                `;

            }


            if (
                pk.includes(name)
            ) {

                wrapper.classList.add(
                    "full"
                );

            }


            grid.appendChild(wrapper);

        }
    );


    $("editorOverlay")
        .classList
        .remove("hidden");

}


/* =========================================================
   DATE FORMAT
========================================================= */

function toLocalDateTime(value) {

    try {

        const date =
            new Date(value);

        const pad =
            n => String(n).padStart(2,"0");

        return (
            date.getFullYear()
            + "-"
            + pad(date.getMonth()+1)
            + "-"
            + pad(date.getDate())
            + "T"
            + pad(date.getHours())
            + ":"
            + pad(date.getMinutes())
        );

    } catch {

        return value;

    }

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeEditor() {

    $("editorOverlay")
        .classList
        .add("hidden");

    state.editingRecord =
        null;

}


/* =========================================================
   COLLECT FORM
========================================================= */

function collectFormData() {

    const result = {};

    const columns =
        state.currentColumns;


    columns.forEach(
        ([name,type,nullable,generated]) => {

            if (generated)
                return;


            const element =
                document.querySelector(
                    `[data-field="${CSS.escape(name)}"]`
                );


            if (!element)
                return;


            if (type === "boolean") {

                result[name] =
                    element.checked;

                return;

            }


            let value =
                element.value;


            if (
                value === "" &&
                nullable
            ) {

                result[name] =
                    null;

                return;

            }


            if (
                value === "" &&
                !nullable
            ) {

                result[name] =
                    value;

                return;

            }


            if (
                type === "integer" ||
                type === "bigint"
            ) {

                result[name] =
                    Number(value);

                return;

            }


            if (
                type === "jsonb"
            ) {

                try {

                    result[name] =
                        JSON.parse(value);

                } catch {

                    throw new Error(
                        `${name} contains invalid JSON.`
                    );

                }

                return;

            }


            if (
                type === "timestamptz"
            ) {

                result[name] =
                    new Date(value)
                        .toISOString();

                return;

            }


            result[name] =
                value;

        }
    );


    return result;

}


/* =========================================================
   SAVE
========================================================= */

async function saveRecord() {

    if (!state.currentTable)
        return;


    let payload;

    try {

        payload =
            collectFormData();

    } catch(error) {

        toast(
            "Validation Error",
            error.message,
            "error"
        );

        return;

    }


    const table =
        state.currentTable;


    $("saveRecord").disabled =
        true;

    $("saveRecord").textContent =
        "Saving...";


    try {

        if (state.editingRecord) {

            const pk =
                SCHEMA[table]?.pk || [];

            let query =
                supabaseClient
                    .from(table)
                    .update(payload);


            pk.forEach(
                key => {

                    query =
                        query.eq(
                            key,
                            state.editingRecord[key]
                        );

                }
            );


            const {
                error
            } =
                await query;


            if (error)
                throw error;


            toast(
                "Record Updated",
                `${prettyName(table)} updated successfully.`
            );

        } else {

            const {
                error
            } =
                await supabaseClient
                    .from(table)
                    .insert(payload);


            if (error)
                throw error;


            toast(
                "Record Added",
                `${prettyName(table)} created successfully.`
            );

        }


        closeEditor();

        await loadRows();

    } catch(error) {

        toast(
            "Save Failed",
            error.message,
            "error"
        );

    } finally {

        $("saveRecord").disabled =
            false;

        $("saveRecord").textContent =
            "Save Record";

    }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(row) {

    if (!state.currentTable)
        return;


    const table =
        state.currentTable;


    const pk =
        SCHEMA[table]?.pk || [];


    const label =
        row.title ||
        row.name ||
        row.question ||
        row.email ||
        row.nominee_name ||
        row.key ||
        row.id ||
        "this record";


    const confirmed =
        confirm(
            `Delete ${label} from ${table}?\n\nThis cannot be undone.`
        );


    if (!confirmed)
        return;


    try {

        let query =
            supabaseClient
                .from(table)
                .delete();


        pk.forEach(
            key => {

                query =
                    query.eq(
                        key,
                        row[key]
                    );

            }
        );


        const {
            error
        } =
            await query;


        if (error)
            throw error;


        toast(
            "Record Deleted",
            `${prettyName(table)} record deleted.`
        );


        await loadRows();


    } catch(error) {

        toast(
            "Delete Failed",
            error.message,
            "error"
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

}


/* =========================================================
   EVENTS
========================================================= */

$("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const email =
                $("loginEmail").value.trim();

            const password =
                $("loginPassword").value;


            $("loginError")
                .classList
                .add("hidden");


            try {

                await login(
                    email,
                    password
                );

            } catch(error) {

                $("loginError")
                    .classList
                    .remove("hidden");

                $("loginError")
                    .textContent =
                    error.message;

            }

        }
    );


$("logoutBtn")
    .addEventListener(
        "click",
        logout
    );


$("refreshBtn")
    .addEventListener(
        "click",
        loadRows
    );


$("addBtn")
    .addEventListener(
        "click",
        () => openEditor()
    );


$("closeModal")
    .addEventListener(
        "click",
        closeEditor
    );


$("cancelModal")
    .addEventListener(
        "click",
        closeEditor
    );


$("saveRecord")
    .addEventListener(
        "click",
        saveRecord
    );


$("editorOverlay")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("editorOverlay")
            ) {

                closeEditor();

            }

        }
    );


$("prevBtn")
    .addEventListener(
        "click",
        async () => {

            if (
                state.currentPage > 1
            ) {

                state.currentPage--;

                await loadRows();

            }

        }
    );


$("nextBtn")
    .addEventListener(
        "click",
        async () => {

            const pages =
                Math.ceil(
                    state.totalRows /
                    state.pageSize
                );


            if (
                state.currentPage < pages
            ) {

                state.currentPage++;

                await loadRows();

            }

        }
    );


$("pageSize")
    .addEventListener(
        "change",
        async () => {

            state.currentPage =
                1;

            await loadRows();

        }
    );


$("searchInput")
    .addEventListener(
        "input",
        () => {

            clearTimeout(
                state.searchTimer
            );

            state.searchTimer =
                setTimeout(
                    () => {

                        state.currentPage =
                            1;

                        loadRows();

                    },
                    350
                );

        }
    );


$("menuToggle")
    .addEventListener(
        "click",
        () => {

            $("sidebar")
                .classList
                .toggle("open");

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeEditor();

        }

    }
);


/* =========================================================
   START
========================================================= */

init();

</script>
