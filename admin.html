<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>CrowRules Entertainment - Admin Pro v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050505;--p:#0d0d10;--p2:#15151a;--line:#292930;--text:#f4f4f6;--muted:#92929c;--danger:#ff304f;--ok:#68d27b}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:Montserrat,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0a0a0d;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{font:800 18px Orbitron;margin-bottom:25px}.brand span{color:#999}.navbtn{width:100%;text-align:left;background:none;border:0;color:#aaa;padding:11px;border-radius:9px;font-weight:800;margin:2px 0}.navbtn:hover,.navbtn.active{background:#1b1b20;color:#fff}.main{padding:25px 4vw}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.top h1{font:700 25px Orbitron;margin:0}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:800}.primary{background:#f3f3f3;color:#050505}.ghost{background:#19191e;color:#fff;border:1px solid #33333a}.danger{background:#3a121a;color:#fff;border:1px solid #702433}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:linear-gradient(145deg,#15151a,#0b0b0d);border:1px solid var(--line);border-radius:15px;padding:18px}.stat b{display:block;font:800 28px Orbitron;margin-top:8px}.muted{color:var(--muted);font-size:12px}.panel{background:#0d0d10;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.panel h2{font:700 17px Orbitron;margin:0 0 15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #222229;text-align:left;font-size:12px}.table th{color:#777}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#888;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#15151a;color:#fff;border:1px solid #303039;border-radius:8px;padding:10px;outline:none}.field textarea{min-height:90px;resize:vertical}.span2{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:100;place-items:center;padding:20px}.modal.open{display:grid}.modalbox{width:min(800px,100%);max-height:90vh;overflow:auto;background:#0d0d10;border:1px solid #3a3a42;border-radius:16px}.modalhead{display:flex;justify-content:space-between;padding:13px 17px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.x{background:none;border:0;color:#aaa;font-size:23px}.status{position:fixed;right:18px;bottom:18px;background:#18181d;border:1px solid #38383f;padding:10px 13px;border-radius:10px;font-size:11px;opacity:0;transition:.2s}.status.show{opacity:1}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#0d0d10;border:1px solid #303039;border-radius:18px;padding:25px}.loginbox h1{font:700 25px Orbitron}.loginbox input{width:100%;padding:11px;margin:7px 0;background:#15151a;border:1px solid #303039;border-radius:9px;color:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards,.formgrid{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">CROW<span>RULES</span> ADMIN PRO</div><h1>Admin Login</h1><p class="muted">Use your Supabase member account. Your profile role controls access.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">SIGN IN</button><p id="loginError" class="muted"></p></div></div>

<div id="app" class="app hidden">
<aside class="side"><div class="brand">CROW<span>RULES</span> ADMIN</div>
<button class="navbtn active" data-view="dashboard">▣ Dashboard</button>
<button class="navbtn" data-view="channels">📺 Channels</button>
<button class="navbtn" data-view="shows">🔥 Shows</button>
<button class="navbtn" data-view="episodes">▶ Episodes</button>
<button class="navbtn" data-view="schedule">📡 Schedule</button>
<button class="navbtn" data-view="rooms">💬 Crow Rooms</button>
<button class="navbtn" data-view="members">👤 Members</button>
<div style="height:20px"></div><button class="navbtn" onclick="location.reload()">↻ Refresh</button><button class="navbtn" onclick="logout()">⇥ Sign Out</button>
</aside>
<main class="main"><div class="top"><div><h1 id="viewTitle">Dashboard</h1><div class="muted" id="who"></div></div><a class="btn ghost" href="crowrules-tv.html">Open CrowRules TV ↗</a></div><div id="content"></div></main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><strong id="modalTitle">Edit</strong><button class="x" onclick="closeModal()">×</button></div><div class="modalbody" id="modalBody"></div></div></div>
<div id="status" class="status"></div>

<script>
"use strict";
const SUPABASE_URL="https://zauxdqyssratvzmomozf.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";
if(!window.supabase)throw new Error("Supabase library failed to load.");
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
let user=null,profile=null,currentView="dashboard";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const toast=t=>{const x=document.getElementById("status");x.textContent=t;x.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove("show"),3200)};
const roles=["admin","super_admin","owner","manager","producer","editor"];
async function boot(){
 const {data,error}=await sb.auth.getSession();
 if(error){document.getElementById("loginError").textContent=error.message;return}
 user=data.session?.user||null;
 if(!user)return showLogin();
 await loadProfile();
 if(!profile||!roles.includes(String(profile.role||"").toLowerCase())||profile.is_active===false){document.getElementById("loginError").textContent="This account does not have Admin Pro access.";await sb.auth.signOut();return}
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("who").textContent=`${profile.display_name||user.email} · ${profile.role}`;renderDashboard();
}
function showLogin(){document.getElementById("login").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}
async function loadProfile(){const r=await sb.from("profiles").select("id,display_name,role,email,is_active,avatar_url,bio").eq("id",user.id).maybeSingle();profile=r.data||null;if(r.error)console.error(r.error)}
async function login(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password)return document.getElementById("loginError").textContent="Enter email and password.";const r=await sb.auth.signInWithPassword({email,password});if(r.error)return document.getElementById("loginError").textContent=r.error.message;await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange((_e,s)=>{if(!s){user=null;profile=null;showLogin()}});

document.querySelectorAll(".navbtn[data-view]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;document.getElementById("viewTitle").textContent=b.textContent.replace(/^[^ ]+ /,"");renderView()}));
function renderView(){if(currentView==="dashboard")renderDashboard();else if(currentView==="channels")renderTable("tv_channels","Channels",["id","name","slug","description","stream_url","stream_type","is_active"]);else if(currentView==="shows")renderTable("shows","Shows",["id","title","slug","category","status","is_active"]);else if(currentView==="episodes")renderTable("episodes","Episodes",["id","title","show_id","season_number","episode_number","status","is_published"]);else if(currentView==="schedule")renderTable("schedule_items","Schedule",["id","title","channel_id","starts_at","ends_at","status","is_active"]);else if(currentView==="rooms")renderTable("chat_rooms","Crow Rooms",["id","name","slug","room_type","is_public","is_members_only","is_enabled"]);else if(currentView==="members")renderTable("profiles","Members",["id","display_name","email","role","is_active","created_at"])}
async function count(table){const r=await sb.from(table).select("*",{count:"exact",head:true});return r.count||0}
async function renderDashboard(){document.getElementById("viewTitle").textContent="Dashboard";document.getElementById("content").innerHTML="<div class='cards' id='stats'><div class='stat'>Channels<b>…</b></div><div class='stat'>Shows<b>…</b></div><div class='stat'>Episodes<b>…</b></div><div class='stat'>Rooms<b>…</b></div></div><div class='panel' style='margin-top:16px'><h2>Supabase Connection</h2><div id='health' class='muted'>Testing database connection…</div></div>";const [a,b,c,d]=await Promise.all([count("tv_channels"),count("shows"),count("episodes"),count("chat_rooms")]);document.getElementById("stats").innerHTML=[["Channels",a],["Shows",b],["Episodes",c],["Rooms",d]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join("");document.getElementById("health").textContent="✓ Supabase database connection is working."}
async function renderTable(table,title,cols){
 document.getElementById("viewTitle").textContent=title;
 document.getElementById("content").innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openEditor('${table}')">＋ Add</button><button class="btn ghost" onclick="renderTable('${table}','${title}',${JSON.stringify(cols).replaceAll('"','&quot;')})">↻ Refresh</button></div><div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}<th>ACTIONS</th></tr></thead><tbody id="rows"><tr><td colspan="${cols.length+1}">Loading…</td></tr></tbody></table></div></div>`;
 const r=await sb.from(table).select("*").order("created_at",{ascending:false,nullsFirst:false}).limit(100);
 if(r.error){document.getElementById("rows").innerHTML=`<tr><td colspan="${cols.length+1}">${esc(r.error.message)}</td></tr>`;return}
 document.getElementById("rows").innerHTML=(r.data||[]).map(row=>`<tr>${cols.map(c=>`<td>${esc(typeof row[c]==="object"?JSON.stringify(row[c]):row[c])}</td>`).join("")}<td><button class="btn ghost" onclick='openEditor(${JSON.stringify(table)},${JSON.stringify(row)})'>EDIT</button> <button class="btn danger" onclick='removeRow(${JSON.stringify(table)},${JSON.stringify(row.id)})'>DELETE</button></td></tr>`).join("")||`<tr><td colspan="${cols.length+1}">No records.</td></tr>`;
}
function field(name,value){const text=["description","bio"].includes(name);return `<div class="field ${text?"span2":""}"><label>${name}</label>${text?`<textarea name="${esc(name)}">${esc(value)}</textarea>`:`<input name="${esc(name)}" value="${esc(value)}">`}</div>`}
async function openEditor(table,row={}){
 const configs={tv_channels:["name","slug","description","logo_url","banner_url","stream_url","stream_type","channel_number","sort_order","is_active"],shows:["title","slug","description","thumbnail_url","banner_url","category","status","sort_order","is_active","is_published"],episodes:["show_id","channel_id","title","slug","description","short_description","season_number","episode_number","thumbnail_url","banner_url","youtube_thumbnail_url","youtube_url","video_url","video_type","status","featured","is_featured","is_active","is_published","is_free","sort_order"],schedule_items:["channel_id","show_id","episode_id","title","description","starts_at","ends_at","item_type","status","thumbnail_url","video_url","video_type","youtube_url","sort_order","is_active"],chat_rooms:["name","slug","description","room_type","is_public","is_members_only","is_enabled","slow_mode_seconds"],profiles:["display_name","email","role","is_active","bio"]};
 const fields=configs[table]||[];document.getElementById("modalTitle").textContent=(row.id?"Edit ":"Add ")+table;
 document.getElementById("modalBody").innerHTML=`<form id="editorForm"><div class="formgrid">${fields.map(n=>field(n,row[n]??"")).join("")}</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary">SAVE</button><button type="button" class="btn ghost" onclick="closeModal()">CANCEL</button></div></form>`;
 document.getElementById("modal").classList.add("open");
 document.getElementById("editorForm").onsubmit=async e=>{e.preventDefault();const obj={};new FormData(e.target).forEach((v,k)=>{if(["is_active","is_published","is_public","is_members_only","is_enabled","featured","is_featured","is_free"].includes(k))obj[k]=String(v).toLowerCase()!=="false";else if(["channel_number","sort_order","season_number","episode_number","slow_mode_seconds"].includes(k))obj[k]=v===""?null:Number(v);else obj[k]=v===""?null:v});if(row.id&&table==="profiles")obj.id=row.id;let q=row.id?sb.from(table).update(obj).eq("id",row.id):sb.from(table).insert(obj);const r=await q;if(r.error)return toast(r.error.message);toast("Saved.");closeModal();renderView()};
}
async function removeRow(table,id){if(!id||!confirm("Delete this record?"))return;const r=await sb.from(table).delete().eq("id",id);if(r.error)return toast(r.error.message);toast("Deleted.");renderView()}
function closeModal(){document.getElementById("modal").classList.remove("open")}
boot();
</script>

<!-- BACKDECKCREW_ADMIN_INTEGRATION -->
<script>
(()=>{
 const add=()=>{
  const aside=document.querySelector('aside');
  const main=document.querySelector('main');
  if(!aside||!main)return;
  const nav=document.createElement('button'); nav.className='nav'; nav.dataset.page='backdeckcrew'; nav.textContent='🎬 Back Deck Crew'; aside.appendChild(nav);
  const page=document.createElement('section'); page.id='page-backdeckcrew'; page.className='page'; page.innerHTML='<h1>Back Deck Crew</h1><div class="grid"><div class="card"><h2>Back Deck Crew Settings</h2><div id="backdeck-settings" class="muted">Loading…</div></div><div class="card"><h2>Crew Members</h2><div id="backdeck-members" class="muted">Loading…</div></div></div>'; main.appendChild(page);
  nav.onclick=async()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));nav.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));page.classList.add('active');
   const s=await db.from('backdeckcrew_settings').select('*').eq('site_slug','backdeckcrew').maybeSingle();
   document.getElementById('backdeck-settings').textContent=s.error?s.error.message:JSON.stringify(s.data||{},null,2);
   const m=await db.from('backdeckcrew_members').select('name,role,bio,is_featured,is_active,sort_order').order('sort_order',{ascending:true});
   document.getElementById('backdeck-members').innerHTML=m.error?'<span class="bad">'+String(m.error.message).replace(/[<>]/g,'')+'</span>':(m.data||[]).map(x=>'<div class="notice"><b>'+String(x.name||'').replace(/[<>]/g,'')+'</b> — '+String(x.role||'').replace(/[<>]/g,'')+'</div>').join('')||'<span class="muted">No crew members yet.</span>';
  };
 }; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
</body>
</html>
