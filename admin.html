<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro v6.6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font:14px system-ui,sans-serif;overflow:hidden}
#status{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box;background:#05070b}
.box{max-width:760px;width:100%}.small{color:#8996a8}.bad{color:#ff637b}
.spinner{width:30px;height:30px;margin:0 auto 14px;border:3px solid #273241;border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#05070b}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="status">
  <div class="box">
    <div class="spinner"></div>
    <h2>🐦‍⬛ CrowRules Entertainment</h2>
    <p id="statusText">Loading Admin Pro v6.6…</p>
    <p id="statusDetail" class="small">Starting the CrowRules Supabase control center.</p>
  </div>
</div>

<iframe id="adminFrame" title="CrowRules Admin Pro" src="./admin-v6.3.html?admin_v66=1&amp;cb=20260827"></iframe>

<script>
(function(){
  const status=document.getElementById('status');
  const text=document.getElementById('statusText');
  const detail=document.getElementById('statusDetail');
  const frame=document.getElementById('adminFrame');
  let loaded=false;

  function fail(message){
    if(loaded)return;
    document.querySelector('.spinner')?.remove();
    text.textContent='Admin Pro v6.6 could not start';
    text.className='bad';
    detail.textContent=String(message||'The Admin Pro source did not load.').replace(/[<>]/g,'');
    detail.className='small bad';
    const b=document.createElement('button');
    b.textContent='Reload Admin Pro';
    b.onclick=()=>location.reload();
    document.querySelector('.box').appendChild(b);
  }

  frame.addEventListener('load',function(){
    loaded=true;
    status.classList.add('hidden');
    document.title='CrowRules Entertainment — Admin Pro v6.6';
  });

  frame.addEventListener('error',function(){fail('The Admin Pro source could not be loaded from GitHub Pages.')});

  setTimeout(function(){
    if(!loaded)fail('Timed out loading Admin Pro. Check that admin-v6.3.html is available in the repository.');
  },15000);
})();
</script>

<!-- BACKDECKCREW_ADMIN_INTEGRATION -->
<script>
(()=>{
 const add=()=>{
  const aside=document.querySelector('aside');
  const main=document.querySelector('main');
  if(!aside||!main)return;
  const nav=document.createElement('button'); nav.className='nav'; nav.dataset.page='backdeckcrew'; nav.textContent='🎬 Back Deck Crew'; aside.appendChild(nav);
  const page=document.createElement('section'); page.id='page-backdeckcrew'; page.className='page'; page.innerHTML='<h1>Back Deck Crew</h1><div class="grid"><div class="card"><h2>Back Deck Crew Settings</h2><div id="backdeck-settings" class="muted">Loading…</div></div><div class="card"><h2>Crew Members</h2><div id="backdeck-members" class="muted">Loading…</div></div></div>'; main.appendChild(page);
  nav.onclick=async()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));nav.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));page.classList.add('active');
   const s=await db.from('backdeckcrew_settings').select('*').eq('site_slug','backdeckcrew').maybeSingle();
   document.getElementById('backdeck-settings').textContent=s.error?s.error.message:JSON.stringify(s.data||{},null,2);
   const m=await db.from('backdeckcrew_members').select('name,role,bio,is_featured,is_active,sort_order').order('sort_order',{ascending:true});
   document.getElementById('backdeck-members').innerHTML=m.error?'<span class="bad">'+String(m.error.message).replace(/[<>]/g,'')+'</span>':(m.data||[]).map(x=>'<div class="notice"><b>'+String(x.name||'').replace(/[<>]/g,'')+'</b> — '+String(x.role||'').replace(/[<>]/g,'')+'</div>').join('')||'<span class="muted">No crew members yet.</span>';
  };
 }; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
</body>
</html>
