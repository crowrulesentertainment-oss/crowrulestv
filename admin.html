/* =========================================================
   STATE
========================================================= */

let currentTable =
    "spectrum_awards_seasons";

let records = [];

let editingId = null;


/* =========================================================
   NAVIGATION
========================================================= */

document
.querySelectorAll(".nav-item")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".nav-item")
            .forEach(item =>
                item.classList.remove("active")
            );

            button.classList.add("active");

            currentTable =
                button.dataset.table;

            const config =
                configs[currentTable];

            document.getElementById(
                "pageTitle"
            ).textContent =
                config.title;

            document.getElementById(
                "pageSubtitle"
            ).textContent =
                config.subtitle;

            loadData();

        }
    );

});


/* =========================================================
   LOAD
========================================================= */

async function loadData(){

    const container =
        document.getElementById(
            "tableContainer"
        );

    container.innerHTML =
        `<div class="loading">Loading...</div>`;

    const {
        data,
        error
    } =
        await db
        .from(currentTable)
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                Unable to load this section.<br><br>
                ${escapeHTML(error.message)}
            </div>`;

        showToast(
            "Database error",
            true
        );

        return;
    }

    records = data || [];

    document.getElementById(
        "recordCount"
    ).textContent =
        records.length;

    document.getElementById(
        "connectionStatus"
    ).textContent =
        "●";

    renderTable();
}


/* =========================================================
   RENDER
========================================================= */

function renderTable(){

    const container =
        document.getElementById(
            "tableContainer"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();

    const config =
        configs[currentTable];

    const filtered =
        records.filter(record =>
            JSON.stringify(record)
            .toLowerCase()
            .includes(search)
        );

    if(!filtered.length){

        container.innerHTML =
            `<div class="empty">
                No records found.
            </div>`;

        return;
    }

    let html = "<table><thead><tr>";

    config.columns
    .slice(0,5)
    .forEach(column => {

        html +=
            `<th>${formatLabel(column)}</th>`;

    });

    html += "<th>ACTIONS</th></tr></thead><tbody>";

    filtered.forEach(record => {

        html += "<tr>";

        config.columns
        .slice(0,5)
        .forEach(column => {

            html +=
                `<td>${formatValue(
                    record[column]
                )}</td>`;

        });

        html += `
            <td>
                <div class="actions">

                    <button
                        class="action-btn btn-edit"
                        onclick="editRecord('${record.id}')">
                        EDIT
                    </button>

                    <button
                        class="action-btn btn-danger"
                        onclick="deleteRecord('${record.id}')">
                        DELETE
                    </button>

                </div>
            </td>
        `;

        html += "</tr>";

    });

    html += "</tbody></table>";

    container.innerHTML = html;
}

        configs[currentTable].title;

    buildForm({});

    document.getElementById(
        "recordModal"
    ).classList.add("open");
}


/* =========================================================
   EDIT
========================================================= */

function editRecord(id){

    const record =
        records.find(
            item => item.id === id
        );

    if(!record) return;

    editingId = id;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit " +
        configs[currentTable].title;

    buildForm(record);

    document.getElementById(
        "recordModal"
    ).classList.add("open");
}


/* =========================================================
   FORM
========================================================= */

function buildForm(record){

    const container =
        document.getElementById(
            "formFields"
        );

    container.innerHTML = "";

    configs[currentTable]
    .columns
    .forEach(column => {

        const value =
            record[column] ?? "";

        const field =
            document.createElement(
                "div"
            );

        field.className =
            "field";

        if(
            column === "description" ||
            column === "bio" ||
            column === "notes" ||
            column === "social_links"
        ){
            field.classList.add("full");
        }

        const label =
            document.createElement(
                "label"
            );

        label.textContent =
            formatLabel(column);

        field.appendChild(label);

        let input;

        if(
            column === "description" ||
            column === "bio" ||
            column === "notes"
        ){

            input =
                document.createElement(
                    "textarea"
                );

            input.value = value;

        }
        else if(
            column === "published" ||
            column === "active" ||
            column === "featured" ||
            column === "winner" ||
            column === "voting_enabled" ||
            column === "rights_confirmed" ||
            column === "is_featured" ||
            column === "is_active"
        ){

            input =
                document.createElement(
                    "select"
                );

            input.innerHTML = `
                <option value="true"
                    ${value === true ? "selected":""}>
                    TRUE
                </option>

                <option value="false"
                    ${value === false ? "selected":""}>
                    FALSE
                </option>
            `;

        }
        else if(
            column.includes("_at") ||
            column === "release_date"
        ){

            input =
                document.createElement(
                    "input"
                );

            input.type =
                column === "release_date"
                ? "date"
                : "datetime-local";

            if(value){

                input.value =
                    column === "release_date"
                    ? value
                    : new Date(value)
                    .toISOString()
                    .slice(0,16);

            }

        }
        else if(
            column === "price_cents" ||
            column === "year" ||
            column === "sort_order" ||
            column === "episode_number" ||
            column === "season_number" ||
            column === "season" ||
            column === "track_number" ||
            column === "duration_seconds"
        ){

            input =
                document.createElement(
                    "input"
                );

            input.type =
                "number";

            input.value =
                value;

        }
        else{

            input =
                document.createElement(
                    "input"
                );

            input.type =
                "text";

            if(
                column === "social_links"
            ){

                input.value =
                    typeof value === "object"
                    ? JSON.stringify(value)
                    : value;

            }
            else{

                input.value =
                    value;

            }

        }

        input.name =
            column;

        field.appendChild(input);

        container.appendChild(field);

    });
}


/* =========================================================
   SAVE
========================================================= */

document
.getElementById("recordForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const formData =
            new FormData(event.target);

        const payload = {};

        configs[currentTable]
        .columns
        .forEach(column => {

            let value =
                formData.get(column);

            if(value === ""){
                value = null;
            }

            if([
                "published",
                "active",
                "featured",
                "winner",
                "voting_enabled",
                "rights_confirmed",
                "is_featured",
                "is_active"
            ].includes(column)){

                value =
                    value === "true";

            }

            if([
                "year",
                "sort_order",
                "episode_number",
                "season_number",
                "season",
                "track_number",
                "duration_seconds",
                "price_cents"
            ].includes(column)){

                value =
                    value === null
                    ? null
                    : Number(value);

            }

            if(column === "social_links"){

                try{
                    value =
                        value
                        ? JSON.parse(value)
                        : {};
                }
                catch{
                    showToast(
                        "Invalid social links JSON",
                        true
                    );
                    return;
                }

            }

            if(
                column.includes("_at") &&
                value
            ){

                value =
                    new Date(value)
                    .toISOString();

            }

            payload[column] =
                value;

        });

        let result;

        if(editingId){

            result =
                await db
                .from(currentTable)
                .update(payload)
                .eq("id",editingId);

        }
        else{

            result =
                await db
                .from(currentTable)
                .insert(payload);

        }

        if(result.error){

            console.error(
                result.error
            );

            showToast(
                result.error.message,
                true
            );

            return;
        }

        closeModal();

        showToast(
            editingId
            ? "Record updated."
            : "Record added."
        );

        await loadData();

    }
);


/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(id){

    const record =
        records.find(
            item => item.id === id
        );

    if(!record) return;

    const name =
        record.name ||
        record.title ||
        record.nominee_name ||
        record.artist_name ||
        record.question ||
        "this record";

    if(
        !confirm(
            `Delete ${name}?\n\nThis cannot be undone.`
        )
    ){
        return;
    }

    const {
        error
    } =
        await db
        .from(currentTable)
        .delete()
        .eq("id",id);

    if(error){

        console.error(error);

        showToast(
            "Delete failed: " +
            error.message,
            true
        );

        return;
    }

    showToast(
        "Record deleted."
    );

    await loadData();
}

/* =========================================================
   HELPERS
========================================================= */

function formatLabel(value){

    return value
        .replaceAll("_"," ")
        .replace(/\b\w/g,
            char => char.toUpperCase()
        );
}


function formatValue(value){

    if(value === null ||
       value === undefined){

        return "—";
    }

    if(typeof value === "boolean"){

        return value
            ? `<span class="badge badge-green">YES</span>`
            : `<span class="badge badge-red">NO</span>`;
    }

    if(typeof value === "object"){

        return escapeHTML(
            JSON.stringify(value)
        );
    }

    const stringValue =
        String(value);

    if(
        stringValue === "published" ||
        stringValue === "active" ||
        stringValue === "accepted"
    ){

        return `
            <span class="badge badge-green">
                ${escapeHTML(stringValue)}
            </span>
        `;
    }

    return escapeHTML(
        stringValue.length > 90
        ? stringValue.slice(0,90)+"..."
        : stringValue
    );
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    error=false
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.className =
        "toast show " +
        (error
            ? "error"
            : "success"
        );

    setTimeout(
        () => {
            toast.classList.remove(
                "show"
            );
        },
        3500
    );
}
