<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrowRules Admin v1.1</title>

<meta name="theme-color" content="#050509">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   CROWRULES ADMIN v1.1
   SINGLE-FILE ADMIN APPLICATION
========================================================= */

:root {
    --bg: #050509;
    --bg2: #090912;
    --panel: #0d0d18;
    --panel2: #121221;
    --border: #25253a;
    --text: #f4f4f8;
    --muted: #9292a8;
    --accent: #8b5cf6;
    --accent2: #a855f7;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #38bdf8;
    --shadow: 0 15px 50px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(
            circle at top right,
            rgba(139,92,246,.10),
            transparent 35%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.login-card {
    width: min(440px, 100%);
    background: rgba(13,13,24,.95);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 35px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(15px);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-mark {
    width: 70px;
    height: 70px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            #181828
        );
    box-shadow:
        0 0 35px rgba(139,92,246,.3);
    font-size: 34px;
}

.logo h1 {
    margin: 0;
    font-size: 27px;
    letter-spacing: 2px;
}

.logo p {
    color: var(--muted);
    margin: 8px 0 0;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #c8c8d8;
    font-size: 13px;
    font-weight: 700;
}

input,
textarea,
select {
    width: 100%;
    background: #080810;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 13px;
    outline: none;
    transition: .2s ease;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,92,246,.12);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.primary-btn {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 13px 16px;
    color: white;
    font-weight: 800;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    transition: .2s ease;
}

.primary-btn:hover {
    transform: translateY(-1px);
    box-shadow:
        0 8px 25px rgba(139,92,246,.25);
}

.status-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
}

.status-box.error {
    display: block;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
}

.status-box.success {
    display: block;
    background: rgba(34,197,94,.1);
    border: 1px solid rgba(34,197,94,.3);
    color: #86efac;
}

/* =========================================================
   APP
========================================================= */

#app {
    min-height: 100vh;
}

.layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    background: rgba(7,7,14,.97);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    overflow-y: auto;
}

.sidebar-brand {
    padding: 10px 12px 25px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 15px;
}

.sidebar-brand strong {
    display: block;
    font-size: 17px;
    letter-spacing: 1px;
}

.sidebar-brand span {
    display: block;
    color: var(--muted);
    margin-top: 4px;
    font-size: 11px;
}

.nav-section {
    margin-top: 20px;
}

.nav-section-title {
    padding: 0 12px 7px;
    color: #62627a;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.nav-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: #a8a8ba;
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 3px;
    text-align: left;
}

.nav-btn:hover {
    background: #11111d;
    color: white;
}

.nav-btn.active {
    background:
        linear-gradient(
            90deg,
            rgba(139,92,246,.18),
            transparent
        );
    color: white;
    border-color: rgba(139,92,246,.25);
}

.sidebar-bottom {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
}

.logout-btn {
    width: 100%;
    background: rgba(239,68,68,.08);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,.2);
    border-radius: 9px;
    padding: 10px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-width: 0;
}

.topbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid var(--border);
    background: rgba(5,5,9,.75);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 20;
}

.topbar-left h2 {
    margin: 0;
    font-size: 19px;
}

.topbar-left p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 11px;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-chip {
    border: 1px solid var(--border);
    background: #0c0c15;
    padding: 8px 11px;
    border-radius: 9px;
    font-size: 12px;
}

.content {
    padding: 25px;
    max-width: 1600px;
    margin: auto;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: 1px solid var(--border);
    background: #11111b;
    color: #ddd;
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 12px;
    font-weight: 700;
}

.btn:hover {
    border-color: #3c3c59;
    background: #171724;
}

.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn-success {
    color: #86efac;
    border-color: rgba(34,197,94,.3);
}

.btn-danger {
    color: #fca5a5;
    border-color: rgba(239,68,68,.3);
}

.btn-warning {
    color: #fcd34d;
    border-color: rgba(245,158,11,.3);
}

/* =========================================================
   DASHBOARD
========================================================= */

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 15px;
}

.page-title h1 {
    margin: 0;
    font-size: 25px;
}

.page-title p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0,1fr));
    gap: 15px;
    margin-bottom: 22px;
}

.stat-card {
    background:
        linear-gradient(
            145deg,
            rgba(18,18,33,.98),
            rgba(10,10,18,.98)
        );
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
}

.stat-value {
    margin-top: 8px;
    font-size: 30px;
    font-weight: 900;
}

.stat-icon {
    float: right;
    opacity: .55;
    font-size: 20px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
}

.panel {
    background: rgba(13,13,24,.96);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
}

.panel-header {
    padding: 15px 17px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-header strong {
    font-size: 14px;
}

.panel-body {
    padding: 17px;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px 13px;
    border-bottom: 1px solid #1c1c2b;
    text-align: left;
    white-space: nowrap;
}

th {
    color: #77778f;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .8px;
}

td {
    color: #d7d7e2;
    font-size: 12px;
}

tr:hover td {
    background: rgba(255,255,255,.015);
}

.actions {
    display: flex;
    gap: 5px;
}

/* =========================================================
   BADGES
========================================================= */

.badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 800;
}

.badge-success {
    background: rgba(34,197,94,.1);
    color: #86efac;
}

.badge-danger {
    background: rgba(239,68,68,.1);
    color: #fca5a5;
}

.badge-warning {
    background: rgba(245,158,11,.1);
    color: #fcd34d;
}

.badge-info {
    background: rgba(56,189,248,.1);
    color: #7dd3fc;
}

.badge-purple {
    background: rgba(139,92,246,.1);
    color: #c4b5fd;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.search-box {
    max-width: 350px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 45px 20px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(7px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: min(700px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #0d0d18;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
}

.modal-header {
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    margin: 0;
}

.modal-close {
    border: 0;
    background: transparent;
    color: #88889d;
    font-size: 22px;
}

.modal-body {
    padding: 20px;
}

.modal-footer {
    padding: 15px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

/* =========================================================
   FORM GRID
========================================================= */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.full {
    grid-column: 1 / -1;
}

/* =========================================================
   TOAST
========================================================= */

#toastContainer {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    min-width: 260px;
    max-width: 380px;
    background: #11111c;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    font-size: 12px;
}

.toast.success {
    border-color: rgba(34,197,94,.35);
}

.toast.error {
    border-color: rgba(239,68,68,.35);
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    padding: 45px;
    text-align: center;
    color: var(--muted);
}

.spinner {
    width: 25px;
    height: 25px;
    margin: 0 auto 10px;
    border: 2px solid #29293d;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu {
    display: none;
}

@media (max-width: 1000px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: fixed;
        left: -270px;
        width: 250px;
        z-index: 80;
        transition: .25s ease;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
        border: 1px solid var(--border);
        background: #11111b;
        color: white;
        border-radius: 8px;
        padding: 8px 10px;
    }

    .stats-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 650px) {

    .content {
        padding: 15px;
    }

    .topbar {
        padding: 0 15px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .user-chip {
        display: none;
    }

    .page-title {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<script>
/* =========================================================
   CROWRULES ADMIN v1.1
   SUPABASE CONFIGURATION
========================================================= */

/*
   IMPORTANT:

   Put your Supabase PROJECT URL here.

   Example:
   https://xxxxxxxxxxxxxxxx.supabase.co

   Then put your PUBLIC/PUBLISHABLE key here.

   DO NOT use:
   - service_role
   - secret key
   - database password

   Browser applications must use the public/publishable key.
*/

const SUPABASE_CONFIG = {

    url:
        "https://zauxdqyssratvzmomozf.supabase.co",

    publishableKey:
        "sb_publishable_-Z6wecSOxwOk6IBut2zLn_8DfRxnE9"

};


/* =========================================================
   SUPABASE INITIALIZATION
========================================================= */

let supabaseClient = null;

function initializeSupabase() {

    if (
        !SUPABASE_CONFIG.url ||
        !SUPABASE_CONFIG.publishableKey ||
        SUPABASE_CONFIG.publishableKey.includes(
            "PASTE_YOUR"
        )
    ) {

        showLoginError(
            "Supabase is not configured. Add your Project URL and Publishable Key in SUPABASE_CONFIG."
        );

        return false;
    }

    try {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_CONFIG.url,
                SUPABASE_CONFIG.publishableKey,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );

        return true;

    } catch (error) {

        console.error(error);

        showLoginError(
            "Could not initialize Supabase: " +
            error.message
        );

        return false;
    }
}


/* =========================================================
   STATE
========================================================= */

const state = {

    currentId: null,

    currentRows: [],

    currentColumns: [],

    currentUser: null,

    currentProfile: null

/* =========================================================

    },

const $ = selector =>

const $$ = selector =>
    document.querySelectorAll(selector);


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(message) {

    const box =
        $("#loginStatus");

    if (!box) return;

    box.textContent = message;

    box.className =
        "status-box error";
}


/* =========================================================
   TOAST
========================================================= */

function toast(
    message,
    type = "success"
) {

    const container =
        $("#toastContainer");

    const item =
        document.createElement("div");

    item.className =
        `toast ${type}`;

    item.textContent =
        message;

    container.appendChild(item);

    setTimeout(
        () => item.remove(),
        4000
    );
}


/* =========================================================
   AUTH
========================================================= */

async function login(
    email,
    password
) {

    if (!supabaseClient) {

        toast(
            "Supabase is not initialized.",
            "error"
        );

        return;
    }

    const button =
        $("#loginButton");

    button.disabled = true;

    button.textContent =
        "SIGNING IN...";

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if (error)
            throw error;

        state.currentUser =
            data.user;

        await verifyAdmin();

    } catch (error) {

        console.error(error);

        showLoginError(
            formatSupabaseError(error)
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "SIGN IN";
    }
}


/* =========================================================
   ADMIN VERIFICATION
========================================================= */

async function verifyAdmin() {

    if (!state.currentUser) {

        showLogin();

        return false;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq(
                    "id",
                    state.currentUser.id
                )
                .maybeSingle();

        if (error)
            throw error;

        state.currentProfile =
            data;

        /*
           If your profiles table uses a role
           field, enforce administrator access.

           Accepted administrator values:
           admin
           administrator
           owner
           super_admin
        */

        if (
            data &&
            data.role &&
            ![
                "admin",
                "administrator",
                "owner",
                "super_admin"
            ].includes(
                String(data.role).toLowerCase()
            )
        ) {

            await supabaseClient.auth.signOut();

            showLoginError(
                "Your account is authenticated, but it does not have administrator access."
            );

            return false;
        }

        showApp();

        return true;

    } catch (error) {

        console.error(error);

        /*
           If the profiles table is protected by RLS,
           don't incorrectly call the API key invalid.
        */

        toast(
            "Authentication succeeded, but admin profile verification failed: " +
            formatSupabaseError(error),
            "error"
        );

        return false;
    }
}


/* =========================================================
   SESSION CHECK
========================================================= */

async function checkSession() {

    if (!supabaseClient)
        return;

    try {

        const {
            data
        } =
            await supabaseClient.auth.getSession();

        if (
            data &&
            data.session &&
            data.session.user
        ) {

            state.currentUser =
                data.session.user;

            await verifyAdmin();

        } else {

            showLogin();
        }

    } catch (error) {

        console.error(error);

        showLogin();
    }
}

/* =========================================================

========================================================= */

async function loadTable(
    table
) {

    const config =
        TABLES[table];

    const container =
        $("#tableContainer");

    if (!container)
        return;

    container.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Loading...

        </div>
    `;

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(table)
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(500);

        if (error)
            throw error;

        state.currentRows =
            data || [];

        state.currentColumns =
            getDisplayColumns(
                table,
                data || []
            );

        renderTableRows();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                <strong>
                    Unable to load ${escapeHtml(
                        config.label
                    )}
                </strong>

                <p>
                    ${escapeHtml(
                        formatSupabaseError(error)
                    )}
                </p>

            </div>
        `;

        toast(
            formatSupabaseError(error),
            "error"
        );
    }
}


/* =========================================================
   DISPLAY COLUMNS
========================================================= */

function getDisplayColumns(
    table,
    rows
) {

    const config =
        TABLES[table];

    const available =
        rows.length
            ? Object.keys(rows[0])
            : config.columns;

    const wanted =
        config.columns.filter(
            col =>
                available.includes(col)
        );

    return wanted.slice(0, 7);
}

function filterCurrentTable() {

    const search =
        ($("#tableSearch")?.value || "")
            .trim()
            .toLowerCase();

    if (!search) {

        renderTableRows();

        return;
    }

    const filtered =
        state.currentRows.filter(
            row =>
                Object.values(row)
                    .some(value =>
                        String(
                            value ?? ""
                        )
                        .toLowerCase()
                        .includes(search)
                    )
        );

    renderTableRows(
        filtered
    );
}

/* =========================================================
   FORM GENERATION
========================================================= */

function generateForm(
    table,
    row
) {

    const config =
        TABLES[table];

    const keys =
        getFormKeys(
            table,
            row
        );

    return `

        <div class="form-grid">

            ${keys.map(
                key =>
                    formField(
                        key,
                        row[key]
                    )
            ).join("")}

        </div>

        <p style="
            color:#66667b;
            font-size:11px;
            margin-top:18px;
        ">
            Fields are generated from the existing
            database record. ID and timestamps are
            handled automatically where possible.
        </p>
    `;
}


function getFormKeys(
    table,
    row
) {

    const config =
        TABLES[table];

    const keys =
        Object.keys(row || {});

    let columns =
        keys.length
            ? keys
            : config.columns;

    return columns.filter(
        key =>
            key !== "id" &&
            key !== "created_at" &&
            key !== "updated_at"
    );
}


/* =========================================================
   FORM FIELD
========================================================= */

function formField(
    key,
    value
) {

    const fullFields = [
        "description",
        "content",
        "body",
        "value"
    ];

    const type =
        detectInputType(
            key,
            value
        );

    const label =
        formatColumnName(
            key
        );

    const safeValue =
        value == null
            ? ""
            : value;

    if (
        fullFields.includes(
            key.toLowerCase()
        )
    ) {

        return `

            <div class="form-group full">

                <label>
                    ${label}
                </label>

                <textarea
                    data-field="${escapeAttribute(
                        key
                    )}"
                >${escapeHtml(
                    safeValue
                )}</textarea>

            </div>
        `;
    }

    return `

        <div class="form-group">

            <label>
                ${label}
            </label>

            <input
                type="${type}"
                data-field="${escapeAttribute(
                    key
                )}"
                value="${escapeAttribute(
                    safeValue
                )}"
            >

        </div>
    `;
}


function detectInputType(
    key,
    value
) {

    const lower =
        key.toLowerCase();

    if (
        lower.includes("email")
    )
        return "email";

    if (
        lower.includes("url") ||
        lower.includes("link")
    )
        return "url";

    if (
        lower.includes("price") ||
        lower.includes("amount") ||
        lower.includes("number")
    )
        return "number";

    if (
        lower.includes("date") ||
        lower.includes("time") ||
        lower.includes("scheduled")
    )
        return "datetime-local";

    if (
        typeof value === "boolean"
    )
        return "checkbox";

    return "text";
}


/* =========================================================
   SAVE MODAL
========================================================= */

async function saveModal() {

    const table =
        state.currentTable;

    const fields =
        $("#modalBody")
            .querySelectorAll(
                "[data-field]"
            );

    const payload = {};

    fields.forEach(
        field => {

            const key =
                field.dataset.field;

            if (
                field.type ===
                "checkbox"
            ) {

                payload[key] =
                    field.checked;

            } else {

                let value =
                    field.value;

                if (
                    field.type ===
                    "number"
                ) {

                    value =
                        value === ""
                            ? null
                            : Number(value);
                }

                if (
                    field.type ===
                    "datetime-local"
                ) {

                    value =
                        value
                            ? new Date(
                                value
                              ).toISOString()
                            : null;
                }

                payload[key] =
                    value === ""
                        ? null
                        : value;
            }
        }
    );

    const saveButton =
        $("#modalSave");

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Saving...";

    try {

        let result;

        if (state.currentId) {

            result =
                await supabaseClient
                    .from(table)
                    .update(payload)
                    .eq(
                        "id",
                        state.currentId
                    );

        } else {

            result =
                await supabaseClient
                    .from(table)
                    .insert(
                        payload
                    );
        }

        if (result.error)
            throw result.error;

        closeModal();

        toast(
            state.currentId
                ? "Record updated successfully."
                : "Record created successfully."
        );

        await loadTable(
            table
        );

    } catch (error) {

        console.error(error);

        toast(
            formatSupabaseError(error),
            "error"
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Save";
    }
}


/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(
    table,
    id
) {

    if (
        !confirm(
            "Delete this record? This action cannot be undone."
        )
    )
        return;

    try {

        const {
            error
        } =
            await supabaseClient
                .from(table)
                .delete()
                .eq(
                    "id",
                    id
                );

        if (error)
            throw error;

        toast(
            "Record deleted successfully."
        );

        await loadTable(
            table
        );

    } catch (error) {

        console.error(error);

        toast(
            formatSupabaseError(error),
            "error"
        );
    }
}


/* =========================================================
   MODAL CONTROLS
========================================================= */

function closeModal() {

    $("#modalOverlay")
        .classList.add(
            "hidden"
        );

    $("#modalBody")
        .innerHTML = "";

    state.currentId =
        null;
}


/* =========================================================
   FORMAT HELPERS
========================================================= */

function formatColumnName(
    column
) {

    return String(column)
        .replace(
            /_/g,
            " "
        )
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );
}


function formatCell(
    value,
    column
) {

    if (
        value === null ||
        value === undefined
    )
        return "—";

    if (
        column === "created_at" ||
        column === "updated_at" ||
        column.includes("time") ||
        column.includes("date")
    ) {

        return formatDate(
            value
        );
    }

    if (
        column === "status"
    ) {

        return statusBadge(
            value
        );
    }

    if (
        column.includes("url") ||
        column.includes("link")
    ) {

        const url =
            String(value);

        if (
            /^https?:\/\//i.test(
                url
            )
        ) {

            return `
                <a
                    href="${escapeAttribute(
                        url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="color:#a78bfa"
                >
                    Open
                </a>
            `;
        }
    }

    const text =
        String(value);

    return escapeHtml(
        text.length > 90
            ? text.slice(0,90) + "..."
            : text
    );
}


function statusBadge(
    status
) {

    if (
        status === null ||
        status === undefined
    )
        return "—";

    const value =
        String(status);

    const lower =
        value.toLowerCase();

    let cls =
        "badge-purple";

    if (
        [
            "active",
            "published",
            "live",
            "enabled",
            "approved"
        ].includes(lower)
    )
        cls = "badge-success";

    else if (
        [
            "inactive",
            "disabled",
            "draft",
            "cancelled",
            "deleted"
        ].includes(lower)
    )
        cls = "badge-danger";

    else if (
        [
            "scheduled",
            "pending",
            "upcoming"
        ].includes(lower)
    )
        cls = "badge-warning";

    else if (
        [
            "processing",
            "starting"
        ].includes(lower)
    )
        cls = "badge-info";

    return `
        <span class="badge ${cls}">
            ${escapeHtml(value)}
        </span>
    `;
}


function formatDate(
    value
) {

    if (!value)
        return "—";

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    )
        return escapeHtml(
            String(value)
        );

    return date.toLocaleString(
        undefined,
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   ERROR HANDLING
========================================================= */

function formatSupabaseError(
    error
) {

    if (!error)
        return "Unknown error.";

    const message =
        error.message ||
        error.error_description ||
        String(error);

    const lower =
        message.toLowerCase();

    if (
        lower.includes(
            "invalid api key"
        )
    ) {

        return `
            Invalid Supabase API key.
            Verify that SUPABASE_CONFIG.publishableKey
            contains the current Supabase Publishable key
            and not a revoked/old key.
        `;
    }

    if (
        lower.includes(
            "jwt"
        ) &&
        lower.includes(
            "expired"
        )
    ) {

        return `
            Authentication token expired.
            Sign out and sign in again.
        `;
    }

    if (
        lower.includes(
            "permission denied"
        ) ||
        lower.includes(
            "row-level security"
        )
    ) {

        return `
            Supabase Row Level Security blocked this operation.
            Check the table's RLS policies for the authenticated
            admin user.
        `;
    }

    if (
        lower.includes(
            "relation"
        ) &&
        lower.includes(
            "does not exist"
        )
    ) {

        return `
            The requested database table does not exist
            or is not exposed through the Supabase API.
        `;
    }

    if (
        lower.includes(
            "column"
        ) &&
        lower.includes(
            "does not exist"
        )
    ) {

        return `
            A requested database column does not exist.
            The Admin UI may need to be synchronized with
            your current schema.
        `;
    }

    return message;
}


/* =========================================================
   SECURITY / HTML ESCAPING
========================================================= */

function escapeHtml(
    value
) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );
}

/* =========================================================
   AUTH STATE LISTENER
========================================================= */

function setupAuthListener() {

    if (!supabaseClient)
        return;

    supabaseClient.auth
        .onAuthStateChange(
            async (
                event,
                session
            ) => {

                if (
                    event ===
                    "SIGNED_OUT"
                ) {

                    showLogin();

                    return;
                }

                if (
                    session &&
                    session.user
                ) {

                    state.currentUser =
                        session.user;

                    if (
                        event ===
                        "SIGNED_IN"
                    ) {

                        await verifyAdmin();

                    }

                }

            }
        );
}


/* =========================================================
   START APPLICATION
========================================================= */

async function boot() {

    const initialized =
        initializeSupabase();

    if (!initialized)
        return;

    setupAuthListener();

    await checkSession();
}


boot();
