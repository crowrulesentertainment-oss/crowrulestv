<script>
(function(){
'use strict';

  ['tv_channels','TV Channels'],
  ['tv_channel_playlist','Channel Playlists'],
  ['schedule_items','Schedule Items'],
  ['live_events','Live Events'],
  ['shows','Shows'],
  ['episodes','Episodes'],

async function countRows(table,filter){
  let query=db.from(table).select('*',{count:'exact',head:true});
  if(filter)for(const key of Object.keys(filter))query=query.eq(key,filter[key]);
  const result=await query;
  if(result.error)throw result.error;
  return Number(result.count||0);
}

function switchPage(page,nav){
  document.querySelectorAll('.nav').forEach(item=>item.classList.remove('active'));
  document.querySelectorAll('.page').forEach(item=>item.classList.remove('active'));
  if(nav)nav.classList.add('active');
  if(page)page.classList.add('active');
}

async function renderStats(target){
  if(!target)return;
  target.innerHTML='<div class="notice">Loading live Supabase statistics…</div>';
  try{
    const values=await Promise.all(tables.map(async item=>[item[0],item[1],await countRows(item[0])]));
    const active=await countRows('schedule_items',{is_active:true});
    const published=await countRows('schedule_items',{status:'published'});
    const scheduled=await countRows('schedule_items',{status:'scheduled'});
    const live=await countRows('schedule_items',{item_type:'live'});
    target.innerHTML=
      '<div class="grid">'+values.map(item=>
        '<div class="card"><div class="muted">'+esc(item[1])+'</div><b style="font-size:28px">'+item[2]+'</b><div class="muted">database records</div></div>'
      ).join('')+'</div>'+ 
      '<div class="grid" style="margin-top:14px">'+
        [['Active Schedule',active],['Published',published],['Scheduled',scheduled],['Live Programs',live]].map(item=>
          '<div class="card"><div class="muted">'+esc(item[0])+'</div><b style="font-size:28px">'+item[1]+'</b></div>'
        ).join('')+
      '</div>';
  }catch(error){
    target.innerHTML='<div class="notice"><span class="bad">Statistics could not load: '+esc(error.message||error)+'</span></div>';
  }
}

function addStatistics(){
  if(document.getElementById('page-statistics'))return;
  const aside=document.querySelector('aside');
  const main=document.querySelector('main');
  const dashboard=document.getElementById('page-dashboard');
  if(!aside||!main)return false;

  const nav=document.createElement('button');
  nav.type='button';
  nav.className='nav';
  nav.dataset.page='statistics';
  nav.textContent='📊 Statistics';

  const existingHealth=Array.from(aside.querySelectorAll('.nav')).find(x=>x.dataset.page==='health');
  if(existingHealth)aside.insertBefore(nav,existingHealth);else aside.appendChild(nav);

  const page=document.createElement('section');
  page.id='page-statistics';
  page.className='page';
  page.innerHTML=`
    <div class="hero">
      <div>
        <h1>📊 Statistics</h1>
        <p class="muted">Live counts from the CrowRules Supabase database.</p>
      </div>
      <button class="primary" id="crStatsRefresh">↻ Refresh</button>
    </div>
    <div id="crStatsBody"></div>`;
  main.appendChild(page);

  nav.onclick=()=>{
    switchPage(page,nav);
    renderStats(document.getElementById('crStatsBody'));
  };
  document.getElementById('crStatsRefresh').onclick=()=>renderStats(document.getElementById('crStatsBody'));

  if(dashboard&&!document.getElementById('crDashboardStats')){
    const card=document.createElement('div');
    card.id='crDashboardStats';
    card.className='card';
    card.style.marginTop='14px';
    card.innerHTML='<div class="hero"><div><h2>📊 Database Statistics</h2><p class="muted">Quick database totals.</p></div><button type="button" id="crDashStatsRefresh">Refresh</button></div><div id="crDashStatsBody"></div>';
    dashboard.appendChild(card);
    document.getElementById('crDashStatsRefresh').onclick=()=>renderStats(document.getElementById('crDashStatsBody'));
    renderStats(document.getElementById('crDashStatsBody'));
  }
  return true;
}

function ensureScheduleStudio(){
  const nav=document.querySelector('.nav[data-page="schedule"]');
  if(nav){
    nav.textContent='📺 Schedule Studio';
    nav.title='Open Schedule Studio';
  }
  const page=document.getElementById('page-schedule');
  if(page&&window.scheduleStudio&&typeof window.scheduleStudio.load==='function'&&!page.dataset.crScheduleReady){
    page.dataset.crScheduleReady='1';
    window.scheduleStudio.load();
  }
}

function init(){
  if(window.__crAdmin51Init)return;
  if(!window.db){setTimeout(init,250);return;}
  window.__crAdmin51Init=true;
  addStatistics();
  ensureScheduleStudio();
}

let attempts=0;
const boot=()=>{
  attempts++;
  if(document.querySelector('aside')&&document.querySelector('main'))init();
  else if(attempts<80)setTimeout(boot,250);
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
