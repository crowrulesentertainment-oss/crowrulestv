<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro v6.6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font:14px system-ui,sans-serif;overflow:hidden}
#status{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box;background:#05070b}
.box{max-width:760px;width:100%}.small{color:#8996a8}.bad{color:#ff637b}
.spinner{width:30px;height:30px;margin:0 auto 14px;border:3px solid #273241;border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#05070b}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="status">
  <div class="box">
    <div class="spinner"></div>
    <h2>🐦‍⬛ CrowRules Entertainment</h2>
    <p id="statusText">Loading Admin Pro v6.6…</p>
    <p id="statusDetail" class="small">Starting the CrowRules Supabase control center.</p>
  </div>
</div>

<iframe id="adminFrame" title="CrowRules Admin Pro" src="./admin-v6.3.html?admin_v66=1&amp;cb=20260827"></iframe>

<script>
(function(){
  const status=document.getElementById('status');
  const text=document.getElementById('statusText');
  const detail=document.getElementById('statusDetail');
  const frame=document.getElementById('adminFrame');
  let loaded=false;

  function fail(message){
    if(loaded)return;
    document.querySelector('.spinner')?.remove();
    text.textContent='Admin Pro v6.6 could not start';
    text.className='bad';
    detail.textContent=String(message||'The Admin Pro source did not load.').replace(/[<>]/g,'');
    detail.className='small bad';
    const b=document.createElement('button');
    b.textContent='Reload Admin Pro';
    b.onclick=()=>location.reload();
    document.querySelector('.box').appendChild(b);
  }

  frame.addEventListener('load',function(){
    loaded=true;
    status.classList.add('hidden');
    document.title='CrowRules Entertainment — Admin Pro v6.6';
  });

  frame.addEventListener('error',function(){fail('The Admin Pro source could not be loaded from GitHub Pages.')});

  setTimeout(function(){
    if(!loaded)fail('Timed out loading Admin Pro. Check that admin-v6.3.html is available in the repository.');
  },15000);
})();
</script>
</body>
</html>
