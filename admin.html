<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>CrowRules Entertainment — Admin Pro v5.0</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#05070b;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.box{width:min(760px,100%);text-align:center;padding:28px;border:1px solid #202a38;border-radius:16px;background:#0a0f17;box-shadow:0 20px 60px #0008}
.logo{font-size:28px;margin-bottom:8px}.small{color:#8996a8}.bad{color:#ff637b}
button{margin-top:14px;padding:10px 15px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="status" aria-live="polite"><div class="box"><div class="logo">🐦‍⬛</div><h2>CrowRules Entertainment</h2><p id="statusText">Loading Admin Pro v5.0…</p><p id="statusDetail" class="small">Starting the Statistics + Schedule Studio control center.</p></div></div>
<script>
(async()=>{
 const root=document.getElementById('status'),text=document.getElementById('statusText'),detail=document.getElementById('statusDetail');
 const fail=message=>{text.textContent='Admin Pro v5.0 could not start';text.className='bad';detail.textContent=String(message||'Unknown loading error').replace(/[<>]/g,'');detail.className='small bad';if(!document.getElementById('reloadAdmin')){const b=document.createElement('button');b.id='reloadAdmin';b.type='button';b.textContent='Reload Admin Pro';b.onclick=()=>location.reload();root.querySelector('.box').appendChild(b)}};
 try{
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),20000);
  const r=await fetch('./admin-v4.html?build=20260827-v5.0',{cache:'no-store',credentials:'same-origin',signal:c.signal});clearTimeout(timer);
  if(!r.ok)throw new Error('Admin Pro core returned HTTP '+r.status);
  let h=await r.text();if(h.length<500)throw new Error('Admin Pro core document is incomplete');
  const enhancement=`<script>(function(){'use strict';\nconst esc2=v=>String(v??'').replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',"'":'&#39;'}[c]));\nconst statTables=['tv_channels','tv_channel_playlist','schedule_items','live_events','shows','episodes','celebrity_deaths'];\nasync function exactCount(table,filters){let q=db.from(table).select('*',{count:'exact',head:true});if(filters)for(const[k,v]of Object.entries(filters))q=q.eq(k,v);const r=await q;if(r.error)throw r.error;return r.count||0}\nasync function loadStatistics(){const box=document.getElementById('crStatistics');if(!box)return;box.innerHTML='<div class="notice">Loading statistics…</div>';try{const vals=await Promise.all(statTables.map(async t=>[t,await exactCount(t)]));const active=await exactCount('schedule_items',{is_active:true});const published=await exactCount('schedule_items',{status:'published'});const scheduled=await exactCount('schedule_items',{status:'scheduled'});const live=await exactCount('live_events');box.innerHTML='<div class="grid">'+vals.map(([t,c])=>'<div class="card"><div class="muted">'+esc2(t)+'</div><b style="font-size:28px">'+c+'</b><div class="muted">records</div></div>').join('')+'</div><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Active Schedule</div><b style="font-size:28px">'+active+'</b></div><div class="card"><div class="muted">Published Schedule</div><b style="font-size:28px">'+published+'</b></div><div class="card"><div class="muted">Scheduled</div><b style="font-size:28px">'+scheduled+'</b></div><div class="card"><div class="muted">Live Events</div><b style="font-size:28px">'+live+'</b></div></div><p class="muted" style="margin-top:12px">Counts are read directly from Supabase with exact database counts.</p>'}catch(e){box.innerHTML='<div class="notice"><span class="bad">Statistics error: '+esc2(e.message||e)+'</span></div>'}}\nfunction addStatistics(){const dash=document.getElementById('page-dashboard'),main=document.querySelector('aside'),content=document.querySelector('main');if(!dash||!main||!content||document.getElementById('page-statistics'))return;const nav=document.createElement('button');nav.className='nav';nav.dataset.page='statistics';nav.textContent='📊 Statistics';const health=Array.from(main.querySelectorAll('.nav')).find(x=>x.dataset.page==='health');health?main.insertBefore(nav,health):main.appendChild(nav);const page=document.createElement('section');page.id='page-statistics';page.className='page';page.innerHTML='<div class="hero"><div><h1>📊 Statistics</h1><p class="muted">Live database statistics for the CrowRules Entertainment control center.</p></div><button class="primary" id="crStatsRefresh">↻ Refresh Statistics</button></div><div id="crStatistics"></div>';content.appendChild(page);nav.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));nav.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));page.classList.add('active');loadStatistics()};const statsCard=document.createElement('div');statsCard.className='card';statsCard.style.marginTop='14px';statsCard.innerHTML='<div class="hero"><div><h2>Database Statistics</h2><p class="muted">Exact row counts from the canonical tables.</p></div><button id="crDashStats">Refresh</button></div><div id="crDashboardStats"></div>';dash.appendChild(statsCard);document.getElementById('crStatsRefresh').onclick=loadStatistics;document.getElementById('crDashStats').onclick=loadDashboardStats;loadDashboardStats()}\nasync function loadDashboardStats(){const box=document.getElementById('crDashboardStats');if(!box)return;try{const vals=await Promise.all(statTables.map(async t=>[t,await exactCount(t)]));box.innerHTML='<div class="grid">'+vals.map(([t,c])=>'<div class="card"><div class="muted">'+esc2(t)+'</div><b style="font-size:23px">'+c+'</b></div>').join('')+'</div>'}catch(e){box.innerHTML='<span class="bad">'+esc2(e.message||e)+'</span>'}}\nfunction upgradeScheduleNav(){const n=document.querySelector('.nav[data-page="schedule"]);if(n){n.textContent='📺 Schedule Studio';n.title='Open Schedule Studio';n.onclick=()=>{if(window.scheduleStudio&&typeof window.scheduleStudio.load==='function')window.scheduleStudio.load();openPage('schedule')}}}\nconst init=()=>{if(window.__crV50Init)return;window.__crV50Init=true;addStatistics();upgradeScheduleNav();};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();<\\/script>`;
  const marker='</body>',pos=h.toLowerCase().lastIndexOf(marker);if(pos<0)throw new Error('Admin Pro core is missing </body>');
  h=h.slice(0,pos)+enhancement+h.slice(pos);
  h=h.replace(/Admin Pro v4\.0/g,'Admin Pro v5.0').replace(/admin-v4\.js\?build=[^\"']+/g,'admin-v4.js?build=20260827-v5.0').replace(/schedule-studio\.js\?build=[^\"']+/g,'schedule-studio.js?build=20260827-v5.0').replace(/playlist-studio-schedule-picker\.js\?build=[^\"']+/g,'playlist-studio-schedule-picker.js?build=20260827-v5.0').replace(/playlist-studio-episodes\.js\?build=[^\"']+/g,'playlist-studio-episodes.js?build=20260827-v5.0');
  document.open();document.write(h);document.close();
 }catch(e){fail(e.name==='AbortError'?'Timed out loading Admin Pro.':e.message||e)}
})();
</script>
</body>
</html>
