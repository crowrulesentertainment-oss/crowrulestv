<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>CrowRules Entertainment — Admin Pro v4.8</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#05070b;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.box{width:min(760px,100%);text-align:center;padding:28px;border:1px solid #202a38;border-radius:16px;background:#0a0f17;box-shadow:0 20px 60px #0008}
.logo{font-size:28px;margin-bottom:8px}.small{color:#8996a8}.bad{color:#ff637b}
button{margin-top:14px;padding:10px 15px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="status" aria-live="polite">
  <div class="box">
    <div class="logo">🐦‍⬛</div>
    <h2>CrowRules Entertainment</h2>
    <p id="statusText">Loading Admin Pro v4.8…</p>
    <p id="statusDetail" class="small">Starting the verified Admin Pro control center.</p>
  </div>
</div>
<script>
(async()=>{
  const root=document.getElementById('status');
  const text=document.getElementById('statusText');
  const detail=document.getElementById('statusDetail');
  const fail=message=>{
    text.textContent='Admin Pro v4.8 could not start';
    text.className='bad';
    detail.textContent=String(message||'Unknown loading error').replace(/[<>]/g,'');
    detail.className='small bad';
    if(!document.getElementById('reloadAdmin')){
      const b=document.createElement('button');
      b.id='reloadAdmin';b.type='button';b.textContent='Reload Admin Pro';
      b.onclick=()=>location.reload();root.querySelector('.box').appendChild(b);
    }
  };
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),20000);
    const response=await fetch('./admin-v4.html?build=20260827-v4.8',{cache:'no-store',credentials:'same-origin',signal:controller.signal});
    clearTimeout(timer);
    if(!response.ok)throw new Error('Admin Pro core returned HTTP '+response.status);
    let html=await response.text();
    if(html.length<500)throw new Error('Admin Pro core document is incomplete');

    /*
      admin-v4.html is the single integration point for Schedule Studio,
      Playlist Studio, channel routing, and the Supabase-backed admin UI.
      The old wrapper injected duplicate schedule and Back Deck Crew pages,
      which caused duplicate cards and conflicting schedule logic.
    */
    html=html.replace(/Admin Pro v4\.0/g,'Admin Pro v4.8');
    html=html.replace(/admin-v4\.js\?build=[^"']+/g,'admin-v4.js?build=20260827-v4.8');
    html=html.replace(/playlist-studio-schedule-picker\.js\?build=[^"']+/g,'playlist-studio-schedule-picker.js?build=20260827-v4.8');
    html=html.replace(/schedule-studio\.js\?build=[^"']+/g,'schedule-studio.js?build=20260827-v4.8');
    html=html.replace(/playlist-studio-episodes\.js\?build=[^"']+/g,'playlist-studio-episodes.js?build=20260827-v4.8');
    html=html.replace(/admin-v3\.9-integrated\.js\?build=[^"']+/g,'admin-v3.9-integrated.js?build=20260827-v4.8');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    fail(error?.name==='AbortError'?'Timed out loading Admin Pro.':error?.message||error);
  }
})();
</script>

<!-- BACKDECKCREW_ADMIN_INTEGRATION -->
<script>
(()=>{
 const add=()=>{
  const aside=document.querySelector('aside');
  const main=document.querySelector('main');
  if(!aside||!main)return;
  const nav=document.createElement('button'); nav.className='nav'; nav.dataset.page='backdeckcrew'; nav.textContent='🎬 Back Deck Crew'; aside.appendChild(nav);
  const page=document.createElement('section'); page.id='page-backdeckcrew'; page.className='page'; page.innerHTML='<h1>Back Deck Crew</h1><div class="grid"><div class="card"><h2>Back Deck Crew Settings</h2><div id="backdeck-settings" class="muted">Loading…</div></div><div class="card"><h2>Crew Members</h2><div id="backdeck-members" class="muted">Loading…</div></div></div>'; main.appendChild(page);
  nav.onclick=async()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));nav.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));page.classList.add('active');
   const s=await db.from('backdeckcrew_settings').select('*').eq('site_slug','backdeckcrew').maybeSingle();
   document.getElementById('backdeck-settings').textContent=s.error?s.error.message:JSON.stringify(s.data||{},null,2);
   const m=await db.from('backdeckcrew_members').select('name,role,bio,is_featured,is_active,sort_order').order('sort_order',{ascending:true});
   document.getElementById('backdeck-members').innerHTML=m.error?'<span class="bad">'+String(m.error.message).replace(/[<>]/g,'')+'</span>':(m.data||[]).map(x=>'<div class="notice"><b>'+String(x.name||'').replace(/[<>]/g,'')+'</b> — '+String(x.role||'').replace(/[<>]/g,'')+'</div>').join('')||'<span class="muted">No crew members yet.</span>';
  };
 }; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
</body>
</html>
