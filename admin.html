<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro v3.9</title>
<style>
html,body{margin:0;background:#05070b;color:#fff;font:14px system-ui,sans-serif}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
.box{max-width:760px;width:100%}
.small{color:#8996a8}.bad{color:#ff637b}.good{color:#35d58a}
button{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="status"><div class="box">
<h2>🐦‍⬛ CrowRules Entertainment</h2>
<p id="statusText">Loading Admin Pro v3.9…</p>
<p id="statusDetail" class="small">Connecting to the verified CrowRules Supabase project.</p>
</div></div>
<script>
(async()=>{
 const status=document.getElementById('statusText');
 const detail=document.getElementById('statusDetail');
 const clean=v=>String(v??'').replace(/[<>]/g,'');
 const fail=(message,detailText='GitHub Pages may still be publishing the latest Admin Pro build.')=>{
   status.textContent='Admin Pro could not start';
   status.className='bad';
   detail.textContent=clean(message)+' '+detailText;
   detail.className='small bad';
   const b=document.createElement('button');
   b.textContent='Reload Admin Pro';
   b.onclick=()=>location.reload();
   document.querySelector('.box').appendChild(b);
 };
 try{
   status.textContent='Loading Admin Pro v3.9…';
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),12000);
   const r=await fetch('./admin-v3.9.html?build=20260826-startup-fix',{cache:'no-store',signal:controller.signal});
   clearTimeout(timer);
   if(!r.ok)throw new Error('Admin Pro could not be loaded ('+r.status+').');
   let h=await r.text();
   if(!h||h.length<500)throw new Error('Admin Pro returned an incomplete HTML document.');

   const scripts=[
     './playlist-studio-schedule-picker.js?build=20260826',
     './schedule-studio.js?build=20260826',
     './playlist-studio-episodes.js?build=20260826',
     './admin-v3.9-integrated.js?build=20260826-integrated-2'
   ];
   const injection=scripts.map(src=>'<script src="'+src+'"><\\/script>').join('');
   const bodyClose='</body>';
   const pos=h.toLowerCase().lastIndexOf(bodyClose);
   if(pos<0)throw new Error('Admin Pro HTML is missing its closing body tag.');
   h=h.slice(0,pos)+injection+h.slice(pos);

   document.open();
   document.write(h);
   document.close();
 }catch(e){
   fail(e?.name==='AbortError'?'Timed out loading admin-v3.9.html.':(e?.message||e));
 }
})();
</script>
</body>
</html>
