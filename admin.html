<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro</title>
<style>html,body{margin:0;background:#05070b;color:#fff;font:14px system-ui,sans-serif}#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}.box{max-width:620px}.bad{color:#ff637b}.small{color:#8996a8}</style>
</head>
<body>
<div id="status"><div class="box"><h2>🐦‍⬛ CrowRules Entertainment</h2><p>Loading Admin Pro…</p><p class="small">Connecting to Supabase securely.</p></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./admin-v3.6.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Admin Pro could not be loaded ('+response.status+').');
    let html=await response.text();
    const legacyAnon='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdXhkcXlzc3JhdHZ6bW9tb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjE3MjYsImV4cCI6MjEwMjk5NzcyNn0.nPTPMgD8gHzL7qRmMuUNJxpjXaCJRVXmgxck15AKDDA';
    const before=html;
    html=html.replace(/const SUPABASE_KEY='[^']*';/,"const SUPABASE_KEY='"+legacyAnon+"';");
    if(html===before) throw new Error('Supabase key declaration was not found in Admin Pro.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').innerHTML='<div class="box"><h2>Admin Pro unavailable</h2><p class="bad">'+String(error.message||error).replace(/[<>]/g,'')+'</p><p class="small">Refresh after GitHub Pages finishes publishing the latest commit.</p></div>';
  }
})();
</script>
</body>
</html>
