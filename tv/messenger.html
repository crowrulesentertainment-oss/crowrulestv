<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Messenger</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#050505;color:#eee;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:280px 1fr;gap:15px}.box{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px}.users button,button{display:block;width:100%;margin:7px 0;padding:10px;border-radius:8px;border:1px solid #333;background:#171717;color:#fff;text-align:left;cursor:pointer}.messages{height:430px;overflow:auto;border:1px solid #222;padding:12px}.m{padding:9px;border-bottom:1px solid #222}.mine{text-align:right}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;background:#171717;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.compose button{width:auto;margin:0}.muted{color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>💬 CrowRules Messenger</h1><p id="status" class="muted">Checking member session…</p><div id="app"></div></div><script>const sb=supabase.createClient('https://zauxdqyssratvzmomozf','sb_publishable_Zc0a9Qk9v8xwJ3bG6H2mF1nR4tP7sQ0aE5dC8bV2');let me,conversation;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const r=await sb.auth.getUser();me=r.data.user;if(!me){$('app').innerHTML='<div class="box"><h2>Members only</h2><p>Sign in on CrowRules TV first.</p><a href="../tv.html#members">Return to Members</a></div>';return}$('status').textContent='Signed in • Messenger';$('app').innerHTML='<div class="grid"><div class="box"><h3>Members</h3><div id="users">Loading…</div></div><div class="box"><h3 id="title">Select a member</h3><div class="messages" id="messages">Choose a member to begin.</div><div class="compose"><textarea id="body" maxlength="4000" placeholder="Write a message…"></textarea><button onclick="send()">Send</button></div></div></div>';await users();sb.channel('messenger-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'messenger_messages'},p=>{if(p.new?.conversation_id===conversation)loadMessages()}).subscribe()}async function users(){const r=await sb.from('member_public_profiles').select('id,username,display_name,avatar_url').eq('is_active',true).order('display_name').limit(100);if(r.error){$('users').textContent='Member directory unavailable.';return}$('users').innerHTML=(r.data||[]).filter(x=>x.id!==me.id).map(x=>`<button onclick="start('${x.id}',${JSON.stringify(x.display_name||x.username||'Member')})">${esc(x.display_name||x.username||'Member')}</button>`).join('')||'<p class="muted">No other members yet.</p>'}async function start(other,name){const p=await sb.from('messenger_participants').select('conversation_id').eq('user_id',me.id);let found=null;for(const x of p.data||[]){const q=await sb.from('messenger_participants').select('user_id').eq('conversation_id',x.conversation_id);if((q.data||[]).some(v=>v.user_id===other)){found=x.conversation_id;break}}if(!found){const c=await sb.from('messenger_conversations').insert({created_by:me.id}).select('id').single();if(c.error)return alert(c.error.message);found=c.data.id;const i=await sb.from('messenger_participants').insert([{conversation_id:found,user_id:me.id},{conversation_id:found,user_id:other}]);if(i.error)return alert(i.error.message)}conversation=found;$('title').textContent=name;loadMessages()}async function loadMessages(){const r=await sb.from('messenger_messages').select('id,sender_id,body,created_at').eq('conversation_id',conversation).order('created_at');if(r.error)return;$('messages').innerHTML=(r.data||[]).map(x=>`<div class="m ${x.sender_id===me.id?'mine':''}">${esc(x.body)}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<p class="muted">No messages yet.</p>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){const body=$('body').value.trim();if(!body||!conversation)return;const r=await sb.from('messenger_messages').insert({conversation_id:conversation,sender_id:me.id,body});if(r.error)alert(r.error.message);else{$('body').value='';loadMessages()}}boot();</script></body></html>
