<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Entertainment — Admin Pro v4.0</title>
<style>html,body{margin:0;background:#05070b;color:#fff;font:14px system-ui,sans-serif}#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}.box{max-width:760px;width:100%}.small{color:#8996a8}.bad{color:#ff637b}button{padding:10px 14px;border-radius:9px;border:1px solid #273241;background:#151c27;color:#fff;cursor:pointer}</style>
</head>
<body>
<div id="status"><div class="box"><h2>🐦‍⬛ CrowRules Entertainment</h2><p id="statusText">Loading Admin Pro v4.0…</p><p id="statusDetail" class="small">Connecting to the verified CrowRules Supabase control center.</p></div></div>
<script>
(async()=>{
 const text=document.getElementById('statusText'),detail=document.getElementById('statusDetail');
 const fail=m=>{text.textContent='Admin Pro v4.0 could not start';text.className='bad';detail.textContent=String(m).replace(/[<>]/g,'');detail.className='small bad';const b=document.createElement('button');b.textContent='Reload';b.onclick=()=>location.reload();document.querySelector('.box').appendChild(b)};
 try{
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),20000);
  const r=await fetch('./admin-v3.9.html?build=20260826-v4',{cache:'no-store',signal:c.signal});clearTimeout(timer);
  if(!r.ok)throw new Error('Base Admin Pro returned HTTP '+r.status);
  let h=await r.text();if(h.length<500)throw new Error('Base Admin Pro document is incomplete');
  const scripts=['./playlist-studio-schedule-picker.js?build=20260826-v4','./schedule-studio.js?build=20260826-v4','./playlist-studio-episodes.js?build=20260826-v4','./admin-v3.9-integrated.js?build=20260827-v4','./admin-v4.js?build=20260826-v4'];
  const injection=scripts.map(s=>'<script src="'+s+'"><\\/script>').join('');
  const marker='</body>',pos=h.toLowerCase().lastIndexOf(marker);if(pos<0)throw new Error('Base Admin Pro is missing </body>');
  h=h.slice(0,pos)+injection+h.slice(pos);
  h=h.replace(/Admin Pro v3\.9/g,'Admin Pro v4.0');
  document.open();document.write(h);document.close();
 }catch(e){fail(e.name==='AbortError'?'Timed out loading Admin Pro v4.0.':e.message||e)}
})();
</script>
</body>
</html>
