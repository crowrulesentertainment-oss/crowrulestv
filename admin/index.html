<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CrowRules Entertainment — Admin Pro v4.1</title><style>html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font-family:system-ui}iframe{width:100%;height:100%;border:0;display:block}.upgrade{position:fixed;right:14px;bottom:14px;z-index:9999;background:#8b5cf6;color:#fff;padding:9px 13px;border-radius:10px;font-weight:700;display:none}</style></head><body><iframe id="adminFrame" src="../admin-v3.9.html?admin_v41=1" title="CrowRules Admin Pro"></iframe><div id="upgrade" class="upgrade">Admin Pro v4.1</div><script>
(()=>{'use strict';const frame=document.getElementById('adminFrame'),badge=document.getElementById('upgrade');const REST='https://zauxdqyssratvzmomozf.supabase.co/rest/v1';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdXhkcXlzc3JhdHZ6bW9tb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjE3MjYsImV4cCI6MjEwMjk5NzcyNn0.nPTPMgD8gHzL7qRmMuUNJxpjXaCJRVXmgxck15AKDDA';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){try{for(const k of Object.keys(localStorage)){if(k.includes('crowrules-admin-pro-v39')||k.includes('crowrules-admin-pro-v41')){const x=JSON.parse(localStorage.getItem(k)||'{}');return x.access_token||x.currentSession?.access_token||x.session?.access_token||''}}}catch{}return''}
async function api(path,opts={}){const t=token();if(!t)throw Error('Please sign in to Admin Pro first.');const r=await fetch(REST+'/'+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});const text=await r.text();if(!r.ok)throw Error(text||('HTTP '+r.status));return text?JSON.parse(text):null}
function wait(){const d=frame.contentDocument;if(!d||!d.body){setTimeout(wait,400);return}badge.style.display='block';if(d.getElementById('cr41-style'))return;const style=d.createElement('style');style.id='cr41-style';style.textContent='.cr41btn{border:1px solid #39465a;background:#151c27;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.cr41primary{background:#8b5cf6;border-color:#8b5cf6}.cr41modal{position:fixed;inset:0;z-index:10000;background:#000d;display:grid;place-items:center;padding:16px}.cr41card{background:#0d121a;border:1px solid #39465a;border-radius:15px;padding:18px;width:min(920px,96vw);max-height:92vh;overflow:auto}.cr41row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#0a1017;border:1px solid #273241;border-radius:10px;padding:10px;margin:6px 0}.cr41search{width:100%;padding:10px;background:#080b10;color:#fff;border:1px solid #303b4b;border-radius:9px;margin:8px 0 12px}.cr41muted{color:#8b98aa}.cr41bad{color:#ff637b}.cr41good{color:#35d58a}';d.head.appendChild(style);

const ep=d.getElementById('page-episodes');if(ep&&!d.getElementById('cr41Episodes')){const h=ep.querySelector('.hero');const b=d.createElement('button');b.id='cr41Episodes';b.className='cr41btn cr41primary';b.textContent='📺 Add Episode to TV Playlist';b.onclick=()=>openPicker('episodes');h?.appendChild(b)}
const pl=d.getElementById('page-playlists');if(pl){const bar=pl.querySelector('.toolbar');if(bar&&!d.getElementById('cr41SchedulePlaylist')){const b=d.createElement('button');b.id='cr41SchedulePlaylist';b.className='cr41btn';b.textContent='📅 Add Schedule Items';b.disabled=true;b.onclick=()=>openPicker('schedule');bar.appendChild(b);const ch=d.getElementById('studioChannel');ch?.addEventListener('change',()=>b.disabled=!ch.value)}}}
async function openPicker(mode){const d=frame.contentDocument;try{const ch=await api('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc');const path=mode==='episodes'?'episodes?select=id,title,season_number,episode_number,youtube_url,video_url,status,is_active&is_active=eq.true&order=published_at.desc&limit=1000':'schedule_items?select=id,episode_id,title,description,starts_at,ends_at,item_type,status,is_active&is_active=eq.true&order=starts_at.asc&limit=1000';const rows=await api(path);const modal=d.createElement('div');modal.className='cr41modal';modal.id='cr41Modal';modal.innerHTML=`<div class="cr41card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0">${mode==='episodes'?'📺 Add Episodes to TV Playlist':'📅 Add from Schedule Items'}</h2><p class="cr41muted">Choose the TV channel and programming to add.</p></div><button class="cr41btn" id="cr41Close">✕</button></div><label>TV Channel<select id="cr41Channel" class="cr41search">${ch.map(c=>`<option value="${c.id}">${c.channel_number?c.channel_number+' — ':''}${esc(c.name)}</option>`).join('')}</select></label><input id="cr41SearchInput" class="cr41search" placeholder="Search…"><div id="cr41Info" class="cr41muted"></div><div id="cr41List"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="cr41btn" id="cr41Cancel">Cancel</button><button class="cr41btn cr41primary" id="cr41Add">Add selected</button></div></div>`;d.body.appendChild(modal);const close=()=>modal.remove();modal.querySelector('#cr41Close').onclick=close;modal.querySelector('#cr41Cancel').onclick=close;const render=async()=>{const q=modal.querySelector('#cr41SearchInput').value.toLowerCase().trim();const channel=modal.querySelector('#cr41Channel').value;const existing=await api(`tv_channel_playlist?select=${mode==='episodes'?'episode_id':'schedule_item_id'}&channel_id=eq.${encodeURIComponent(channel)}&${mode==='episodes'?'episode_id':'schedule_item_id'}=not.is.null`);const used=new Set(existing.map(x=>x[mode==='episodes'?'episode_id':'schedule_item_id']));const filtered=rows.filter(x=>!q||[x.title,x.description,x.item_type,x.status].some(v=>String(v||'').toLowerCase().includes(q)));modal.querySelector('#cr41List').innerHTML=filtered.map(x=>{const linked=mode==='episodes'||!!x.episode_id,already=used.has(x.id),playable=mode==='schedule'||!!(x.youtube_url||x.video_url);return`<label class="cr41row"><input type="checkbox" data-id="${esc(x.id)}" ${(already||!linked||!playable)?'disabled':''}><div><b>${esc(x.title||'Untitled')}</b><div class="cr41muted">${mode==='episodes'?`S${esc(x.season_number??'—')} E${esc(x.episode_number??'—')}`:esc(x.item_type||'schedule')} · ${esc(mode==='episodes'?(x.status||''):(x.starts_at||''))}${already?' · Already in playlist':''}${!linked?' · Needs linked episode':''}${!playable?' · No media':''}</div></div></label>`}).join('')||'<div class="cr41muted">No matching items.</div>';modal.querySelector('#cr41Info').textContent=`${filtered.length} shown • ${[...modal.querySelectorAll('input[data-id]:not(:disabled)')].length} available`};modal.querySelector('#cr41SearchInput').oninput=render;modal.querySelector('#cr41Channel').onchange=render;modal.querySelector('#cr41Add').onclick=async()=>{const channel=modal.querySelector('#cr41Channel').value;const ids=[...modal.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);if(!ids.length){alert('Select at least one item.');return}const maxRows=await api(`tv_channel_playlist?select=playlist_position&channel_id=eq.${encodeURIComponent(channel)}&order=playlist_position.desc&limit=1`);let pos=maxRows[0]?.playlist_position==null?0:Number(maxRows[0].playlist_position)+1;const chosen=rows.filter(x=>ids.includes(x.id));const payload=chosen.map(x=>mode==='episodes'?{channel_id:channel,episode_id:x.id,schedule_item_id:null,live_event_id:null,playlist_position:pos++,enabled:true}:{channel_id:channel,episode_id:x.episode_id,schedule_item_id:x.id,live_event_id:null,playlist_position:pos++,enabled:true});try{modal.querySelector('#cr41Add').disabled=true;await api('tv_channel_playlist',{method:'POST',body:JSON.stringify(payload)});close();const fn=d.defaultView?.loadStudioPlaylist;if(typeof fn==='function')await fn();else d.getElementById('studioChannel')?.dispatchEvent(new Event('change'));alert(`Added ${payload.length} item${payload.length===1?'':'s'} to the TV playlist.`)}catch(e){alert('Could not add to playlist: '+e.message)}finally{modal.querySelector('#cr41Add').disabled=false}};await render()}catch(e){alert('Playlist Studio error: '+e.message)}}
frame.addEventListener('load',()=>setTimeout(wait,250));setInterval(()=>{try{wait()}catch{}},1500)})();
