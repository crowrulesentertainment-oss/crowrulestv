<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CrowRules Entertainment — Admin Pro v4.3</title><style>html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font-family:system-ui}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="adminFrame" src="../admin-v3.9.html?admin_v43=1" title="CrowRules Admin Pro"></iframe><script>(()=>{'use strict';const f=document.getElementById('adminFrame');const REST='https://zauxdqyssratvzmomozf.supabase.co/rest/v1';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdXhkcXlzc3JhdHZ6bW9tb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjE3MjYsImV4cCI6MjEwMjk5NzcyNn0.nPTPMgD8gHzL7qRmMuUNJxpjXaCJRVXmgxck15AKDDA';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){try{for(const k of Object.keys(localStorage)){if(k.includes('crowrules-admin-pro')){const x=JSON.parse(localStorage.getItem(k)||'{}');return x.access_token||x.currentSession?.access_token||x.session?.access_token||''}}}catch{}return''}async function api(path,opt={}){const t=token();if(!t)throw Error('Sign in to Admin Pro first.');const r=await fetch(REST+'/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});const text=await r.text();if(!r.ok)throw Error(text||('HTTP '+r.status));return text?JSON.parse(text):null}function inject(){const d=f.contentDocument;if(!d?.body)return setTimeout(inject,300);if(d.getElementById('cr43'))return;const s=d.createElement('style');s.id='cr43';s.textContent='.cr43{border:1px solid #39465a;background:#151c27;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.cr43p{background:#8b5cf6;border-color:#8b5cf6}.cr43m{position:fixed;inset:0;z-index:99999;background:#000d;display:grid;place-items:center;padding:16px}.cr43c{background:#0d121a;border:1px solid #39465a;border-radius:15px;padding:18px;width:min(900px,96vw);max-height:92vh;overflow:auto}.cr43r{display:grid;grid-template-columns:auto 1fr;gap:10px;background:#0a1017;border:1px solid #273241;border-radius:10px;padding:10px;margin:6px 0}.cr43i{width:100%;box-sizing:border-box;padding:10px;background:#080b10;color:#fff;border:1px solid #303b4b;border-radius:9px;margin:8px 0}.cr43muted{color:#8b98aa}';d.head.appendChild(s);const ep=d.getElementById('page-episodes');if(ep&&!d.getElementById('cr43ep')){const b=d.createElement('button');b.id='cr43ep';b.className='cr43 cr43p';b.textContent='📺 Add Episode to TV Playlist';b.onclick=()=>picker('episodes');ep.querySelector('.hero')?.appendChild(b)}const pl=d.getElementById('page-playlists');if(pl&&!d.getElementById('cr43pl')){const b=d.createElement('button');b.id='cr43pl';b.className='cr43';b.textContent='📅 Add Schedule Items';b.onclick=()=>picker('schedule');pl.querySelector('.toolbar')?.appendChild(b)}}async function picker(mode){const d=f.contentDocument;try{const [chs,rows]=await Promise.all([api('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc'),api(mode==='episodes'?'episodes?select=id,title,season_number,episode_number,youtube_url,video_url,status,is_active&is_active=eq.true&order=published_at.desc&limit=1000':'schedule_items?select=id,episode_id,title,description,starts_at,ends_at,item_type,status,is_active&is_active=eq.true&order=starts_at.asc&limit=1000')]);const m=d.createElement('div');m.className='cr43m';m.innerHTML=`<div class="cr43c"><div style="display:flex;justify-content:space-between"><div><h2>${mode==='episodes'?'📺 Add Episodes to TV Playlist':'📅 Add Schedule Items to TV Playlist'}</h2><div class="cr43muted">Schedule items are valid playlist items even without an episode link.</div></div><button class="cr43" id="x">✕</button></div><select id="c" class="cr43i">${chs.map(c=>`<option value="${c.id}">${c.channel_number?c.channel_number+' — ':''}${esc(c.name)}</option>`).join('')}</select><input id="q" class="cr43i" placeholder="Search…"><div id="l"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="cr43" id="no">Cancel</button><button class="cr43 cr43p" id="go">Add selected</button></div></div>`;d.body.appendChild(m);const close=()=>m.remove();m.querySelector('#x').onclick=close;m.querySelector('#no').onclick=close;const render=async()=>{const channel=m.querySelector('#c').value,q=m.querySelector('#q').value.toLowerCase();const col=mode==='episodes'?'episode_id':'schedule_item_id';const existing=await api(`tv_channel_playlist?select=${col}&channel_id=eq.${encodeURIComponent(channel)}&${col}=not.is.null`);const used=new Set(existing.map(x=>x[col]));const rr=rows.filter(x=>!q||[x.title,x.description,x.status,x.item_type].some(v=>String(v||'').toLowerCase().includes(q)));m.querySelector('#l').innerHTML=rr.map(x=>{const unavailable=used.has(x.id)||(mode==='episodes'&&!x.youtube_url&&!x.video_url);return `<label class="cr43r"><input type="checkbox" data-id="${esc(x.id)}" ${unavailable?'disabled':''}><div><b>${esc(x.title||'Untitled')}</b><div class="cr43muted">${mode==='episodes'?`S${esc(x.season_number??'—')} E${esc(x.episode_number??'—')}`:esc(x.item_type||'schedule')} · ${esc(mode==='episodes'?(x.status||''):(x.starts_at||''))}${used.has(x.id)?' · Already in playlist':''}${mode==='schedule'&&x.episode_id?' · Linked episode':''}${mode==='schedule'&&!x.episode_id?' · Direct schedule item':''}${mode==='episodes'&&!x.youtube_url&&!x.video_url?' · Add media first':''}</div></div></label>`}).join('')||'<div class="cr43muted">No matching items.</div>'};m.querySelector('#q').oninput=render;m.querySelector('#c').onchange=render;await render();m.querySelector('#go').onclick=async()=>{const ids=[...m.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);if(!ids.length)return alert('Select at least one item.');const channel=m.querySelector('#c').value;const max=await api(`tv_channel_playlist?select=playlist_position&channel_id=eq.${encodeURIComponent(channel)}&order=playlist_position.desc&limit=1`);let pos=max[0]?.playlist_position==null?0:Number(max[0].playlist_position)+1;const chosen=rows.filter(x=>ids.includes(x.id));const payload=chosen.map(x=>mode==='episodes'?{channel_id:channel,episode_id:x.id,schedule_item_id:null,live_event_id:null,playlist_position:pos++,enabled:true}:{channel_id:channel,episode_id:null,schedule_item_id:x.id,live_event_id:null,playlist_position:pos++,enabled:true});try{await api('tv_channel_playlist',{method:'POST',body:JSON.stringify(payload)});alert(`Added ${payload.length} item${payload.length===1?'':'s'} to the playlist.`);close();d.getElementById('studioChannel')?.dispatchEvent(new Event('change'))}catch(e){alert('Could not add to playlist: '+e.message)}}}catch(e){alert('Playlist Studio error: '+e.message)}}f.addEventListener('load',()=>setTimeout(inject,300));setTimeout(inject,500)})();</script></body></html>
