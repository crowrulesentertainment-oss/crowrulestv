Items';b.onclick=()=>openPicker();(pl.querySelector('.toolbar')||pl.querySelector('.hero'))?.appendChild(b)}async function openPicker(){const token=getToken();if(!token)return alert('Please sign in to Admin Pro first.');try{const [channels,items]=await Promise.all([get('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc'),get('schedule_items?select=id,title,description,starts_at,ends_at,item_type,status,is_active&is_active=eq.true&order=starts_at.asc&limit=1000')]);const m=d.createElement('div');m.className='cr44modal';m.innerHTML='<div class="cr44card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>📅 Add Schedule Items to TV Playlist</h2><div class="cr44muted">Schedule items are first-class playlist entries. An episode link is optional.</div></div><button class="cr44btn" id="cr44x">✕</button></div><select id="cr44channel" class="cr44input">'+channels.map(c=>'<option value="'+esc(c.id)+'">'+esc((c.channel_number?c.channel_number+' — ':'')+c.name)+'</option>').join('')+'</select><input id="cr44search" class="cr44input" placeholder="Search schedule items…"><div id="cr44list"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="cr44btn" id="cr44cancel">Cancel</button><button class="cr44btn cr44primary" id="cr44go">Add selected</button></div></div>';d.body.appendChild(m);const close=()=>m.remove();m.querySelector('#cr44x').onclick=close;m.querySelector('#cr44cancel').onclick=close;const render=async()=>{const channel=m.querySelector('#cr44channel').value,q=m.querySelector('#cr44search').value.toLowerCase();const existing=await get('tv_channel_playlist?select=schedule_item_id&channel_id=eq.'+encodeURIComponent(channel)+'&schedule_item_id=not.is.null');const used=new Set(existing.map(x=>x.schedule_item_id));const list=items.filter(x=>!q||[x.title,x.description,x.status,x.item_type].some(v=>String(v||'').toLowerCase().includes(q)));m.querySelector('#cr44list').innerHTML=list.map(x=>'<label class="cr44item"><input type="checkbox" data-id="'+esc(x.id)+'" '+(used.has(x.id)?'disabled':'')+'><div><b>'+esc(x.title||'Untitled')+'</b><div class="cr44muted">'+esc(x.item_type||'schedule')+' · '+esc(x.starts_at||'')+(used.has(x.id)?' · Already in playlist':' · Direct schedule item')+'</div></div></label>').join('')||'<div class="cr44muted">No schedule items found.</div>'};m.querySelector('#cr44search').oninput=render;m.querySelector('#cr44channel').onchange=render;await render();m.querySelector('#cr44go').onclick=async()=>{const ids=[...m.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);if(!ids.length)return alert('Select at least one schedule item.');const channel=m.querySelector('#cr44channel').value;const max=await get('tv_channel_playlist?select=playlist_position&channel_id=eq.'+encodeURIComponent(channel)+'&order=playlist_position.desc&limit=1');let pos=max[0]&&max[0].playlist_position!=null?Number(max[0].playlist_position)+1:0;const payload=items.filter(x=>ids.includes(x.id)).map(x=>({channel_id:channel,episode_id:null,schedule_item_id:x.id,live_event_id:null,playlist_position:pos++,enabled:true}));try{await post('tv_channel_playlist',payload);alert('Added '+payload.length+' schedule item'+(payload.length===1?'':'s')+' to the TV playlist.');close();d.getElementById('studioChannel')?.dispatchEvent(new Event('change'));}catch(e){alert('Could not add schedule items: '+e.message)}}}catch(e){alert('Playlist Studio error: '+e.message)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getToken(){try{for(const k of Object.keys(localStorage)){if(k.includes('crowrules')||k.includes('supabase')){const x=JSON.parse(localStorage.getItem(k)||'{}');const t=x.access_token||x.currentSession?.access_token||x.session?.access_token;if(t)return t}}}catch(e){}return''}const REST='https://zauxdqyssratvzmomozf.supabase.co/rest/v1';const KEY='eyJhbGciOiJI
