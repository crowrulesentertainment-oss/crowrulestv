<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CrowRules Entertainment — Admin Pro v4.0</title><style>html,body{margin:0;width:100%;height:100%;background:#05070b;color:#fff;font-family:system-ui}iframe{width:100%;height:100%;border:0;display:block}.upgrade{position:fixed;right:14px;bottom:14px;z-index:9999;background:#8b5cf6;color:#fff;padding:9px 13px;border-radius:10px;font-weight:700;box-shadow:0 6px 24px #0008;display:none}</style></head><body><iframe id="adminFrame" src="../admin-v3.9.html" title="CrowRules Admin Pro"></iframe><div id="upgrade" class="upgrade">Admin Pro v4.0</div><script>
(()=>{'use strict';const frame=document.getElementById('adminFrame'),badge=document.getElementById('upgrade');const URL='https://zauxdqyssratvzmomozf.supabase.co/rest/v1';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdXhkcXlzc3JhdHZ6bW9tb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjE3MjYsImV4cCI6MjEwMjk5NzcyNn0.nPTPMgD8gHzL7qRmMuUNJxpjXaCJRVXmgxck15AKDDA';
const token=()=>{try{for(const k of Object.keys(localStorage)){if(k.includes('crowrules-admin-pro-v39')){const x=JSON.parse(localStorage.getItem(k)||'{}');return x.access_token||x.currentSession?.access_token||''}}}catch{}return''};
async function api(path,opts={}){const t=token();if(!t)throw Error('Please sign in to Admin Pro first.');const r=await fetch(URL+'/'+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opts.headers||{})},});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function wait(){const d=frame.contentDocument;if(!d||!d.body){setTimeout(wait,500);return}badge.style.display='block';if(d.getElementById('cr-v4-style'))return;const style=d.createElement('style');style.id='cr-v4-style';style.textContent='.cr4{background:#111827;border:1px solid #39465a;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.cr4.primary{background:#8b5cf6;border-color:#8b5cf6}.cr4row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#0a1017;border:1px solid #273241;border-radius:10px;padding:10px;margin:6px 0}.cr4modal{position:fixed;inset:0;z-index:1000;background:#000c;display:grid;place-items:center;padding:18px}.cr4card{background:#0d121a;border:1px solid #39465a;border-radius:15px;padding:18px;width:min(900px,96vw);max-height:90vh;overflow:auto}.cr4list{max-height:55vh;overflow:auto}.cr4search{width:100%;padding:10px;background:#080b10;color:#fff;border:1px solid #303b4b;border-radius:9px;margin:8px 0 12px}';d.head.appendChild(style);
const nav=[...d.querySelectorAll('.nav')].find(x=>x.textContent.includes('Playlist Studio'));if(nav&&!d.getElementById('cr4PlaylistButton')){const b=d.createElement('button');b.id='cr4PlaylistButton';b.className='nav';b.textContent='📅 Add Schedule Items';b.onclick=()=>openSchedule();nav.parentNode.insertBefore(b,nav.nextSibling)}
const epPage=d.getElementById('page-episodes');if(epPage&&!epPage.querySelector('#cr4EpisodeTools')){const h=epPage.querySelector('.hero');const tools=d.createElement('div');tools.id='cr4EpisodeTools';tools.className='toolbar';tools.innerHTML='<button class="cr4 primary" id="cr4AddEpisodePlaylist">📺 Add Episode to TV Playlist</button>';h?.appendChild(tools);d.getElementById('cr4AddEpisodePlaylist').onclick=()=>openEpisodePicker()}
}
async function channelOptions(d){const cs=await api('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc');return cs.map(c=>`<option value="${c.id}">${c.channel_number?c.channel_number+' — ':''}${esc(c.name)}</option>`).join('')}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modal(title,body,save){const d=frame.contentDocument;const m=d.createElement('div');m.className='cr4modal';m.id='cr4Modal';m.innerHTML=`<div class="cr4card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0">${title}</h2><p style="color:#8b98aa">Admin Pro v4.0</p></div><button class="cr4" id="cr4Close">✕</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="cr4" id="cr4Cancel">Cancel</button><button class="cr4 primary" id="cr4Save">Add to Playlist</button></div></div>`;d.body.appendChild(m);const close=()=>m.remove();d.getElementById('cr4Close').onclick=close;d.getElementById('cr4Cancel').onclick=close;d.getElementById('cr4Save').onclick=async()=>{const b=d.getElementById('cr4Save');b.disabled=true;try{await save();close();if(typeof d.loadStudioPlaylist==='function')await d.loadStudioPlaylist();}catch(e){alert(e.message||e)}finally{b.disabled=false}};return m}
async function openSchedule(){const d=frame.contentDocument;const ch=await api('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc');const items=await api('schedule_items?select=*&is_active=eq.true&order=starts_at.asc&limit=500');const current=d.getElementById('studioChannel')?.value||'';const body=`<label>TV Channel<select id="cr4Channel" class="cr4search">${ch.map(c=>`<option value="${c.id}" ${c.id===current?'selected':''}>${c.channel_number?c.channel_number+' — ':''}${esc(c.name)}</option>`).join('')}</select></label><input id="cr4Search" class="cr4search" placeholder="Search schedule items…"><div id="cr4Items" class="cr4list"></div>`;const m=modal('📅 Add from Schedule Items',body,async()=>{const ids=[...m.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);const channel=m.querySelector('#cr4Channel').value;if(!ids.length)throw Error('Select at least one schedule item.');const existing=await api('tv_channel_playlist?select=schedule_item_id&channel_id=eq.'+encodeURIComponent(channel)+'&schedule_item_id=not.is.null');const used=new Set(existing.map(x=>x.schedule_item_id));const max=await api('tv_channel_playlist?select=playlist_position&channel_id=eq.'+encodeURIComponent(channel)+'&order=playlist_position.desc&limit=1');let pos=max[0]?.playlist_position==null?0:Number(max[0].playlist_position)+1;for(const id of ids.filter(x=>!used.has(x))){const item=items.find(x=>x.id===id);if(!item)continue;await api('tv_channel_playlist',{method:'POST',body:JSON.stringify({channel_id:channel,schedule_item_id:id,episode_id:item.episode_id||null,live_event_id:null,playlist_position:pos++,enabled:true})})}});const render=()=>{const q=m.querySelector('#cr4Search').value.toLowerCase();const used=[];m.querySelector('#cr4Items').innerHTML=items.filter(x=>!q||[x.title,x.description,x.item_type,x.status].some(v=>String(v||'').toLowerCase().includes(q))).map(x=>`<label class="cr4row"><input type="checkbox" data-id="${esc(x.id)}"><div><b>${esc(x.title||'Untitled')}</b><div style="color:#8b98aa">${esc(x.starts_at||'')} · ${esc(x.item_type||'schedule')} · ${esc(x.status||'')}</div></div></label>`).join('')||'<div style="color:#8b98aa">No schedule items found.</div>'};m.querySelector('#cr4Search').oninput=render;render()}
async function openEpisodePicker(){const d=frame.contentDocument;const eps=await api('episodes?select=id,title,season_number,episode_number,youtube_url,video_url,is_active&is_active=eq.true&order=published_at.desc&limit=500');const ch=await api('tv_channels?select=id,name,channel_number&is_active=eq.true&order=sort_order.asc');const body=`<label>TV Channel<select id="cr4Channel" class="cr4search">${ch.map(c=>`<option value="${c.id}">${c.channel_number?c.channel_number+' — ':''}${esc(c.name)}</option>`).join('')}</select></label><input id="cr4Search" class="cr4search" placeholder="Search episodes…"><div id="cr4Items" class="cr4list"></div>`;const m=modal('📺 Add Episode to TV Playlist',body,async()=>{const channel=m.querySelector('#cr4Channel').value;const ids=[...m.querySelectorAll('input[data-id]:checked')].map(x=>x.dataset.id);if(!ids.length)throw Error('Select at least one episode.');const existing=await api('tv_channel_playlist?select=episode_id&channel_id=eq.'+encodeURIComponent(channel)+'&episode_id=not.is.null');const used=new Set(existing.map(x=>x.episode_id));const max=await api('tv_channel_playlist?select=playlist_position&channel_id=eq.'+encodeURIComponent(channel)+'&order=playlist_position.desc&limit=1');let pos=max[0]?.playlist_position==null?0:Number(max[0].playlist_position)+1;for(const id of ids.filter(x=>!used.has(x))){const e=eps.find(x=>x.id===id);if(!e||(e.youtube_url==null&&e.video_url==null))continue;await api('tv_channel_playlist',{method:'POST',body:JSON.stringify({channel_id:channel,episode_id:id,schedule_item_id:null,live_event_id:null,playlist_position:pos++,enabled:true})})}});const render=()=>{const q=m.querySelector('#cr4Search').value.toLowerCase();m.querySelector('#cr4Items').innerHTML=eps.filter(x=>!q||String(x.title||'').toLowerCase().includes(q)).map(x=>`<label class="cr4row"><input type="checkbox" data-id="${esc(x.id)}"><div><b>${esc(x.title||'Untitled')}</b><div style="color:#8b98aa">S${esc(x.season_number??'—')} E${esc(x.episode_number??'—')} · ${x.youtube_url||x.video_url?'Playable':'No media URL'}</div></div></label>`).join('')};m.querySelector('#cr4Search').oninput=render;render()}
frame.addEventListener('load',()=>setTimeout(wait,300));setInterval(()=>{try{if(frame.contentDocument)wait()}catch{}},2000);})();
</script></body></html>
