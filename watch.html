<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030303"><title>CrowRules TV | Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="js/live-config.js"></script><script src="js/hls-player.js"></script>
<style>
:root{--bg:#030303;--red:#e50914;--white:#fff;--muted:#a7a7a7;--line:rgba(255,255,255,.1);--display:Orbitron,sans-serif;--body:Montserrat,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(229,9,20,.12),transparent 35%),var(--bg);color:var(--white);font-family:var(--body);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 22px;margin-bottom:28px}.brand{font:800 1rem var(--display);letter-spacing:.08em}.brand span{color:var(--red)}.back{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.eyebrow{color:var(--red);font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}.title{font:800 clamp(1.5rem,4vw,2.8rem) var(--display);letter-spacing:.04em;margin:0 0 10px}.description{color:var(--muted);line-height:1.7;margin:0 0 22px}.player-shell{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.45)}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:#09090a;border-top:1px solid var(--line)}.live{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:8px}.live[data-state=live]:before{background:var(--red);box-shadow:0 0 12px var(--red)}.live[data-state=connecting]:before{background:#e0a500}.hint{font-size:.65rem;color:#777;text-align:right}.notice{margin-top:20px;padding:16px;border:1px solid rgba(229,9,20,.2);background:rgba(229,9,20,.035);border-radius:8px;color:var(--muted);font-size:.78rem;line-height:1.7}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style></head>
<body><main class="wrap">
<nav class="nav"><a class="brand" href="index.html">CROW<span>RULES</span> TV</a><a class="back" href="live.html">← Live Channels</a></nav><div id="app"></div>
</main>
<script>
(function(){
const params=new URLSearchParams(location.search),slug=params.get("channel")||"crowrules-main",channel=window.getCrowRulesLiveChannel(slug),app=document.getElementById("app");
if(!channel){app.innerHTML='<div class="empty">Live channel not found.</div>';return;}
app.innerHTML='<div class="eyebrow">CrowRules+ Custom Live</div><h1 class="title">'+escapeHtml(channel.name)+'</h1><p class="description">'+escapeHtml(channel.description||"Live from the CrowRules universe.")+'</p><section class="player-shell"><video id="liveVideo" controls playsinline autoplay muted></video><div class="bar"><div id="status" class="live" data-state="connecting">Connecting…</div><div class="hint">Custom HLS Live</div></div></section><div class="notice"><strong>Stream setup:</strong> this page is ready for a public HLS .m3u8 playback URL. Keep RTMP/SRT ingest credentials on your streaming server or encoder — never in GitHub.</div>';
const status=document.getElementById("status"),video=document.getElementById("liveVideo");
if(!channel.playbackUrl){status.textContent="OFFLINE — HLS URL not configured";status.dataset.state="error";video.controls=false;video.removeAttribute("autoplay");return;}
try{window.CrowRulesHLS.attach(video,channel.playbackUrl,{statusElement:status});}catch(e){console.error(e);status.textContent="Unable to initialize HLS player";status.dataset.state="error";}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
})();
</script></body></html>
