name: Integrate CrowRules Core

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'crowrules-core.js'
      - '.github/workflows/integrate-crowrules-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate shared core into homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="./crowrules-core.js"></script>'
          if marker not in text:
              anchor = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              if anchor not in text:
                  raise SystemExit('Supabase script anchor not found in index.html')
              text = text.replace(anchor, anchor + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Integrated crowrules-core.js into index.html')
          else:
              print('crowrules-core.js is already integrated')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No homepage change needed.'
          else
            git add index.html
            git commit -m 'Integrate crowrules-core.js into CrowRules Entertainment homepage'
            git push
          fi
