name: Integrate CrowRules Core — Tacoma Nights

on:
  push:
    branches: [main]
    paths:
      - 'tacoma-nights.html'
      - 'crowrules-core.js'
      - '.github/workflows/integrate-tacoma-nights-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safely integrate CrowRules Core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tacoma-nights.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="./crowrules-core.js"></script>'

          text = re.sub(
              r'\s*<script\s+src=["\']\./crowrules-core\.js["\']\s*></script>\s*',
              '\n', text, flags=re.I
          )

          m = re.search(r'</body\s*>', text, flags=re.I)
          if not m:
              raise SystemExit('No </body> tag found; refusing to modify Tacoma Nights.')

          text = text[:m.start()] + '\n' + marker + '\n' + text[m.start():]
          p.write_text(text, encoding='utf-8')

          verify = p.read_text(encoding='utf-8')
          if verify.count(marker) != 1:
              raise SystemExit('Verification failed: expected exactly one crowrules-core.js script.')
          if '</html>' not in verify.lower():
              raise SystemExit('Verification failed: closing HTML tag missing.')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tacoma-nights.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Tacoma Nights already has the correct CrowRules Core integration.'
          else
            git commit -m 'Integrate crowrules-core.js into Tacoma Nights'
            git push
          fi
