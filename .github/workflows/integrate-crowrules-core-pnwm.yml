name: Integrate CrowRules Core — Pacific Northwest Mothers

on:
  push:
    branches: [main]
    paths:
      - 'pnwm.html'
      - 'crowrules-core.js'
      - '.github/workflows/integrate-crowrules-core-pnwm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-pnwm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safely inject crowrules-core.js into pnwm.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('pnwm.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="./crowrules-core.js"></script>'

          # Remove duplicate core tags if an earlier attempt inserted more than one.
          text = text.replace('\r\n', '\n')
          text = re.sub(r'\s*<script\s+src=["\']\./crowrules-core\.js["\']\s*></script>\s*', '\n', text, flags=re.IGNORECASE)

          body_close = re.search(r'</body\s*>', text, flags=re.IGNORECASE)
          if not body_close:
              raise SystemExit('No </body> tag found in pnwm.html; file was not modified.')

          injection = '\n<script src="./crowrules-core.js"></script>\n'
          text = text[:body_close.start()] + injection + text[body_close.start():]
          p.write_text(text, encoding='utf-8')
          print('Integrated exactly one crowrules-core.js tag into Pacific Northwest Mothers')
          PY

      - name: Verify integration and preserve page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('pnwm.html').read_text(encoding='utf-8')
          marker = '<script src="./crowrules-core.js"></script>'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly one core script tag; found {text.count(marker)}')
          if '</html>' not in text.lower():
              raise SystemExit('Verification failed: closing HTML tag missing.')
          print('Verification passed: exactly one core script and valid closing HTML remain.')
          PY

      - name: Commit only PNWM if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- pnwm.html; then
            echo 'PNWM already integrated; nothing to commit.'
          else
            git add pnwm.html
            git diff --cached --check
            git commit -m 'Update Pacific Northwest Mothers with CrowRules Core integration'
            git push
          fi
