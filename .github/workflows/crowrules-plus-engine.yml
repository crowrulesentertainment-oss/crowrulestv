name: CrowRules+ playout engine checks
on:
  push:
    paths:
      - "crowrules-plus-engine/**"
      - "studio/studio.js"
      - ".github/workflows/crowrules-plus-engine.yml"
  pull_request:
    paths:
      - "crowrules-plus-engine/**"
      - "studio/studio.js"
      - ".github/workflows/crowrules-plus-engine.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        working-directory: crowrules-plus-engine
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: crowrules-plus-engine
        run: npm run check
