name: Repair duplicate cards in tv.html

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch current tv.html safely
        shell: python
        run: |
          from pathlib import Path

          p = Path("tv.html")
          s = p.read_text(encoding="utf-8")

          marker = "/* =========================================================\n   START\n========================================================= */"

          patch = r'''/* =========================================================
   DUPLICATE RENDER GUARD

   Keeps the current tv.html architecture safe even when a
   refresh, realtime update, or another script renders a rail
   more than once. It works on the DOM actually used by this
   version of CrowRules TV and does not depend on old function
   names from previous tv.html versions.
========================================================= */

function dedupeRenderedContainer(container){
  if(!container) return;

  const seen = new Set();

  Array.from(container.children).forEach(node => {
    if(!node || node.nodeType !== 1) return;

    const text = clean(node.textContent || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();

    let key = text;

    const button = node.querySelector("[data-channel],[data-show],[data-episode],[data-guide]");
    if(button){
      key = button.outerHTML
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    const image = node.querySelector("img[src]");
    if(image){
      key += "|img:" + String(image.getAttribute("src") || "").trim().toLowerCase();
    }

    if(!key) return;

    if(seen.has(key)){
      node.remove();
      return;
    }

    seen.add(key);
  });
}

function dedupeAllTVCards(){
  [
    $("channelsRail"),
    $("showsRail"),
    $("episodesRail"),
    $("membersGrid"),
    $("allMembersGrid"),
    $("guideBody")
  ].forEach(dedupeRenderedContainer);
}

function initDuplicateRenderGuard(){
  dedupeAllTVCards();

  const targets = [
    $("channelsRail"),
    $("showsRail"),
    $("episodesRail"),
    $("membersGrid"),
    $("allMembersGrid"),
    $("guideBody")
  ].filter(Boolean);

  if(!targets.length || !window.MutationObserver) return;

  let scheduled = false;

  const run = () => {
    scheduled = false;
    dedupeAllTVCards();
  };

  const observer = new MutationObserver(() => {
    if(scheduled) return;
    scheduled = true;
    requestAnimationFrame(run);
  });

  targets.forEach(target => {
    observer.observe(target, {
      childList:true,
      subtree:true
    });
  });
}

'''

          if "function dedupeRenderedContainer(container)" not in s:
              if marker not in s:
                  raise SystemExit("tv.html START marker not found")
              s = s.replace(marker, patch + "\n" + marker, 1)

          boot_marker = "boot();"
          if "initDuplicateRenderGuard();" not in s:
              if boot_marker not in s:
                  raise SystemExit("tv.html boot marker not found")
              s = s.replace(boot_marker, "initDuplicateRenderGuard();\n\n" + boot_marker, 1)

          p.write_text(s, encoding="utf-8")
          print("tv.html duplicate-render guard installed")

      - name: Verify patched tv.html
        run: |
          grep -q "function dedupeRenderedContainer(container)" tv.html
          grep -q "initDuplicateRenderGuard();" tv.html
          grep -q "function loadChannels()" tv.html
          grep -q "function loadShows()" tv.html
          grep -q "function loadEpisodes()" tv.html
          echo "tv.html verification passed"

      - name: Commit tv.html and remove obsolete repair workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            .github/workflows/fix-duplicate-cards.yml \
            .github/workflows/fix-duplicate-cards-v2.yml

          git add tv.html .github/workflows

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix duplicate cards in CrowRules TV"
          git push
