name: Install CrowRules TV schedule_items engine

on:
  push:
    paths:
      - 'tv-schedule-v7.js'
      - '.github/workflows/install-tv-schedule-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add schedule_items engine to tv.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tv.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./tv-schedule-v7.js?v=7"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'CrowRules TV Automation'
          git config user.email 'actions@github.com'
          git add tv.html
          git diff --cached --quiet || git commit -m 'Upgrade CrowRules TV to schedule_items v7'
          git push