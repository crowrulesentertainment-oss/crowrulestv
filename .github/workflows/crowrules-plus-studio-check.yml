name: CrowRules+ Studio Checks
on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/crowrules-plus-studio-check.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/crowrules-plus-studio-check.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Studio JavaScript syntax
        run: node --check studio/studio.js
